            <span class="src">ESPN · ${shortDay(n.published)} · ${n.players.map(esc).join(', ')}</span>
          </a>`).join('')}</div>
      </section>`;
  }

  function landingPage(w) {
    const next = leadWithNext();
    const rows = coachRows(next) || [];
    const weekNum = next ? ahead().week : w.week;
    // Always this week's Coach rows: `rows` can be next week's when this week's list is empty.
    const mine = advice() || [];
    const stickers = w.complete ? finalStickers(w) : preKickoffStickers(w, mine);
    const title = w.complete
      ? (stickers.length ? `Week ${w.week} in ${STICKER_COUNT[stickers.length]} sticker${stickers.length === 1 ? '' : 's'}` : 'This week, wrapped')
      : `Getting ready<br>for Week ${w.week}`;
    const toFix = mine.filter((r) => r.counts.now).length;
    // "Every lineup looks set" is only true once ESPN has projections to judge a lineup by.
    const judged = mine.length && mine.every((r) => r.projected !== false);
    const dek = w.complete
      ? `Every game is final. The recap's still being written, so the numbers get the first word.`
      : toFix
        ? `${count(toFix, 'lineup has', 'lineups have')} something to fix and there's still time. Here's every matchup before kickoff.`
        : judged
          ? `Every lineup looks set and nobody's kicked off yet. Here's every matchup before kickoff.`
          : `Nobody's kicked off yet. Here's every matchup and what's worth sorting out before kickoff.`;
    return `
      <div class="hub-head">
        <div class="page-head">
          <div class="kicker">Week ${w.week} · ${w.complete ? 'in the books' : 'not started yet'}</div>
          <div class="head-row${!w.complete && WEEKS.length ? ' has-recap' : ''}">
            <h1>${title}</h1>
            ${w.complete && !stickers.length ? scorePills(w) : ''}
            ${!w.complete && WEEKS.length ? `<a class="recap-btn" href="#week-${latest().week}">Last week's recap <span aria-hidden="true">→</span></a>` : ''}
          </div>
          <p class="dek">${dek}</p>
        </div>
        ${seasonStrip(w)}
      </div>

      ${stickers.length ? `<div class="stickers hub-chips">${stickers.map(sticker).join('')}</div>` : ''}

      ${w.complete ? `<div class="recap-when"><span class="d">TUE</span><span>The full recap, game balls and flags included, lands Tuesday. Nobody's safe.</span></div>` : ''}

      ${w.complete ? `
      <section>
        ${secHead('board', 'Final scores')}
        <div class="final-lines">${w.games.map((g) => `
          <a href="#live.game-${g.key}">
            <span class="w"><span class="ml-w">${isTie(g) ? 'T' : 'W'}</span><b>${esc(g.winner.manager)}</b><span class="num">${f2(g.winner.points)}</span></span>
            <span class="l">${esc(g.loser.manager)} <span class="num">${f2(g.loser.points)}</span></span>
          </a>`).join('')}</div>
      </section>
      ${rows.length ? `<a class="live-banner" href="${coachHref()}"><span>Every team's Week ${weekNum} to-do list is on <b>Coach</b>: swaps, injuries and empty slots.</span><span class="go">Open Coach →</span></a>` : ''}` : `
      <div class="hub-grid">
        <section style="margin-top:0">
          ${secHead('board', 'Matchups')}
          <p class="sec-sub">Projected scores are ESPN's. The strip under each game shows who has the edge at every lineup spot, in projected points${hub().stakes ? `. "Stakes" is what a win or a loss does to a team's chance of making the playoffs, by the same math as Standings` : ''}.</p>
          ${hubGames(w)}
        </section>
        <div class="hub-side">
          ${coachDesk(mine)}
          ${rankedProjections(w)}
          ${wireSection(true)}
        </div>
      </div>`}

      ${w.complete ? wireSection() : ''}
      ${newsSection()}

      <p class="sec-sub" style="margin-top:28px">${next ? nextSource() : coachSource(w)}</p>`;
  }

  function awardsPage(w) {
    return `
      <div class="crumbs"><a href="#week-${w.week}">Week ${w.week}</a><span>›</span><span>Awards</span></div>
      ${weekSwitch(w, '.awards')}
      ${draftBanner(w)}
      <div class="page-head">
        <div class="kicker">Week ${w.week} awards</div>
        <h1>Game balls, flags and tough breaks</h1>
      </div>
      ${AWARD_KINDS.filter((k) => w[k].length).map((k) => `
        <section>
          ${secHead(KIND[k].marker, KIND[k].title)}
          <p class="sec-sub">${KIND[k].sub}</p>
          <div class="cards">${w[k].map((c) => awardCard(c, k)).join('')}</div>
        </section>`).join('')}
      ${w.glossary.length ? `
      <section>
        ${secHead('book', 'Rookie glossary', '<a class="more" href="#glossary">Every term →</a>')}
        <p class="sec-sub">Football words from this week's recap, explained for the rest of us.</p>
        <dl class="terms">${w.glossary.map((g) => `<div class="term"><dt>${esc(g.term)}</dt><dd>${esc(g.definition)}</dd></div>`).join('')}</dl>
      </section>` : ''}`;
  }

  function matchupPage(w, key) {
    const g = w.games.find((x) => x.key === key);
    if (!g) return notFound();
    const W = g.winner, L = g.loser;
    const items = [];
    for (const [s, won, opp] of [[W, true, L], [L, false, W]]) {
      for (const sw of s.swaps.filter((x) => Math.abs(x.gain) >= 1)) {
        items.push({ tag: sw.gain > 0 ? 'good' : 'bad', label: signed(sw.gain),
          text: `${esc(s.manager)} started ${esc(sw.started)} (${scored(sw.started_pos, sw.started_points)}) over ${esc(sw.benched)} (${scored(sw.benched_pos, sw.benched_points)}) at ${esc(sw.slot)}.` });
      }
      if (s.points_left > 0.5) {
        const flip = !won && s.optimal > opp.points;
        items.push({ tag: flip ? 'bad' : 'info', label: `${f1(s.points_left)} benched`,
          text: `${esc(s.manager)} left ${f2(s.points_left)} points on the bench. Her best possible lineup scored ${f2(s.optimal)}${flip ? `, enough to beat ${esc(opp.manager)}` : ''}.` });
      } else {
        items.push({ tag: 'good', label: 'perfect', text: `${esc(s.manager)} started her best possible lineup.` });
      }
    }
    const related = AWARD_KINDS.flatMap((k) => w[k].filter((c) => c.manager === W.manager || c.manager === L.manager).map((c) => awardCard(c, k)));
    const others = w.games.filter((x) => x.key !== key);
    const lead = w.live && !w.complete;
    return `
      <div class="crumbs"><a href="${base(w)}">${w.live ? 'Live · ' : ''}Week ${w.week}</a><span>›</span><span>${esc(W.manager)} vs ${esc(L.manager)}</span></div>
      ${draftBanner(w)}
      <div class="versus">
        <div class="side winner"><div class="mgr">${mgrLink(W.manager)}</div><div class="team">${esc(W.team_name)}</div><div class="score">${f2(W.points)}</div></div>
        <div class="vs" aria-hidden="true">vs</div>
        <div class="side right loser"><div class="mgr">${mgrLink(L.manager)}</div><div class="team">${esc(L.team_name)}</div><div class="score">${f2(L.points)}</div></div>
        <div class="foot"><span>Week ${w.week} · ${w.complete ? 'Final' : `In progress · updated ${updated(w.captured_at)}`}</span><span>${esc(W.manager)} ${lead ? 'leads' : 'by'} ${f2(W.points - L.points)}</span></div>
      </div>
      ${lead ? `<div style="margin-top:14px" class="a-live">${liveStrip(g).replace('class="live-strip"', 'class="live-strip" style="border:2px solid var(--edge);border-radius:14px"')}</div>` : ''}
      ${g.blurb ? `<p class="dek" style="color:var(--ink);margin-top:22px">${esc(g.blurb)}</p>` : ''}

      <section>
        ${secHead('flag', lead ? 'So far' : 'How it was decided')}
        <p class="sec-sub">${lead ? 'Lineup swaps and bench points so far. These change as games are played.' : 'The lineup swaps each manager made that stuck, and how many points each left on the bench.'}</p>
        <ul class="decided">${items.map((i) => `<li><span class="tag ${i.tag}">${esc(i.label)}</span><span>${i.text}</span></li>`).join('')}</ul>
      </section>

      ${related.length ? `<section>${secHead('ball', 'Their awards this week')}<div class="cards">${related.join('')}</div></section>` : ''}

      <section>
        ${secHead('board', 'Box score')}
        <p class="sec-sub">Points scored and the experts' projection for every player.${w.live ? ' The badge next to a name is his NFL team, a colored pill is ESPN\'s injury designation, and a pulsing sticker with the game clock means that game is on right now.' : ''} A ⚑ on the bench marks a player who outscored a starter he could have replaced.</p>
        <div class="box-grid">${lineupCard(W, true, !!w.live)}${lineupCard(L, false, !!w.live)}</div>
      </section>

      ${others.length ? `<section>${secHead('board', 'Other games this week')}<div class="other-games">${others.map((o) => `<a href="${base(w)}.game-${o.key}">${esc(o.winner.manager)} ${f2(o.winner.points)} · ${esc(o.loser.manager)} ${f2(o.loser.points)}</a>`).join('')}</div></section>` : ''}`;
  }

  function standingsPage() {
    const rows = SEASON.standings;
    const weeks = SEASON.weeks_played;
    const all = rows.flatMap((t) => t.weekly.map((g) => g.points));
    const lo = Math.min(...all), hi = Math.max(...all);
    const shade = (p) => `background: color-mix(in srgb, var(--heat-hi) ${(hi > lo ? 6 + ((p - lo) / (hi - lo)) * 42 : 20).toFixed(0)}%, var(--card))`;
    const luck = rows.map((t) => ({ t, diff: (t.wins + 0.5 * t.ties) / weeks.length - t.all_play_w / Math.max(1, t.all_play_w + t.all_play_l) }))
      .sort((a, b) => b.diff - a.diff);
    const lucky = luck[0], unlucky = luck[luck.length - 1];
    const luckCard = (x, cls, title, text) => `
      <article class="card ${cls}"><div class="card-top"><span class="who">${mgrLink(x.t.manager)}</span><span class="stat">Real ${record(x.t)} · vs. everyone ${x.t.all_play_w}–${x.t.all_play_l}</span></div>
        <h3>${title}</h3><p>${text}</p></article>`;
    return `
      <div class="page-head">
        <div class="kicker">${DATA.league.season} season</div>
        <h1>Standings</h1>
        <p class="dek">Ranked by wins, then total points scored${weeks.length ? `, through Week ${weeks[weeks.length - 1]}` : ''}. Only finished, recapped weeks count${LIVE ? `; Week ${LIVE.week} is on the <a href="#live">Live</a> page until its recap drops` : ''}. Hit <b>Profile</b> on any row for that team's whole season: every game, every award, every point left on the bench.</p>
      </div>

      <section style="margin-top:18px">
        <div class="std-card">${standingsTable(rows)}</div>
        <p class="sec-sub" style="margin-top:12px"><b>Vs. everyone</b> is the record a team would have if it played all seven other teams every week, so it shows who has been scoring well no matter who they drew. <b>Benched</b> is the season total of points left on the bench.</p>
      </section>

      ${playoffPicture()}

      ${weeks.length ? `
      <section>
        ${secHead('board', 'Points by week')}
        <p class="sec-sub">Every team's score each week. Darker blue means a higher score. Tap a score to open that game.</p>
        <div class="std-card table-scroll">
          <table class="std heat">
            <thead><tr><th>Team</th>${weeks.map((n) => `<th style="text-align:center">Week ${n}</th>`).join('')}<th class="r">Average</th></tr></thead>
            <tbody>${rows.map((t) => `
              <tr>
                <td class="mgr"><a href="#team-${t.team_id}">${esc(t.manager)}</a></td>
                ${t.weekly.map((g) => `<td class="cell" style="${shade(g.points)}" title="${esc(t.manager)}, Week ${g.week}: ${f2(g.points)} vs ${esc(g.opponent)} ${f2(g.opponent_points)}"><a href="#week-${g.week}.game-${g.game_key}">${f2(g.points)}</a><span class="res ${g.result}">${g.result}</span></td>`).join('')}
                <td class="r">${f2(t.avg)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
          <div class="heat-legend"><span>Lower</span><span class="ramp" aria-hidden="true"></span><span>Higher</span><span>· W = win, L = loss</span></div>
        </div>
      </section>

      ${lucky.diff !== unlucky.diff ? `
      <section>
        ${secHead('flag', 'The luck report')}
        <p class="sec-sub">Compare each team's real record with her "vs. everyone" record, and you can see who has been lucky with her opponents.</p>
        <div class="cards">
          ${luckCard(lucky, 'balls', 'Luckiest so far', 'Her real record is better than her scores alone would earn. She keeps drawing opponents on their off weeks.')}
          ${luckCard(unlucky, 'breaks', 'Unluckiest so far', 'Her scores deserve a better record than she has. She keeps running into the hottest team of the week.')}
        </div>
      </section>` : ''}` : ''}`;
  }

  /* ---------- team profile: three tabs ----------
     #team-<id> is Overview (the hero, this week, Coach's take and advice), #team-<id>.lineup
     is the week's lineup and to-dos, #team-<id>.next is the same tab pointed at next week, and
     #team-<id>.season is the whole season: the chart, the audit, every game, awards and moves. */
  const TP_TABS = [['overview', 'Overview', ''], ['lineup', 'Lineup', '.lineup'], ['season', 'Season', '.season']];
  const tpTabs = (id, tab) => `<nav class="tp-tabs" aria-label="Profile sections">${TP_TABS.map(([k, label, sfx]) =>
    `<a href="#team-${id}${sfx}"${k === tab ? ' aria-current="page"' : ''}>${label}</a>`).join('')}</nav>`;
  const tpHead = (color, title, more = '') =>
    `<div class="tp-head"><span class="mark" style="--c:var(${color})" aria-hidden="true"></span><h2>${title}</h2>${more}</div>`;
  const TP_CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
  const TP_SEEDED = new Set();

  function teamPage(id, tab = 'overview', next = false) {
    const t = TEAMS[id];
    if (!t) return notFound();
    next = !!(next && ahead());                     // no current next-week capture → This week
    const rank = SEASON.standings.indexOf(t) + 1;
    const p = t.profile || { audit: [], moves: [], weak_spot: null };
    const onCoach = !!coachFor(id, false);
    if (tab !== 'overview') {
      return `
        <a class="tp-bar" href="#team-${id}" aria-label="${esc(t.manager)}, back to the overview">
          <span><span class="back">‹ ${esc(t.team_name)}</span><span class="nm">${esc(t.manager)}</span></span>
          <span class="rec"><b>${record(t)}</b><span>${ordinal(rank)} place</span></span>
        </a>
        ${coachFor(id, false) ? teamSwitch(id, next) : ''}
        ${tpTabs(id, tab)}
        ${tab === 'lineup' ? thisWeekSection(id, next) : tpSeason(id, t, p)}`;
    }
    return `
      <div class="crumbs"><a href="${onCoach ? coachUrl(false, null) : '#standings'}">${onCoach ? 'Coach' : 'Standings'}</a><span>›</span><span>${esc(t.manager)}</span></div>
      ${onCoach ? teamSwitch(id, false) : ''}
      <section class="tp-hero" aria-labelledby="tp-h">
        <div class="tp-hero-top"><span class="tp-tname">${esc(t.team_name)}</span>${myTeam.get() === id ? '<span class="tp-you">You</span>' : ''}</div>
        <h1 id="tp-h">${esc(t.manager)}</h1>
        <div class="tp-rec"><b>${record(t)}</b><span>${ordinal(rank)} place</span></div>
        <div class="tp-stats">
          <div><div class="l">Avg score</div><div class="v">${f1(t.avg)}</div></div>
          <div><div class="l">Best week</div><div class="v">${t.best ? `${f1(t.best.points)} <small>W${t.best.week}</small>` : '–'}</div></div>
          <div><div class="l">Vs. everyone</div><div class="v">${t.all_play_w}–${t.all_play_l}</div></div>
          <div><div class="l">Points benched</div><div class="v">${f1(t.bench_left)}</div></div>
        </div>
      </section>
      ${tpTabs(id, 'overview')}
      <div class="tp-cols">
        <div>
          ${tpMatchup(id)}
          ${tpTake(id, p)}
          ${tpAdvice(id)}
          ${tpSoFar(t)}
          ${tpDig(id, t, p)}
        </div>
        <aside class="tp-rail" aria-label="Quick looks">${tpRail(id, t, p)}</aside>
      </div>
      <p class="tp-foot">Everything here comes from ESPN's projections and injury report. A projection is the experts' guess at how many points a player will score. Useful, not gospel. Nothing on this page changes your lineup for you: make the moves in the ESPN app.</p>`;
  }

  /* Overview: the week being played, boiled down to the matchup, the odds and one sentence. */
  function tpMatchup(id) {
    const a = coachFor(id, false);
    if (!a) {
      const wk = (WEEKS.length ? WEEKS[WEEKS.length - 1].week : 0) + 1;
      return `<section class="tp-sec">${tpHead('--accent', 'This week')}<p class="sec-sub">Nothing to fix until Week ${wk}'s rosters land.</p></section>`;
    }
    const g = LIVE.games.find((x) => x.winner.team_id === id || x.loser.team_id === id);
    const mine = g && (g.winner.team_id === id ? g.winner : g.loser);
    const opp = g ? (g.winner.team_id === id ? g.loser : g.winner) : TEAMS[a.opponent_id];
    const tone = a.counts.now ? 'now' : a.counts.watch ? 'watch' : 'ok';
    const badge = a.can_change === false ? 'Locked in' : a.counts.now ? `${a.counts.now} to fix` : a.counts.watch ? `${a.counts.watch} to watch` : 'All clear';
    const wp = a.win_probability;
    return `
      <section class="tp-sec" aria-labelledby="tp-wk">
        <div class="tp-head"><span class="mark" style="--c:var(--accent)" aria-hidden="true"></span><h2 id="tp-wk">Week ${LIVE.week}, right now</h2>${g ? `<a class="more" href="#live.game-${g.key}">Live box score →</a>` : ''}</div>
        <div class="tp-match">
          <div class="tp-vs"><span class="nm">${opp ? `vs <a href="#team-${opp.team_id}">${esc(opp.manager)}</a>` : 'Opponent TBD'}</span><span class="tp-badge ${tone}">${badge}</span></div>
          ${wp == null ? '' : `<div class="tp-win">
            <div class="row"><span class="lab">Chance to win</span><span class="big">${Math.round(wp * 100)}%</span></div>
            <div class="tp-meter" role="img" aria-label="Chance to win ${Math.round(wp * 100)} percent"><i style="width:${(wp * 100).toFixed(1)}%"></i></div>
            <div class="src">ESPN's number</div></div>`}
          <div class="tp-nums">
            <div><b>${f1(a.projected)}</b><span>projected</span></div>
            <div><b>${mine ? f1(mine.points) : '–'}</b><span>on the board</span></div>
            <div><b>${a.yet_to_play}</b><span>starter${a.yet_to_play === 1 ? '' : 's'} left to play</span></div>
          </div>
          <div class="tp-note ${tone}">${tone === 'ok' ? TP_CHECK : ''}<p>${esc(a.summary)}${a.counts.now && a.can_change !== false ? `<br><a href="#team-${id}.lineup">See the fixes →</a>` : ''}</p></div>
          ${ahead() ? `<a class="tp-live" href="#team-${id}.next">Week ${ahead().week} is coming up. See next week →</a>` : ''}
        </div>
      </section>`;
  }

  /* The audit cards, swipeable on a phone. The full text lives on the Season tab. */
  function tpTake(id, p) {
    return `
      <section class="tp-sec" aria-labelledby="tp-take">
        <div class="tp-head"><span class="mark" style="--c:var(--orange)" aria-hidden="true"></span><h2 id="tp-take">Coach's take</h2>${p.audit.length ? `<a class="more" href="#team-${id}.season">All ${p.audit.length} →</a>` : ''}</div>
        ${p.audit.length
          ? `<div class="tp-take">${p.audit.map(adviceCard).join('')}</div>`
          : '<p class="sec-sub">The coach needs one finished week before she has opinions.</p>'}
      </section>`;
  }

  function tpAdvice(id) {
    const a = coachFor(id, false);
    if (!a) return '';
    // Matched here, not trusted from the build: /api/live replaces LIVE.advice with rows that
    // never went through site_data(), so a baked tag would vanish on the first refresh.
    const weak = (TEAMS[id].profile || {}).weak_spot;
    const ideas = ((a && a.roster_ideas) || []).map((it) => ({ ...it, fills_weak_spot: !!it.pos && it.pos === weak }));
    const waiver = ideas.filter((it) => !it.trade);
    const trades = ideas.filter((it) => it.trade);
    const col = (label, note, items) => (items.length ? `<div><div class="tp-sub"><span>${label}</span><small>${note}</small></div>${items.map(adviceCard).join('')}</div>` : '');
    return `
      <section class="tp-sec" aria-labelledby="tp-adv">
        ${tpHead('--lime', "Coach's advice").replace('<h2>', '<h2 id="tp-adv">')}
        ${ideas.length
          ? `<p class="sec-sub">Ideas, not orders. A trade only shows up here if it helps both teams.</p>
             <div class="tp-ideas">${col('Waiver wire', 'From FantasyPros and everyone\'s rosters', waiver)}${col('Trade idea', 'Checked against both lineups', trades)}</div>`
          : '<p class="sec-sub">No new ideas today.</p>'}
      </section>`;
  }

  function tpSoFar(t) {
    if (!t.weekly.length) return '';
    return `
      <section class="tp-sec" aria-labelledby="tp-sofar">
        <div class="tp-head"><span class="mark" style="--c:var(--pink)" aria-hidden="true"></span><h2 id="tp-sofar">Season so far</h2><a class="more" href="#team-${t.team_id}.season">Week by week and awards →</a></div>
        <div class="tp-weeks">${t.weekly.map((g) => `
          <a class="tp-wk" href="#week-${g.week}.game-${g.game_key}" aria-label="Week ${g.week} against ${esc(g.opponent)}: ${g.result === 'W' ? 'won' : 'lost'}, ${f1(g.points)} points, ${g.score_rank} of 8 that week">
            <span class="wl">WEEK ${g.week}<span class="tp-opp"> · ${esc(g.opponent).toUpperCase()}</span></span><span class="tp-res ${g.result}">${g.result}</span><b>${f1(g.points)}</b><small>${g.score_rank} of 8</small>
          </a>`).join('')}</div>
        <p class="sec-sub">Score, then where it ranked among all 8 teams that week.</p>
      </section>`;
  }

  // Phones skip the side rail, so its quick looks become two doors into the other tabs.
  function tpDig(id, t, p) {
    const kinds = AWARD_KINDS.map((k) => [k, t.awards.filter((a) => a.kind === k).length]).filter(([, n]) => n);
    const counts = [...kinds.map(([k, n]) => `${n} ${KIND[k].label.toLowerCase()}${n === 1 ? '' : 's'}`), `${p.moves.length} roster move${p.moves.length === 1 ? '' : 's'}`].join(', ');
    return `
      <section class="tp-dig" aria-label="More detail">
        <a href="#team-${id}.lineup"><span><b>Full lineup</b><small>Starters, bench and ${f1(t.bench_left)} points benched this season</small></span><span class="chev" aria-hidden="true">›</span></a>
        <a href="#team-${id}.season"><span><b>Week by week, awards and moves</b><small>${counts}</small></span><span class="chev" aria-hidden="true">›</span></a>
      </section>`;
  }

  // Laptop only: her starters, the latest moves and the latest award, without leaving Overview.
  function tpRail(id, t, p) {
    const a = coachFor(id, false);
    const g = a && LIVE.games.find((x) => x.winner.team_id === id || x.loser.team_id === id);
    const mine = g && (g.winner.team_id === id ? g.winner : g.loser);
    const starters = mine ? [...mine.starters].sort((x, y) => SLOT_ORDER.indexOf(x.slot) - SLOT_ORDER.indexOf(y.slot)) : [];
    const latestWeek = p.moves.length ? p.moves[0].week : null;
    const latest = p.moves.filter((m) => m.week === latestWeek);
    const award = [...t.awards].sort((x, y) => y.week - x.week)[0];
    const names = (xs) => xs.map(esc).join(', ');
    return `
      ${mine ? `
      <section class="tp-panel" aria-labelledby="tp-ln">
        <header><h2 id="tp-ln">${id === myTeam.get() ? 'Your' : `${esc(t.manager)}\'s`} lineup</h2><span>${f2(mine.points)} · proj ${f1(a.projected)}</span></header>
        ${starters.map((s) => `<div class="tp-ln"><span class="slot">${esc(s.slot)}</span><b>${esc(s.name)}</b><span class="pts">${f2(s.points)}</span></div>`).join('')}
        <a class="go" href="#team-${id}.lineup">Bench and full lineup →</a>
      </section>` : ''}
      <section class="tp-panel" aria-labelledby="tp-mv">
        <header><h2 id="tp-mv">Latest moves</h2>${latestWeek ? `<span>Week ${latestWeek}</span>` : ''}</header>
        ${latest.length ? latest.map((m) => `<div class="tp-mvrow" style="border-top:1.5px solid var(--rule)">${moveLines(m, names)}</div>`).join('')
          : '<p class="sec-sub" style="padding:0 16px 14px">No adds, drops or trades yet. Still riding with the draft-day roster.</p>'}
        <a class="go" href="#team-${id}.season">${p.moves.length ? `See all ${p.moves.length} move${p.moves.length === 1 ? '' : 's'} →` : 'Open the season →'}</a>
      </section>
      ${award ? `
      <section class="tp-panel award" aria-labelledby="tp-aw">
        <header><h2 id="tp-aw">Latest award</h2><span class="rail-pill ${KIND[award.kind].cls}">${KIND[award.kind].label}</span></header>
        <p><a href="#week-${award.week}.awards" style="color:var(--accent);font-weight:800;text-decoration:none">Week ${award.week}</a> · ${esc(award.title)}</p>
        <a href="#team-${id}.season" style="font-weight:700;font-size:13.5px;color:var(--accent)">All ${t.awards.length} awards →</a>
      </section>` : ''}`;
  }

  const moveLines = (m, names) => `
    ${m.added.length ? `<span><em>Added</em><b>${names(m.added)}</b></span>` : ''}
    ${m.dropped.length ? `<span class="out"><em>${m.type === 'trade' ? 'Sent' : 'Dropped'}</em>${names(m.dropped)}</span>` : ''}`;

  /* Season tab: how every week went, the audit in full, every game, her awards and every move. */
  function tpSeason(id, t, p) {
    const weeks = [...t.weekly].sort((x, y) => y.week - x.week);
    const top = Math.max(...t.weekly.map((g) => g.points), t.avg || 0, 1);
    const h = (n) => `${Math.max(2, (n / top) * 100).toFixed(1)}%`;
    const kinds = AWARD_KINDS.map((k) => [k, t.awards.filter((a) => a.kind === k).length]).filter(([, n]) => n);
    const awards = [...t.awards].sort((x, y) => y.week - x.week);
    const names = (xs) => xs.map(esc).join(', ');
    const byWeek = [];
    for (const m of p.moves) {
      const last = byWeek[byWeek.length - 1];
      if (last && last.week === m.week) last.moves.push(m); else byWeek.push({ week: m.week, moves: [m] });
    }
    // The newest week starts open, once per page load; after that the page remembers what she opened or shut.
    if (byWeek.length && !TP_SEEDED.has(id)) { TP_SEEDED.add(id); HUB_OPEN.add(`mv-${id}-${byWeek[0].week}`); }
    return `
      ${t.weekly.length ? `
      <section class="tp-sec" aria-labelledby="tp-sc">
        ${tpHead('--accent', 'Score by week').replace('<h2>', '<h2 id="tp-sc">')}
        <div class="tp-chart">
          <div class="tp-plot" role="img" aria-label="Weekly scores: ${t.weekly.map((g) => `week ${g.week} ${f1(g.points)}`).join(', ')}. Average ${f1(t.avg)}.">
            ${t.weekly.map((g) => `<div class="tp-col" style="--h:${h(g.points)}"><span class="tp-val">${f1(g.points)}</span><div class="${g.result === 'L' ? 'tp-bar-l' : 'tp-bar-w'}"></div></div>`).join('')}
            <div class="tp-avg" style="--h:${h(t.avg)}"><span>average: ${f1(t.avg)}</span></div>
          </div>
          <div class="tp-axis" aria-hidden="true">${t.weekly.map((g) => `<span>W${g.week} · ${g.result}</span>`).join('')}</div>
        </div>
      </section>` : ''}

      <section class="tp-sec">
        ${tpHead('--orange', "Coach's audit")}
        ${p.audit.length
          ? `<p class="sec-sub">${id === myTeam.get() ? 'Your' : `${esc(t.manager)}\'s`} season so far, graded on every week with a recap.</p><div class="cards">${p.audit.map(adviceCard).join('')}</div>`
          : '<p class="sec-sub">The coach needs one finished week before she has opinions.</p>'}
      </section>

      ${weeks.length ? `
      <section class="tp-sec" aria-labelledby="tp-ww">
        ${tpHead('--lime', 'Week by week').replace('<h2>', '<h2 id="tp-ww">')}
        ${weeks.map((g) => `
          <a class="tp-gm" href="#week-${g.week}.game-${g.game_key}"><span class="tp-res ${g.result}">${g.result}</span>
            <span><b>Week ${g.week} · ${esc(g.opponent)}</b><span class="sc">${f2(g.points)} – ${f2(g.opponent_points)}</span></span>
            <span class="rt"><b>${g.score_rank} of 8</b>${f2(g.points_left)} benched</span></a>`).join('')}
      </section>` : ''}

      <section class="tp-sec" aria-labelledby="tp-aw">
        <div class="tp-head"><span class="mark" style="--c:var(--orange)" aria-hidden="true"></span><h2 id="tp-aw">Awards</h2>${kinds.length ? `<span class="more" style="font-weight:400;color:var(--muted)">${kinds.map(([k, n]) => `${n} ${KIND[k].label.toLowerCase()}${n === 1 ? '' : 's'}`).join(' · ')}</span>` : ''}</div>
        ${awards.length
          ? awards.map((a) => `<div class="tp-aw"><span class="aw-pill ${KIND[a.kind].cls}">${KIND[a.kind].label}</span><span><a href="#week-${a.week}.awards">Week ${a.week}</a> · ${esc(a.title)}</span></div>`).join('')
          : '<p class="sec-sub">No awards yet. Give it time.</p>'}
      </section>

      <section class="tp-sec" aria-labelledby="tp-mvs">
        <div class="tp-head"><span class="mark" style="--c:var(--pink)" aria-hidden="true"></span><h2 id="tp-mvs">Roster moves</h2>${p.moves.length ? `<span class="more" style="font-weight:400;color:var(--muted)">${p.moves.length} this season</span>` : ''}</div>
        ${byWeek.length
          ? byWeek.map((w) => `
            <details class="tp-mv" data-hub-open="mv-${id}-${w.week}"${HUB_OPEN.has(`mv-${id}-${w.week}`) ? ' open' : ''}>
              <summary><span>Week ${w.week}<small>· ${w.moves.length} move${w.moves.length === 1 ? '' : 's'}</small></span></summary>
              ${w.moves.map((m) => `<div class="tp-mvrow">${m.type === 'trade' ? '<b>Trade</b>' : ''}${moveLines(m, names)}</div>`).join('')}
            </details>`).join('')
          : '<p class="sec-sub">No adds, drops or trades yet. Still riding with the draft-day roster.</p>'}
      </section>`;
  }

  /* ---------- coach: this week's to-do list, per team ----------
     Everything on these pages is computed in site/build.py from the same capture the
     Live page uses: ESPN's projections, its injury report, and which NFL games have
     started. It refreshes with the rest of the live data. */
  const adviceCard = (it) => `
    <article class="card ${it.level}">
      <div class="card-top"><span class="who">${esc(ADVICE_KIND[it.kind] || 'Note')}</span>${it.fills_weak_spot ? '<span class="fit">fills your weak spot</span>' : ''}${it.stat ? `<span class="stat">${esc(it.stat)}</span>` : ''}</div>
      <h3>${esc(it.title)}</h3>
      <p>${esc(it.text)}</p>
      ${it.trade ? tradeBlock(it.trade) : ''}
    </article>`;

  /* The numbers behind an evaluated trade card, straight from scripts/trade_eval.py: the
     players each way, each side's lineup gain over the next few weeks, and each side's
     playoff odds before and after. The card's text says why; this shows the receipts. */
  const tradeBlock = (t) => {
    const who = (xs) => xs.map((x) => `<span>${esc(x.name)}${x.pos ? ` <small>${esc(x.pos)}</small>` : ''}</span>`).join('');
    // A trade can pass on title odds alone (a near-lock's playoff odds barely move), so show
    // whichever of the two her odds actually moved on.
    const onTitle = Math.abs(t.you.playoff[1] - t.you.playoff[0]) < 0.005;
    const kind = onTitle ? 'title' : 'playoff';
    const odds = (s) => `${pct(s[kind][0])} → ${pct(s[kind][1])}`;
    const gain = (n) => (Math.abs(n) < 0.05 ? 'about even' : `${signed(n)} pts a week`);
    const her = nameOf(t.partner_id);
    const f = t.flags || {};
    const sticker = f.plays_this_week ? `You play her in Week ${t.week}`
      : f.rival === 'next_week' ? `You play her in Week ${t.week + 1}`
      : f.rival === 'bubble' ? "You're both on the playoff bubble" : '';
    return `
      <div class="trade">
        <div class="trade-side"><b>You send</b>${who(t.give)}</div>
        <div class="trade-side"><b>You get from ${esc(her)}</b>${who(t.get)}</div>
      </div>
      <dl class="trade-math">
        <div><dt>Your lineup, next 4 weeks</dt><dd>${gain(t.you.near)}</dd></div>
        <div><dt>${esc(her)}'s lineup</dt><dd>${gain(t.them.near)}</dd></div>
        <div><dt>Your ${kind} odds</dt><dd>${odds(t.you)}</dd></div>
        <div><dt>${esc(her)}'s ${kind} odds</dt><dd>${odds(t.them)}</dd></div>
      </dl>
      ${sticker && t.week ? `<div class="trade-flags"><span>${esc(sticker)}</span></div>` : ''}`;
  };

  const coachSource = (w) => `Everything here comes from ESPN's own projections and injury report, captured ${updated(w.captured_at)}. A projection is the experts' guess at how many points a player will score. Useful, not gospel. Nothing on this page changes your lineup for you: make the moves in the ESPN app.`;
  const nextSource = () => `Next week's rosters, projections and injury report as ESPN had them ${updated(ahead().captured_at)}. All of it moves as the week gets closer${ahead().projected ? '' : ", and ESPN hasn't published next week's projections yet, so this is byes and injuries only"}. Worth another look on Saturday. Nothing here changes your lineup for you: make the moves in the ESPN app.`;

  /* Both tabs run through the same pages: `next` false is the week being played, true is
     the week after it. Same cards, same components, different source. A flip switch, not
     a second row of tabs, since it's one choice with only two states. */
  function weekToggle(next, id) {
    if (!ahead()) return '';
    // On a team's profile the toggle flips the Lineup tab; on the league grid it flips the grid.
    const tab = (isNext, label, week) => `<a href="${id ? `#team-${id}${isNext ? '.next' : '.lineup'}` : coachUrl(isNext, null)}" ${isNext === next ? 'aria-current="page"' : ''}>${label} <span class="wk-n">W${week}</span></a>`;
    return `<div class="week-toggle" data-state="${next ? 'next' : 'this'}" role="group" aria-label="Choose a week"><span class="knob" aria-hidden="true"></span>${tab(false, 'This week', LIVE.week)}${tab(true, 'Next week', ahead().week)}</div>`;
  }

  function teamSwitch(active, next) {
    return `<nav class="team-switch" aria-label="Choose a team">${coachRows(next).map((a) => `
      <a href="${coachUrl(next, a.team_id)}" data-myteam="${a.team_id}" ${a.team_id === active ? 'aria-current="page"' : ''}>${esc(a.manager)}${a.counts.now ? `<span class="dot" title="${a.counts.now} to fix">!</span>` : ''}</a>`).join('')}</nav>`;
  }

  /* Her top two items, most urgent first. build.py already sorts items by level, then puts a
     lookback or opponent-preview card in front of them, so re-sort here (stable) to let a real
     to-do outrank that "info" card. */
  const LEVEL_RANK = { now: 0, watch: 1, info: 2 };

  const todoBadge = (a, next) => (a.counts.now ? `<span class="todo now">${a.counts.now} to ${next ? 'sort out' : 'fix'}</span>`
    : a.counts.watch ? `<span class="todo watch">${a.counts.watch} to watch</span>`
    : '<span class="todo clear">all clear</span>');
  // The "nothing to fix" item is left out: the card's summary line already says so.
  const topItems = (a, n) => a.items.filter((it) => it.kind !== 'clear').sort((x, y) => (LEVEL_RANK[x.level] ?? 3) - (LEVEL_RANK[y.level] ?? 3)).slice(0, n);

  function winBar(a, b) {
    const p = a.win_probability;
    if (p == null) return '';
    return `<div class="fo-bar" role="img" aria-label="Chance to win: ${esc(a.manager)} ${pct(p)}, ${esc(b.manager)} ${pct(1 - p)}">
      <span class="a" style="flex:${p.toFixed(3)}" aria-hidden="true">${pct(p)}</span><span class="b" style="flex:${(1 - p).toFixed(3)}" aria-hidden="true">${pct(1 - p)}</span></div>`;
  }

  // Each team's opponent, read off the advice rows; one pair per game, your game first.
  function coachPairs(rows, me) {
    const seen = new Set();
    const pairs = [];
    for (const a of rows) {
      if (seen.has(a.team_id)) continue;
      const b = rows.find((r) => r.team_id === a.opponent_id);
      if (!b) continue;
      seen.add(a.team_id); seen.add(b.team_id);
      pairs.push(b.team_id === me ? [b, a] : [a, b]);
    }
    const closeness = ([a]) => (a.win_probability == null ? 1 : Math.abs(a.win_probability - 0.5));
    return pairs.sort((x, y) => ((y[0].team_id === me) - (x[0].team_id === me)) || (closeness(x) - closeness(y)));
  }

  function coachHero(a, rows, next) {
    const opp = rows.find((r) => r.team_id === a.opponent_id);
    const t = TEAMS[a.team_id];
    const po = SEASON.playoffs && SEASON.playoffs.teams.find((x) => x.team_id === a.team_id);
    const stand = [t && t.weekly && t.weekly.length ? record(t) : null, po ? `Seed ${po.proj_seed}` : null].filter(Boolean);
    const items = topItems(a, 2);
    return `
      <section class="coach-hero" aria-labelledby="ch-mgr">
        <span class="you-sticker" aria-hidden="true">You</span>
        <div class="ch-head">
          <div class="ch-who"><p class="ch-eyebrow">Your team</p><h2 class="mgr" id="ch-mgr">${esc(a.manager)}</h2><div class="tname">${esc(a.team_name)}</div></div>
          <a class="profile-btn ch-go" href="${coachUrl(next, a.team_id)}" data-myteam="${a.team_id}">See my full profile →</a>
          ${todoBadge(a, next)}
        </div>
        ${stand.length || po ? `<p class="ch-stand">${stand.map(esc).join(' · ')}${po ? ` <span class="po-label ${PO_LABEL[po.label] || ''}" title="${esc(PO_TIP[po.label] || '')}">${esc(po.label)}</span>` : ''}</p>` : ''}
        ${opp || a.projected != null ? `
        <div class="ch-game">
          <div class="ch-vs">${opp ? `vs <b>${esc(opp.manager)}</b><span>${esc(opp.team_name)}</span>` : 'Opponent TBD'}</div>
          ${a.projected != null ? `<div class="ch-proj"><span class="n">${f1(a.projected)}</span><span class="l">projected points</span></div>` : '<div></div>'}
          ${opp ? winBar(a, opp) : ''}
        </div>` : ''}
        ${a.summary ? `<p class="ch-sum">${esc(a.summary)}</p>` : ''}
        ${items.length ? `<ul class="cc-list ch-list">${items.map((it) => `
          <li><span class="cc-box ${esc(it.level)}" aria-hidden="true"></span><span>${esc(it.title)}<small>${esc(ADVICE_KIND[it.kind] || 'Note')}${it.stat ? ` · ${esc(it.stat)}` : ''}</small></span></li>`).join('')}</ul>` : ''}
      </section>`;
  }

  function heroPicker(next) {
    return `
      <section class="coach-hero ch-pick" aria-labelledby="ch-pick">
        <h2 class="mgr" id="ch-pick" style="margin:0;font:900 36px/1 var(--display)">Hi, I'm Coach.</h2>
        <p>Tell me your name and this spot becomes yours: your game, your odds, your to-dos.</p>
        <button type="button" class="profile-btn" data-open-pick>Tell Coach your name</button>
        <dialog class="pick-dialog" id="pick-dialog" aria-labelledby="pick-h">
          <h2 id="pick-h">Hi, I'm Coach.</h2>
          <p>I've read every roster in this league, ESPN's injury report and 8,000 simulated seasons, so yes, I already know what's wrong with your lineup. Pick your name and I'll tell you before kickoff.</p>
          <div class="pick-grid">${coachRows(next).map((a) => `
            <button type="button" data-pick="${a.team_id}"${a.counts.now ? ` aria-label="${esc(a.manager)}, ${a.counts.now} to fix"` : ''}>${esc(a.manager)}${a.counts.now ? `<span class="dot" aria-hidden="true">!</span>` : ''}</button>`).join('')}</div>
          <p class="pick-hint"><span class="dot" aria-hidden="true">!</span> A pink ! means that team has homework.</p>
        </dialog>
      </section>`;
  }

  function coachRadar(rows, pairs, next) {
    const swap = rows.flatMap((r) => r.items.filter((it) => it.kind === 'swap' && it.gain).map((it) => ({ r, it })))
      .sort((x, y) => y.it.gain - x.it.gain)[0];
    const hurt = rows.flatMap((r) => r.items.filter((it) => it.kind === 'out' || it.kind === 'watch').map((it) => ({ r, it })))
      .sort((x, y) => (LEVEL_RANK[x.it.level] ?? 3) - (LEVEL_RANK[y.it.level] ?? 3))[0];
    const close = pairs.filter(([a]) => a.win_probability != null)
      .sort((x, y) => Math.abs(x[0].win_probability - 0.5) - Math.abs(y[0].win_probability - 0.5))[0];
    const tile = (cls, tag, body, r) => (r
      ? `<a class="radar-tile ${cls}" href="${lineupUrl(next, r.team_id)}" data-myteam="${r.team_id}"><span class="rt-tag">${tag}</span>${body}</a>`
      : `<div class="radar-tile ${cls}"><span class="rt-tag">${tag}</span>${body}</div>`);
    return `
      <section class="radar" aria-labelledby="radar-h">
        <h2 id="radar-h">League radar</h2>
        ${tile('swap', 'Biggest swap on the board', swap
          ? `<div class="rt-main">${esc(deskTitle(swap.it.title))}</div><div class="rt-sub"><span>${esc(swap.r.manager)}'s bench</span><b>+${f1(swap.it.gain)}</b></div>`
          : '<p class="rt-empty">Nobody has a better player sitting on the bench. Look at you all.</p>', swap && swap.r)}
        ${tile('close', 'Closest matchup', close
          ? `<div class="rt-main">${esc(close[0].manager)} vs ${esc(close[1].manager)}</div><div class="rt-sub"><span>ESPN's win odds</span><span>${pct(close[0].win_probability)} · ${pct(1 - close[0].win_probability)}</span></div>`
          : '<p class="rt-empty">No win odds from ESPN yet. Check back closer to kickoff.</p>', null)}
        ${tile('hurt', 'On the injury report', hurt
          ? `<div class="rt-main">${esc(deskTitle(hurt.it.title))}</div><div class="rt-sub"><span>${esc(hurt.r.manager)}'s team</span><span class="rt-pill">${esc(ADVICE_KIND[hurt.it.kind] || 'Injury')}</span></div>`
          : '<p class="rt-empty">Every starter is healthy. Knock on wood.</p>', hurt && hurt.r)}
      </section>`;
  }

  /* "Where everyone's strong": every team's rank (1 = best of 8) at each lineup spot, from
     the season's points at that spot (the same ranks behind the profile's Position strength
     card). Shade is a single cobalt ramp, but the number and the corner sticker carry the
     meaning, so nothing depends on color alone. */
  const GRID_COLS = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'DST', 'K'];
  const GRID_NAME = { QB: 'quarterback', RB: 'running back', WR: 'wide receiver', TE: 'tight end', FLEX: 'flex', DST: 'defense', K: 'kicker' };
  function strengthGrid(next, me) {
    const teams = SEASON.standings.filter((t) => t.profile && t.profile.pos_ranks);
    if (!teams.length) return '<p class="sec-sub">Coach needs one finished week before she can rank anybody.</p>';
    const n = teams.length;
    const row = (t) => {
      const ranks = t.profile.pos_ranks;
      const mine = t.team_id === me;
      const best = t.profile.best_spot;
      const weak = t.profile.weak_spot;
      const spread = best && weak && ranks[best] !== ranks[weak];
      const avg = GRID_COLS.reduce((a, c) => a + ranks[c], 0) / GRID_COLS.length;
      // No data-myteam on these links: tapping someone else's name must not make her "You".
      return `
        <tr${mine ? ' class="me"' : ''}>
          <th scope="row"><a href="${coachUrl(next, t.team_id)}">${esc(t.manager)}</a>${mine ? '<span class="you-tag">You</span>' : ''}</th>
          ${GRID_COLS.map((c) => {
            const r = ranks[c];
            const tag = spread && c === best ? ['best', 'Best spot', '▲'] : spread && c === weak ? ['weak', 'Weakest spot', '▼'] : null;
            return `<td class="h${r}"><span class="rk" aria-hidden="true">${r}</span>${tag ? `<span class="corner ${tag[0]}" aria-hidden="true">${tag[2]}</span>` : ''}<span class="sr">${esc(t.manager)} at ${GRID_NAME[c]}: ${ordinal(r)} of ${n}${tag ? `, ${tag[1].toLowerCase()}` : ''}</span></td>`;
          }).join('')}
          <td class="avg"><span class="rk" aria-hidden="true">${avg.toFixed(1)}</span><span class="sr">${esc(t.manager)}, average across all spots: ${avg.toFixed(1)}</span></td>
        </tr>`;
    };
    return `
      <div class="strength table-scroll" role="region" aria-label="Lineup spot rankings, scrolls sideways" tabindex="0">
        <table>
          <thead><tr><th scope="col">Manager</th>${GRID_COLS.map((c) => `<th scope="col" title="${esc(GRID_NAME[c])}">${c}</th>`).join('')}<th scope="col" title="average rank across all spots">AVG</th></tr></thead>
          <tbody>${teams.map(row).join('')}</tbody>
        </table>
      </div>
      <p class="strength-key"><span><i class="corner best" aria-hidden="true">▲</i>best spot</span><span><i class="corner weak" aria-hidden="true">▼</i>weakest spot</span><span>AVG is the mean of a team's seven ranks</span><span>1 is the league's best, ${n} the worst</span></p>`;
  }

  /* "Waiver order this week": ESPN's own order, captured as waiver_rank (SEASON.waiver_order). ESPN
     resets it each week to worst record first, but with its own tiebreaks, so the standings upside
     down only stands in for captures that predate the field. */
  function waiverCard(next, me) {
    const order = SEASON.waiver_order
      ? SEASON.waiver_order.map((id) => TEAMS[id]).filter(Boolean)
      : [...SEASON.standings].reverse();
    return `
      <section class="panel" aria-labelledby="wo-h">
        <h2 id="wo-h">Waiver order this week</h2>
        <p class="sec-sub">Worst record picks first. The order resets every week.</p>
        <ol class="waiver">${order.map((t, i) => {
          const mine = t.team_id === me;
          return `<li${mine ? ' class="me"' : ''}><span class="pos">${i + 1}</span><span class="wname"><a href="${coachUrl(next, t.team_id)}">${esc(t.manager)}</a>${mine ? '<span class="you-tag">You</span>' : ''}</span><span class="rec">${record(t)}</span></li>`;
        }).join('')}</ol>
      </section>`;
  }

  /* "Injuries and byes": everyone on a roster who's hurt or whose NFL team is off, grouped by team.
     The status is always spelled out in the pill, so its fill is a hint and never the message. */
  let injPick = null;
  const INJ_PILL = (status) => (OUTISH.includes(status) ? 'out' : status === 'Bye' ? 'bye' : 'q');
  function injuryCard(next, me) {
    const view = ahead() && (injPick || (next ? 'next' : 'this')) === 'next' ? 'next' : 'this';
    const rows = coachRows(view === 'next') || [];
    const known = rows.some((r) => Array.isArray(r.report));
    const groups = rows.filter((r) => (r.report || []).length)
      .sort((x, y) => (y.team_id === me) - (x.team_id === me));
    const body = !known
      ? '<p class="inj-empty">Coach hasn\'t got the injury report for this one yet. Check back soon.</p>'
      : groups.length
        ? `<div class="inj-wrap table-scroll"><table class="inj-table">
            <thead><tr><th scope="col">Manager</th><th scope="col">Player</th><th scope="col">Status</th><th scope="col">Spot</th></tr></thead>
            ${groups.map((g) => `<tbody>${g.report.map((p, i) => `
              <tr>${i === 0 ? `<th scope="rowgroup" rowspan="${g.report.length}"><a href="${coachUrl(next, g.team_id)}">${esc(g.manager)}</a>${g.team_id === me ? '<span class="you-tag">You</span>' : ''}</th>` : ''}
                <td class="pl">${esc(p.name)}${p.pos && p.pos !== 'DST' ? ` <small>${esc(p.pos)}</small>` : ''}${p.team ? ` <span class="nfl">${p.logo ? `<img src="${esc(p.logo)}" alt="" width="16" height="16" loading="lazy" onerror="this.remove()">` : ''}${esc(p.team)}</span>` : ''}</td>

    return `

  /* The week-ahead lineup: no scores exist yet, so the table is the roster and what ESPN

  /* The week-in-progress part of a team's profile: what used to be her own Coach page.

  function thisWeekSection(id, next) {

    const opp = g ? (g.winner.team_id === id ? g.loser : g.winner) : TEAMS[a.opponent_id];
    const byes = a.items.filter((it) => it.kind === 'bye').length;
    const groups = Object.keys(ADVICE_LEVEL)
      .map((lvl) => [lvl, a.items.filter((it) => it.level === lvl)])
      .filter(([, items]) => items.length);
    return `

        <p class="dek">${!next && a.can_change === false

          : (a.counts.now ? `${a.counts.now} thing${a.counts.now === 1 ? '' : 's'} to ${next ? 'sort out before Sunday' : 'fix before kickoff'}.` : 'Nothing urgent.')}${opp ? ` You're playing <a href="#team-${opp.team_id}">${esc(opp.manager)}</a>${next ? ` in Week ${week}.` : `. <a href="#live.game-${g.key}">Live box score →</a>`}` : ''}</p>
        <p class="team-summary">${esc(a.summary)}</p>
        <div class="stat-tiles">
          <div class="tile"><div class="label">To ${next ? 'sort out' : 'fix now'}</div><div class="value">${a.counts.now}</div><div class="sub">${a.counts.watch} to keep an eye on</div></div>
          <div class="tile"><div class="label">Projected total</div><div class="value">${next && !ahead().projected ? '–' : f1(a.projected)}</div><div class="sub">${next ? (ahead().projected ? "ESPN's estimate for Week " + week : 'not published yet') : (mine ? `${f2(mine.points)} on the board` : "ESPN's estimate")}</div></div>
          ${next
            ? `<div class="tile"><div class="label">Starters on a bye</div><div class="value">${byes}</div><div class="sub">${byes ? 'a bye week means his NFL team doesn\'t play' : 'everyone has a game'}</div></div>`
            : `<div class="tile"><div class="label">Starters left to play</div><div class="value">${a.yet_to_play}</div><div class="sub">${a.playing_now ? `${a.playing_now} on the field right now` : `${a.movable} still swappable`}</div></div>`}
          ${a.win_probability == null ? '' : `<div class="tile"><div class="label">Chance to win</div><div class="value">${Math.round(a.win_probability * 100)}%</div><div class="sub">ESPN's number${opp ? `, vs ${esc(opp.manager)}` : ''}</div></div>`}
        </div>
      </section>

      ${groups.map(([lvl, items]) => `
        <section>
          ${secHead(ADVICE_LEVEL[lvl].marker, (next && ADVICE_LEVEL[lvl].nextTitle) || ADVICE_LEVEL[lvl].title)}
          <p class="sec-sub">${(next && ADVICE_LEVEL[lvl].nextSub) || ADVICE_LEVEL[lvl].sub}</p>
          <div class="cards">${items.map(adviceCard).join('')}</div>
        </section>`).join('')}

      ${next ? `
      <section>
        ${secHead('board', `Your lineup for Week ${week}`)}
        <p class="sec-sub">What you have set right now, and what ESPN projects for it. Tap any player for what ESPN is saying about him. The badge next to a name is his NFL team and a colored pill is ESPN's injury designation. Nobody has played, so there are no points yet.</p>
        <div class="box-grid">${nextLineupCard(a)}</div>
      </section>` : (mine ? `
      <section>
        ${secHead('board', 'Your lineup right now')}
        <p class="sec-sub">Tap any player for how his points happened, plus whatever ESPN is saying about him. The badge next to a name is his NFL team, a colored pill is ESPN's injury designation, and a pulsing lime sticker means his game is on right now. A ⚑ on the bench marks a player already outscoring a starter he could have replaced.</p>
        <div class="box-grid">${lineupCard(mine, true, true, `<span class="res">proj ${f1(a.projected)}</span>`, a.players)}</div>
      </section>` : '')}
      <p class="sec-sub">${next ? nextSource() : coachSource(LIVE)}</p>`;
  }

  function auditSection(p) {
    return `
      <section>

          ? `<p class="sec-sub">Your season so far, graded on every week with a recap.</p><div class="cards">${p.audit.map(adviceCard).join('')}</div>`
          : '<p class="sec-sub">The coach needs one finished week before she has opinions.</p>'}

  function suggestionsSection(id, next) {
    const a = coachFor(id, next);
    // Matched here, not trusted from the build: /api/live replaces LIVE.advice with rows that

    const weak = (TEAMS[id].profile || {}).weak_spot;

          : '<p class="sec-sub">No new ideas today.</p>'}

    return `

          : '<p class="sec-sub">No adds, drops or trades yet. Still riding with the draft-day roster.</p>'}

  function glossaryPage() {
    const seen = new Map();
    for (const w of WEEKS) for (const g of w.glossary) {
      const k = g.term.toLowerCase();

    }
    const terms = [...seen.values()].sort((a, b) => a.term.localeCompare(b.term));
    return `
      <div class="page-head">

      </div>
      <section style="margin-top:18px">
        ${terms.length ? `<dl class="terms">${terms.map((g) => `<div class="term"><dt>${esc(g.term)} <a href="#week-${g.week}">Week ${g.week}</a></dt><dd>${esc(g.definition)}</dd></div>`).join('')}</dl>` : '<p class="sec-sub">Terms show up here once the first recap is out.</p>'}
      </section>`;
  }

  const notFound = () => `<div class="empty"><h1>Fumble</h1><p>That page doesn't exist. <a href="${WEEKS.length ? `#week-${latest().week}` : '#'}" style="color:var(--accent)">Back to the latest recap</a></p></div>`;

__BTS_JS__
  /* ---------- router: every page is a #hash inside this one file ---------- */
  let btsSection = '';
  function route() {
    const h = location.hash.replace(/^#/, '');
    let m, html, nav = 'week';
    if (h === 'glossary') { html = glossaryPage(); nav = 'glossary'; }
    else if ((m = /^behind-the-scenes(?:\.(big|data|api|harness|deploy|safe|cheat))?$/.exec(h))) { html = btsPage(); nav = 'behind-the-scenes'; btsSection = m[1] || ''; }
    else if (h === 'live' && LIVE) { html = liveOrLanding(LIVE); nav = 'live'; }
    else if ((m = /^live\.game-(\d+-\d+)$/.exec(h)) && LIVE) { html = matchupPage(LIVE, m[1]); nav = 'live'; }
    else if (h === 'coach' && advice()) { html = coachPage(false); nav = 'coach'; }
    else if (h === 'coach-next' && ahead()) { html = coachPage(true); nav = 'coach'; }
    else if ((m = /^coach(-next)?-(\d+)$/.exec(h))) { myTeam.set(Number(m[2])); location.replace(lineupUrl(!!m[1], m[2])); return; }
    else if ((m = /^team-(\d+)(?:\.(lineup|season|next))?$/.exec(h))) { html = teamPage(Number(m[1]), m[2] === 'season' ? 'season' : m[2] ? 'lineup' : 'overview', m[2] === 'next'); nav = coachFor(Number(m[1]), false) ? 'coach' : 'standings'; }
    else if (!WEEKS.length && LIVE && h === '') { html = liveOrLanding(LIVE); nav = 'live'; }
    else if (!WEEKS.length) { html = `<div class="empty"><h1>First recap coming soon</h1><p>Check back Tuesday. We will have opinions.</p></div>`; }
    else if (h === 'standings') { html = standingsPage(); nav = 'standings'; }
    else if ((m = /^week-(\d+)\.awards$/.exec(h)) && weekOf(+m[1])) { html = awardsPage(weekOf(+m[1])); }
    else if ((m = /^week-(\d+)\.game-(\d+-\d+)$/.exec(h)) && weekOf(+m[1])) { html = matchupPage(weekOf(+m[1]), m[2]); }
    else if ((m = /^week-(\d+)$/.exec(h)) && weekOf(+m[1])) { html = weekPage(weekOf(+m[1])); }
    // Home page: a current/pending week (in progress, final and awaiting its recap, or not
    // even kicked off yet) is more useful than last week's recap for as long as it's around.
    // Only once it's actually been recapped does the home page fall back to that recap.
    else if (h === '' && LIVE) { html = liveOrLanding(LIVE); nav = 'live'; }
    else if (h === '') { html = weekPage(latest()); }
    else { html = notFound(); }
    $('#main').innerHTML = html;
    document.querySelectorAll('#nav a').forEach((a) =>
      a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    if (advice()) document.getElementById('nav-coach').href = coachHref();
    if (nav === 'behind-the-scenes') btsMount(btsSection);
    // Coach's hello is a modal: it opens on its own and only a pick closes it.
    const pick = document.getElementById('pick-dialog');
    if (pick && !pick.open && pick.showModal) pick.showModal();
  }

  /* Escape is the one way out of a modal, so it's blocked (`cancel` and `close` don't bubble,
     hence the capture), and a close that slips through reopens until there's a team. */
  document.addEventListener('cancel', (e) => { if (e.target.id === 'pick-dialog') e.preventDefault(); }, true);
  document.addEventListener('close', (e) => { if (e.target.id === 'pick-dialog' && e.target.isConnected) e.target.showModal(); }, true);

  /* Opening a player card. #main survives every re-render (only its contents change), so
     one listener here outlives the router and the live refresh. */
  $('#main').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-peek]');
    if (!btn) return;
    const id = Number(btn.dataset.peek);
    const panel = document.getElementById(btn.getAttribute('aria-controls'));
    if (!panel) return;
    const open = panel.hidden;
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.closest('tr').classList.toggle('peek-open', open);
    if (open) PEEK.add(id); else PEEK.delete(id);
  });

  /* `toggle` doesn't bubble, so it's caught on the way down. */
  $('#main').addEventListener('toggle', (e) => {
    const key = e.target.dataset && e.target.dataset.hubOpen;
    if (!key) return;
    if (e.target.open) HUB_OPEN.add(key); else HUB_OPEN.delete(key);
  }, true);

  /* Picking a team from Coach (a grid card or the team switcher) is what makes it "my team"
     for the Coach tab. Opening someone's profile from Standings or a matchup link isn't. */
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-myteam]');
    if (a) myTeam.set(Number(a.dataset.myteam));
    // Coach's hello modal: remember the pick and redraw Coach as her team.
    const pick = e.target.closest('button[data-pick]');
    if (pick) { myTeam.set(Number(pick.dataset.pick)); route(); }
    const inj = e.target.closest('button[data-inj]');
    if (inj) { injPick = inj.dataset.inj; route(); const again = document.querySelector(`button[data-inj="${injPick}"]`); if (again) again.focus({ preventScroll: true }); }
    const reopen = e.target.closest('button[data-open-pick]');
    if (reopen) { const d = document.getElementById('pick-dialog'); if (d && !d.open) d.showModal(); }
  });

  window.addEventListener('hashchange', () => {
    injPick = null;
    route();
    window.scrollTo({ top: 0 });
    $('#main').focus({ preventScroll: true });
  });

  /* ---------- live refresh (Vercel builds only; see api/live.py) ----------
     Strictly an upgrade on top of what's already on screen: the page paints from its
     baked data first, then asks /api/live for a fresher copy of the same week. The
     artifact build leaves FANTASY_LIVE_API unset and so never calls it, and any failure
     here leaves the baked numbers exactly as they were. */
  async function refreshLive() {
    if (!LIVE || !window.FANTASY_LIVE_API) return;
    try {
      const res = await fetch(window.FANTASY_LIVE_API, { cache: 'no-store' });
      if (!res.ok) return;
      const fresh = await res.json();
      // A new week may have started since this build was deployed; only ever patch the
      // week this page is actually showing.
      if (fresh.week !== LIVE.week) return;
      Object.assign(LIVE, fresh);
      const h = location.hash.replace(/^#/, '');
      // Home page ('') also renders live while games are on (see route()), including the
      // moment a refresh lands the final score that flips it over to the recap.
      // The team picker has nothing live in it; redrawing would reset its focus every minute.
      const picking = (document.getElementById('pick-dialog') || {}).open;
      if (!picking && (h.startsWith('live') || h.startsWith('coach') || h.startsWith('team-') || h === '')) {
        // A re-render rebuilds the swipe row of stickers; put it back where her thumb left it.
        const chips = document.querySelector('.hub-chips');
        const left = chips ? chips.scrollLeft : 0;
        route();
        if (left) { const again = document.querySelector('.hub-chips'); if (again) again.scrollLeft = left; }
      }
    } catch { /* offline, blocked, or a 503 (ESPN refused): keep the baked numbers */ }
  }

  /* How soon to ask again. While somebody's game is on, points land every few seconds and
     the page should keep up; the rest of the week nothing moves, so it idles at the old
     once-a-minute. A capture with no NFL game states (the public scoreboard is best
     effort) reports nobody playing and simply idles, never slower than it used to be. */
  const LIVE_PLAYING = 20000, LIVE_IDLE = 60000;
  function livePace() {
    if (!LIVE || LIVE.complete || !window.FANTASY_LIVE_API) return 0; // nothing left to follow
    const onField = (LIVE.games || []).some((g) => (g.winner.playing_now || 0) + (g.loser.playing_now || 0) > 0);
    return onField ? LIVE_PLAYING : LIVE_IDLE;
  }

  /* One timer that re-reads the pace after every refresh, so the page speeds up by itself
     at kickoff and slows down when the last game ends, without a reload. A hidden tab
     still skips the request (battery, and nobody is reading it). */
  let liveTimer;
  function followLive() {
    clearTimeout(liveTimer);
    const wait = livePace();
    if (!wait) return;
    liveTimer = setTimeout(async () => {
      if (document.visibilityState === 'visible') await refreshLive();
      followLive();
    }, wait);
  }

  route();
  // Always upgrade once, even in a background tab: a page opened and read later should
  // still show fresh numbers, and a finished week has no timer to catch it later.
  refreshLive().then(followLive);
  // Coming back to the tab shouldn't mean staring at numbers frozen since you left.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshLive().then(followLive);
  });
})();
</script>
