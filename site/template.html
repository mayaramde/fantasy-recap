<title>__PAGE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600&display=swap">
<style>
  /* Tailgate pop palette, sticker-book UI.
     Cobalt = navigation, links, scoreboard. Tangerine = game balls. Bubblegum = flags. Lime = highlight badges.
     Text never takes a pop color on white (contrast); pops are fills with ink text on top. */
  :root {
    --bg: #f3f5fb;
    --card: #ffffff;
    --ink: #151a33;
    --muted: #565d79;
    --rule: #dde2ef;
    --edge: #151a33;
    --drop: #151a33;
    --board: #151a33;
    --board-2: #2b3263;
    --on-board: #f4f6ff;
    --on-board-muted: #a9b2dc;
    --accent: #2e4bf2;
    --accent-soft: #e2e7ff;
    --accent-ink: #1a2a9c;
    --on-accent: #ffffff;
    --orange: #ff7a1a;
    --awc-ball: #2e4bf2;
    --awc-break: #f0a468;
    --pink: #ff6fb5;
    --lime: #c7f04a;
    --on-pop: #151a33;
    --logo-chip: #ffffff;
    --pink-soft: #ffe0ef;
    --orange-soft: #ffe6d3;
    --lime-soft: #eefbc9;
    --win: #1c7a50;
    --loss: #c0392b;
    --heat-hi: #2e4bf2;
    --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
    --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --script: "Fredoka", "Figtree", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1127;
      --card: #1a1f3f;
      --ink: #f2f4ff;
      --muted: #a4abd2;
      --rule: #2d345f;
      --edge: #4a55a0;
      --drop: #03040d;
      --board: #070919;
      --board-2: #283064;
      --on-board: #f4f6ff;
      --on-board-muted: #98a2d6;
      --accent: #8196ff;
      --accent-soft: #262f6c;
      --accent-ink: #e0e6ff;
      --on-accent: #0b1033;
      --orange: #ff8a33;
      --pink: #ff82c0;
      --lime: #c7f04a;
      --on-pop: #151a33;
    --logo-chip: #ffffff;
      --pink-soft: #4a1e3d;
      --orange-soft: #4a2c15;
    --lime-soft: #2f3a14;
      --win: #55d094;
      --loss: #ff7d70;
      --heat-hi: #8196ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1127;
    --card: #1a1f3f;
    --ink: #f2f4ff;
    --muted: #a4abd2;
    --rule: #2d345f;
    --edge: #4a55a0;
    --drop: #03040d;
    --board: #070919;
    --board-2: #283064;
    --on-board: #f4f6ff;
    --on-board-muted: #98a2d6;
    --accent: #8196ff;
    --accent-soft: #262f6c;
    --accent-ink: #e0e6ff;
    --on-accent: #0b1033;
    --orange: #ff8a33;
    --pink: #ff82c0;
    --lime: #c7f04a;
    --on-pop: #151a33;
    --logo-chip: #ffffff;
    --pink-soft: #4a1e3d;
    --orange-soft: #4a2c15;
    --lime-soft: #2f3a14;
    --win: #55d094;
    --loss: #ff7d70;
    --heat-hi: #8196ff;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 400 15.5px/1.55 var(--body); padding-inline: 16px; padding-block: 0 56px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  /* flow-root: the phone header's compensating margin must not collapse into the page's first margin */
  body > .wrap { display: flow-root; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  a { color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  main:focus { outline: none; }

  /* the sticker: every raised surface shares one outline + hard offset shadow */
  a.game, .card, .lineup, .std-card, .tile, .decided li, .other-games a, .versus,
  .story, .final-lines {
    border: 2px solid var(--edge); box-shadow: 4px 4px 0 var(--drop); border-radius: 14px;
  }
  @media (prefers-reduced-motion: no-preference) {
    a.game, .other-games a, .chips a, .profile-btn { transition: transform 0.12s ease, box-shadow 0.12s ease; }
  }
  a.game:hover, .other-games a:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--drop); }
  a.game:active, .other-games a:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }
  .badge-tilt { display: inline-block; transform: rotate(-3deg); }

  /* ---------- site header ---------- */
  .site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding-inline: 16px; border-bottom: 2px solid var(--edge); }
  .site-head .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 12px; max-width: 1160px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .flag-mark { width: 24px; height: 28px; flex: none; background: var(--pink); clip-path: polygon(0 0, 100% 0, 76% 50%, 100% 100%, 0 100%); transform: rotate(-8deg); filter: drop-shadow(2px 2px 0 var(--drop)); }
  .brand-name { font: 800 24px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
  .brand-script { font: 600 13px/1 var(--script); color: var(--on-pop); background: var(--lime); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 9px; margin-left: 6px; display: inline-block; transform: rotate(-4deg); vertical-align: 3px; }
  nav.site-nav { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; margin-left: auto; padding: 2px 4px 4px 2px; }
  nav.site-nav a { text-decoration: none; font: 600 14px/1 var(--body); padding: 8px 11px; border-radius: 999px; white-space: nowrap; color: var(--ink); border: 2px solid transparent; }
  nav.site-nav a:hover { border-color: var(--edge); }
  nav.site-nav a[aria-current="page"] { background: var(--accent); color: var(--on-accent); border-color: var(--edge); box-shadow: 2px 2px 0 var(--drop); }

  /* ---------- "Viewing as": whose eyes the site is wearing ----------
     Orange means "you" everywhere. The chip glows on purpose, all the time, so nobody forgets
     which view they're in; people who ask for less motion get a steady glow instead. */
  .va { position: relative; }
  .va-btn { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink); background: var(--orange-soft); border: 2px solid var(--edge); border-radius: 999px;
    padding: 5px 12px 5px 9px; font: 700 13px/1.2 var(--body); white-space: nowrap; box-shadow: 2px 2px 0 var(--drop); animation: glow 2.2s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 2px 2px 0 var(--drop), 0 0 0 0 rgba(255, 122, 26, 0), 0 0 10px 2px rgba(255, 122, 26, 0.45); }
    50% { box-shadow: 2px 2px 0 var(--drop), 0 0 0 6px rgba(255, 122, 26, 0.2), 0 0 24px 7px rgba(255, 122, 26, 0.7); }
  }
  @media (prefers-reduced-motion: reduce) {
    .va-btn { animation: none; box-shadow: 2px 2px 0 var(--drop), 0 0 16px 4px rgba(255, 122, 26, 0.55); }
  }
  .va-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); border: 2px solid var(--edge); }
  .va-btn .ini { display: none; }
  .va-btn small { font: 500 10px/1 var(--mono); color: var(--muted); }
  .va-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 260px; max-width: calc(100vw - 32px); background: var(--card); color: var(--ink);
    border: 2px solid var(--edge); border-radius: 16px; box-shadow: 4px 4px 0 var(--drop); padding: 8px; }
  .va-menu[hidden] { display: none; }
  .va-menu h2 { margin: 4px 8px 6px; font: 500 10px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .va-menu .it { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; text-decoration: none; font: 600 14px/1.2 var(--body); }
  .va-menu .it:hover, .va-menu .it:focus-visible { background: var(--accent-soft); }
  .va-menu .it .ck { width: 16px; flex: none; color: var(--accent); font-weight: 800; }
  .va-menu .it .rec { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--muted); }
  .va-menu hr { border: 0; border-top: 2px dotted var(--rule); margin: 6px 4px; }
  .va-menu .it.open-team { justify-content: space-between; margin-bottom: 4px; background: var(--lime-soft); border: 2px solid var(--edge); }
  .va-menu .it.open-team:hover, .va-menu .it.open-team:focus-visible { background: var(--lime); color: var(--on-pop); }
  .who-dialog .pick-grid button.me { background: var(--orange-soft); }
  .who-dialog .pick-grid button.me::after { content: "you"; font: 500 10px/1 var(--mono); text-transform: none; letter-spacing: 0; color: var(--muted); }
  .who-dialog .just-looking { display: block; width: 100%; margin-top: 12px; cursor: pointer; color: var(--ink); font: 700 15px/1 var(--body); background: transparent; border: 2px dashed var(--edge); border-radius: 10px; padding: 12px 10px; }
  .who-dialog .just-looking:hover, .who-dialog .just-looking:focus-visible { background: var(--card); }
  .va-toast { position: fixed; z-index: 60; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
    background: var(--board); color: var(--on-board); border: 2px solid var(--edge); border-radius: 999px; box-shadow: 3px 3px 0 var(--drop); padding: 8px 8px 8px 16px; font: 600 14px/1.2 var(--body); }
  .va-toast[hidden] { display: none; }
  .va-toast button { cursor: pointer; font: 800 13px/1 var(--body); color: var(--on-pop); background: var(--lime); border: 2px solid var(--edge); border-radius: 999px; padding: 6px 12px; }

  /* ---------- phone header: two rows at the top, one slim bar once you scroll ----------
     Row 1 is the brand and the glowing chip, row 2 is the swipeable nav. Past ~70px of scroll the
     header collapses to a solid 48px bar (flag, page-name pill, avatar-only chip); it only opens
     again below ~20px so it can't flicker at the threshold. siteHead adds the height it gave up
     as a margin so the content underneath never jumps. */
  .site-head .pgn { display: none; }
  @media (max-width: 380px) { .va-pre { display: none; } }
  @media (max-width: 640px) {
    .site-head .wrap { padding-block: 10px 0; gap: 6px 10px; }
    .brand-script { display: none; }
    .brand-name { font-size: 21px; }
    .va { margin-left: auto; }
    nav.site-nav { order: 3; flex: 1 0 100%; margin-left: 0; padding: 4px 0 10px; scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, #000 82%, transparent); mask-image: linear-gradient(90deg, #000 82%, transparent); }
    nav.site-nav::-webkit-scrollbar { display: none; }
    nav.site-nav a { padding: 8px 13px; }
    .site-head.sc { box-shadow: 0 2px 0 var(--drop); }
    .site-head.sc .wrap { height: 48px; flex-wrap: nowrap; padding-block: 0; gap: 8px; align-content: center; }
    .site-head.sc .brand-name, .site-head.sc nav.site-nav { display: none; }
    .site-head.sc .pgn { display: inline-block; font: 800 13px/1 var(--body); background: var(--accent-soft); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; padding: 6px 11px; white-space: nowrap; }
    .site-head.sc .va { margin-left: auto; }
    .site-head.sc .va-btn { padding: 2px; gap: 0; }
    .site-head.sc .va-btn .dot, .site-head.sc .va-btn .va-txt, .site-head.sc .va-btn small { display: none; }
    .site-head.sc .va-btn .ini { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: var(--on-pop); border: 2px solid var(--edge); font: 800 13px/1 var(--body); }
  }

  .draft-banner { margin-top: 18px; padding: 10px 14px; background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 3px 3px 0 var(--drop); font-size: 13.5px; font-weight: 700; }

  /* ---------- ESPN ticker ----------
     Lives outside #main (see drawTicker) so a live refresh's re-render can't restart the scroll. The
     second copy of the list is what makes the -50% loop seamless; it is aria-hidden and unfocusable. */
  .ticker { --tk-dur: 60s; display: flex; align-items: stretch; min-height: 56px; margin-inline: -16px; background: var(--board); color: var(--on-board); border-bottom: 2px solid var(--edge); }
  .ticker[hidden] { display: none; }
  .tk-label { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--lime); color: var(--on-pop); border-right: 2px solid var(--edge); font: 500 12px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  .tk-label .short { display: none; }
  .tk-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--orange); border: 1.5px solid var(--on-pop); }
  .tk-view { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: stretch; }
  .tk-track { display: flex; width: max-content; }
  .tk-list { display: flex; flex: none; list-style: none; margin: 0; padding: 0; }
  .tk-item { display: flex; align-items: center; gap: 10px; min-height: 44px; height: 100%; padding: 0 12px 0 20px; color: var(--on-board); text-decoration: none; white-space: nowrap; font: 600 15px/1.2 var(--body); }
  .tk-item:hover .tk-h { text-decoration: underline; }
  .tk-item:focus-visible { outline-offset: -3px; }
  .tk-chip { font: 700 12px/1 var(--body); padding: 5px 9px; border-radius: 999px; border: 2px solid var(--edge); background: var(--accent-soft); color: var(--accent-ink); }
  .tk-chip.me { background: var(--orange); color: var(--on-pop); }
  .tk-who { font: 400 12px/1 var(--mono); color: var(--on-board-muted); }
  .tk-sep { flex: none; width: 9px; height: 9px; margin-left: 8px; background: var(--pink); border: 1.5px solid var(--edge); transform: rotate(45deg); }
  .tk-btn { flex: none; width: 56px; display: grid; place-items: center; padding: 0; background: var(--board-2); color: var(--on-board); border: 0; border-left: 2px solid var(--edge); cursor: pointer; }
  .tk-btn:hover { background: var(--accent); color: var(--on-accent); }
  .tk-btn:focus-visible { outline-offset: -5px; }
  .tk-btn svg { width: 20px; height: 20px; }
  .tk-btn .play, .ticker.paused .tk-btn .pause { display: none; }
  .ticker.paused .tk-btn .play { display: block; }
  @media (prefers-reduced-motion: no-preference) {
    .tk-dot { animation: pulse 1.6s ease-in-out infinite; }
    .tk-track { animation: tk-scroll var(--tk-dur) linear infinite; }
    .ticker.paused .tk-track, .ticker:focus-within .tk-track { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: no-preference) and (hover: hover) { .tk-view:hover .tk-track { animation-play-state: paused; } }
  @keyframes tk-scroll { to { transform: translateX(-50%); } }
  /* No motion: a strip she can scroll by hand, one copy of the list, and no button that does nothing. */
  @media (prefers-reduced-motion: reduce) {
    .tk-view { overflow-x: auto; }
    .tk-list.dup, .tk-btn { display: none; }
  }
  @media (max-width: 620px) {
    .ticker { --tk-dur: 50s; min-height: 48px; }
    .tk-label { padding: 0 12px; }
    .tk-label .long { display: none; }
    .tk-label .short { display: inline; }
    .tk-item { font-size: 14px; }
    .tk-who { display: none; }
    .tk-btn { width: 48px; }
  }

  /* ---------- Latest news (ESPN headlines about rostered players) ---------- */
  .nl-head h2 { font-size: 44px; }
  .nl-cap { display: inline-flex; align-items: center; gap: 7px; font: 400 12px/1.2 var(--mono); color: var(--muted); white-space: nowrap; }
  .nl-cap::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--win); }
  .nl-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .nl-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; background: var(--card); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; font: 700 14px/1 var(--body); cursor: pointer; white-space: nowrap; }
  .nl-chip b { font: 500 12px/1 var(--mono); padding: 4px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
  .nl-chip.me { background: var(--orange-soft); }
  .nl-chip.zero { opacity: 0.6; }
  .nl-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .nl-chip[aria-pressed="true"] b { background: var(--lime); color: var(--on-pop); }
  .nl-count { margin: 12px 0 14px; font: 400 12.5px/1.3 var(--mono); color: var(--muted); }
  .nl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  .nl-grid > * { min-width: 0; }
  .nl-lead { grid-column: span 2; grid-row: span 2; }
  .nl-lead, .nl-card { display: flex; flex-direction: column; text-decoration: none; border: 2px solid var(--edge); }
  .nl-card { gap: 10px; padding: 20px; background: var(--card); color: var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--drop); }
  .nl-lead { gap: 14px; padding: 18px; background: var(--accent); color: var(--on-accent); border-radius: 20px; box-shadow: 5px 5px 0 var(--drop); }
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .nl-lead, .nl-card { transition: transform 0.12s ease, box-shadow 0.12s ease; }
    .nl-card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--drop); }
    .nl-lead:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--drop); }
  }
  .nl-card:focus-visible, .nl-lead:focus-visible { outline-offset: 4px; border-radius: 20px; }
  .nl-banner { position: relative; height: 200px; overflow: hidden; border: 2px solid var(--edge); border-radius: 12px; background: var(--accent-ink); flex: none; }
  .nl-banner svg, .nl-banner img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .nl-banner img { object-fit: cover; }
  .nl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .nl-date { margin-left: auto; font: 400 12px/1 var(--mono); color: var(--muted); }
  .nl-lead .nl-date { color: var(--on-accent); opacity: 0.85; }
  .nl-tag { font: 600 12px/1 var(--script); padding: 5px 10px; border: 2px solid var(--edge); border-radius: 999px; color: var(--on-pop); background: var(--lime); }
  .nl-tag.Injury { background: var(--pink); }
  .nl-tag.Feature { background: var(--accent-soft); color: var(--accent-ink); }
  .nl-yours { font: 500 12px/1 var(--mono); padding: 5px 8px; border-radius: 6px; background: var(--lime); color: var(--on-pop); text-transform: uppercase; letter-spacing: 0.04em; }
  .nl-h { margin: 0; font: 800 20px/1.2 var(--body); text-wrap: balance; }
  .nl-lead .nl-h { font: 800 54px/0.98 var(--display); letter-spacing: 0.005em; }
  .nl-card:hover .nl-h { text-decoration: underline; }
  .nl-owners { display: flex; flex-wrap: wrap; gap: 6px; }
  .nl-owner { font: 700 12.5px/1 var(--body); padding: 6px 10px; border-radius: 999px; border: 2px solid var(--edge); background: var(--accent-soft); color: var(--accent-ink); }
  .nl-lead .nl-owner { background: var(--card); color: var(--ink); }
  .nl-owner.me { background: var(--orange); color: var(--on-pop); }
  .nl-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
  .nl-pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; background: var(--card); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; font: 400 12.5px/1.2 var(--mono); }
  .nl-pill small { color: var(--muted); font: inherit; }
  .nl-av { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--board); border: 2px solid var(--edge); display: grid; place-items: end center; }
  .nl-av.WAS { background: #5a1414; } .nl-av.BUF { background: #00338d; } .nl-av.NO { background: #8a6d2f; }
  .nl-av.NE { background: #002244; } .nl-av.HOU { background: #03202f; }
  .nl-av svg, .nl-av img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
  .nl-av img { object-fit: cover; object-position: top; }
  .nl-av img.logo { object-fit: contain; padding: 6px; background: #fff; }
  .nl-av .tm { position: absolute; right: -6px; bottom: -4px; padding: 2px 4px; background: var(--board); color: var(--on-board); border: 1.5px solid var(--edge); border-radius: 5px; font: 500 9px/1 var(--mono); }
  .nl-read { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 2px solid var(--edge); border-radius: 999px; background: var(--lime); color: var(--on-pop); font: 800 14px/1 var(--body); }
  .nl-card .nl-read { min-height: 0; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13.5px; }
  .nl-empty { grid-column: 1 / -1; padding: 26px 22px; border: 2px dashed var(--edge); border-radius: 16px; background: var(--card); }
  .nl-empty h3 { font: 800 28px/1 var(--display); }

  .page-head h1 { font: 800 clamp(36px, 6.2vw, 62px)/0.98 var(--display); letter-spacing: 0.005em; max-width: 20ch; }

  /* Pre-kickoff landing page: the way back to the last finished recap, next to the title. */
  .recap-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; box-shadow: 3px 3px 0 var(--drop); font: 700 14px/1.1 var(--body); text-decoration: none; white-space: nowrap; transform: rotate(-1.5deg); }
  .recap-btn:hover { transform: translate(-1px, -2px) rotate(-1.5deg); box-shadow: 6px 6px 0 var(--drop); }
  .head-row.has-recap { justify-content: flex-start; gap: 12px 18px; }

  .recap-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }
  .pill { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 14px 4px 4px; border-radius: 999px; border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); color: var(--on-pop); }
  .pill-plain { padding-left: 14px; }

  .pill-mid { background: var(--orange); transform: rotate(-1deg); }
  .pill-bot { background: var(--pink); transform: rotate(1deg); }
  /* the rank medallion: where this score landed among the eight */
  .pill .medal { flex: none; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 999px; background: var(--board); color: var(--on-board); border: 2px solid var(--edge); display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font: 800 15px/1 var(--display); letter-spacing: 0.02em; }
  /* the ordinal rides high without taking part in the line box, so the numeral stays centred */
  .pill .medal .ord { font-size: 9.5px; line-height: 1; align-self: center; margin: -7px 0 0 0.5px; letter-spacing: 0; }
  .pill .txt { display: grid; gap: 1px; font: 600 11px/1.1 var(--body); text-transform: uppercase; letter-spacing: 0.07em; }
  .pill .txt b { font: 700 14px/1.15 var(--body); text-transform: none; letter-spacing: 0; }

  /* ---------- recap page (#week-N): the hero, in the approved mock-up's navy panel ---------- */
  body:has(.rp) { overflow-x: clip; }
  .rp-hero { position: relative; margin-top: 22px; border: 2px solid var(--edge); border-radius: 28px; background: var(--board); color: var(--on-board); box-shadow: 8px 8px 0 var(--accent); overflow: hidden; padding: 48px 48px 40px; isolation: isolate; }
  .rp-hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.09) 1.5px, transparent 0); background-size: 22px 22px; z-index: -2; }
  .rp-hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0, transparent 68%); opacity: 0.55; z-index: -1; }
  .rp-big { position: absolute; right: 36px; bottom: -70px; font: 900 clamp(120px, 34vw, 380px)/1 var(--display); color: transparent; -webkit-text-stroke: 3px rgba(244, 246, 255, 0.22); z-index: -1; user-select: none; pointer-events: none; }
  .rp-hero-in { position: relative; max-width: 880px; }
  .rp-hero .kicker { display: inline-flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 14px; background: var(--lime); color: var(--on-pop); font: 600 15px/1 var(--script); transform: rotate(-1.5deg); }
  .rp-hero .kicker i { width: 9px; height: 9px; border-radius: 50%; background: var(--on-pop); display: inline-block; }
  .rp-hero h1 { margin: 18px 0 16px; font: 900 clamp(26px, 2.2vw + 18px, 46px)/1.02 var(--display); letter-spacing: 0.005em; max-width: 24ch; color: var(--on-board); }
  .rp-hero .dek { margin: 0; font-size: clamp(15px, 0.4vw + 13.5px, 18px); line-height: 1.5; color: var(--on-board-muted); max-width: 64ch; }
  .rp-hero .pills { gap: 14px; margin-top: 30px; }
  .rp-hero .pill { min-height: 52px; padding: 4px 18px 4px 4px; box-shadow: 3px 3px 0 var(--drop); transition: transform 0.2s; }
  .rp-hero .pill-plain { padding-left: 18px; }
  .rp-hero .pill-top { transform: rotate(-1.5deg); }
  .rp-hero .pill-mid { background: #fff; transform: rotate(0.5deg); }
  .rp-hero .pill-bot { transform: rotate(1deg); }
  .rp-hero .pill:hover { transform: rotate(0deg) translateY(-3px); }
  .rp-hero .pill .medal { min-width: 38px; height: 38px; font-size: 17px; }
  .rp-hero .pill .txt { font: 600 12px/1.1 var(--script); text-transform: none; letter-spacing: 0.02em; }
  .rp-hero .pill .txt b { font: 800 20px/1.15 var(--display); letter-spacing: 0.01em; }
  .rp-hero .pill .txt b .num { font: 500 18px/1 var(--mono); margin-left: 4px; }
  @media (prefers-reduced-motion: no-preference) {
    .rp-big { animation: rp-bob 6s ease-in-out infinite; }
    .rp-rv { animation: rp-rise 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
    .rp-rv.d1 { animation-delay: 0.05s; } .rp-rv.d2 { animation-delay: 0.15s; } .rp-rv.d3 { animation-delay: 0.28s; } .rp-rv.d4 { animation-delay: 0.42s; }
  }
  @keyframes rp-rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes rp-pop { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes rp-fill { from { width: 0; } }
  @keyframes rp-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes rp-marq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes rp-bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(-1deg); } }
  /* The recap page's motion on every other page. `#main.enter` is set by route() only when the hash changed (a
     real navigation), never on a live refresh or a same-page redraw, so a page that redraws every minute doesn't
     replay its entrance each time. Recap pages keep their own (.rp) timings. */
  @media (prefers-reduced-motion: no-preference) {
    #main.enter .page-head > * { animation: rp-rise 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
    #main.enter .page-head > :nth-child(1) { animation-delay: 0.05s; } #main.enter .page-head > :nth-child(2) { animation-delay: 0.15s; }
    #main.enter .page-head > :nth-child(3) { animation-delay: 0.28s; } #main.enter .page-head > :nth-child(n+4) { animation-delay: 0.42s; }
    #main.enter:not(:has(.rp)) section:not(section section) { animation: rp-rise 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
    #main.enter:not(:has(.rp)) section:nth-of-type(n+2) { animation-delay: 0.06s; } #main.enter:not(:has(.rp)) section:nth-of-type(n+3) { animation-delay: 0.12s; }
    #main.enter:not(:has(.rp)) section:nth-of-type(n+4) { animation-delay: 0.18s; } #main.enter:not(:has(.rp)) section:nth-of-type(n+5) { animation-delay: 0.24s; }
    /* progress bars fill in from zero, as the recap's standings bars do */
    #main.enter .po-bar > span, #main.enter .hub-rank .tr > span, #main.enter .cl-bar > span, #main.enter .cl-bar2 > span, #main.enter .cl-segs i,
    #main.enter .cl-picks .cl-bar > span { animation: rp-fill 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) both; animation-delay: 0.2s; }
  }
  .rp [hidden] { display: none !important; }

  .rp .sec-head h2 { font: 900 40px/1 var(--display); text-transform: uppercase; white-space: nowrap; }

  .week-switch, .team-switch { display: flex; gap: 8px; overflow-x: auto; margin-top: 20px; padding: 2px 4px 5px 2px; }
  .week-switch a, .team-switch a { text-decoration: none; font: 700 15px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; border: 2px solid var(--edge); background: var(--card); padding: 8px 12px; border-radius: 10px; white-space: nowrap; }
  .week-switch a:hover, .team-switch a:hover { background: var(--accent-soft); }

  /* the week toggle: a flip switch, not another row of tabs, so it reads as one control */

  .week-toggle .knob { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); background: var(--lime); border-radius: 999px; }
  .week-toggle[data-state="next"] .knob { left: auto; right: 2px; }

  /* ---------- sections ---------- */
  section { margin-top: 44px; }

  .marker.ball { background: var(--orange); border-radius: 50% / 38%; transform: rotate(-30deg); width: 24px; height: 15px; }

  /* ---------- score boxes ---------- */

  .rp-sb { display: grid; gap: 28px; margin-top: 26px; }

  .tape-bar .tl { flex: 1; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; background: var(--pink); color: var(--on-pop); }

  .tape-quote { position: relative; margin-top: 22px; padding: 34px 28px 24px; border: 2px solid var(--edge); border-radius: 18px; background: var(--card); color: var(--ink); }
  .tape-quote .qm { position: absolute; left: 18px; top: -6px; font: 900 84px/1 var(--display); color: var(--accent); }
  .tape-quote .blurb { font-size: 19px; line-height: 1.6; }
  .tape-quote .open { display: inline-block; margin-top: 18px; font-size: 15px; text-decoration: none; }
  .tape-quote .open:hover { text-decoration: underline; }
  @media (max-width: 640px) { .rp .game-list { grid-template-columns: minmax(0, 1fr); } .tp-m { font-size: 30px; } .tape-bar .tn { font-size: 18px; } .tape-quote .blurb { font-size: 17px; } .tape { padding: 20px; } }

  /* ---------- landing page: compact matchup cards ---------- */
  .ml-w { flex: none; font: 700 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 6px; border: 1.5px solid var(--edge); background: var(--lime); color: var(--on-pop); transform: rotate(-4deg); }
  /* Pre-kickoff card: each side is its own <details>, the score row is the toggle, and that
     side's lineup opens directly underneath it. Cobalt for the first side, bubblegum for the second. */
  .slot-chip { display: inline-block; min-width: 34px; padding: 3px 0; border-radius: 6px; border: 1.5px solid var(--edge); text-align: center; font: 600 10.5px/1 var(--mono); background: var(--card); color: var(--ink); }
  .slot-chip.s-QB { background: var(--pink); color: var(--on-pop); }
  .slot-chip.s-RB { background: var(--lime); color: var(--on-pop); }
  .slot-chip.s-WR { background: var(--orange); color: var(--on-pop); }
  .slot-chip.s-TE { background: var(--accent-soft); }
  .slot-chip.s-FLEX { background: var(--orange-soft); }
  .slot-chip.s-DST, .slot-chip.s-K { background: var(--pink-soft); }

  /* ---------- landing page: the week in stickers ----------
     Two across on a phone, four across on a laptop. Each sticker's shadow and tag take
     one pop color, with ink text on the tag, never pop-colored text on white. */
  .stickers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 18px; }
  .story { background: var(--card); padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .story .tag { justify-self: start; font: 600 12px/1 var(--script); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 9px; transform: rotate(-3deg); }
  .story .fig { font: 900 34px/0.9 var(--display); font-variant-numeric: tabular-nums; }
  .story p { margin: 0; font-size: 13.5px; line-height: 1.35; }
  .story.orange { box-shadow: 4px 4px 0 var(--orange); } .story.orange .tag { background: var(--orange); }
  .story.lime { box-shadow: 4px 4px 0 var(--lime); } .story.lime .tag { background: var(--lime); }
  .story.pink { box-shadow: 4px 4px 0 var(--pink); } .story.pink .tag { background: var(--pink); }
  .story.accent { box-shadow: 4px 4px 0 var(--accent); } .story.accent .tag { background: var(--accent-soft); color: var(--ink); }
  /* Scoreboard card: the pre-kickoff variant of the sticker. Label, then the number (always the biggest
     thing) with its unit, then a name, then one small line. No sentences, no jokes. */
  .story.sc { gap: 0; padding-bottom: 16px; }
  .story.sc .tag { margin-bottom: 8px; }
  .story.sc .figure { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; }
  .story.sc .fig { font-size: 46px; line-height: 1; }
  .story.sc .unit { font: 700 11px/1 var(--mono); letter-spacing: 0.1em; color: var(--muted); }
  .story.sc .nm { margin-top: 8px; font: 800 22px/1.15 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .story.sc .sub { margin: 0; font-size: 13px; line-height: 1.3; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ---------- week hub (the landing page before kickoff) ----------
     One column on a phone; from 860px the matchups take the wide column and Coach's desk and the
     ranked projections sit beside them. Side A of every game is cobalt, side B is pink, and nothing
     relies on the color alone: every cell and bar says who and how much in text. */
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hub-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 28px; }
  .hub-head .page-head { flex: 1 1 340px; }
  .season-strip { flex: 1 1 300px; max-width: 460px; display: grid; gap: 7px; margin-bottom: 8px; }
  .season-strip .lab { display: flex; justify-content: space-between; gap: 10px; font: 500 11.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .season-strip .weeks { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .season-strip .weeks span { height: 24px; border: 2px solid var(--edge); border-radius: 6px; background: var(--card); font: 500 10px/20px var(--mono); text-align: center; color: var(--muted); }
  .season-strip .weeks .done { background: var(--board); color: var(--on-board); }
  .season-strip .weeks .now { background: var(--orange); color: var(--on-pop); box-shadow: 2px 2px 0 var(--drop); transform: translateY(-3px); }
  .season-strip .weeks .po { background: var(--pink-soft); color: var(--ink); }
  .hub-grid { display: grid; gap: 28px; margin-top: 30px; align-items: start; }
  .hub-grid > * { min-width: 0; }
  .hub-side { display: grid; gap: 34px; }
  .hub-side > section { margin-top: 0; }
  .hub-wire { display: grid; gap: 28px; align-items: start; }
  .hub-wire > * { min-width: 0; }
  /* Stacked in the side column: the feed scrolls inside its own panel so a busy week can't
     stretch the page, and the pickups chart sits under it. */
  .hub-wire.stack { gap: 18px; }
  .wire-scroll { max-height: 440px; overflow-y: auto; overscroll-behavior: contain; }
  @media (min-width: 860px) {
    .hub-grid { grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); }
    .hub-wire { grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr); }
    .hub-wire.stack { grid-template-columns: minmax(0, 1fr); }
  }
  .hub-game, .hub-panel { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--drop); }
  .hub-game { overflow: hidden; }
  .hub-game + .hub-game { margin-top: 18px; }
  .hub-tag { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 2px solid var(--edge); font: 600 12px/1.2 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
  .hub-tag.mine { background: var(--lime-soft); }
  .hub-tag.swing { background: var(--pink-soft); }
  .hub-pill { font: 600 11px/1 var(--script); padding: 4px 9px; border: 2px solid var(--edge); border-radius: 999px; background: var(--lime); color: var(--on-pop); text-transform: none; letter-spacing: 0; }
  .hub-pill.swing { background: var(--pink); }
  .hub-sides { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px 12px; padding: 14px 16px 6px; }
  .hub-sides .nm { font: 800 26px/1 var(--display); }
  .hub-sides .nm a { text-decoration: none; }
  .hub-sides .nm a:hover { text-decoration: underline; }
  .hub-sides .rc { font: 500 11.5px/1.3 var(--mono); color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  .hub-sides .r { text-align: right; }
  .hub-sides .mid { font: 500 11px/1.3 var(--mono); color: var(--muted); text-align: center; }
  .hub-score { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
  .hub-score.r { justify-content: flex-end; }
  .hub-score i { width: 12px; height: 12px; flex: none; border: 2px solid var(--edge); border-radius: 4px; }
  .hub-a { background: var(--accent); } .hub-b { background: var(--pink); }
  .hub-bar { display: flex; height: 14px; margin: 6px 16px 4px; border: 2px solid var(--edge); border-radius: 99px; overflow: hidden; background: var(--rule); }
  .hub-bar span { display: block; height: 100%; }
  .hub-edges { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; padding: 12px 16px 6px; list-style: none; margin: 0; }
  .hub-edges li { border: 2px solid var(--edge); border-radius: 9px; padding: 6px 2px 5px; text-align: center; background: var(--card); min-width: 0; }
  .hub-edges li.a { background: var(--accent-soft); } .hub-edges li.b { background: var(--pink-soft); }
  .hub-edges .sl { display: block; font: 500 10px/1 var(--mono); color: var(--muted); letter-spacing: 0.04em; }
  .hub-edges .eg { display: block; font: 700 13.5px/1.3 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hub-edges .ar { display: block; font: 500 10px/1 var(--mono); }
  .hub-key { padding: 0 16px 12px; margin: 0; font: 500 11px/1.4 var(--mono); color: var(--muted); }
  .hub-key i { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--edge); border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .hub-stake { margin: 0; padding: 11px 16px; border-top: 2px solid var(--edge); background: var(--bg); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13.5px; }
  .hub-stake .odds { font: 700 13px/1 var(--mono); background: var(--card); border: 2px solid var(--edge); border-radius: 8px; padding: 4px 7px; }
  .hub-stake .to { color: var(--muted); }
  .hub-lineups { border-top: 2px solid var(--edge); }
  .hub-lineups > summary { cursor: pointer; list-style: none; padding: 10px 16px; font-weight: 700; font-size: 13.5px; color: var(--accent); }
  .hub-lineups > summary::-webkit-details-marker { display: none; }
  .hub-lineups > summary::after { content: " ▾"; }
  .hub-lineups[open] > summary::after { content: " ▴"; }
  .hub-lineups .cols { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--edge); }
  .hub-lineups .cols > div + div { border-left: 2px solid var(--edge); }
  /* Full lineups: face + NFL badge, name, team and kickoff, a status sticker, the projection. On a phone
     the two sides stack; the width it reacts to is the card's own, not the window's. */
  .hub-lineups .body { container-type: inline-size; }
  @container (max-width: 520px) {
    .hub-lineups .cols { grid-template-columns: 1fr; }
    .hub-lineups .cols > div + div { border-left: none; border-top: 2px solid var(--edge); }
  }
  .hub-lineups table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  .hub-lineups caption { padding: 8px 10px 5px; text-align: left; font: 600 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .hub-lineups caption .cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hub-lineups caption .flag { white-space: nowrap; font: 600 10.5px/1 var(--mono); text-transform: none; letter-spacing: 0; color: var(--on-pop); background: var(--pink); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 8px; }
  .hub-lineups td { padding: 7px 6px; border-top: 1px solid var(--rule); vertical-align: middle; }
  .hub-lineups td.slot { width: 56px; padding-left: 10px; }
  .hub-lineups .slotpill { display: inline-block; min-width: 36px; padding: 5px 6px; text-align: center; font: 700 11px/1 var(--mono); color: var(--ink); background: var(--card); border: 2px solid var(--edge); border-radius: 10px; }
  .hub-lineups td.av { width: 56px; padding: 7px 10px 7px 0; }
  .hub-lineups td.pl { min-width: 0; }
  .hub-lineups .pl .nm { font-weight: 700; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
  .hub-lineups .pl .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 7px; margin-top: 3px; min-height: 18px; font: 600 12px/1.2 var(--body); color: var(--muted); }
  .hub-lineups .pl .sub b { color: var(--ink); font-weight: 800; }
  .hub-lineups td.r { width: 52px; padding-right: 10px; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .hub-lineups td.zero { font-weight: 700; text-decoration: underline; }
  .hub-lineups tr.k-out td { background: var(--pink-soft); }
  .hub-lineups tr.k-iffy td { background: var(--orange-soft); }
  .hub-lineups tr.k-bye td { background: var(--accent-soft); }
  .hub-lineups .st { display: inline-block; padding: 3px 7px 2px; font: 600 10.5px/1 var(--script); letter-spacing: 0.05em; text-transform: uppercase; color: var(--on-pop);
    background: var(--card); border: 2px solid var(--edge); border-radius: 999px; box-shadow: 1px 1px 0 var(--edge); transform: rotate(-3deg); white-space: nowrap; }
  .hub-lineups .st.out { background: var(--pink); }
  .hub-lineups .st.iffy { background: var(--orange); }
  .hub-lineups .st.bye { color: var(--ink); background: var(--card); }
  .hub-lineups .legend, .hub-lineups .strip { margin: 0; padding: 9px 16px 11px; border-top: 2px solid var(--edge); font-size: 12px; color: var(--muted); }
  .hub-lineups .legend b { color: var(--ink); }
  .hub-lineups .strip { background: var(--orange-soft); color: var(--ink); font-size: 12.5px; }
  .hub-lineups .none { padding: 18px 12px; text-align: center; font-size: 13.5px; color: var(--muted); background: var(--lime-soft); }
  @media (prefers-reduced-motion: reduce) { .hub-lineups .st { transform: none; } }
  .hub-panel { padding: 6px 16px 12px; }
  .hub-fix { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .hub-fix:last-of-type { border-bottom: none; }
  .hub-who { font: 700 12px/1 var(--mono); background: var(--accent-soft); color: var(--ink); border: 2px solid var(--edge); border-radius: 8px; padding: 5px 7px; min-width: 64px; text-align: center; text-decoration: none; }
  .hub-who.me { background: var(--orange); color: var(--on-pop); }
  .hub-fix .t { font-weight: 700; font-size: 13.5px; line-height: 1.25; min-width: 0; }
  .hub-fix .t small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .hub-fix .pts { font: 700 12.5px/1 var(--mono); border: 2px solid var(--edge); border-radius: 8px; padding: 4px 6px; background: var(--lime); color: var(--on-pop); white-space: nowrap; }
  .hub-fix .pts.flag { background: var(--pink); }
  .hub-clear { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 0 2px; font-size: 12.5px; color: var(--muted); }
  .hub-clear b { font: 600 11px/1 var(--script); background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 8px; }
  .hub-rank { display: grid; grid-template-columns: minmax(64px, auto) 1fr 46px; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; }
  .hub-rank .nm { font-weight: 700; }
  .hub-rank .tr { height: 14px; background: var(--rule); border: 2px solid var(--edge); border-radius: 99px; overflow: hidden; }
  .hub-rank .tr span { display: block; height: 100%; background: var(--accent); }
  .hub-rank .tr span.me { background: var(--orange); }
  .hub-rank .v { font: 500 12.5px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .hub-note { font: 500 11.5px/1.4 var(--mono); color: var(--muted); margin: 8px 0 0; }
  .hub-day { font: 600 11.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 12px 0 4px; margin: 0; }
  .hub-ev { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .hub-ev:last-child { border-bottom: none; }
  .hub-ev .ic { width: 26px; height: 26px; box-sizing: border-box; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid var(--edge); border-radius: 8px; background: var(--lime); color: var(--on-pop); }
  .hub-ev .ic svg { width: 14px; height: 14px; display: block; }
  .hub-ev .ic.trade { background: var(--orange); } .hub-ev .ic.swap { background: var(--accent-soft); color: var(--ink); } .hub-ev .ic.drop { background: var(--pink-soft); color: var(--ink); }
  .hub-ev .how { color: var(--muted); }
  @media (max-width: 760px) {
    /* The four stickers become one row to swipe: it scrolls inside itself, so the page never does. */
    .stickers.hub-chips { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin-inline: -16px; padding: 2px 20px 8px 16px; scrollbar-width: none; }
    .stickers.hub-chips::-webkit-scrollbar { display: none; }

    .stickers.hub-chips.scoreboard { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; overflow: visible; margin-inline: 0; padding: 2px 6px 6px 0; }
    .stickers.hub-chips.scoreboard .story { flex: none; }

    .hub-lineups .cols { grid-template-columns: 1fr; } .hub-lineups .cols > div + div { border-left: none; border-top: 2px solid var(--edge); }
  }
  .recap-when { margin-top: 22px; display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--accent-soft); border: 2px solid var(--edge); border-radius: 14px; font-size: 14px; font-weight: 600; }
  .recap-when .d { flex: none; font: 900 26px/0.9 var(--display); background: var(--card); border: 2px solid var(--edge); border-radius: 10px; padding: 6px 9px 4px; }
  .final-lines { background: var(--card); overflow: hidden; display: grid; }
  .final-lines a { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 11px 16px; text-decoration: none; }
  .final-lines a + a { border-top: 2px dashed var(--rule); }
  .final-lines a:hover b { text-decoration: underline; }

  .final-lines .w .num { font: 700 17px/1 var(--mono); }
  .final-lines .l { color: var(--muted); font: 500 14px/1.2 var(--body); }
  .final-lines .l .num { font-family: var(--mono); }

  /* ---------- matchup page ---------- */
  .versus { margin-top: 18px; background: var(--board); color: var(--on-board); padding: 22px 20px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
  .versus .side { display: grid; gap: 4px; }
  .versus .side.right { text-align: right; justify-items: end; }
  .versus .mgr { font: 800 clamp(26px, 5vw, 40px)/1 var(--display); }
  .versus .mgr a { text-decoration: none; }
  .versus .team { font-size: 12.5px; color: var(--on-board-muted); }
  .versus .score { font: 900 clamp(40px, 8vw, 68px)/1 var(--display); font-variant-numeric: tabular-nums; }
  .versus .side.loser .score, .versus .side.loser .mgr { color: var(--on-board-muted); }
  .versus .vs { font: 600 18px/1 var(--script); color: var(--on-pop); background: var(--lime); border-radius: 999px; padding: 8px 10px; transform: rotate(-6deg); }
  .versus .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--board-2); padding-top: 12px; margin-top: 6px; font: 500 12px/1.4 var(--mono); color: var(--on-board-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  @media (max-width: 520px) {
    .versus { grid-template-columns: 1fr; }
    .versus .side.right { text-align: left; justify-items: start; }
    .versus .vs { display: none; }
  }
  .decided { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .decided li { background: var(--card); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
  .decided .tag { font: 600 11.5px/1 var(--mono); padding: 5px 7px; border-radius: 6px; border: 1.5px solid var(--edge); white-space: nowrap; margin-top: 1px; color: var(--on-pop); }
  .decided .tag.good { background: var(--lime); }
  .decided .tag.bad { background: var(--pink); }
  .decided .tag.info { background: var(--card); color: var(--ink); }
  /* An evaluated trade (scripts/trade_eval.py): who goes where, then both sides' numbers */
  .trade { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
  .trade-side { border: 1.5px solid var(--edge); border-radius: 8px; padding: 8px 10px; display: grid; gap: 3px; font-size: 14px; }
  .trade-side b { font: 600 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .trade-math { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 6px 12px; margin: 0; }
  .trade-math div { display: grid; gap: 2px; }
  .trade-math dt { font-size: 12px; color: var(--muted); }
  .trade-math dd { margin: 0; font: 600 13px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .trade-flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .trade-flags span { font: 600 11px/1 var(--mono); border: 1.5px solid var(--edge); border-radius: 999px; padding: 4px 8px; }
  .card .fit { font: 600 11px/1 var(--mono); background: var(--lime); color: var(--on-pop); border: 1.5px solid var(--edge); border-radius: 999px; padding: 4px 8px; transform: rotate(-2deg); white-space: nowrap; }

  .box-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 18px; }
  .lineup { background: var(--card); padding: 14px 16px; }
  .lineup h3 { font: 800 21px/1.1 var(--display); display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .lineup h3 a { text-decoration: none; }
  .lineup table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .lineup th { text-align: left; font: 600 11px/1 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 0 6px; }
  .lineup th.r, .lineup td.r { text-align: right; }
  .lineup td { padding: 5px 0; border-top: 1px solid var(--rule); vertical-align: baseline; }
  .lineup td.slot { width: 44px; color: var(--muted); font: 500 11px/1 var(--mono); }
  .lineup td.r { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
  /* A little room at both ends of every row, so an open row's outline has somewhere to go
     without landing on a name or a number. */
  .lineup th:first-child, .lineup td:first-child { padding-left: 5px; }
  .lineup th:last-child, .lineup td:last-child { padding-right: 5px; }
  .lineup td.proj { color: var(--muted); font-size: 12px; }
  .lineup tr.bench-head td { padding-top: 12px; border-top: none; font: 700 11px/1 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .lineup tr.bench td { color: var(--muted); }
  .lineup tr.bench.hot td { color: var(--ink); font-weight: 700; background: var(--pink-soft); }
  .lineup tr.bench.hot td.slot::after { content: " ⚑"; color: var(--ink); }
  /* On a live box score each player carries his NFL team logo (the slot column already
     names the position), and a player whose game is on right now wears a pulsing sticker. */
  .lineup td .tlogo { width: 19px; height: 19px; margin-left: 6px; vertical-align: -4px; object-fit: contain; }
  .lineup td .playing { display: inline-flex; align-items: center; white-space: nowrap; margin-left: 5px;
    font: 500 10.5px/1 var(--script); color: var(--on-pop); background: var(--lime);
    border: 1.5px solid var(--edge); border-radius: 999px; padding: 3px 7px 3px 5px; vertical-align: 1px; }
  /* The sticker is lime in both themes, so the dot keeps the one red that reads on it. */
  .lineup td .playing .live-dot { width: 7px; height: 7px; margin-right: 4px; vertical-align: 0; background: #c0392b; }
  .lineup .opt { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .lineup .opt b { color: var(--ink); }

  /* the player card: tap a row on the Coach page for how his points happened */
  .lineup button.peek { display: flex; width: 100%; gap: 6px; align-items: baseline; padding: 0;
    margin: -2px 0; background: none; border: 0; border-radius: 6px; color: inherit; font: inherit;
    text-align: left; cursor: pointer; }
  .lineup button.peek .chev { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: 11px;
    transform: rotate(0deg); transition: transform 0.15s ease; }
  .lineup button.peek[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .lineup button.peek .chev::before { content: "▶"; }
  .lineup button.peek:hover .peek-name { text-decoration: underline; }
  /* An open row becomes the top of its own card: same fill, and the outline runs from the
     player's name down around the card, so the two are one sticker rather than a box that
     happens to sit underneath. The side edges are inset shadows, not borders, so opening a
     row can't nudge the text in it sideways. */
  .lineup tr.peek-open > td { background: var(--accent-soft); border-top-color: transparent;
    box-shadow: inset 0 2px 0 var(--edge); }
  .lineup tr.peek-open > td:first-child { box-shadow: inset 2px 2px 0 var(--edge);
    border-top-left-radius: 11px; }
  .lineup tr.peek-open > td:last-child { box-shadow: inset -2px 2px 0 var(--edge);
    border-top-right-radius: 11px; }
  .lineup tr.peek-row > td { padding: 0 0 12px; border-top: none; }
  .peek-body { border: 2px solid var(--edge); border-top: none; border-radius: 0 0 12px 12px;
    background: var(--accent-soft); padding: 4px 12px 10px; display: grid; gap: 8px; }
  .peek-blurb { margin: 0; font-size: 13.5px; }
  .peek-lines { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .peek-lines caption { text-align: left; font: 600 10.5px/1 var(--body); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em; padding-bottom: 4px; }
  .peek-lines th { width: 100%; font: 500 12.5px/1.4 var(--body); color: var(--ink); text-align: left;
    text-transform: none; letter-spacing: 0; padding: 3px 0; border-top: 1px solid var(--rule); }
  .peek-lines td { width: 1%; padding: 3px 0 3px 14px; border-top: 1px solid var(--rule); text-align: right;
    font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .peek-lines td.val { color: var(--muted); padding-left: 10px; }
  .peek-lines tfoot th, .peek-lines tfoot td { font-weight: 700; border-top: 2px solid var(--edge); }
  .peek-notes { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
  .peek-notes li::marker { color: var(--accent); }
  .peek-none { margin: 0; font-size: 12.5px; color: var(--muted); }

  .other-games { display: flex; flex-wrap: wrap; gap: 10px; }
  .other-games a { text-decoration: none; background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; box-shadow: 3px 3px 0 var(--drop); }

  /* ---------- award cards: each kind gets its own colored sticker shadow ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 18px; }
  .card { background: var(--card); padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
  .card.balls { box-shadow: 5px 5px 0 var(--orange); }
  .card.flags { box-shadow: 5px 5px 0 var(--pink); }
  .card.breaks { box-shadow: 5px 5px 0 var(--drop); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .who { font: 800 14px/1 var(--display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .who a { text-decoration: none; }
  .who a:hover { color: var(--accent); }
  .stat { font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; padding: 5px 8px; border-radius: 6px; white-space: nowrap; border: 1.5px solid var(--edge); color: var(--on-pop); transform: rotate(-3deg); }
  .card.balls .stat { background: var(--orange); }
  .card.flags .stat { background: var(--pink); }
  .card.breaks .stat { background: var(--lime); }
  .card h3 { font: 800 22px/1.05 var(--display); letter-spacing: 0.01em; }
  .card p { margin: 0; font-size: 14.5px; }

  /* recap page awards: filter chips, grouped by kind, a round sticker beside each manager */
  .rp-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .rp .chip { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid var(--edge); background: var(--card); color: var(--ink); font: 700 15px/1 var(--body); box-shadow: 2px 2px 0 var(--drop); cursor: pointer; }
  .rp .chip:hover { transform: translateY(-2px); }
  .rp .chip.sel { background: var(--ink); color: var(--bg); }
  /* ---------- award cards (v3): a patterned band with a photo sticker, the title label and an
     emoji sticker pinned to its corner, over a quiet animated background. Everything is awc-
     prefixed; the kind color rides on --k (fill) and --s (soft chip). ---------- */
  .awc-list { container-type: inline-size; display: flex; flex-direction: column; gap: 36px; margin-top: 18px; }
  .awc-grp { display: flex; flex-direction: column; gap: 16px; }
  .awc-grp[hidden] { display: none; }
  .awc-gh { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
  .awc-gb { background: var(--k); color: var(--on-pop); border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--drop); border-radius: 10px; padding: 8px 14px 6px; transform: rotate(-2deg); font: 900 28px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
  .awc-cnt { font: 500 13px/1 var(--mono); color: var(--muted); }
  .awc-sub { margin: 0; max-width: 64ch; color: var(--muted); font-size: 14.5px; }
  .awc-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @container (min-width: 560px) { .awc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* exactly three cards share one row once there is room; they run taller instead of wrapping to a lone fourth-row card */
  @container (min-width: 760px) { .awc-grid.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .awc-grid .awc-body { flex: 1; }
  .awc { container-type: inline-size; background: var(--card); border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--drop); overflow: hidden; display: flex; flex-direction: column; }
  /* --band is the card's own band: game balls cobalt, flags pink, tough breaks a muted tangerine (the group badges keep --k) */
  .awc.balls { --k: var(--orange); --band: var(--awc-ball); --s: var(--orange-soft); }
  .awc.flags { --k: var(--pink); --band: var(--pink); --s: var(--pink-soft); }
  .awc.breaks { --k: var(--lime); --band: var(--awc-break); --s: var(--orange-soft); }
  .awc-grp.balls { --k: var(--orange); }
  .awc-grp.flags { --k: var(--pink); }
  .awc-grp.breaks { --k: var(--lime); }
  .awc-band { position: relative; isolation: isolate; overflow: hidden; border-bottom: 2px solid var(--edge); display: flex; align-items: center; gap: 16px; padding: 22px 18px; min-height: 132px; background-color: var(--band, var(--k)); background-image: repeating-conic-gradient(from 0deg at 16% 110%, rgba(255, 255, 255, 0.3) 0 7deg, transparent 7deg 14deg); color: var(--on-pop); }
  .awc-stk { z-index: 2; position: relative; flex: none; width: 76px; height: 76px; border-radius: 22px; background: #fff; transform: rotate(-5deg); box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--edge), 6px 7px 0 5px var(--drop); margin: 4px 6px; }
  .awc-sin { width: 100%; height: 100%; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #fff; }
  .awc-sin img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
  .awc-emo { font-size: 44px; line-height: 1; }
  .awc-ico { color: var(--on-pop); }
  .awc-ttl { position: relative; z-index: 2; background: #fff; color: var(--on-pop); border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--drop); border-radius: 8px; padding: 8px 12px 6px; transform: rotate(-2deg); font: 900 22px/0.98 var(--display); text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
  .awc-tb { position: absolute; right: -12px; bottom: -14px; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; text-transform: none; }
  .awc-band.nophoto .awc-tb { display: none; }
  .awc-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .awc-body p { margin: 0; font-size: 14px; line-height: 1.5; }
  .awc-who { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .awc-who b { font: 600 19px/1 var(--script); }
  .awc-who a { text-decoration: none; }
  .awc-who a:hover { color: var(--accent); }
  .awc-stat { background: var(--s); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; padding: 5px 10px 4px; font: 500 12px/1 var(--mono); }
  /* The animated bands (v4): one idea per kind. Game balls: flames rise off the band and fade.
     Flags: flags and puffs of wind drift across. Tough breaks: a poo circles a bowl and gets flushed. */
  .awc-ft { position: absolute; bottom: -14px; left: var(--x); font-size: var(--fs); line-height: 1; opacity: 0; z-index: 1; pointer-events: none; transform-origin: 50% 100%; animation: awc-up var(--d) ease-out var(--dl) infinite; }
  .awc-band.fire .awc-stk { animation: awc-hot 1.6s ease-in-out infinite alternate; }
  .awc-fl { position: absolute; left: -50px; top: var(--y); font-size: var(--fs); line-height: 1; opacity: 0; z-index: 1; pointer-events: none; animation: awc-drift var(--d) linear var(--dl) infinite; }
  .awc-band.flush { padding-right: 134px; }
  .awc-zc { position: absolute; right: 14px; top: 50%; width: 100px; height: 100px; margin-top: -50px; z-index: 1; pointer-events: none; }
  .awc-zc > * { position: absolute; left: 50%; top: 50%; line-height: 1; transform: translate(-50%, -50%); }
  .awc-bowl { font-size: 104px; opacity: 0.16; animation: awc-bowl 1.3s linear infinite; }
  .awc-ring { width: 96px; height: 96px; border-radius: 50%; border: 3px solid #fff; opacity: 0; animation: awc-ring 2.1s ease-out infinite; }
  .awc-sp { font-size: 42px; --r: 58px; animation: awc-flushin 3.6s ease-in infinite; }
  .awc-toilet { font-size: 58px; z-index: 3; animation: awc-wob 0.42s ease-in-out infinite alternate; filter: drop-shadow(2px 3px 0 rgba(21, 26, 51, 0.55)); }
  /* a narrow card (three to a row) can't spare the 134px: the flush sits small in the corner, behind the label */
  @container (max-width: 460px) {
    .awc-band.flush { padding-right: 18px; }
    .awc-zc { right: 4px; top: auto; bottom: 6px; margin-top: 0; width: 84px; height: 84px; transform: scale(0.8); transform-origin: 100% 100%; }
  }
  @keyframes awc-up { 0% { transform: translateY(0) scale(0.7); opacity: 0; } 12% { opacity: 1; } 55% { opacity: 0.95; } 100% { transform: translateY(-118px) scale(0.35) rotate(8deg); opacity: 0; } }
  @keyframes awc-hot { from { transform: rotate(-5deg) scale(1); } to { transform: rotate(-4deg) scale(1.03); } }
  @keyframes awc-drift { 0% { transform: translateX(0) rotate(-16deg) scale(0.9); opacity: 0; } 12% { opacity: 0.95; } 50% { transform: translateX(200px) rotate(16deg) scale(1.1); } 88% { opacity: 0.95; } 100% { transform: translateX(440px) rotate(-16deg) scale(0.9); opacity: 0; } }
  @keyframes awc-bowl { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes awc-ring { 0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; } }
  @keyframes awc-flushin { 0% { transform: translate(-50%, -50%) rotate(0) translateX(var(--r)) rotate(0) scale(1); opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(900deg) translateX(0) rotate(-900deg) scale(0.1); opacity: 0; } }
  @keyframes awc-wob { 0% { transform: translate(-50%, -50%) rotate(-12deg) scale(1); } 100% { transform: translate(-50%, -50%) rotate(10deg) scale(1.1); } }
  @media (prefers-reduced-motion: reduce) {
    .awc-ft, .awc-fl, .awc-sp, .awc-ring, .awc-bowl, .awc-toilet, .awc-band.fire .awc-stk { animation: none; }
    .awc-ft { opacity: 0.4; bottom: 8px; }
    .awc-fl { left: 30%; opacity: 0.8; }
    .awc-sp { opacity: 0.9; }
  }
  .awc-empty { display: flex; align-items: center; gap: 24px; background: var(--card); border: 2px dashed var(--edge); border-radius: 18px; padding: 24px; max-width: 760px; margin-top: 18px; }
  .awc-empty .st { flex: none; width: 84px; height: 84px; border-radius: 22px; background: var(--accent-soft); border: 2px solid var(--edge); box-shadow: 4px 4px 0 var(--drop); transform: rotate(-5deg); display: flex; align-items: center; justify-content: center; font-size: 44px; }
  .awc-empty h3 { font: 900 34px/1 var(--display); text-transform: uppercase; margin: 0 0 6px; }
  .awc-empty p { margin: 0; color: var(--muted); }
  @media (max-width: 480px) { .awc-empty { flex-direction: column; align-items: flex-start; gap: 16px; } }
  @media (max-width: 640px) { .awc-gb { font-size: 24px; } }

  /* ---------- tables ---------- */
  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 16px 32px; }
  .table-scroll { overflow-x: auto; }
  table.std { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.std th { text-align: left; font: 600 11.5px/1.2 var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 10px 8px 0; border-bottom: 2px solid var(--edge); white-space: nowrap; }
  table.std td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--rule); }
  table.std tbody tr:last-child td { border-bottom: none; }
  table.std .r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.std th.r { font-family: var(--body); }
  table.std .rank { width: 30px; font: 800 19px/1 var(--display); color: var(--muted); }
  table.std tbody tr:first-child .rank { color: var(--accent); }
  table.std .mv { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 8px; border-radius: 999px; font: 700 12.5px/1 var(--mono); }
  table.std .mv.up { color: var(--win); background: color-mix(in srgb, var(--win) 16%, transparent); }
  table.std .mv.down { color: var(--loss); background: color-mix(in srgb, var(--loss) 14%, transparent); }
  table.std .mv.flat { padding: 4px 0 4px 10px; color: var(--muted); font-weight: 500; }
  table.std tr.moved-up td { background: color-mix(in srgb, var(--win) 6%, transparent); }
  table.std tr.moved-down td { background: color-mix(in srgb, var(--loss) 6%, transparent); }
  table.std .mgr a { font-weight: 700; text-decoration: none; }
  table.std .mgr a:hover { color: var(--accent); text-decoration: underline; }
  table.std .tname { display: block; font-size: 12px; color: var(--muted); }
  /* the profile button: team pages are easy to miss behind a plain name link, so every
     standings row gets an obvious way in, lined up down the right of the team column */
  table.std .mgr-cell { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  table.std .mgr-who { display: block; white-space: nowrap; }
  .profile-btn { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 999px; background: var(--accent); color: var(--on-accent); border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); font: 600 12px/1.25 var(--script); letter-spacing: 0.01em; white-space: nowrap; }
  table.std .mgr a.profile-btn:hover { color: var(--on-accent); text-decoration: none; }
  .profile-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--drop); }
  .profile-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--drop); }
  .res { font: 700 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px; }
  .res.W { color: var(--win); background: color-mix(in srgb, var(--win) 14%, transparent); }
  .res.L { color: var(--loss); background: color-mix(in srgb, var(--loss) 12%, transparent); }
  .std-card { background: var(--card); padding: 16px 16px 6px; }

  .heat td.cell { text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; padding: 9px 6px; border: 3px solid var(--card); border-radius: 8px; white-space: nowrap; }
  .heat td.cell a { text-decoration: none; }
  .heat td.cell a:hover { text-decoration: underline; }
  .heat td.cell .res { margin-left: 4px; background: var(--card); }
  .heat-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 8px; font-size: 12px; color: var(--muted); }
  .heat-legend .ramp { width: 120px; height: 10px; border-radius: 5px; border: 1px solid var(--rule); background: linear-gradient(90deg, color-mix(in srgb, var(--heat-hi) 6%, var(--card)), color-mix(in srgb, var(--heat-hi) 48%, var(--card))); }

  /* ---------- playoff picture ---------- */
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  /* the playoff line: a dashed cobalt rule under the last seed in, labeled once */
  table.std tr.po-cut td { border-bottom: 2px dashed var(--accent); }
  table.std tr.po-line td { padding: 6px 0 10px; border-bottom: 1px solid var(--rule); }
  .po-line-tag { display: inline-block; font: 600 12px/1 var(--script); color: var(--accent-ink); background: var(--accent-soft); border: 1.5px dashed var(--accent); border-radius: 999px; padding: 4px 10px; }
  .bye-tag { display: inline-block; margin-left: 7px; vertical-align: 1px; font: 600 11px/1 var(--script); color: var(--on-pop); background: var(--lime); border: 1.5px solid var(--edge); border-radius: 999px; padding: 3px 7px; transform: rotate(-4deg); }

  .bracket { display: grid; grid-template-columns: repeat(var(--br-cols, 3), minmax(0, 1fr)); gap: 18px; align-items: stretch; }
  .br-col { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; min-width: 0; }
  .br-col h3 { font: 600 12.5px/1 var(--script); letter-spacing: 0.02em; color: var(--muted); text-transform: uppercase; }
  .br-game { background: var(--card); border: 2px solid var(--edge); box-shadow: 4px 4px 0 var(--drop); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; }
  .br-team { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .br-team a { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .br-team a:hover { color: var(--accent); text-decoration: underline; }
  .br-team.fav { font-weight: 800; }
  .br-seed { min-width: 24px; height: 24px; padding: 0 5px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: var(--board); color: var(--on-board); font: 800 13px/1 var(--display); }
