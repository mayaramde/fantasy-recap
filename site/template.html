          <div class="tab-src">${rankedProjections(w)}${wireSection(true)}</div>
        </div>
      </div>`}

      ${w.complete ? `<div class="tab-src">${wireSection()}</div>` : ''}
      ${bottomPanels(w)}

      <p class="sec-sub" style="margin-top:28px">${next ? nextSource() : coachSource(w)}</p>`;
  }

  function awardsPage(w) {
    return `
      <div class="crumbs"><a href="#week-${w.week}">Week ${w.week}</a><span>›</span><span>Awards</span></div>
      ${weekSwitch(w, '.awards')}
      ${draftBanner(w)}
      <div class="page-head">
        <div class="kicker">Week ${w.week} awards</div>
        <h1>Game balls, flags and tough breaks</h1>
      </div>
      ${AWARD_KINDS.some((k) => w[k].length) ? awardGroups(w) : awardsEmpty()}
      ${w.glossary.length ? `
      <section>
        ${secHead('book', 'Rookie glossary', '<a class="more" href="#glossary">Every term →</a>')}
        <p class="sec-sub">Football words from this week's recap, explained for the rest of us.</p>
        <dl class="terms">${w.glossary.map((g) => `<div class="term"><dt>${esc(g.term)}</dt><dd>${esc(g.definition)}</dd></div>`).join('')}</dl>
      </section>` : ''}`;
  }

  function matchupPage(w, key) {
    const g = w.games.find((x) => x.key === key);
    if (!g) return notFound();
    const W = g.winner, L = g.loser;
    const items = [];
    for (const [s, won, opp] of [[W, true, L], [L, false, W]]) {
      for (const sw of s.swaps.filter((x) => Math.abs(x.gain) >= 1)) {
        items.push({ tag: sw.gain > 0 ? 'good' : 'bad', label: signed(sw.gain),
          text: `${esc(s.manager)} started ${esc(sw.started)} (${scored(sw.started_pos, sw.started_points)}) over ${esc(sw.benched)} (${scored(sw.benched_pos, sw.benched_points)}) at ${esc(sw.slot)}.` });
      }
      if (s.points_left > 0.5) {
        const flip = !won && s.optimal > opp.points;
        items.push({ tag: flip ? 'bad' : 'info', label: `${f1(s.points_left)} benched`,
          text: `${esc(s.manager)} left ${f2(s.points_left)} points on the bench. Her best possible lineup scored ${f2(s.optimal)}${flip ? `, enough to beat ${esc(opp.manager)}` : ''}.` });
      } else {
        items.push({ tag: 'good', label: 'perfect', text: `${esc(s.manager)} started her best possible lineup.` });
      }
    }
    const related = AWARD_KINDS.flatMap((k) => w[k].filter((c) => c.manager === W.manager || c.manager === L.manager).map((c, i) => awardCard(c, k, i)));
    const others = w.games.filter((x) => x.key !== key);
    const lead = w.live && !w.complete;
    return `
      <div class="crumbs"><a href="${base(w)}">${w.live ? 'Live · ' : ''}Week ${w.week}</a><span>›</span><span>${esc(W.manager)} vs ${esc(L.manager)}</span></div>
      ${draftBanner(w)}
      <div class="versus">
        <div class="side winner"><div class="mgr">${mgrLink(W.manager)}</div><div class="team">${esc(W.team_name)}</div><div class="score">${f2(W.points)}</div></div>
        <div class="vs" aria-hidden="true">vs</div>
        <div class="side right loser"><div class="mgr">${mgrLink(L.manager)}</div><div class="team">${esc(L.team_name)}</div><div class="score">${f2(L.points)}</div></div>
        <div class="foot"><span>Week ${w.week} · ${w.complete ? 'Final' : `In progress · updated ${updated(w.captured_at)}`}</span><span>${esc(W.manager)} ${lead ? 'leads' : 'by'} ${f2(W.points - L.points)}</span></div>
      </div>
      ${lead ? `<div style="margin-top:14px" class="a-live">${liveStrip(g).replace('class="live-strip"', 'class="live-strip" style="border:2px solid var(--edge);border-radius:14px"')}</div>` : ''}
      ${g.blurb ? `<p class="dek" style="color:var(--ink);margin-top:22px">${esc(g.blurb)}</p>` : ''}

      <section>
        ${secHead('flag', lead ? 'So far' : 'How it was decided')}
        <p class="sec-sub">${lead ? 'Lineup swaps and bench points so far. These change as games are played.' : 'The lineup swaps each manager made that stuck, and how many points each left on the bench.'}</p>
        <ul class="decided">${items.map((i) => `<li><span class="tag ${i.tag}">${esc(i.label)}</span><span>${i.text}</span></li>`).join('')}</ul>
      </section>

      ${related.length ? `<section>${secHead('ball', 'Their awards this week')}<div class="awc-list"><div class="awc-grid">${related.join('')}</div></div></section>` : ''}

      <section>
        ${secHead('board', 'Box score')}
        <p class="sec-sub">Points scored and the experts' projection for every player.${w.live ? ' The badge next to a name is his NFL team, a colored pill is ESPN\'s injury designation, and a pulsing sticker with the game clock means that game is on right now.' : ''} A ⚑ on the bench marks a player who outscored a starter he could have replaced.</p>
        <div class="box-grid">${lineupCard(W, true, !!w.live)}${lineupCard(L, false, !!w.live)}</div>
      </section>

      ${others.length ? `<section>${secHead('board', 'Other games this week')}<div class="other-games">${others.map((o) => `<a href="${base(w)}.game-${o.key}">${esc(o.winner.manager)} ${f2(o.winner.points)} · ${esc(o.loser.manager)} ${f2(o.loser.points)}</a>`).join('')}</div></section>` : ''}`;
  }

  function standingsPage() {
    const rows = SEASON.standings;
    const weeks = SEASON.weeks_played;
    const all = rows.flatMap((t) => t.weekly.map((g) => g.points));
    const lo = Math.min(...all), hi = Math.max(...all);
    const shade = (p) => `background: color-mix(in srgb, var(--heat-hi) ${(hi > lo ? 6 + ((p - lo) / (hi - lo)) * 42 : 20).toFixed(0)}%, var(--card))`;
    const luck = rows.map((t) => ({ t, diff: (t.wins + 0.5 * t.ties) / weeks.length - t.all_play_w / Math.max(1, t.all_play_w + t.all_play_l) }))
      .sort((a, b) => b.diff - a.diff);
    const lucky = luck[0], unlucky = luck[luck.length - 1];
    const luckCard = (x, cls, title, text) => `
      <article class="card ${cls}"><div class="card-top"><span class="who">${mgrLink(x.t.manager)}</span><span class="stat">Real ${record(x.t)} · vs. everyone ${x.t.all_play_w}–${x.t.all_play_l}</span></div>
        <h3>${title}</h3><p>${text}</p></article>`;
    return `
      <div class="page-head">
        <div class="kicker">${DATA.league.season} season</div>
        <h1>Standings</h1>
        <p class="dek">Ranked by wins, then total points scored${weeks.length ? `, through Week ${weeks[weeks.length - 1]}` : ''}. Only finished, recapped weeks count${LIVE ? `; Week ${LIVE.week} is on the <a href="#live">Live</a> page until its recap drops` : ''}. Hit <b>Profile</b> on any row for that team's whole season: every game, every award, every point left on the bench.</p>
      </div>

      <section style="margin-top:18px">
        <div class="std-card">${standingsTable(rows)}</div>
        <p class="sec-sub" style="margin-top:12px"><b>Vs. everyone</b> is the record a team would have if it played all seven other teams every week, so it shows who has been scoring well no matter who they drew. <b>Benched</b> is the season total of points left on the bench.</p>
      </section>

      ${playoffPicture()}

      ${weeks.length ? `
      <section>
        ${secHead('board', 'Points by week')}
        <p class="sec-sub">Every team's score each week. Darker blue means a higher score. Tap a score to open that game.</p>
        <div class="std-card table-scroll">
          <table class="std heat">
            <thead><tr><th>Team</th>${weeks.map((n) => `<th style="text-align:center">Week ${n}</th>`).join('')}<th class="r">Average</th></tr></thead>
            <tbody>${rows.map((t) => `
              <tr>
                <td class="mgr"><a href="#team-${t.team_id}">${esc(t.manager)}</a></td>
                ${t.weekly.map((g) => `<td class="cell" style="${shade(g.points)}" title="${esc(t.manager)}, Week ${g.week}: ${f2(g.points)} vs ${esc(g.opponent)} ${f2(g.opponent_points)}"><a href="#week-${g.week}.game-${g.game_key}">${f2(g.points)}</a><span class="res ${g.result}">${g.result}</span></td>`).join('')}
                <td class="r">${f2(t.avg)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
          <div class="heat-legend"><span>Lower</span><span class="ramp" aria-hidden="true"></span><span>Higher</span><span>· W = win, L = loss</span></div>
        </div>
      </section>

      ${lucky.diff !== unlucky.diff ? `
      <section>
        ${secHead('flag', 'The luck report')}
        <p class="sec-sub">Compare each team's real record with her "vs. everyone" record, and you can see who has been lucky with her opponents.</p>
        <div class="cards">
          ${luckCard(lucky, 'balls', 'Luckiest so far', 'Her real record is better than her scores alone would earn. She keeps drawing opponents on their off weeks.')}
          ${luckCard(unlucky, 'breaks', 'Unluckiest so far', 'Her scores deserve a better record than she has. She keeps running into the hottest team of the week.')}
        </div>
      </section>` : ''}` : ''}`;
  }

  /* ---------- team profile: four tabs ----------
     #team-<id> is Overview (the hero, this week, Coach's take and advice), #team-<id>.lineup
     is the week's lineup and to-dos, #team-<id>.next is the same tab pointed at next week, and
     #team-<id>.season is the whole season: the chart, the audit, every game, awards and moves, and
     #team-<id>.league is the league-wide half of the old Coach landing (take, strength grid, waiver order,
     injuries and byes) with the viewed team and the viewer's own team marked. */
  const TP_TABS = [['overview', 'Overview', ''], ['lineup', 'Lineup', '.lineup'], ['season', 'Season', '.season'], ['league', 'League', '.league']];
  const tpHead = (color, title, more = '') =>
    `<div class="tp-head"><span class="mark" style="--c:var(${color})" aria-hidden="true"></span><h2>${title}</h2>${more}</div>`;
  const TP_CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';

  /* Her playoff odds, said so they can't be misread. Before kickoff the Week hub's simulation
     knows the odds if she loses this week's game and if she wins it, so the header shows that
     range. Once it has kicked off the range is gone and what is left is today's single number,
     which the header labels as what it is. */
  function tpOdds(id) {
    const st = hub().stakes;
    if (st && LIVE && st.week === LIVE.week) {
      const g = st.games.find((x) => x.teams.some((r) => r.team_id === id));
      const mine = g && g.teams.find((r) => r.team_id === id);
      const theirs = g && g.teams.find((r) => r.team_id !== id);
      if (mine && mine.win != null && mine.lose != null) return { lose: mine.lose, win: mine.win, opp: theirs ? nameOf(theirs.team_id) : null };
    }
    const po = SEASON.playoffs && SEASON.playoffs.teams.find((x) => x.team_id === id);
    return po ? { now: po.playoff } : null;
  }
  // "81–94%", or one number when the game barely moves it.
  function oddsRange(o) {
    if (!o) return null;
    if (o.now != null) return { text: pct(o.now), sub: 'chance to make the top 4' };
    const lo = pct(o.lose), hi = pct(o.win);
    const vs = o.opp ? ` vs ${o.opp}` : '';
    return lo === hi ? { text: hi, sub: `either way${vs}` } : { text: `${lo.replace('%', '')}–${hi}`, sub: `lose–win${vs}` };
  }

  function tpStrip(id, sfx, next) {
    const youId = myTeam.get();
    return `
      <nav class="tp-strip" aria-label="Teams, in standings order">${SEASON.standings.map((x) => {
        const a = coachFor(x.team_id, next);
        const n = a ? a.counts.now : 0;
        const bits = [x.manager, n ? `${n} fix${n === 1 ? '' : 'es'} waiting` : '', x.team_id === youId ? 'you' : ''].filter(Boolean).join(', ');
        return `<a class="tp-chip" href="#team-${x.team_id}${sfx}"${x.team_id === id ? ' aria-current="page"' : ''} aria-label="${esc(bits)}">${esc(x.manager)}${x.team_id === youId ? '<i class="you" aria-hidden="true"></i>' : ''}${n ? `<span class="n" aria-hidden="true">${n}</span>` : ''}</a>`;
      }).join('')}</nav>
      <p class="tp-key" aria-hidden="true"><span><i class="n"></i> fixes waiting</span><span><i class="you"></i> you</span><span>sorted by standings</span></p>`;
  }

  /* The same top on all three tabs: breadcrumb, team strip, identity card, tab bar. The tab bar
     is sticky; tpSticky keeps its `top` equal to the site header's height and flips `.stuck`
     (which shows the mini identity) once the identity card has scrolled out from under it. */
  function tpHeader(id, t, tab, sfx, next) {
    const rank = SEASON.standings.indexOf(t) + 1;
    const onCoach = !!coachFor(id, false);
    const odds = oddsRange(tpOdds(id));
    const me = myTeam.get(), you = me === id;
    return `
      <div class="crumbs"><a href="${onCoach ? coachUrl(false, null) : '#standings'}">${onCoach ? 'Coach' : 'Standings'}</a><span aria-hidden="true">›</span><span aria-current="page">${esc(t.manager)}</span>${you ? '<span class="you-tag">you</span>' : ''}</div>
      ${tpStrip(id, sfx, next)}
      <section class="tp-id" id="tp-id" aria-labelledby="tp-h">
        <div class="tp-id-top"><span class="tp-tname">${esc(t.team_name)}</span>${you ? '<span class="tp-you">You</span>' : ''}</div>
        <div class="tp-id-main"><h1 id="tp-h">${esc(t.manager)}</h1><div class="tp-rec"><b>${record(t)}</b><span>${ordinal(rank)} place</span></div></div>
        ${you ? '' : (me ? `<a class="tp-back" href="#team-${me}">Back to my team (${esc(TEAMS[me].manager)})</a>` : `<a class="tp-back" href="${advice() ? '#coach' : '#standings'}">Back to the league</a>`)}
        <dl class="tp-stats">
          ${odds ? `<div class="po"><dt>Playoff odds</dt><dd>${odds.text}</dd><span class="hs">${esc(odds.sub)}</span></div>` : ''}
          <div><dt>Avg score</dt><dd>${f1(t.avg)}</dd></div>
          <div><dt>Best week</dt><dd>${t.best ? `${f1(t.best.points)}<small>W${t.best.week}</small>` : '–'}</dd></div>
          <div><dt>Vs. everyone</dt><dd>${t.all_play_w}–${t.all_play_l}</dd></div>
        </dl>
      </section>
      <div class="tp-tabbar" id="tp-tabbar">
        <span class="tp-mini" aria-hidden="true">${esc(t.manager)} <em>${record(t)} · ${ordinal(rank)}</em></span>
        <nav class="tp-seg" aria-label="Profile sections">${TP_TABS.map(([k, label, sx]) =>
          `<a href="#team-${id}${k === 'lineup' && next ? '.next' : sx}"${k === tab ? ' aria-current="page"' : ''}>${label}</a>`).join('')}</nav>
      </div>`;
  }

  /* League tab: the same pieces as the Coach landing (site/coach/landing.js), for this week. */
  function tpLeague(id) {
    return `<div class="cl-page cl-intab">${coachLeague(coachRows(false) || [], myTeam.get(), id)}</div>
      <p class="tp-foot">${voice(LIVE ? coachSource(LIVE) : '')}</p>`;
  }

  function teamPage(id, tab = 'overview', next = false) {
    const t = TEAMS[id];
    if (!t) return notFound();
    otherTeam = id !== myTeam.get(); viewName = t.manager;
    next = !!(next && ahead() && tab === 'lineup');   // no current next-week capture → This week; only the Lineup tab has the toggle
    const p = t.profile || { audit: [], moves: [], weak_spot: null };
    const sfx = next ? '.next' : (TP_TABS.find(([k]) => k === tab) || [])[2] || '';
    const head = tpHeader(id, t, tab, sfx, next);
    if (tab === 'lineup') return head + tpLineup(id, next);
    if (tab === 'season') return head + tpSeason(id, t, p);
    if (tab === 'league') return head + tpLeague(id);
    return `
      ${head}
      <div class="ov-grid">${tpMatchup(id)}${tpPlayoffs(id, t)}</div>
      ${tpTake(id, p)}
      ${tpNext(id)}
      <p class="tp-foot">${voice("Everything here comes from ESPN's projections and injury report. A projection is the experts' guess at how many points a player will score. Useful, not gospel. Nothing on this page changes your lineup for you: make the moves in the ESPN app.")}</p>`;
  }

  /* ---------- faces ----------
     Every place a player is named gets a face chip: his ESPN headshot (a D/ST gets its logo) with a
     small NFL team badge, the same sources as Recaps' Top scorers. The week-ahead capture, the audit
     cards and the award stories only carry a player's id, so his NFL team is looked up from the
     live week's boxes, which list every rostered player. No badge beats a wrong one. */
  const HEADSHOT_URL = (id) => `https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`;
  let proIdx = null, proIdxFor = null;
  function proOf(id) {
    if (!LIVE || id == null) return null;
    if (proIdxFor !== LIVE.games) {
      proIdx = new Map();
      LIVE.games.forEach((g) => [g.winner, g.loser].forEach((s) => [...s.starters, ...s.bench].forEach((p) => {
        if (p.player_id != null) proIdx.set(p.player_id, p);
      })));
      proIdxFor = LIVE.games;
    }
    return proIdx.get(id) || null;
  }
  // A player from anywhere in the data: {player_id|id, name, pos, team?, logo?}, completed from the live boxes.
  function whoIs(p) {
    const id = p.player_id ?? p.id;
    const known = proOf(id) || {};
    return { id, name: p.name || known.name || '', pos: p.pos || known.pos || '', logo: p.logo || known.logo || null, team: p.team || known.team || '' };
  }
  const isDst = (w) => w.pos === 'DST' || w.pos === 'D/ST' || w.id < 0;
  function face(p, size = '') {
    const w = whoIs(p);
    const fallback = `this.onerror=null;this.src='${NO_HEADSHOT}'`;
    if (w.id == null && !isDst(w)) return `<span class="pf ${size}"><img class="img" src="${NO_HEADSHOT}" alt=""></span>`;
    if (isDst(w)) return `<span class="pf dst ${size}">${w.logo ? `<img class="img" src="${esc(w.logo)}" alt="" loading="lazy" onerror="${fallback}">` : '<span class="img"></span>'}</span>`;
    return `<span class="pf ${size}"><img class="img" src="${esc(HEADSHOT_URL(w.id))}" alt="" loading="lazy" onerror="${fallback}">${w.logo ? `<img class="nfl" src="${esc(w.logo)}" alt="" title="${esc(w.team)}" loading="lazy" onerror="this.remove()">` : ''}</span>`;
  }
  // The inline version: face, name, and an optional small gray note ("22.2 proj").
  const ref = (p, note = '') => { const w = whoIs(p); return `<span class="ref">${face(p, 'xs')}<span class="rn">${esc(w.name)}</span>${note ? `<em>${esc(note)}</em>` : ''}</span>`; };
  const refs = (list) => (list && list.length ? `<div class="refs">${list.map((x) => ref(x)).join('')}</div>` : '');
  // The players a Coach item is about: every player id inside its key that is on a roster in the live week.
  function itemFaces(it, limit = 2) {
    const out = [];
    for (const tok of String(it.key || '').split(':')) {
      const n = Number(tok);
      if (!Number.isInteger(n) || (n > -1000 && n < 1000)) continue;
      const p = proOf(n);
      if (p && !out.some((x) => x.player_id === n)) out.push(p);
    }
    return out.slice(0, limit);
  }

  /* ---------- Overview: one snapshot ---------- */
  function tpMatchup(id) {
    const a = coachFor(id, false);
    const t = TEAMS[id];
    if (!a) {
      const wk = (WEEKS.length ? WEEKS[WEEKS.length - 1].week : 0) + 1;
      return `<div class="ov-card"><div class="ov-lab">This week</div><p class="ov-p" style="margin-bottom:0">Nothing to fix until Week ${wk}'s rosters land.</p></div>`;
    }
    const g = LIVE.games.find((x) => x.winner.team_id === id || x.loser.team_id === id);
    const mine = g && (g.winner.team_id === id ? g.winner : g.loser);
    const theirs = g && (g.winner.team_id === id ? g.loser : g.winner);
    const opp = theirs ? TEAMS[theirs.team_id] : TEAMS[a.opponent_id];
    const oppRow = opp && coachFor(opp.team_id, false);
    const wp = a.win_probability;
    const state = LIVE.complete ? 'final' : LIVE.kicked_off ? 'in progress' : 'not started';
    const fixes = a.items.filter((it) => it.level === 'now');
    const first = fixes[0];
    const oppName = opp ? opp.manager : 'Opponent TBD';
    const lastName = (s) => esc(s.manager);
    return `
      <div class="ov-card" aria-labelledby="ov-wk">
        <div class="ov-lab" id="ov-wk">Week ${LIVE.week} · ${state}</div>
        <div class="ov-vs"><span class="mg" aria-hidden="true">${esc(t.manager[0])}</span><b>${esc(t.manager)}</b><i>vs</i>${opp ? `<span class="mg t" aria-hidden="true">${esc(opp.manager[0])}</span><b><a href="#team-${opp.team_id}">${esc(oppName)}</a></b>` : `<b>${esc(oppName)}</b>`}</div>
        ${wp == null ? '' : `
        <div class="ov-wc"><div><b style="color:var(--accent)">${Math.round(wp * 100)}%</b><span>${lastName(t)}'s chance to win</span></div><div class="r"><b>${Math.round((1 - wp) * 100)}%</b><span>${esc(oppName)}'s chance to win</span></div></div>
        <div class="ov-bar" role="img" aria-label="ESPN's win chance: ${esc(t.manager)} ${Math.round(wp * 100)} percent, ${esc(oppName)} ${Math.round((1 - wp) * 100)} percent"><i style="width:${(wp * 100).toFixed(1)}%"></i></div>
        <div class="ov-legend" aria-hidden="true"><span><i class="sq" style="background:var(--accent)"></i>${esc(t.manager)}</span><span>ESPN's win chance</span><span>${esc(oppName)}<i class="sq" style="background:var(--pink)"></i></span></div>`}
        <dl class="ov-stats">
          <div><dt>${esc(t.manager)} proj</dt><dd>${f1(mine ? projOf(mine) : a.projected)}</dd></div>
          <div><dt>${esc(oppName)} proj</dt><dd>${theirs ? f1(projOf(theirs)) : oppRow ? f1(oppRow.projected) : '–'}</dd></div>
          <div><dt>Starters left</dt><dd>${a.yet_to_play}</dd></div>
        </dl>
        ${first
          ? `<div class="ov-fix"><span aria-hidden="true">⚠</span><div><b>${fixes.length} to fix.</b> ${esc(voice(first.title))}.${refs(itemFaces(first))}</div><a class="go" href="#team-${id}.lineup">See it →</a></div>`
          : `<div class="ov-fix ok"><span aria-hidden="true">${TP_CHECK}</span><div>${esc(voice(a.summary))}</div></div>`}
      </div>`;
  }

  // Playoffs, in words. The odds are the chance to finish in the top 4 of 8; the two numbers are what
  // they become if she loses this week's game and if she wins it, from the same simulation as Standings.
  function tpPlayoffs(id, t) {
    const po = SEASON.playoffs;
    const rank = SEASON.standings.indexOf(t) + 1;
    const cfg = po && po.config;
    const o = tpOdds(id);
    const n = cfg ? cfg.teams : 4;
    let body;
    if (o && o.lose != null) {
      const lo = Math.round(o.lose * 100), hi = Math.round(o.win * 100);
      const vs = o.opp ? ` ${esc(o.opp)}` : ' this week';
      body = lo === hi || pct(o.lose) === pct(o.win)
        ? `<div class="ov-odds"><div class="n"><span>Either way${o.opp ? ` against ${esc(o.opp)}` : ''}</span><b>${pct(o.win)}</b></div></div>
           <p class="ov-worth">This week's game barely moves ${esc(t.manager)}'s odds.${cfg ? ` Playoffs start Week ${cfg.first_round_week}.` : ''}</p>`
        : `<div class="ov-odds"><div><span>If ${esc(t.manager)} loses to${vs}</span><b>${pct(o.lose)}</b></div><div class="ar" aria-hidden="true">→</div><div class="w"><span>If ${esc(t.manager)} beats${vs}</span><b>${pct(o.win)}</b></div></div>
           <p class="ov-worth">So this week's game is worth <b>${hi - lo} points</b> of playoff odds.${cfg ? ` Playoffs start Week ${cfg.first_round_week}.` : ''} Same math as Standings.</p>`;
    } else if (o && o.now != null) {
      body = `<div class="ov-odds"><div class="n"><span>${esc(t.manager)}'s chance of a playoff spot right now</span><b>${pct(o.now)}</b></div></div>
        <p class="ov-worth">Once this week's games are in, Coach shows what a win or a loss does to it.${cfg ? ` Playoffs start Week ${cfg.first_round_week}.` : ''} Same math as Standings.</p>`;
    } else {
      body = '<p class="ov-worth">Playoff odds show up once there is a finished week to simulate from.</p>';
    }
    return `
      <div class="ov-card" aria-labelledby="ov-po">
        <div class="ov-lab" id="ov-po">Playoff picture</div>
        <div class="ov-seed"><b>${ordinal(rank)} seed</b><span class="ov-tag">Top ${n} advance</span></div>
        <p class="ov-p">Playoff odds are ${esc(t.manager)}'s chance to finish in the top ${n} of ${SEASON.standings.length} and make the playoffs.</p>
        ${body}
      </div>`;
  }

  // This week's waiver and trade ideas for a team, with the weak-spot tag matched here, not trusted from the
  // build: /api/live replaces LIVE.advice with rows that never went through site_data(), so a baked tag
  // would vanish on the first refresh.
  function tpIdeas(id, next) {
    const a = coachFor(id, next);
    const weak = (TEAMS[id].profile || {}).weak_spot;
    return ((a && a.roster_ideas) || []).map((it) => ({ ...it, fills_weak_spot: !!it.pos && it.pos === weak }));
  }

  // One audit card, as the orange take, then this week's ideas: up to 2 waiver and 1 trade up front,
  // topped up to 3 from whatever is left, the rest behind a closed "N more ideas". The other audit cards
  // are on the Season tab.
  function tpTake(id, p) {
    const ideas = tpIdeas(id, false);
    const waiver = ideas.filter((it) => !it.trade), trades = ideas.filter((it) => it.trade);
    const shown = [...waiver.slice(0, 2), ...trades.slice(0, 1)];
    const rest = [...waiver.slice(2), ...trades.slice(1)];
    while (shown.length < 3 && rest.length) shown.push(rest.shift());
    const it = p.audit.find((x) => x.kind === 'position') || p.audit[0];
    const link = p.audit.length ? `<a class="more" href="#team-${id}.season">Full audit on Season →</a>` : '';
    return `
      <section class="tp-sec" aria-labelledby="tp-take">
        ${tpHead('--orange', "Coach's take", link).replace('<h2>', '<h2 id="tp-take">')}
        ${it
          ? `<article class="ov-take${it.written ? '' : ' computed'}"><span class="ov-tag og">${esc(ADVICE_KIND[it.kind] || 'Coach')}</span><h3>${esc(voice(it.title))}</h3><p>${esc(voice(it.text))}</p>${it.written ? '' : '<p class="tp-unwritten">Coach hasn\'t written today\'s take yet.</p>'}${refs(it.players)}</article>`
          : '<p class="sec-sub">The coach needs one finished week before she has opinions on the season.</p>'}
        <div class="tp-sub"><span>Ideas for this week</span><small>Ideas, not orders. A trade only shows up if it helps both teams.</small></div>
        ${shown.length
          ? `<div class="tp-cards">${shown.map(adviceCard).join('')}</div>
             ${rest.length ? `<details class="tp-more" data-hub-open="tp-more-${id}"${HUB_OPEN.has(`tp-more-${id}`) ? ' open' : ''}><summary>${rest.length} more idea${rest.length === 1 ? '' : 's'}</summary><div class="tp-cards">${rest.map(adviceCard).join('')}</div></details>` : ''}`
          : '<p class="sec-sub">No new waiver or trade ideas today.</p>'}
      </section>`;
  }

  // The opponent after this week's game, from the week-ahead capture, with the one player of hers to watch.
  function tpNext(id) {
    const a = ahead() && coachFor(id, true);
    const opp = a && TEAMS[a.opponent_id];
    if (!opp) return '';
    const row = coachFor(opp.team_id, true);
    const roster = row && row.lineup ? [...row.lineup.starters, ...row.lineup.bench] : [];
    const key = a.items.find((it) => it.kind === 'matchup');
    const named = key && itemFaces(key, 5).map((x) => roster.find((r) => r.player_id === x.player_id)).find(Boolean);
    const starters = roster.filter((r) => r.slot !== 'BENCH' && r.slot !== 'IR');
    const byProj = [...starters].sort((x, y) => (y.projected || 0) - (x.projected || 0));
    const watch = named || byProj[0];
    // Why this player: an ESPN designation first (never guessed, only when the capture has one), then
    // whether her week leans on him, else just that he's the one to watch.
    let why = '';
    if (watch) {
      const total = starters.reduce((n, r) => n + (r.projected || 0), 0);
      const isStarter = starters.includes(watch);
      const ratio = total > 0 && isStarter && watch.projected ? watch.projected / total : null;
      const share = ratio == null ? null : Math.round(ratio * 100);
      if (watch.injury && isStarter) {
        const desig = String(watch.injury).toLowerCase().replace(/\bir\b/, 'IR');
        why = { cls: 'inj', tag: 'Injury watch', text: `ESPN lists him ${desig}. If he sits, her whole week changes, so check back before kickoff.` };
      } else if (ratio != null && ratio >= 0.18) {
        why = { cls: 'eng', tag: 'Her engine', text: `${share}% of her ${f1(total)} projected points come from him. Slow him down and she's in trouble.` };
      } else {
        const lead = watch === byProj[0] ? 'Her highest-projected starter this week' : 'One of her key players this week';
        why = { cls: 'thr', tag: 'Top threat', text: `${lead}${share != null ? `, about ${share}% of her ${f1(total)} projected points.` : '.'}` };
      }
    }
    return `
      <section class="tp-sec" aria-labelledby="tp-next">
        ${tpHead('--accent', "Who's next").replace('<h2>', '<h2 id="tp-next">')}
        <div class="ov-card ov-next${why && why.cls === 'inj' ? ' hurt' : ''}"><span class="mon" aria-hidden="true">${esc(opp.manager[0])}</span><div><div class="nm"><a href="#team-${opp.team_id}">${esc(opp.manager)}</a> (${record(opp)}), Week ${ahead().week}</div>
          ${watch ? `<div class="sub">Keep an eye on ${ref(watch, watch.projected ? `${f1(watch.projected)} proj` : '')}</div>
          <div class="why"><span class="ov-tag${why.cls === 'inj' ? ' pk' : why.cls === 'eng' ? ' og' : ''}">${why.tag}</span><span>${esc(why.text)}</span></div>` : ''}</div></div>
      </section>`;
  }

  /* Season tab: the scores, Coach's audit, every game, then awards and roster moves as accordions. */
  function seasonChart(t) {
    const W = 560, H = 160, pad = 8, base = H - 26, top = 24;
    const n = t.weekly.length;
    const maxv = Math.max(...t.weekly.map((g) => g.points), t.avg || 0, 1) * 1.04;
    const slot = (W - pad * 2) / n, bw = Math.min(58, slot * 0.74);
    const yOf = (v) => base - (base - top) * (v / maxv);
    const bars = t.weekly.map((g, i) => {
      const x = pad + i * slot + (slot - bw) / 2, y = yOf(g.points);
      return `<rect class="${g.result === 'L' ? 'ch-l' : 'ch-w'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(base - y).toFixed(1)}" rx="7"/>
        <text class="ch-v" x="${(x + bw / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}">${f1(g.points)}</text>
        <text class="ch-x" x="${(x + bw / 2).toFixed(1)}" y="${H - 8}">W${g.week} · ${g.result}</text>`;
    }).join('');
    const ay = yOf(t.avg).toFixed(1);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly scores: ${t.weekly.map((g) => `week ${g.week} ${f1(g.points)}`).join(', ')}. Average ${f1(t.avg)}.">${bars}<line class="ch-avg" x1="0" x2="${W}" y1="${ay}" y2="${ay}"/><text class="ch-al" x="${W - 2}" y="${(ay - 5).toFixed(1)}">avg ${f1(t.avg)}</text></svg>`;
  }

  function tpSeason(id, t, p) {
    const who = id === myTeam.get() ? 'Your' : `${esc(t.manager)}'s`;
    const weeks = [...t.weekly].sort((x, y) => y.week - x.week);
    const optimal = t.points_for + t.bench_left;
    const awards = [...t.awards].map((a, i) => ({ ...a, i })).sort((x, y) => y.week - x.week || x.i - y.i);
    const kinds = AWARD_KINDS.map((k) => [k, awards.filter((a) => a.kind === k).length]).filter(([, n]) => n);
    const byWeek = [];
    for (const m of p.moves) {
      const last = byWeek[byWeek.length - 1];
      if (last && last.week === m.week) last.moves.push(m); else byWeek.push({ week: m.week, moves: [m] });
    }
    const awardRow = (a, n) => {
      const key = `aw-${id}-${a.week}-${a.i}`, rid = `${key}-p`, open = LU_OPEN.has(key);
      const k = KIND[a.kind];
      return `
        <div class="prow${open ? ' open' : ''}" data-key="${key}">
          <div class="arow" role="button" tabindex="0" aria-expanded="${open}" aria-controls="${rid}" data-row><span class="aw-tag ${k.cls}">${esc(k.label)}</span><div class="at"><small>Week ${a.week}</small><b>${esc(a.title)}</b></div><span class="chev" aria-hidden="true">▾</span></div>
          <div class="coach" id="${rid}"><div class="cin"><div class="cb${a.kind === 'flags' ? ' fl' : ''}"><p>${esc(a.text || a.stat || a.title)}</p>${a.stat && a.text ? `<p style="margin-top:6px;font:500 11.5px var(--mono);color:var(--muted)">${esc(a.stat)}</p>` : ''}${refs(a.players)}<p style="margin-top:8px"><a href="#week-${a.week}.awards" style="color:var(--accent);font-weight:700;font-size:13px">Week ${a.week}'s awards →</a></p></div></div></div>
        </div>`;
    };
    const mvRef = (m, side) => (m[side].map((name, i) => ref({ id: m[`${side}_ids`] ? m[`${side}_ids`][i] : null, name })).join(''));
    const movesRow = () => {
      const key = `mv-${id}`, rid = `${key}-p`, open = LU_OPEN.has(key), latest = byWeek[0];
      return `
        <div class="prow${open ? ' open' : ''}" data-key="${key}">
          <div class="arow" role="button" tabindex="0" aria-expanded="${open}" aria-controls="${rid}" data-row><span class="aw-tag moves">Roster moves</span><div class="at"><small>${p.moves.length} this season</small><b>Latest: Week ${latest.week}, ${latest.moves.length} move${latest.moves.length === 1 ? '' : 's'}</b></div><span class="chev" aria-hidden="true">▾</span></div>
          <div class="coach" id="${rid}"><div class="cin"><div class="cb mvs">${byWeek.map((w) => `<p class="mvw">Week ${w.week} · ${w.moves.length} move${w.moves.length === 1 ? '' : 's'}</p>${w.moves.map((m) => `
            <div class="mv">${m.type === 'trade' ? '<i>Trade</i>' : ''}${m.added.length ? `<i>${m.type === 'trade' ? 'Got' : 'Added'}</i>${mvRef(m, 'added')}` : ''}${m.dropped.length ? `<i class="d">${m.type === 'trade' ? 'Sent' : 'Dropped'}</i>${mvRef(m, 'dropped')}` : ''}</div>`).join('')}`).join('')}</div></div></div>
        </div>`;
    };
    const takeCard = (it, i) => `<article class="ov-take ${['l', '', 'b'][i % 3]}"><span class="ov-tag${i % 3 === 1 ? ' og' : i % 3 === 2 ? ' w' : ''}">${esc(ADVICE_KIND[it.kind] || 'Coach')}</span><h3>${esc(voice(it.title))}</h3><p><b>${esc(it.stat || '')}</b>${it.stat ? ' · ' : ''}${esc(voice(it.text))}</p>${refs(it.players)}</article>`;
    return `
      ${t.weekly.length ? `
      <section class="tp-sec" aria-labelledby="tp-sc">
        ${tpHead('--accent', 'Score by week').replace('<h2>', '<h2 id="tp-sc">')}
        <div class="sc-grid"><div class="sc-chart">${seasonChart(t)}</div>
          <div class="sc-tiles">
            <div class="sc-tile b"><b>${f1(t.avg)}</b><span>Avg score</span></div>
            <div class="sc-tile l"><b>${t.best ? `${f1(t.best.points)}<em>W${t.best.week}</em>` : '–'}</b><span>Best week</span></div>
            <div class="sc-tile o"><b>${optimal > 0 ? Math.round((t.points_for / optimal) * 100) : 100}%</b><span>Of optimal lineup</span></div>
            <div class="sc-tile p"><b>${f1(t.bench_left)}</b><span>Points benched</span></div>
          </div></div>
      </section>` : ''}

      <section class="tp-sec" aria-labelledby="tp-au">
        ${tpHead('--orange', "Coach's audit").replace('<h2>', '<h2 id="tp-au">')}
        ${p.audit.length
          ? `<p class="sec-sub">${who} season so far, graded on every week with a recap.</p><div class="sc-audit">${p.audit.map(takeCard).join('')}</div>`
          : '<p class="sec-sub">The coach needs one finished week before she has opinions.</p>'}
      </section>

      ${weeks.length ? `
      <section class="tp-sec" aria-labelledby="tp-ww">
        ${tpHead('--lime', 'Week by week').replace('<h2>', '<h2 id="tp-ww">')}
        <div class="sc-wk">${weeks.map((g) => `
          <a class="sc-wl" href="#week-${g.week}.game-${g.game_key}"><span class="r ${g.result}" aria-label="${g.result === 'W' ? 'Won' : g.result === 'L' ? 'Lost' : 'Tied'}">${g.result}</span>
            <span class="t"><b>Week ${g.week} · ${esc(g.opponent)}</b><small>${g.score_rank} of 8 · ${f2(g.points_left)} benched</small></span><span class="s">${f2(g.points)} – ${f2(g.opponent_points)}</span></a>`).join('')}</div>
      </section>` : ''}

      <section class="tp-sec" aria-labelledby="tp-aw">
        <div class="tp-head"><span class="mark" style="--c:var(--orange)" aria-hidden="true"></span><h2 id="tp-aw">Awards and moves</h2>${awards.length || byWeek.length ? '<a class="more" href="#" data-act="all">Expand all</a>' : ''}</div>
        <p class="sec-sub">${kinds.length ? `${kinds.map(([k, n]) => `${n} ${KIND[k].label.toLowerCase()}${n === 1 ? '' : 's'}`).join(', ')}. ` : 'No awards yet. Give it time. '}Tap one for the story.</p>
        <div class="sc-aw acc">${awards.map(awardRow).join('')}${byWeek.length ? movesRow() : ''}${byWeek.length ? '' : '<p class="sec-sub" style="padding:10px 0">No adds, drops or trades yet. Still riding with the draft-day roster.</p>'}</div>
      </section>`;
  }

  /* ---------- coach: this week's to-do list, per team ----------
     Everything on these pages is computed in site/build.py from the same capture the
     Live page uses: ESPN's projections, its injury report, and which NFL games have
     started. It refreshes with the rest of the live data. */
  const adviceCard = (it) => `
    <article class="card ${it.level}">
      <div class="card-top"><span class="who">${esc(ADVICE_KIND[it.kind] || 'Note')}</span>${it.fills_weak_spot ? `<span class="fit">${voice('fills your weak spot')}</span>` : ''}${it.stat ? `<span class="stat">${esc(it.stat)}</span>` : ''}</div>
      <h3>${esc(voice(it.title))}</h3>
      <p>${esc(voice(it.text))}</p>
      ${it.trade ? tradeBlock(it.trade) : ''}
    </article>`;

  /* The numbers behind an evaluated trade card, straight from scripts/trade_eval.py: the
     players each way, each side's lineup gain over the next few weeks, and each side's
     playoff odds before and after. The card's text says why; this shows the receipts. */
  const tradeBlock = (t) => {
    const who = (xs) => xs.map((x) => `<span>${esc(x.name)}${x.pos ? ` <small>${esc(x.pos)}</small>` : ''}</span>`).join('');
    // A trade can pass on title odds alone (a near-lock's playoff odds barely move), so show
    // whichever of the two her odds actually moved on.
    const onTitle = Math.abs(t.you.playoff[1] - t.you.playoff[0]) < 0.005;
    const kind = onTitle ? 'title' : 'playoff';
    const odds = (s) => `${pct(s[kind][0])} → ${pct(s[kind][1])}`;
    const gain = (n) => (Math.abs(n) < 0.05 ? 'about even' : `${signed(n)} pts a week`);
    const her = nameOf(t.partner_id);
    const f = t.flags || {};
    const I = otherTeam ? viewName : 'You';
    const sticker = f.plays_this_week ? `${I} play${otherTeam ? 's' : ''} her in Week ${t.week}`
      : f.rival === 'next_week' ? `${I} play${otherTeam ? 's' : ''} her in Week ${t.week + 1}`
      : f.rival === 'bubble' ? (otherTeam ? `${viewName} and ${her} are both on the playoff bubble` : "You're both on the playoff bubble") : '';
    return `
      <div class="trade">
        <div class="trade-side"><b>${voice('You send')}</b>${who(t.give)}</div>
        <div class="trade-side"><b>${voice('You get from')} ${esc(her)}</b>${who(t.get)}</div>
      </div>
      <dl class="trade-math">
        <div><dt>${voice('Your lineup, next 4 weeks')}</dt><dd>${gain(t.you.near)}</dd></div>
        <div><dt>${esc(her)}'s lineup</dt><dd>${gain(t.them.near)}</dd></div>
        <div><dt>${voice(`Your ${kind} odds`)}</dt><dd>${odds(t.you)}</dd></div>
        <div><dt>${esc(her)}'s ${kind} odds</dt><dd>${odds(t.them)}</dd></div>
      </dl>
      ${sticker && t.week ? `<div class="trade-flags"><span>${esc(sticker)}</span></div>` : ''}`;
  };

  const coachSource = (w) => `Everything here comes from ESPN's own projections and injury report, captured ${updated(w.captured_at)}. A projection is the experts' guess at how many points a player will score. Useful, not gospel. Nothing on this page changes your lineup for you: make the moves in the ESPN app.`;
  const nextSource = () => `Next week's rosters, projections and injury report as ESPN had them ${updated(ahead().captured_at)}. All of it moves as the week gets closer${ahead().projected ? '' : ", and ESPN hasn't published next week's projections yet, so this is byes and injuries only"}. Worth another look on Saturday. Nothing here changes your lineup for you: make the moves in the ESPN app.`;

  /* Both tabs run through the same pages: `next` false is the week being played, true is
     the week after it. Same cards, same components, different source. A flip switch, not
     a second row of tabs, since it's one choice with only two states. */
  function weekToggle(next, id) {
    if (!ahead()) return '';
    // On a team's profile the toggle flips the Lineup tab; on the league grid it flips the grid.
    const tab = (isNext, label, week) => `<a href="${id ? `#team-${id}${isNext ? '.next' : '.lineup'}` : coachUrl(isNext, null)}" ${isNext === next ? 'aria-current="page"' : ''}>${label} <span class="wk-n">W${week}</span></a>`;
    return `<div class="week-toggle" data-state="${next ? 'next' : 'this'}" role="group" aria-label="Choose a week"><span class="knob" aria-hidden="true"></span>${tab(false, 'This week', LIVE.week)}${tab(true, 'Next week', ahead().week)}</div>`;
  }

  function teamSwitch(active, next) {
    return `<nav class="team-switch" aria-label="Choose a team">${coachRows(next).map((a) => `
      <a href="${coachUrl(next, a.team_id)}" ${a.team_id === active ? 'aria-current="page"' : ''}>${esc(a.manager)}${a.counts.now ? `<span class="dot" title="${a.counts.now} to fix">!</span>` : ''}</a>`).join('')}</nav>`;
  }

  /* The Coach landing is the league's view: what Coach thinks of all eight teams, then a way
     into each team's own report. The modules live in site/coach/ (pure insight functions with
     tests, plus landing.js for the markup), inlined below. */
__COACH_JS__
__LIVE_JS__

  function coachPage(next) {
    const week = next ? ahead().week : LIVE.week;
    const rows = coachRows(next);
    const me = myTeam.get();
    const mine = rows.find((r) => r.team_id === me);
    return `
      <div class="cl-wide">
      <div class="page-head cl-pagehead">
        <div class="kicker-row">
          <div class="kicker">Week ${week} · ${next ? 'not played yet' : (LIVE.complete ? 'final' : 'live')}</div>
          ${weekToggle(next, null)}
        </div>
        ${next ? `<p class="cl-weeknote">${esc(clWeekNote(next, rows))}</p>` : ''}
        <h1>Coach</h1>
        <p class="dek">${next
          ? `Coach is already on Week ${week}. Nothing has kicked off, so there's time to fix.`
          : `Coach read all ${rows.length} rosters so you don't have to. The league first, then tap a team for her full report.${liveShut() ? ` Every Week ${week} game is done, so nothing here can change until${ahead() ? ` <a href="${coachUrl(true, null)}">Week ${ahead().week}</a>` : ' next week'}.` : ''}`}</p>
      </div>
      <div class="cl-page">
        ${coachLanding(next, rows, me)}
      </div>
      <p class="cl-foot">${next ? nextSource() : coachSource(LIVE)}</p>
      </div>`;
  }

  /* The week-ahead lineup: no scores exist yet, so the table is the roster and what ESPN
     projects for it, with the same team and injury badges as a live box score. */
  /* ---------- Lineup tab: what to fix, then every player ----------
     Rows are drawn like Recaps' Top scorers (round headshot, NFL badge, name, subline, a pill on the
     right) and each opens to Coach's one-liner on how that player is doing. Which rows are open lives
     in LU_OPEN, because the live refresh redraws the page and nobody wants a row snapping shut; opening
     and closing only flips classes, it never re-renders. */
  const LU_OPEN = new Set();
  const kickoffText = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '');

  function lineupRow(p, card, next, tid, bench) {
    const w = whoIs(p);
    const dst = isDst(w);
    const open = LU_OPEN.has(`${tid}-${next ? 'n' : 't'}-${w.id}`);
    const rid = `lu-${tid}-${next ? 'n' : 't'}-${String(w.id).replace('-', 'm')}`;
    const key = `${tid}-${next ? 'n' : 't'}-${w.id}`;
    const bye = !!(card && card.bye);
    const started = !bye && !next && (p.playing || (card && (card.state === 'in' || card.state === 'post')) || p.points > 0.005);
    const slot = p.slot === 'IR' ? 'IR' : bench ? 'BN' : p.slot;
    const inj = p.injury ? ` <span class="inj${OUTISH.includes(p.injury) ? ' out' : ''}" title="ESPN's injury report">${esc(p.injury)}</span>` : '';
    const when = bye ? 'Bye week · nothing to start' : p.playing ? `<span class="live-dot" aria-hidden="true"></span> on now, ${esc(p.playing)}` : kickoffText(p.kickoff);
    const sub = `<b>${esc(w.team || (dst ? '' : '–'))}</b>${when ? ` · ${when}` : ''}${inj}`;
    const pill = bye ? '<div class="pill byep">BYE</div>'
      : started ? `<div class="pill">${f1(p.points)}<small>PROJ ${f1(p.projected)}</small></div>`
      : `<div class="pill proj">${f1(p.projected)}<small>PROJ</small></div>`;
    return `
      <div class="prow${open ? ' open' : ''}" data-key="${esc(key)}">
        <div class="row${bench ? ' bench' : ''}${dst ? ' dst' : ''}${bye ? ' bye' : ''}" role="button" tabindex="0" aria-expanded="${open}" aria-controls="${rid}" data-row>
          <span class="slot${p.slot === 'FLEX' ? ' flex' : ''}${bench ? ' bn' : ''}">${esc(slot === 'DST' ? 'D/ST' : slot)}</span>
          <div class="av">${face(p)}</div>
          <div class="pwho"><div class="nm">${esc(w.name)}${posOf(w.pos) ? ` <span class="pos">(${posOf(w.pos)})</span>` : ''}</div><div class="sub">${sub}</div></div>
          ${pill}<span class="chev" aria-hidden="true">▾</span>
        </div>
        <div class="coach" id="${rid}"><div class="cin"><div class="cb">
          <span class="ctag">Coach says</span>
          ${card ? `<h4>${esc(voice(card.blurb))}</h4><div class="peek-body">${peekDetail(p, card)}</div>` : '<h4>Nothing to say yet.</h4>'}
        </div></div></div>
      </div>`;
  }

  function tpLineup(id, next) {
    const a = coachFor(id, next);
    if (!a) {
      const wk = (WEEKS.length ? WEEKS[WEEKS.length - 1].week : 0) + 1;
      return `<section class="tp-sec">${tpHead('--accent', 'Lineup')}<p class="sec-sub">Nothing to fix until Week ${wk}'s rosters land.</p></section>`;
    }
    const week = next ? ahead().week : LIVE.week;
    const g = next ? null : LIVE.games.find((x) => x.winner.team_id === id || x.loser.team_id === id);
    const mine = g && (g.winner.team_id === id ? g.winner : g.loser);
    const src = next ? a.lineup : mine;
    if (!src) return `<section class="tp-sec">${tpHead('--accent', 'Lineup')}<p class="sec-sub">No lineup on the board for ${esc(TEAMS[id].manager)} this week.</p></section>`;
    const opp = g ? TEAMS[(g.winner.team_id === id ? g.loser : g.winner).team_id] : TEAMS[a.opponent_id];
    const starters = [...src.starters].sort((x, y) => SLOT_ORDER.indexOf(x.slot) - SLOT_ORDER.indexOf(y.slot));
    const bench = [...src.bench].sort((x, y) => (y.projected || 0) - (x.projected || 0));
    const row = (p, b) => lineupRow(p, a.players && p.player_id != null ? a.players[p.player_id] : null, next, id, b);
    const fixes = a.items.filter((it) => it.level === 'now');
    const wp = a.win_probability;
    const sum = [`<b>${f1(mine ? projOf(mine) : a.projected)}</b> projected`, `<b>${a.yet_to_play}</b> starters left`,
      wp == null ? '' : `<b>${Math.round(wp * 100)}%</b> to win${opp ? ` vs ${esc(opp.manager)}` : ''}`].filter(Boolean).join(' · ');
    const cols = (cls) => `<div class="${cls}"><div class="divider" style="margin-top:0">STARTERS</div>${starters.map((p) => row(p, false)).join('')}</div>
      <div class="${cls}"><div class="divider" style="margin-top:0">BENCH</div>${bench.map((p) => row(p, true)).join('')}</div>`;
    return `
      <section class="tp-sec" aria-labelledby="lu-h">
        <div class="kicker-row">${tpHead('--accent', next ? `Week ${week}, coming up` : `Week ${week}, right now`).replace('<h2>', '<h2 id="lu-h">')}${weekToggle(next, id)}</div>
        <p class="lu-sum">${sum}</p>
        <div class="lu-fix${fixes.length ? '' : ' ok'}">
          <div class="ov-lab" style="color:var(--ink)">${fixes.length ? `To fix ${next ? 'before Sunday' : 'now'} · ${fixes.length}` : 'Nothing to fix'}</div>
          ${fixes.length ? fixes.map((it) => `<div class="it"><div><p><b>${esc(voice(it.title))}.</b> ${esc(voice(it.text))}</p>${refs(itemFaces(it))}</div>${it.stat ? `<span class="ov-tag" style="background:var(--pink)">${esc(it.stat)}</span>` : ''}</div>`).join('')
            : `<p>${esc(voice(a.summary))}</p>`}
        </div>
      </section>
      <section class="tp-sec" aria-labelledby="lu-lh">
        ${tpHead('--pink', 'Lineup').replace('<h2>', '<h2 id="lu-lh">')}
        <div class="lhint"><p class="sec-sub" style="margin:0">Tap a player for Coach's read on how he's doing.</p><button type="button" class="lu-all" data-act="all">Expand all</button></div>
        <div class="lu-cols acc">${cols('lu-col')}</div>
      </section>
      ${next ? tpAdvice(id, next) : ''}
      <p class="tp-foot">${voice(next ? nextSource() : coachSource(LIVE))}</p>`;
  }

  function tpAdvice(id, next) {
    const a = coachFor(id, next);
    if (!a) return '';
    const ideas = tpIdeas(id, next);
    const waiver = ideas.filter((it) => !it.trade);
    const trades = ideas.filter((it) => it.trade);
    const col = (label, note, items) => (items.length ? `<div><div class="tp-sub"><span>${label}</span><small>${note}</small></div>${items.map(adviceCard).join('')}</div>` : '');
    return `
      <section class="tp-sec" aria-labelledby="tp-adv">
        ${tpHead('--lime', "Coach's advice").replace('<h2>', '<h2 id="tp-adv">')}
        ${ideas.length
          ? `<p class="sec-sub">Ideas, not orders. A trade only shows up here if it helps both teams.</p>
             <div class="tp-ideas">${col('Waiver wire', 'From FantasyPros and everyone\'s rosters', waiver)}${col('Trade idea', 'Checked against both lineups', trades)}</div>`
          : '<p class="sec-sub">No new ideas today.</p>'}
      </section>`;
  }


  function auditSection(p) {
    return `
      <section>
        ${secHead('board', "Coach's audit")}
        ${p.audit.length
          ? `<p class="sec-sub">Your season so far, graded on every week with a recap.</p><div class="cards">${p.audit.map(adviceCard).join('')}</div>`
          : '<p class="sec-sub">The coach needs one finished week before she has opinions.</p>'}
      </section>`;
  }

  function suggestionsSection(id, next) {
    const a = coachFor(id, next);
    // Matched here, not trusted from the build: /api/live replaces LIVE.advice with rows that
    // never went through site_data(), so a baked tag would vanish on the first refresh.
    const weak = (TEAMS[id].profile || {}).weak_spot;
    const ideas = ((a && a.roster_ideas) || []).map((it) => ({ ...it, fills_weak_spot: !!it.pos && it.pos === weak }));
    return `
      <section>
        ${secHead('board', 'Worth a look')}
        ${ideas.length
          ? `<p class="sec-sub">Roster ideas from FantasyPros' rankings and everyone's rosters. A trade only shows up here if it helps both teams. Ideas, not orders.</p><div class="cards">${ideas.map(adviceCard).join('')}</div>`
          : '<p class="sec-sub">No new ideas today.</p>'}
      </section>`;
  }

  function movesSection(p) {
    const names = (xs) => xs.map(esc).join(', ');
    return `
      <section>
        ${secHead('board', 'Recent moves')}
        ${p.moves.length
          ? `<ul class="decided">${p.moves.map((m) => `<li><span class="tag ${m.type === 'trade' ? 'good' : 'info'}">Week ${m.week}</span><span>${m.type === 'trade' ? '<b>Trade.</b> ' : ''}${m.added.length ? `Added ${names(m.added)}` : ''}${m.added.length && m.dropped.length ? ' · ' : ''}${m.dropped.length ? `${m.type === 'trade' ? 'Sent' : 'Dropped'} ${names(m.dropped)}` : ''}</span></li>`).join('')}</ul>`
          : '<p class="sec-sub">No adds, drops or trades yet. Still riding with the draft-day roster.</p>'}
      </section>`;
  }

  function glossaryPage() {
    const seen = new Map();
    for (const w of WEEKS) for (const g of w.glossary) {
      const k = g.term.toLowerCase();
      if (!seen.has(k)) seen.set(k, { ...g, week: w.week });
    }
    const terms = [...seen.values()].sort((a, b) => a.term.localeCompare(b.term));
    return `
      <div class="page-head">
        <div class="kicker">Football, explained</div>
        <h1>Rookie glossary</h1>
        <p class="dek">Every term from the recaps so far, in plain English. Nobody here was born knowing what a flex spot is.</p>
      </div>
      <section style="margin-top:18px">
        ${terms.length ? `<dl class="terms">${terms.map((g) => `<div class="term"><dt>${esc(g.term)} <a href="#week-${g.week}">Week ${g.week}</a></dt><dd>${esc(g.definition)}</dd></div>`).join('')}</dl>` : '<p class="sec-sub">Terms show up here once the first recap is out.</p>'}
      </section>`;
  }

  const notFound = () => `<div class="empty"><h1>Fumble</h1><p>That page doesn't exist. <a href="${WEEKS.length ? `#week-${latest().week}` : '#'}" style="color:var(--accent)">Back to the latest recap</a></p></div>`;

  /* ---------- "Viewing as" ----------
     The chip in the header says whose eyes the site is wearing, and it changes what the site opens:
     the Coach nav item and the Coach landing both go to the picked team's profile, and her team
     lights up in orange (the "You" badge) everywhere. It does not change which team is on screen,
     which is always the URL's (#team-<id>), so a link to anyone's team still shows that team, written
     about as "her". A wrong pick is one tap from undone: every change raises a toast with an Undo
     button, and "League view" is always at the bottom of the menu. */
  const viewingAs = (() => {
