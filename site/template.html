              <tr${t.proj_seed === cut && cut < n ? ' class="po-cut"' : ''}>
                <td class="rank">${t.proj_seed}</td>
                <td class="mgr"><a href="#team-${t.team_id}">${esc(nameOf(t.team_id))}</a><span class="tname">${esc((TEAMS[t.team_id] || {}).team_name || '')}</span></td>
                <td><div class="po-make">${poBar(t.playoff, `${nameOf(t.team_id)} makes the playoffs ${pct(t.playoff, done)} of the time`)}<span class="num">${pct(t.playoff, done)}</span><span class="po-label ${PO_LABEL[t.label] || ''}" title="${esc(PO_TIP[t.label] || '')}">${esc(t.label)}</span></div></td>
                ${cfg.byes ? `<td class="r">${pct(t.bye, done)}</td>` : ''}
                <td class="r">${pct(t.title, done && t.playoff === 0)}</td>
                <td class="r">${f1(t.proj_wins)}–${f1(t.proj_losses)}</td>
                <td class="r">${trendCell(t.trend)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </section>

      <section>
        ${secHead('book', 'Where everyone lands')}
        <p class="sec-sub">Each row is a team, each column a final seed. Darker blue means she finishes there more often. Seeds left of the dashed line make the playoffs.</p>
        <div class="std-card table-scroll">
          <table class="std heat po-heat" aria-label="Share of simulated seasons each team finishes at each seed">
            <thead><tr><th>Team</th>${seeds.map((k) => `<th style="text-align:center">${k}</th>${k === cut && cut < n ? '<th class="po-sep" aria-hidden="true"></th>' : ''}`).join('')}</tr></thead>
            <tbody>${P.teams.map((t) => `
              <tr>
                <td class="mgr"><a href="#team-${t.team_id}">${esc(nameOf(t.team_id))}</a></td>
                ${t.seed_dist.map((p, k) => `<td class="cell" style="${shade(p)}" title="${esc(nameOf(t.team_id))}: seed ${k + 1} in ${pct(p, done)} of simulations">${p > 0 ? pct(p, done) : ''}</td>${k + 1 === cut && cut < n ? '<td class="po-sep" aria-hidden="true"></td>' : ''}`).join('')}
              </tr>`).join('')}
            </tbody>
          </table>
          <div class="heat-legend"><span>Never</span><span class="ramp" aria-hidden="true"></span><span>Often</span></div>
        </div>
      </section>`;
  }

  /* "Ja'Marr Chase 🐯 Q ● Q3 7:22": on a live week the name carries his NFL team logo,
     ESPN's injury designation if it has one, and, while that team's game is being played,
     the game clock. ESPN can 404 a logo (a team we can't name, a free agent), so a broken
     one removes itself. Shared by the box scores and the Coach page's next-week lineup. */
  const playerName = (p, live) => esc(p.name)
    + (live && p.logo ? ` <img class="tlogo" src="${esc(p.logo)}" alt="${esc(p.team || '')}" title="${esc(p.team || '')}" width="19" height="19" loading="lazy" onerror="this.remove()">` : '')
    + (p.injury ? ` <span class="inj${OUTISH.includes(p.injury) ? ' out' : ''}" title="ESPN's injury report">${esc(p.injury)}</span>` : '')
    + (p.playing ? ` <span class="playing" title="His game is on right now"><span class="live-dot" aria-hidden="true"></span>${esc(p.playing)}</span>` : '');

  /* Player cards (the Coach page's two lineups): `cards` maps an ESPN player id to the
     blurb, scoring breakdown and notes site/build.py computed for him. Which rows are
     open is kept in PEEK rather than in the DOM, because the live refresh re-renders the
     whole page every 20 seconds and nobody wants a card snapping shut mid-read. */
  const PEEK = new Set();
  const peekId = (key, p) => `peek-${key}-${p.player_id}`;

  // The name cell: a disclosure button where there's a card for him, plain text otherwise.
  const peekName = (p, card, id, live) => (card
    ? `<button class="peek" type="button" data-peek="${p.player_id}" aria-expanded="${PEEK.has(p.player_id) ? 'true' : 'false'}" aria-controls="${id}"><span class="peek-name">${playerName(p, live)}</span><span class="chev" aria-hidden="true"></span></button>`
    : playerName(p, live));

  // The row underneath it, which holds the card itself. `cols` is the table's width: the
  // box-score lineup has four columns, the next-week lineup three.
  const peekRow = (p, card, id, cols) => (card
    ? `<tr class="peek-row" id="${id}"${PEEK.has(p.player_id) ? '' : ' hidden'}><td colspan="${cols}">${peekPanel(p, card)}</td></tr>`
    : '');

  // Where the points came from and what else is worth knowing; the blurb is drawn by the caller.
  function peekDetail(p, card) {
    const lines = card.lines || [];
    return `
        ${lines.length ? `
        <table class="peek-lines">
          <caption>Where the points came from</caption>
          <tbody>${lines.map((l) => `
            <tr><th scope="row">${esc(l.label)}</th><td class="val">${esc(l.value) || ''}</td><td>${l.points ? f2(l.points) : '—'}</td></tr>`).join('')}
          </tbody>
          <tfoot><tr><th scope="row">Total</th><td class="val"></td><td>${f2(p.points)}</td></tr></tfoot>
        </table>` : p.points > 0.005 ? `<p class="peek-none">ESPN hasn't broken these ${f2(p.points)} points down yet.</p>` : ''}
        ${(card.notes || []).length ? `<ul class="peek-notes">${card.notes.map((n) => `<li>${esc(voice(n))}</li>`).join('')}</ul>` : ''}`;
  }

  function peekPanel(p, card) {
    return `
      <div class="peek-body">
        <p class="peek-blurb">${esc(card.blurb)}</p>${peekDetail(p, card)}
      </div>`;
  }

  function lineupCard(side, won, live, badge, cards) {
    // A bench player is "hot" if he outscored a starter he could have replaced
    const floor = (p) => {
      const ok = { QB: ['QB'], RB: ['RB', 'FLEX'], WR: ['WR', 'FLEX'], TE: ['TE', 'FLEX'], DST: ['DST'], K: ['K'] }[p.pos] || [];
      const c = side.starters.filter((s) => ok.includes(s.slot));
      return c.length ? Math.min(...c.map((s) => s.points)) : Infinity;
    };
    const starters = [...side.starters].sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
    const bench = [...side.bench].sort((a, b) => b.points - a.points);
    const nameCell = (p) => playerName(p, live);
    const row = (p, cls, slot) => {
      const card = cards && p.player_id != null ? cards[p.player_id] : null;
      const id = peekId(side.team_id, p);
      return `<tr class="${cls}${card && PEEK.has(p.player_id) ? ' peek-open' : ''}"><td class="slot">${esc(slot)}</td><td>${peekName(p, card, id, live)}</td><td class="r">${f2(p.points)}</td><td class="r proj">${f1(p.projected)}</td></tr>`
        + peekRow(p, card, id, 4);
    };
    return `
      <div class="lineup">
        <h3><span>${mgrLink(side.manager)}</span><span class="num">${f2(side.points)} ${badge || `<span class="res ${won ? 'W' : 'L'}">${won ? 'W' : 'L'}</span>`}</span></h3>
        <table>
          <thead><tr><th>Slot</th><th>Player</th><th class="r">Pts</th><th class="r">Proj</th></tr></thead>
          <tbody>
            ${starters.map((p) => row(p, 'starter', p.slot)).join('')}
            <tr class="bench-head"><td colspan="4">Bench</td></tr>
            ${bench.map((p) => row(p, `bench${p.points > floor(p) + 0.005 ? ' hot' : ''}`, p.slot === 'IR' ? 'IR' : 'BN')).join('')}
          </tbody>
        </table>
        <div class="opt">Best possible lineup <b class="num">${f2(side.optimal)}</b> · ${side.points_left > 0.005 ? `<b class="num">${f2(side.points_left)}</b> left on the bench` : 'perfect lineup'}</div>
      </div>`;
  }

  /* Top, middle and bottom score: the same three stickers on the recap page and the live
     page, each carrying the rank it landed on. */
  const ORD = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; };
  const medal = (ranks) => `<span class="medal">${ranks.join('–')}<span class="ord">${ORD(ranks[ranks.length - 1])}</span></span>`;

  function scorePills(w) {
    const sofar = w.complete ? '' : ' so far';
    const mid = (w.mid_pack && w.mid_pack.teams.length) ? w.mid_pack : { teams: [], points: w.median };
    // With an even league nobody scores the middle score exactly, so the sticker shows the
    // score itself; with an odd one it belongs to a real team, so that team gets named.
    const midBody = mid.teams.length === 1
      ? `${esc(mid.teams[0].manager)} <span class="num">${f2(mid.teams[0].points)}</span>`
      : `<span class="num">${f2(mid.points)}</span>`;
    const midTip = mid.teams.length > 1
      ? `Halfway between ${mid.teams.map((t) => `${t.manager} ${f2(t.points)}`).join(' and ')}, the middle two scores of the week: half the league finished above, half below.`
      : 'The middle score of the week: half the league finished above it, half below.';
    // The middle score belongs to no single team in an even league, so it carries no rank medallion.
    const pill = (cls, ranks, label, body, tip) =>
      `<span class="pill ${cls}${ranks.length ? '' : ' pill-plain'}" title="${esc(tip)}">${ranks.length ? medal(ranks) : ''}<span class="txt">${label}<b>${body}</b></span></span>`;
    return `
      <div class="pills">
        ${pill('pill-top', [w.high_score.score_rank], `Top score${sofar}`,
               `${esc(w.high_score.manager)} <span class="num">${f2(w.high_score.points)}</span>`,
               "The week's highest team score.")}
        ${pill('pill-mid', [], 'Middle score', midBody, midTip)}
        ${pill('pill-bot', [w.low_score.score_rank], `Bottom score${sofar}`,
               `${esc(w.low_score.manager)} <span class="num">${f2(w.low_score.points)}</span>`,
               "The week's lowest team score.")}
      </div>`;
  }

  /* ---------- recap page (#week-N) pieces ---------- */
  // What the page remembers while it's redrawn (the live refresh re-routes now and then):
  // which game is open, which award filter is on, which glossary term is expanded.
  const RP = { week: null, game: null, filter: 'all', term: null, me: undefined };
  const rpState = (w) => {
    if (RP.week !== w.week) Object.assign(RP, { week: w.week, game: null, filter: 'all', term: null });
    return RP;
  };

  // Where a team stood after the week being viewed (rank and record as of then), falling back
  // to the latest standings for the live week or a team with no history for it.
  function standAt(id, w) {
    const t = TEAMS[id];
    if (!t) return '';
    const hist = (t.rank_history || []).find((r) => r.week === w.week);
    const played = (t.weekly || []).filter((g) => g.week <= w.week);
    if (hist && played.length) {
      const n = (r) => played.filter((g) => g.result === r).length;
      return `${ordinal(hist.rank)} · ${n('W')}–${n('L')}${n('T') ? `–${n('T')}` : ''}`;
    }
    return `${ordinal(SEASON.standings.indexOf(t) + 1)} · ${record(t)}`;
  }

  // The winner's share of the two scores, as a percent for the tug bar and the tape.
  const shareOf = (g) => {
    const a = Math.max(g.winner.points, 0), b = Math.max(g.loser.points, 0);
    return a + b > 0 ? (a / (a + b) * 100).toFixed(1) : '50.0';
  };

  // Every team's score, winner then loser per game, looped twice so the marquee never gaps.
  function rpTicker(w) {
    const items = w.games.flatMap((g) => [g.winner, g.loser])
      .map((s) => `<span class="tk">${esc(s.manager)} <span class="num">${f2(s.points)}</span></span>`).join('');
    return `<div class="rp-ticker" aria-hidden="true"><div class="ticker-track">${items}${items}</div></div>`;
  }

  // A collapsed game: winner left, loser right, a tug bar underneath. It's a button that picks
  // which tape card is open below; the box score itself is the link inside the tape.
  const isMyGame = (g) => { const me = myTeam.get(); return !!me && (g.winner.team_id === me || g.loser.team_id === me); };
  function gameCard(g, w, on) {
    const mine = isMyGame(g);
    return `
      <button type="button" class="gb${on ? ' sel' : ''}${mine ? ' mine' : ''}" data-rp-game="${esc(g.key)}" aria-pressed="${on}" aria-controls="rp-tape-${esc(g.key)}">
        ${mine ? '<span class="gb-you">Your game</span>' : ''}
        <span class="gb-split">${[['win', g.winner, 'W'], ['lose', g.loser, 'L']].map(([cls, s, r]) => {
          const badge = w.complete ? `<span class="wl ${r}">${r}</span>` : '';
          return `
          <span class="gb-row ${cls}">
            <span class="gb-who"><span class="gb-mgr">${esc(s.manager)}</span><span class="gb-team">${esc(s.team_name)}</span><span class="gb-stand">${standAt(s.team_id, w)}</span></span>
            <span class="gb-score">${cls === 'win' ? `${f2(s.points)}${badge}` : `${badge}${f2(s.points)}`}</span>
          </span>`;
        }).join('')}</span>
        <span class="tug" aria-hidden="true"><span class="a" style="width:${shareOf(g)}%"></span><span class="b"></span></span>
        ${w.live && !w.complete ? liveStrip(g) : ''}
      </button>`;
  }

  // The open game: both managers, a bar split by points, then the blurb and the box score link.
  function tapeCard(g, w, on) {
    return `
      <article class="tape" id="rp-tape-${esc(g.key)}"${on ? '' : ' hidden'}>
        <div class="tape-top">
          <div class="tp win"><span class="tp-m">${esc(g.winner.manager)}</span><span class="tp-t">${esc(g.winner.team_name)}</span></div>
          <div class="tp lose"><span class="tp-m">${esc(g.loser.manager)}</span><span class="tp-t">${esc(g.loser.team_name)}</span></div>
        </div>
        <div class="tape-bar" role="img" aria-label="${esc(g.winner.manager)} ${f2(g.winner.points)}, ${esc(g.loser.manager)} ${f2(g.loser.points)}"><span class="tw" style="width:${shareOf(g)}%"><span class="tn">${f2(g.winner.points)}</span></span><span class="tl"><span class="tn">${f2(g.loser.points)}</span></span></div>
        <div class="tape-quote">
          ${g.blurb ? `<span class="qm" aria-hidden="true">&ldquo;</span><p class="blurb">${esc(g.blurb)}</p>` : ''}
          <a class="open${isMyGame(g) ? ' mine' : ''}" href="${base(w)}.game-${g.key}">${w.live ? (isMyGame(g) ? 'Your live box score →' : 'Live box score →') : (isMyGame(g) ? 'Your box score and lineup calls →' : 'Box score and lineup calls →')}</a>
        </div>
      </article>`;
  }

  // The sticker on each award card: two stroke paths on a 24px grid, in award order within
  // its kind (it wraps if a week ever has more awards than icons).
  const AWARD_ICONS = {
    game_balls: [
      ['M8 4h8v5a4 4 0 0 1-8 0V4z', 'M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4'], // trophy
      ['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 12h.01'], // target
      ['M4 20C4 11 11 4 20 4c0 9-7 16-16 16z', 'M9 15l6-6M10.5 10.5l1.5 1.5M12.5 12.5l1.5 1.5'], // football
    ],
    flags: [
      ['M5 21V4', 'M5 4h12l-2 4 2 4H5'], // flag
      ['M3 17h18M6 17v3M18 17v3', 'M5 17v-4h14v4M8 13V9h8v4'], // bench
    ],
    tough_breaks: [
      ['M13 2L4 14h7l-1 8 9-12h-7l1-8z', 'M13 2'], // lightning bolt
      ['M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5', 'M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5'], // redo arrows
      ['M3 7l6 6 4-4 8 8', 'M15 17h6v-6'], // falling trend line
    ],
  };

  // Award card: a band with the player's photo sticker, the title label and an emoji sticker
  // pinned to the label's corner. An award with no photo shows its emoji as the sticker art
  // (corner sticker dropped); one with neither falls back to the AWARD_ICONS icon. Old weeks
  // carry none of the optional fields, so every read is guarded.
  const AWC_ICON = (kind, i) => {
    const icons = AWARD_ICONS[kind], [d1, d2] = icons[i % icons.length];
    return `<svg class="awc-ico" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d1}"/><path d="${d2}"/></svg>`;
  };
  // The animated background, per kind (CSS above). `n` is the card's position and only shifts the
  // (negative) delays, so neighbouring cards don't pulse in step. Nothing here is read by a screen reader.
  const AWC_FLAMES = [[4, 46, 0, 3.6], [13, 34, -1.2, 4.2], [22, 52, -2.4, 3.8], [31, 38, -0.6, 4.6], [40, 48, -3.0, 3.4], [49, 36, -1.8, 4.4],
    [58, 54, -0.3, 3.9], [67, 40, -2.7, 4.1], [76, 46, -1.4, 3.7], [85, 34, -3.3, 4.5], [93, 44, -0.9, 4.0], [18, 30, -3.6, 4.8],
    [62, 30, -2.1, 4.7], [36, 56, -1.0, 3.5]];
  function awcFloaters(kind, n) {
    const off = n * 0.7;
    if (kind === 'game_balls') {
      return AWC_FLAMES.map(([x, fs, dl, d]) => `<span class="awc-ft" aria-hidden="true" style="--x:${x}%;--fs:${fs}px;--dl:${(dl - off).toFixed(1)}s;--d:${d}s">🔥</span>`).join('');
    }
    if (kind === 'flags') {
      return Array.from({ length: 9 }, (_, j) => `<span class="awc-fl" aria-hidden="true" style="--y:${(j * 11 + 4) % 68}%;--fs:${34 + (j % 3) * 10}px;--d:${(5.2 + (j % 3) * 1.2).toFixed(1)}s;--dl:${(-(j * 1.3) - off).toFixed(1)}s">${['🚩', '🚩', '💨'][j % 3]}</span>`).join('');
    }
    return `<div class="awc-zc" aria-hidden="true"><span class="awc-ring"></span><span class="awc-ring" style="animation-delay:-1s"></span><span class="awc-bowl">🌀</span><span class="awc-sp" style="animation-delay:${(-off).toFixed(1)}s">💩</span><span class="awc-toilet">🚽</span></div>`;
  }
  function awardCard(c, kind, i = 0, mine = false) {
    const k = KIND[kind];
    const emoji = c.emoji ? esc(c.emoji) : '';
    const photo = c.headshot || (c.player_id ? HEADSHOT_URL(c.player_id) : '');
    const art = emoji ? `<span class="awc-emo" aria-hidden="true">${emoji}</span>` : AWC_ICON(kind, i);
    // A photo that fails to load swaps in the emoji art and drops the corner sticker.
    const sticker = photo
      ? `<div class="awc-sin" data-art="${esc(art)}"><img src="${esc(photo)}" alt="" loading="lazy" onerror="var s=this.parentNode;s.innerHTML=s.dataset.art;s.closest('.awc-band').classList.add('nophoto')"></div>`
      : `<div class="awc-sin">${art}</div>`;
    return `
      <article class="awc ${k.cls}${mine ? ' me' : ''}">
        <div class="awc-band${kind === 'game_balls' ? ' fire' : kind === 'tough_breaks' ? ' flush' : ''}${photo ? '' : ' nophoto'}">${awcFloaters(kind, i)}<div class="awc-stk">${sticker}</div><div class="awc-ttl">${esc(c.title)}${photo && emoji ? `<span class="awc-tb" aria-hidden="true">${emoji}</span>` : ''}</div></div>
        <div class="awc-body"><div class="awc-who"><b>${mgrLink(c.manager)}</b>${mine ? '<span class="awc-you">you</span>' : ''}${c.stat ? `<span class="awc-stat">${esc(c.stat)}</span>` : ''}</div><p>${esc(c.text)}</p></div>
      </article>`;
  }
  // The viewer's own awards lead each kind (stable, so everyone else keeps the recap's order). The card's
  // index stays its original one, so its fallback icon and animation don't change when it moves.
  const awardGrid = (cards, kind) => {
    const me = myTeam.get();
    const rows = cards.map((c, i) => [c, i, !!me && teamIdByManager[c.manager] === me]);
    rows.sort((a, b) => b[2] - a[2] || a[1] - b[1]);
    return `<div class="awc-grid${cards.length === 3 ? ' n3' : ''}">${rows.map(([c, i, mine]) => awardCard(c, kind, i, mine)).join('')}</div>`;
  };
  // Kinds in order, each with a tilted badge and a card count. `rp` marks the recap page's groups
  // so its filter chips can hide them.
  const awardGroups = (w, { rp = false, filter = 'all' } = {}) => `<div class="awc-list">${AWARD_KINDS.filter((k) => w[k].length).map((k) => `
    <section class="awc-grp ${KIND[k].cls}${rp ? ' rp-grp' : ''}"${rp ? ` data-rp-kind="${k}"${filter === 'all' || filter === k ? '' : ' hidden'}` : ''}>
      <div class="awc-gh"><h3 class="awc-gb">${KIND[k].title}</h3><span class="awc-cnt">${w[k].length} ${w[k].length === 1 ? 'card' : 'cards'}</span></div>
      <p class="awc-sub">${KIND[k].sub}</p>
      ${awardGrid(w[k], k)}
    </section>`).join('')}</div>`;
  const awardsEmpty = () => `<div class="awc-empty"><div class="st" aria-hidden="true">📭</div><div><h3>No awards yet</h3><p>Game balls, flags and tough breaks land with the Tuesday recap. Nobody has earned a card, or earned a flag, yet.</p></div></div>`;

  // The compact standings as a sticker card: rank, move, team, record, and a bar for points scored.
  function rpStandings(rows) {
    const max = Math.max(...rows.map((t) => t.points_for), 1);
    return `
      <div class="rp-std-card"><div class="table-scroll"><table class="rp-std">
        <thead><tr><th></th><th title="Places gained or lost in the standings after the latest week">Move</th><th>Team</th><th class="r">Record</th><th class="r c5" title="Total points scored this season">Scored</th></tr></thead>
        <tbody>${rows.map((t, i) => `
          <tr class="${i === 0 ? 'top' : ''}${t.team_id === myTeam.get() ? ' me' : ''}">
            <td class="rk">${i + 1}</td>
            <td>${rankMove(t.rank_move)}</td>
            <td><span class="tm"><span class="st-who"><a class="st-team" href="#team-${t.team_id}">${esc(t.manager)}</a>${t.team_id === myTeam.get() ? '<span class="you-tag">you</span>' : ''}</span><span class="tn">${esc(t.team_name)}</span></span></td>
            <td class="r rec">${record(t)}</td>
            <td class="r c5"><span class="sc"><span class="v">${f2(t.points_for)}</span><span class="bar"><i style="width:${(t.points_for / max * 100).toFixed(1)}%;animation-delay:${(0.15 + i * 0.07).toFixed(2)}s"></i></span></span></td>
          </tr>`).join('')}
        </tbody>
      </table></div></div>`;
  }

  // A glossary term as an expanding card. The wording is the recap's own, untouched.
  const rpTerm = (g, i, open) => `
    <div class="rp-term${open ? ' open' : ''}">
      <button type="button" class="rp-term-btn" data-rp-term="${i}" aria-expanded="${open}" aria-controls="rp-term-${i}"><span class="tt">${esc(g.term)}</span><span class="plus" aria-hidden="true"></span></button>
      <div class="rp-term-body" id="rp-term-${i}"><div><p>${esc(g.definition)}</p></div></div>
    </div>`;

  /* ---------- pages ---------- */
  function weekPage(w) {
    const kinds = AWARD_KINDS.filter((k) => w[k].length);
    const nAwards = kinds.reduce((n, k) => n + w[k].length, 0);
    const st = rpState(w);
    // Picking (or changing) who is viewing resets the open game to theirs; a tap on another game sticks until then.
    const me = myTeam.get();
    if (st.me !== me) { st.me = me; st.game = null; }
    const mineKey = (w.games.find(isMyGame) || {}).key;
    const open = w.games.some((g) => g.key === st.game) ? st.game : (mineKey || (w.games[0] || {}).key);
    const filter = st.filter === 'all' || kinds.includes(st.filter) ? st.filter : 'all';
    const term = st.term == null ? 0 : st.term;
    return `
      ${LIVE ? `<a class="live-banner" href="#live"><span>${deadZone() ? '' : '<span class="live-dot" aria-hidden="true"></span>'}${deadZone() ? `Week ${LIVE.week}: scores, coach cards and who's up next` : liveLabel(LIVE)}</span><span class="go">${deadZone() ? 'Take a look →' : (LIVE.complete ? 'Final scores →' : 'Live scores →')}</span></a>` : ''}
      ${weekSwitch(w)}
      ${draftBanner(w)}
      <div class="rp">
      <header class="rp-hero">
        <div class="rp-big" aria-hidden="true">${w.week}</div>
        <div class="rp-hero-in">
          <div class="kicker rp-rv d1"><i aria-hidden="true"></i>Week ${w.week} recap${w.complete ? ' · final' : ' (in progress)'}</div>
          <h1 class="rp-rv d2">${esc(w.headline || `Week ${w.week}`)}</h1>
          ${w.dek ? `<p class="dek rp-rv d3">${esc(w.dek)}</p>` : ''}
          <div class="rp-rv d4">${scorePills(w)}</div>
        </div>
      </header>
      ${rpTicker(w)}

      <section>
        ${secHead('board', 'Scoreboard')}
        <p class="sec-sub">Tap a game for the full box score and the lineup decisions that settled it.</p>
        <div class="rp-sb">
          <div class="game-list">${w.games.map((g) => gameCard(g, w, g.key === open)).join('')}</div>
          <div class="rp-tapes" aria-live="polite">${w.games.map((g) => tapeCard(g, w, g.key === open)).join('')}</div>
        </div>
      </section>

      ${kinds.length ? `
      <section class="rp-aw">
        ${secHead('ball', 'The awards', `<a class="more" href="#week-${w.week}.awards">All ${nAwards} awards →</a>`)}
        <div class="rp-filters" role="group" aria-label="Filter awards">
          ${[['all', `All ${nAwards} awards`], ...kinds.map((k) => [k, KIND[k].title])].map(([k, label]) =>
            `<button type="button" class="chip${k === filter ? ' sel' : ''}" data-rp-filter="${k}" aria-pressed="${k === filter}">${label}</button>`).join('')}
        </div>
        ${awardGroups(w, { rp: true, filter })}
      </section>` : ''}

      <section>
        <div class="rp-two">
          <div>
            ${secHead('board', 'Standings', '<a class="more" href="#standings">Full standings →</a>')}
            <p class="sec-sub">Final standings through Week ${latest().week}. Only finished, recapped weeks count${LIVE ? `, so Week ${LIVE.week} joins after its recap` : ''}.</p>
            ${rpStandings(SEASON.standings)}
          </div>
          <div>
            ${secHead('ball', 'Top scorers')}
            <p class="sec-sub">The five best starters in the league in Week ${w.week}.</p>
            ${leaderList(w.top_performers, '', true)}
            ${lowlights(w, true, true)}
          </div>
        </div>
      </section>

      ${w.glossary.length ? `
      <section>
        ${secHead('book', `New words from Week ${w.week}`, '<a class="more" href="#glossary">Full glossary →</a>')}
        <div class="rp-terms">${w.glossary.map((g, i) => rpTerm(g, i, i === term)).join('')}</div>
      </section>` : ''}
      </div>`;
  }

  /* ---------- the Live scoreboard while games are on: your game, then the rest of the league ----------
     The logic (who is on the left, the verdicts, the movement between refreshes) is in site/live/live.js;
     this is the markup. Sides never swap: the payload's winner/loser order is only used for the score. */
  let liveMove = null; // liveMovement()'s last result; refreshLive() advances it, so a tag lives for one refresh
  const liveDelta = (id) => { const d = liveMove && liveMove.delta.get(id); return d ? `<span class="lv-delta">+${f2(d)}</span>` : ''; };
  const livePlaying = (s) => (s.starters || []).filter((p) => p.playing);
  // Is any starter in the league on the field right now? One answer for the kicker, the dek and
  // livePace(), so the page never describes a refresh rate the timer isn't using.
  const liveAnyPlaying = (w) => (w.games || []).some((g) => ((g.winner || {}).playing_now || 0) + ((g.loser || {}).playing_now || 0) > 0);

  function liveMeter(s, rem, scale, cls) {
    const w = (n) => `${Math.max(Math.min(n / scale * 100, 100), 0).toFixed(1)}%`;
    return `<div class="lv-meter-row"><span class="nm">${esc(s.manager)}</span>
      <div class="lv-meter" role="img" aria-label="${esc(s.manager)}: ${f2(s.points)} scored, ${f1(rem)} projected still to come"><i class="so ${cls}" style="width:${w(s.points)}"></i><i class="to" style="width:${w(rem)}"></i></div>
      <span class="num">${f2(s.points)} +${f1(rem)}</span></div>`;
  }

  function liveHeroCard(w) {
    const me = myTeam.get();
    const { game, picked } = liveHero(w.games, me);
    if (!game) return '';
    const [a, b] = liveSides(game, picked ? me : null);
    const lead = liveLeader(game), leader = lead === a.team_id ? a : lead === b.team_id ? b : null;
    const flipped = !!(liveMove && liveMove.flip.has(game.key));
    const chance = liveChance(a, b);
    const onField = [...livePlaying(a).map((p) => [p, a]), ...livePlaying(b).map((p) => [p, b])];
    const ra = liveRemaining(a), rb = liveRemaining(b);
    const next = onField.length ? null : liveNextKickoff([...(a.starters || []), ...(b.starters || [])], Date.now());
    const boxHref = `${base(w)}.game-${game.key}`;
    const side = (s, cls) => `
      <div class="lv-side ${cls}">
        <div class="mgr">${esc(s.manager)}</div><div class="team">${esc(s.team_name)}</div>
        <div class="lv-score num ${lead === s.team_id ? 'lead' : ''}">${cls === 'r' ? liveDelta(s.team_id) : ''}${f2(s.points)}${cls === 'r' ? '' : liveDelta(s.team_id)}</div>
      </div>`;
    return `
      <section class="lv-hero-wrap" aria-labelledby="lv-hero-h">
        <div class="sec-head"><span class="marker ball" aria-hidden="true"></span><h2 id="lv-hero-h">${picked ? 'Your game' : 'Closest game'}</h2><div class="rule"></div></div>
        <div class="lv-hero">
          <div class="lv-top"><span>${picked ? `Viewing as ${esc(a.manager)}` : 'Closest to a coin flip'}</span><span class="lv-tag ${picked ? '' : 'pick'}">${picked ? (onField.length ? 'Live' : 'Between games') : 'Not your team'}</span></div>
          <div class="lv-versus" aria-live="polite">${side(a, 'l')}<div class="lv-vs" aria-hidden="true">vs</div>${side(b, 'r')}</div>
          <div class="lv-leadline">
            <span>${leader ? `<b>${esc(leader.manager)}</b> leads by <b>${f2(liveGap(game))}</b>` : `Tied at <b>${f2(a.points)}</b>`}</span>
            ${flipped ? '<span class="lv-sticker">Lead changed</span>' : ''}
            ${a.live_projection != null && b.live_projection != null ? `<span class="lv-hint">Projected ${esc(a.manager)} ${f1(a.live_projection)}, ${esc(b.manager)} ${f1(b.live_projection)}</span>` : ''}
          </div>
          ${chance == null ? '' : `
          <div class="lv-prob" role="img" aria-label="Chance to win: ${esc(a.manager)} ${Math.round(chance * 100)}%, ${esc(b.manager)} ${Math.round((1 - chance) * 100)}%"><span class="a" style="flex:${chance.toFixed(3)}"></span><span class="b" style="flex:${(1 - chance).toFixed(3)}"></span></div>
          <div class="lv-prob-lab"><span>${esc(a.manager)} ${Math.round(chance * 100)}% to win</span><span>${esc(b.manager)} ${Math.round((1 - chance) * 100)}%</span></div>`}
          ${ra == null || rb == null ? '' : `
          <div class="lv-come">
            <h3>Still to come</h3>
            ${(() => { const scale = Math.max(a.points + ra, b.points + rb, 1); return liveMeter(a, ra, scale, '') + liveMeter(b, rb, scale, 'o'); })()}
            <p class="lv-hint">Solid is points scored. Hatched is ESPN's projection for the starters still to play.</p>
          </div>`}
          <div class="lv-field">
            <h3>${next ? 'Up next' : 'On the field right now'}</h3>
            ${onField.length
              ? `<div class="lv-chips">${onField.map(([p, s]) => `<a class="lv-chip" href="${boxHref}" title="Open the live box score"><span class="live-dot" aria-hidden="true"></span>${esc(p.name)} <span class="clk">${esc(p.playing)}</span><span class="own">${esc(s.manager)}</span></a>`).join('')}</div>`
              : next ? `<div>Next kickoff <b>${esc(kickoffText(next))}</b></div>` : '<div class="lv-nobody">Nobody is on the field right now.</div>'}
            <p class="lv-hint">${[a, b].map((s) => `${esc(s.manager)}: ${s.playing_now || 0} playing, ${s.yet_to_play || 0} yet to play.`).join(' ')}</p>
          </div>
          <div class="lv-actions">
            <a class="lv-go" href="${boxHref}">Live box score <span aria-hidden="true">→</span></a>
            ${picked ? `<a class="lv-coach" href="${coachHref()}">Your Coach report <span aria-hidden="true">→</span></a>` : ''}
          </div>
          ${picked ? '' : `<div class="lv-pickbox"><span>Pick your team and your game goes first, every time.</span><button class="lv-btn" type="button" data-ask-team>Pick your team</button></div>`}
        </div>
      </section>`;
  }

  // A game that isn't yours: the verdict on top, the score row, a bar split by points scored.
  function liveCard(g, w) {
    const [a, b] = liveSides(g);
    const lead = liveLeader(g), leader = lead === a.team_id ? a : lead === b.team_id ? b : null;
    const v = liveVerdict(liveChance(a, b));
    const total = a.points + b.points, aw = total > 0 ? a.points / total * 100 : 50;
    const playing = (a.playing_now || 0) + (b.playing_now || 0);
    const flipped = !!(liveMove && liveMove.flip.has(g.key));
    return `
      <a class="lv-card" href="${base(w)}.game-${g.key}" aria-label="${esc(a.manager)} ${f2(a.points)}, ${esc(b.manager)} ${f2(b.points)}. ${leader ? `${esc(leader.manager)} leads by ${f1(liveGap(g))}. ` : 'Tied. '}${v ? `${v.label}, ${v.percent}% ${esc((v.favorite === 'left' ? a : b).manager)}. ` : ''}${flipped ? 'Lead changed. ' : ''}Open live box score">
        ${v ? `<div class="lv-card-head"><span class="lv-verdict ${v.tone}">${v.label}</span><span class="lv-pct">${v.percent}% ${esc((v.favorite === 'left' ? a : b).manager)}</span></div>` : ''}
        <div class="lv-top2">
          <div class="lv-s"><div class="m">${esc(a.manager)}</div><div class="lv-sc num ${lead === a.team_id ? 'lead' : ''}">${f1(a.points)}${liveDelta(a.team_id)}</div></div>
          <div class="lv-s r"><div class="m">${esc(b.manager)}</div><div class="lv-sc num ${lead === b.team_id ? 'lead' : ''}">${liveDelta(b.team_id)}${f1(b.points)}</div></div>
        </div>
        <div class="lv-tug" role="img" aria-label="Share of points: ${esc(a.manager)} ${f1(a.points)}, ${esc(b.manager)} ${f1(b.points)}"><i class="l" style="width:${aw.toFixed(1)}%"></i><i class="r" style="width:${(100 - aw).toFixed(1)}%"></i><b class="mid"></b></div>
        <div class="lv-foot"><span>${leader ? `<b>${esc(leader.manager)}</b> leads by ${f1(liveGap(g))}` : 'Tied'}${flipped ? ' <span class="lv-sticker">Lead changed</span>' : ''}</span><span>${playing ? `<span class="live-dot" aria-hidden="true"></span>${playing} playing now` : 'No one on the field'}</span></div>
      </a>`;
  }

  function liveBoard(w) {
    const hero = liveHero(w.games, myTeam.get()).game;
    const rest = hero ? liveClosest(w.games.filter((g) => g !== hero)) : [];
    // Your game on the left and the rest of the league stacked on the right once there's room (live.css);
    // on a phone it's one column. The three score stickers sit below the board, not in the page head.
    return `
      <div class="lv-grid">
        ${liveHeroCard(w)}
        ${rest.length ? `<section>
          ${secHead('flag', 'Rest of the league')}
          <p class="sec-sub">Win chances are ESPN's. The bar is each side's share of the points scored so far. Closest game first, and the sides stay put when the lead changes. Tap a game for the live box score.</p>
          <div class="lv-games">${rest.map((g) => liveCard(g, w)).join('')}</div>
        </section>` : ''}
      </div>
      <section class="lv-extremes">
        ${secHead('board', 'Score extremes so far')}
        ${scorePills(w)}
      </section>`;
  }

  function livePage(w) {
    const fmtDate = (iso) => new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const anyPlaying = liveAnyPlaying(w);
    // With a team picked, the hero already carries "Your Coach report", so the banner is for readers who haven't picked.
    const showBanner = w.advice && (w.complete || !liveHero(w.games, myTeam.get()).picked);
    return `
      <div class="page-head">
        <div class="kicker">Week ${w.week} · ${w.complete ? 'final' : anyPlaying ? 'live' : 'between games'}</div>
        ${w.complete ? `<div class="head-row">
          <h1>Final scores</h1>
          ${scorePills(w)}
        </div>` : '<h1>Live scoreboard</h1>'}
        <p class="dek">${liveLabel(w)} ${!w.complete && liveStale(w.captured_at, Date.now(), window.FANTASY_LIVE_API) ? `<span class="lv-stale">Updated ${updated(w.captured_at)}, a few minutes behind</span>.` : `Updated ${updated(w.captured_at)}.`} ${window.FANTASY_LIVE_API ? `Scores refresh about every ${w.complete || !anyPlaying ? 'minute' : `${LIVE_PLAYING / 1000} seconds`}${w.complete ? '' : anyPlaying ? ' while games are on' : ', and nothing is on the field right now'}.` : `Scores refresh once a day${w.complete ? '' : ', so the real-time numbers are on ESPN'}.`}</p>
      </div>

      ${showBanner ? `<a class="live-banner" href="${coachHref()}"><span>Want to know what to do about it? <b>Coach</b> has every team's swaps, injuries and empty slots for Week ${leadWithNext() ? ahead().week : w.week}.</span><span class="go">Open Coach →</span></a>` : ''}

      ${w.complete ? `<section>
        ${secHead('board', 'Scoreboard')}
        <p class="sec-sub">Tap a game for the box score.</p>
        <div class="games">${w.games.map((g) => scoreBox(g, w)).join('')}</div>
      </section>` : liveBoard(w)}

      <section>
        <div class="two-col">
          <div>
            ${secHead('ball', w.complete ? 'Top scorers' : 'Top scorers so far')}
            ${leaderList(w.top_performers)}
            ${lowlights(w, false)}
          </div>
          <div>
            ${secHead('flag', 'On the wire this week')}
            <p class="sec-sub">Waiver pickups, free-agent adds and drops.</p>
            ${w.moves.length ? `<ul class="moves">${w.moves.map((m) => `
              <li><span class="when">${fmtDate(m.date)}</span>
                <span><b>${mgrLink(m.manager)}</b></span>
                <span>${m.added.length ? `<span class="add">+ ${m.added.map(esc).join(', ')}</span>` : ''}${m.added.length && m.dropped.length ? ' · ' : ''}${m.dropped.length ? `<span class="drop">− ${m.dropped.map(esc).join(', ')}</span>` : ''}</span>
              </li>`).join('')}</ul>` : '<p class="sec-sub">No moves yet this week.</p>'}
          </div>
        </div>
      </section>
      <p class="sec-sub" style="margin-top:28px">Standings only count finished weeks, so this week shows up there once the recap drops Tuesday.</p>`;
  }

  /* The midweek landing page: what "Live" turns into once nothing's actually on the field
     (see deadZone() above). It leads with the week in a few stickers, storylines read
     straight off the numbers so the page has something to say before Tuesday's recap does,
     then the scores, then one way into Coach (which has every team's full list). */
  const STICKER_COUNT = ['no', 'one', 'two', 'three', 'four'];
  const sticker = (x) => `
    <article class="story ${x.tone}">
      <span class="tag">${esc(x.label)}</span>
      <div class="fig num">${esc(x.fig)}</div>
      <p>${esc(x.text)}</p>
    </article>`;

  // The pre-kickoff card: {tone, label, fig, unit, name, sub}. Escaped here, once.
  const scoreCard = (x) => `
    <article class="story sc ${x.tone}">
      <span class="tag">${esc(x.label)}</span>
      <div class="figure"><span class="fig num">${esc(x.fig)}</span><span class="unit">${esc(x.unit)}</span></div>
      <div class="nm">${esc(x.name)}</div>
      <p class="sub">${esc(x.sub)}</p>
    </article>`;

  // Plain words for a position, so a first-season reader isn't handed "RB".
  const POS_WORD = { QB: 'quarterback', RB: 'running back', WR: 'receiver', TE: 'tight end', K: 'kicker', DST: 'defense' };
  // A game this close earns "photo finish" / "anything goes"; past it, the sticker says
  // plainly that it's just the closest one, so the label is never untrue.
  const TIGHT = 10;
  const isTie = (g) => g.winner.result === 'T';

  // A finished week: every sticker is a number from the final scores, and each one is
  // skipped when the week can't back it (one game, all ties, no top scorer).
  // Sticker text is plain: sticker() escapes it, exactly once.
  function finalStickers(w) {
    const out = [];
    const margin = (g) => g.winner.points - g.loser.points;
    const byMargin = [...w.games].sort((a, b) => margin(b) - margin(a));
    const big = byMargin[0];
    const close = byMargin[byMargin.length - 1];
    if (big && margin(big) > 0) out.push({ tone: 'orange', label: 'Blowout', fig: `+${f2(margin(big))}`,
      text: `${big.winner.manager} ${f2(big.winner.points)}, ${big.loser.manager} ${f2(big.loser.points)}. That's the whole sticker.` });
    if (close && close !== big) {
      if (isTie(close)) out.push({ tone: 'lime', label: 'Dead heat', fig: f2(close.winner.points),
        text: `${close.winner.manager} and ${close.loser.manager} tied. Down to the decimal, still nothing.` });
      else if (margin(close) < TIGHT) out.push({ tone: 'lime', label: 'Photo finish', fig: f2(margin(close)),
        text: `${close.winner.manager} edged ${close.loser.manager}, ${f2(close.winner.points)} to ${f2(close.loser.points)}. A coin flip with decimals.` });
      else out.push({ tone: 'lime', label: 'Closest game', fig: f2(margin(close)),
        text: `${close.winner.manager} beat ${close.loser.manager}, ${f2(close.winner.points)} to ${f2(close.loser.points)}.` });
    }
    const top = (w.top_performers || [])[0];
    if (top) out.push({ tone: 'accent', label: 'Top scorer', fig: f1(top.points),
      text: `${top.name}, ${top.manager}'s ${POS_WORD[top.pos] || 'starter'}. Frame this one.` });
    // Ties aren't losses, so only a real loser can be the unlucky one.
    const unlucky = w.games.filter((g) => !isTie(g)).sort((a, b) => b.loser.points - a.loser.points)[0];
    if (unlucky) {
      const beat = w.games.filter((g) => !isTie(g) && g.winner.points < unlucky.loser.points).length;
      out.push({ tone: 'pink', label: beat ? 'Wrong opponent' : 'Best loss', fig: f2(unlucky.loser.points),
        text: beat
          ? `${unlucky.loser.manager} lost with a score that beats ${beat} of this week's winners. The schedule did this.`
          : `${unlucky.loser.manager} posted the week's highest losing score, which now comes with a sticker.` });
    }
    return out;
  }

  // Before kickoff: no scores yet, so every card comes from ESPN's projections, its win odds,
  // or this week's Coach rows, and is skipped when that data isn't there. Each is a scoreboard
  // card (see scoreCard): a number, its unit, a first name and one small line.
  function preKickoffStickers(w, rows) {
    const out = [];
    const proj = (s) => s.live_projection ?? s.projected ?? 0;
    const odds = (g) => Math.max(g.winner.win_probability ?? 0, g.loser.win_probability ?? 0);
    // ESPN can publish rosters days before projections; all zeros means "not yet".
    const hasProj = w.games.some((g) => proj(g.winner) > 0 || proj(g.loser) > 0);

    if (hasProj) {
      // Closest: the smallest gap between two projected totals. A tie goes to the game with the
      // bigger favorite. The first side of the game gets the name.
      const gap = (g) => Math.abs(proj(g.winner) - proj(g.loser));
      const close = [...w.games].sort((a, b) => (Number(f1(gap(a))) - Number(f1(gap(b)))) || (odds(b) - odds(a)))[0];
      if (close) out.push({ tone: 'lime', label: 'Closest', fig: f1(gap(close)), unit: 'PT GAP',
        name: close.winner.manager, sub: `vs ${close.loser.manager}` });
    }

    // Favorite: the highest win probability ESPN has published, whoever it is
    const pairs = w.games.flatMap((g) => [[g.winner, g.loser], [g.loser, g.winner]])
      .filter(([s]) => s.win_probability != null);
    if (pairs.length) {
      const [fav, opp] = pairs.sort((a, b) => b[0].win_probability - a[0].win_probability)[0];
      out.push({ tone: 'orange', label: 'Favorite', fig: `${Math.min(99, Math.round(fav.win_probability * 100))}%`, unit: 'TO WIN',
        name: fav.manager, sub: `vs ${opp.manager}` });
    }

    if (hasProj) {
      // Top projection: the lineup ESPN likes most this week
      const top = w.games.flatMap((g) => [g.winner, g.loser]).sort((a, b) => proj(b) - proj(a))[0];
      out.push({ tone: 'accent', label: 'Top projection', fig: f1(proj(top)), unit: 'PTS',
        name: top.manager, sub: top.team_name });
    }

    // Biggest fix: the one lineup swap worth the most projected points, league-wide. Without
    // one, the busiest to-do list, straight from the Coach rows.
    const fix = rows.flatMap((r) => r.items.filter((it) => it.kind === 'swap' && it.gain > 0).map((it) => ({ r, it })))
      .sort((a, b) => b.it.gain - a.it.gain)[0];
    const busiest = [...rows].sort((a, b) => b.counts.now - a.counts.now)[0];
    if (fix) {
      out.push({ tone: 'pink', label: 'Biggest fix', fig: `+${f1(fix.it.gain)}`, unit: 'PTS',
        name: fix.r.manager, sub: fix.r.team_name });
    } else if (busiest && busiest.counts.now) {
      out.push({ tone: 'pink', label: 'Busiest list', fig: String(busiest.counts.now), unit: 'TO DO',
        name: busiest.manager, sub: busiest.team_name });
    } else if (rows.length) {
      out.push({ tone: 'pink', label: 'All clear', fig: '0', unit: 'TO DO', name: 'Everyone', sub: 'Lineups set' });
    }

    return out.slice(0, 4);
  }

  /* ---------- week hub ----------
     Everything below is drawn from LIVE.games, LIVE.advice and LIVE.wire, which /api/live
     refreshes, so a lineup change shows up in the strip, the bar and Coach's desk together.
     Only the stakes and the headlines (LIVE.hub) are baked at build time; see hub_payload. */
  const projOf = (s) => s.live_projection ?? s.projected ?? 0;
  const NUM_WORD = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight'];
  const count = (n, one, many) => `${NUM_WORD[n] || n} ${n === 1 ? one : many}`;
  const shortDay = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const hub = () => (LIVE && LIVE.hub) || {};
  const stakesFor = (w, g) => {
    const st = hub().stakes;
    return st && st.week === w.week ? st.games.find((x) => x.key === g.key) : null;
  };
  // Lineups somebody opened, by game: the minute-by-minute refresh re-renders the page, and
  // a <details> she just opened shouldn't snap shut under her thumb (same idea as PEEK).
  const HUB_OPEN = new Set();

  function seasonStrip(w) {
    const po = SEASON.playoffs;
    if (!po) return '';
    const first = po.config.first_round_week;
    const rounds = (po.bracket && po.bracket.rounds) || [];
    const last = first - 1 + (rounds.reduce((n, r) => n + r.weeks, 0) || 1);
    const cls = (n) => (n === w.week ? 'now' : n < w.week ? 'done' : n >= first ? 'po' : '');
    const cells = Array.from({ length: last }, (_, i) => `<span class="${cls(i + 1)}">${i + 1}</span>`).join('');
    return `
      <div class="season-strip" role="img" aria-label="Season so far: ${w.week - 1} of ${last} weeks played, Week ${w.week} is ${w.complete ? 'final' : 'next'}, playoffs start in Week ${first}.">
        <div class="lab" aria-hidden="true"><span>Season</span><span>Playoffs start Week ${first}</span></div>
        <div class="weeks" aria-hidden="true">${cells}</div>
      </div>`;
  }

  // Who has the edge at each lineup spot, in projected points. RB and WR add up both starters.
  function edgeStrip(a, b) {
    const sum = (s, slot) => s.starters.filter((p) => p.slot === slot).reduce((n, p) => n + (p.projected || 0), 0);
    return `<ul class="hub-edges">${SLOT_ORDER.map((slot) => {
      const d = sum(a, slot) - sum(b, slot);
      const lead = Math.abs(d) < 0.05 ? null : d > 0 ? a : b;
      return `<li class="${lead ? (lead === a ? 'a' : 'b') : ''}">
        <span class="sl" aria-hidden="true">${slot === 'FLEX' ? 'FLX' : slot}</span>
        <span class="eg" aria-hidden="true">${lead ? `+${f1(Math.abs(d))}` : 'even'}</span>
        <span class="ar" aria-hidden="true">${lead ? (lead === a ? '◀' : '▶') : '·'}</span>
        <span class="vh">${slot}: ${lead ? `${esc(lead.manager)} by ${f1(Math.abs(d))}` : 'even'}</span></li>`;
    }).join('')}</ul>`;
  }

  // One sentence on what the game does to each side's playoff odds. A side whose odds
  // barely move is said plainly rather than given two near-identical numbers.
  function stakesLine(g, st) {
    if (!st) return '';
    const rows = [g.winner, g.loser].map((s) => ({ s, t: st.teams.find((t) => t.team_id === s.team_id) }))
      .filter((x) => x.t && x.t.win != null && x.t.lose != null);
    if (rows.length < 2) return '';
    const MOVES = 0.05;
    const odds = (x) => `<b>${esc(x.s.manager)}</b> <span class="odds">${pct(x.t.lose)}</span><span class="to">→</span><span class="odds">${pct(x.t.win)}</span>`;
    // At the ends a percentage is either a taunt or a jinx, so those are said in words.
    const steady = (x) => {
      const p = (x.t.win + x.t.lose) / 2;
      return p >= 0.97 ? `${esc(x.s.manager)} is all but in either way.` : p <= 0.03 ? `${esc(x.s.manager)}'s odds hold where they are.` : `${esc(x.s.manager)} sits near ${pct(p)} either way.`;
    };
    const moving = rows.filter((x) => x.t.swing >= MOVES);
    let body;
    if (moving.length === 2) body = `${odds(rows[0])} <span class="to">·</span> ${odds(rows[1])}`;
    else if (moving.length === 1) body = `${odds(moving[0])} <span class="to">·</span> <span>${steady(rows.find((x) => x !== moving[0]))}</span>`;
    else body = `<span>This one barely moves the playoff odds. ${steady(rows[0])} ${steady(rows[1])}</span>`;
    return `<p class="hub-stake"><b>Stakes</b>${moving.length ? '<span class="to">playoff odds, loss → win:</span>' : ''} ${body}</p>`;
  }

  // A lineup row's one status: ESPN's designation, else a bye. A designation wins over a bye, and a row
  // with neither says nothing (no injury report in the capture is "we don't know", never "healthy").
  const HUB_STATUS = { Questionable: ['Q', 'iffy'], 'Day to day': ['DTD', 'iffy'], Doubtful: ['D', 'out'], Out: ['OUT', 'out'],
    'On IR': ['IR', 'out'], Suspended: ['SUSP', 'out'] };
  function hubStatus(p) {
    if (p.injury) { const [abbr, tone] = HUB_STATUS[p.injury] || [p.injury, OUTISH.includes(p.injury) ? 'out' : 'iffy']; return { label: p.injury, abbr, tone }; }
    return p.bye ? { label: 'Bye', abbr: 'BYE', tone: 'bye' } : null;
  }
  function hubRow(p, hasProj) {
    const st = hubStatus(p);
    const bits = [p.team ? `<b>${esc(p.team)}</b>` : '', p.bye ? '' : esc(kickoffText(p.kickoff))].filter(Boolean).join(' · ');
    const sticker = st ? `<span class="st ${st.tone}" title="${esc(st.label)}"><span aria-hidden="true">${esc(st.abbr)}</span><span class="sr">${esc(st.label)}</span></span>` : '';
    return `
        <tr${st ? ` class="k-${st.tone}"` : ''}>
          <td class="slot"><span class="slotpill">${esc(p.slot)}</span></td>
          <td class="av">${face(p, 'sm')}</td>
          <td class="pl"><div class="nm">${esc(p.name)}</div><div class="sub">${bits ? `<span>${bits}</span>` : ''}${sticker}</div></td>
          <td class="r${hasProj && !p.projected ? ' zero' : ''}">${f1(p.projected)}</td>
        </tr>`;
  }

  function hubGame(w, g, { mine, swing }) {
    const [a, b] = [g.winner, g.loser];
    const hasProj = projOf(a) > 0 || projOf(b) > 0;
    const fav = [a, b].filter((s) => s.win_probability != null).sort((x, y) => y.win_probability - x.win_probability)[0];
    const mid = fav && fav.win_probability > 0.5 ? `ESPN: ${esc(fav.manager)} ${pct(fav.win_probability)} to win`
      : hasProj ? `${f1(Math.abs(projOf(a) - projOf(b)))} apart` : 'no projections yet';
    const rc = (s) => `${TEAMS[s.team_id] && TEAMS[s.team_id].weekly.length ? `${record(TEAMS[s.team_id])} · ` : ''}${esc(s.team_name)}`;
    // No advice rows at all says nothing about the injury report, so only a capture that has them and none known gets the note.
    const adv = advice() || [];
    const known = !adv.length || adv.some((r) => r.injuries_known);
    const table = (s) => {
      const rows = [...s.starters].sort((x, y) => SLOT_ORDER.indexOf(x.slot) - SLOT_ORDER.indexOf(y.slot));
      if (!rows.length) {
        return `<div><table><caption><div class="cap"><span>${esc(s.manager)}</span></div></caption></table><div class="none">${esc(s.manager)} has no starters yet. This fills in once ESPN has a lineup.</div></div>`;
      }
      const toFix = rows.filter((p) => hubStatus(p)).length;
      return `<div><table><caption><div class="cap"><span>${esc(s.manager)}</span>${toFix ? `<span class="flag">${toFix} to check</span>` : ''}</div></caption><tbody>${
        rows.map((p) => hubRow(p, hasProj)).join('')}</tbody></table></div>`;
    };
    return `
      <article class="hub-game" aria-label="${esc(a.manager)} vs ${esc(b.manager)}">
        <div class="hub-tag${mine ? ' mine' : swing ? ' swing' : ''}">
          ${mine ? '<span class="hub-pill">Your game</span>' : ''}${swing ? '<span class="hub-pill swing">Most at stake</span>' : ''}
          <span>${esc(a.manager)} vs ${esc(b.manager)}</span>
        </div>
        <div class="hub-sides">
          <div><div class="nm">${mgrLink(a.manager)}</div><div class="rc">${rc(a)}</div></div>
          <div class="mid">PROJ</div>
          <div class="r"><div class="nm">${mgrLink(b.manager)}</div><div class="rc">${rc(b)}</div></div>
          <div class="hub-score"><i class="hub-a" aria-hidden="true"></i>${f1(projOf(a))}</div>
          <div class="mid">${mid}</div>
          <div class="hub-score r">${f1(projOf(b))}<i class="hub-b" aria-hidden="true"></i></div>
        </div>
        ${hasProj ? `
        <div class="hub-bar" role="img" aria-label="Projected points: ${esc(a.manager)} ${f1(projOf(a))}, ${esc(b.manager)} ${f1(projOf(b))}">
          <span class="hub-a" style="flex:${projOf(a).toFixed(2)}"></span><span class="hub-b" style="flex:${projOf(b).toFixed(2)}"></span>
        </div>
        ${edgeStrip(a, b)}
        <p class="hub-key"><i class="hub-a" aria-hidden="true"></i>◀ ${esc(a.manager)}'s edge &nbsp; <i class="hub-b" aria-hidden="true"></i>▶ ${esc(b.manager)}'s edge</p>` : ''}
        ${stakesLine(g, stakesFor(w, g))}
        <details class="hub-lineups" data-hub-open="${g.key}"${HUB_OPEN.has(g.key) ? ' open' : ''}>
          <summary>Full lineups</summary>
          <div class="body">
            <div class="cols">${table(a)}${table(b)}</div>
            ${known ? `<p class="legend"><b>Q</b> questionable (might play) · <b>DTD</b> day to day · <b>D</b> doubtful (probably not) · <b>OUT</b> · <b>IR</b> injured reserve · <b>SUSP</b> suspended · <b>BYE</b> no game this week. Tags come from ESPN's injury report. Out, IR and bye starters score zero until swapped.</p>`
              : `<p class="strip"><b>No injury report for this week.</b> Blank here doesn't mean healthy.</p>`}
          </div>
        </details>
      </article>`;
  }

  // Your game first (when the page knows whose page this is), then the most at stake.
  function hubGames(w) {
    const me = myTeam.get();
    const st = hub().stakes;
    const order = st && st.week === w.week ? st.games.map((x) => x.key) : [];
    const rank = (g) => (order.includes(g.key) ? order.indexOf(g.key) : order.length);
    const isMine = (g) => g.winner.team_id === me || g.loser.team_id === me;
    const top = order.length ? st.games[0] : null;
    const swingKey = top && top.teams.reduce((n, t) => n + t.swing, 0) >= 0.1 ? top.key : null;
    return [...w.games].sort((x, y) => (isMine(y) - isMine(x)) || (rank(x) - rank(y)))
      .map((g) => hubGame(w, g, { mine: isMine(g), swing: g.key === swingKey })).join('');
  }

  const DESK_KINDS = { swap: null, bye: 'BYE', out: 'OUT', empty: 'EMPTY', hole: '0 PROJ' };
  // Coach cards talk to "you"; on the desk they sit under somebody else's name.
  const deskTitle = (t) => t.replace(/^Your (.)/, (_, c) => c.toUpperCase());
  function coachDesk(rows) {
    const me = myTeam.get();
    const fixes = rows.flatMap((r) => r.items.filter((it) => it.level === 'now' && it.kind in DESK_KINDS).map((it) => ({ r, it })))
      .sort((x, y) => ((y.it.kind === 'swap') - (x.it.kind === 'swap')) || ((y.it.gain || 0) - (x.it.gain || 0)));
    const clear = rows.filter((r) => !r.counts.now);
    if (!fixes.length && !clear.length) return '';
    return `
      <section>
        ${secHead('flag', 'Coach desk', `<a class="more" href="${coachHref()}">Open Coach →</a>`)}
        <p class="sec-sub">${fixes.length ? 'Lineup fixes across the whole league, biggest projected gain first.' : clear.length === rows.length ? 'Nothing urgent on anybody’s list.' : 'No lineup fixes to make right now.'}</p>
        <div class="hub-panel">
          ${fixes.slice(0, 7).map(({ r, it }) => `
            <div class="hub-fix">
              <a class="hub-who${r.team_id === me ? ' me' : ''}" href="${lineupUrl(false, r.team_id)}">${esc(r.manager)}</a>
              <div class="t">${esc(deskTitle(it.title))}<small>${ADVICE_KIND[it.kind] || ''}</small></div>
              <span class="pts${it.kind === 'swap' ? '' : ' flag'}">${it.kind === 'swap' ? `+${f1(it.gain)}` : DESK_KINDS[it.kind]}</span>
            </div>`).join('')}
          ${clear.length ? `<div class="hub-clear"><b>All clear</b>${clear.map((r) => esc(r.manager)).join(' · ')}</div>` : ''}
        </div>
      </section>`;
  }

  function rankedProjections(w) {
    const me = myTeam.get();
    const sides = w.games.flatMap((g) => [g.winner, g.loser]).sort((x, y) => projOf(y) - projOf(x));
    const max = sides.length ? projOf(sides[0]) : 0;
    if (!max) return '';
    return `
      <section>
        ${secHead('board', 'Projected, ranked')}
        <p class="sec-sub">ESPN's projected score for every lineup as it's set right now.</p>
        <div class="hub-panel" style="padding-top:10px">
          ${sides.map((s) => `
            <div class="hub-rank"><span class="nm">${esc(s.manager)}</span>
              <span class="tr" aria-hidden="true"><span class="${s.team_id === me ? 'me' : ''}" style="width:${(100 * projOf(s) / max).toFixed(1)}%"></span></span>
              <span class="v">${f1(projOf(s))}</span></div>`).join('')}
          <p class="hub-note">${sides.some((s) => s.team_id === me) ? 'Orange is your team. ' : ''}A starter on a bye, a week off for his NFL team, counts for zero until he's swapped out.</p>
        </div>
      </section>`;
  }

  /* The league wire, capped so a busy Sunday of lineup tinkering can't push Wednesday's
     waiver run off the page. Days are the reader's own, not UTC's. */
  const WIRE_MAX = 12, WIRE_LINEUPS = 3;
  function wireSection(stacked = false) {
    const events = (LIVE && LIVE.wire) || [];
    if (!events.length) return '';
    const day = (e) => new Date(e.date).toDateString();
    // One line per manager per day: five separate adds and drops on a Wednesday read as one
    // busy Wednesday, and a morning of lineup tinkering as one "set her lineup".
    const rolled = new Map();
    for (const e of events) {
      if (e.kind === 'trade') { rolled.set(`trade|${e.date}|${e.team_id}|${e.with_id}`, e); continue; }
      const k = `${e.kind}|${day(e)}|${e.team_id}`;
      const had = rolled.get(k);
      if (!had) rolled.set(k, { ...e, added: [...(e.added || [])], dropped: [...(e.dropped || [])], promoted: new Set(e.promoted || []) });
      else if (e.kind === 'lineup') (e.promoted || []).forEach((id) => had.promoted.add(id));
      else { had.added.push(...e.added); had.dropped.push(...e.dropped); had.waiver = had.waiver && e.waiver; }
    }
    for (const e of rolled.values()) {
      if (e.kind !== 'move') continue;
      // Picked up and dropped again the same day nets out to nothing worth a line.
      const both = e.added.filter((n) => e.dropped.includes(n));
      e.added = e.added.filter((n) => !both.includes(n));
      e.dropped = e.dropped.filter((n) => !both.includes(n));
    }
    // Trades always make the cut, then pickups and drops. Lineup changes get what's left, and
    // at least WIRE_LINEUPS lines of it, so the newest days are never blank.
    const WEIGHT = { trade: 0, move: 1 };
    const newest = (x, y) => (x.date < y.date ? 1 : -1);
    const rows = [...rolled.values()].filter((e) => e.kind !== 'move' || e.added.length || e.dropped.length);
    const lineupRows = rows.filter((e) => e.kind === 'lineup').sort(newest);
    const realRows = rows.filter((e) => e.kind !== 'lineup').sort((x, y) => (WEIGHT[x.kind] - WEIGHT[y.kind]) || newest(x, y))
      .slice(0, WIRE_MAX - Math.min(WIRE_LINEUPS, lineupRows.length));
    const shown = [...realRows, ...lineupRows.slice(0, WIRE_MAX - realRows.length)].sort(newest);
    const list = (xs) => xs.map(esc).join(', ');
    const wireIcon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    const IC_ADD = wireIcon('<path d="M12 5v14M5 12h14"/>');
    const IC_DROP = wireIcon('<path d="M5 12h14"/>');
    const IC_TRADE = wireIcon('<path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/>');
    const IC_LINEUP = wireIcon('<path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/>');
    const line = (e) => {
      if (e.kind === 'trade') return `<span class="ic trade" aria-hidden="true">${IC_TRADE}</span><span><b>${esc(e.manager)}</b> and <b>${esc(e.with)}</b> made a trade. ${esc(e.manager)} gets ${list(e.added).replace(/\.$/, '')}. ${esc(e.with)} gets ${list(e.dropped).replace(/\.$/, '')}.</span>`;
      if (e.kind === 'lineup') return `<span class="ic swap" aria-hidden="true">${IC_LINEUP}</span><span><b>${esc(e.manager)}</b> set her lineup${e.promoted.size ? ` <span class="how">· ${e.promoted.size} ${e.promoted.size === 1 ? 'player' : 'players'} moved in off the bench</span>` : ''}</span>`;
      return `<span class="ic${e.added.length ? '' : ' drop'}" aria-hidden="true">${e.added.length ? IC_ADD : IC_DROP}</span><span><b>${esc(e.manager)}</b> ${[e.added.length ? `added ${list(e.added)}` : '', e.dropped.length ? `dropped ${list(e.dropped)}` : ''].filter(Boolean).join(', ')}${e.waiver ? ' <span class="how">· off waivers</span>' : ''}</span>`;
    };
    let last = '';
    const feed = shown.map((e) => {
      const head = day(e) === last ? '' : `<h3 class="hub-day">${shortDay(e.date)}</h3>`;
      last = day(e);
      return `${head}<div class="hub-ev">${line(e)}</div>`;
    }).join('');
    const picks = new Map();
    // Counted off the same netted rows the feed shows, so the two can't disagree.
    for (const e of rows) if (e.kind === 'move' && e.added.length) picks.set(e.manager, (picks.get(e.manager) || 0) + e.added.length);
    const busy = [...picks.entries()].sort((x, y) => y[1] - x[1]);
    const total = busy.reduce((n, [, c]) => n + c, 0);
    return `
      <section>
        ${secHead('board', 'League wire')}
        <p class="sec-sub">Pickups, drops, trades and lineup changes from the last seven days, newest first, straight from ESPN's activity log. "Off waivers" means the pickup waited its turn overnight instead of being grabbed on the spot.</p>
        <div class="hub-wire${stacked ? ' stack' : ''}">
          <div class="hub-panel${stacked ? ' wire-scroll' : ''}"${stacked ? ' tabindex="0" role="region" aria-label="League wire feed"' : ''}>${feed}</div>
          ${busy.length ? `
          <div>
            <h3 class="hub-day" style="padding-top:0">Most pickups, last seven days</h3>
            <div class="hub-panel" style="padding-top:10px">
              ${busy.map(([m, c]) => `
                <div class="hub-rank"><span class="nm">${esc(m)}</span>
                  <span class="tr" aria-hidden="true"><span style="width:${(100 * c / busy[0][1]).toFixed(1)}%"></span></span>
                  <span class="v">${c}</span></div>`).join('')}
              <p class="hub-note">${total} ${total === 1 ? 'pickup' : 'pickups'} across the league in seven days.${busy.length > 1 && busy[0][1] > busy[1][1] ? ` ${esc(busy[0][0])} made ${busy[0][1]} of them.` : ''}</p>
            </div>
          </div>` : ''}
        </div>
      </section>`;
  }

  /* ---------- ESPN news: ranking, and the ticker ----------
     hub().news is baked at build time (see hub_payload), so the ticker is drawn from it once per
     change rather than on every route(): the live refresh re-renders #main every minute, and a
     ticker rebuilt each time would snap back to the start. */
  const NEWS_TICKER_MAX = 12;
  // Your team's stories first, then injuries, then ESPN's own order. Without a team the first rule is skipped.
  function rankedNews() {
    const me = myTeam.get();
    const rank = (n) => (me && n.owners.some((o) => o.team_id === me) ? 0 : n.tag === 'Injury' ? 1 : 2);
    // A borrowed or older payload may not have the current shape; anything off is skipped, never thrown on.
    const ok = (n) => n && Array.isArray(n.owners) && Array.isArray(n.players) && n.players.length && typeof n.url === 'string';
    return (hub().news || []).filter(ok).map((n, i) => [n, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map((x) => x[0]);
  }
  const ownerText = (n) => n.owners.map((o) => o.manager).join(' + ');
  const ownedByMe = (n) => !!myTeam.get() && n.owners.some((o) => o.team_id === myTeam.get());

  let tickerWanted = false, tickerSig = '', tickerPaused = false;
  const IC_PAUSE = '<svg class="pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const IC_PLAY = '<svg class="play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
  function drawTicker() {
    const el = document.getElementById('ticker');
    const list = tickerWanted ? rankedNews().slice(0, NEWS_TICKER_MAX) : [];
    el.hidden = !list.length;
    if (!list.length) return;
    const sig = `${myTeam.get()}|${list.map((n) => n.url).join(' ')}`;
    if (sig === tickerSig) return;
    tickerSig = sig;
    const items = (dup) => list.map((n) => `
      <li><a class="tk-item" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer"${dup ? ' tabindex="-1"' : ''}>
        <span class="tk-chip${ownedByMe(n) ? ' me' : ''}">${esc(ownerText(n))}</span>
        <span class="tk-h">${esc(n.headline)}</span>
        <span class="tk-who">${esc(n.players[0].name)}</span>
        <span class="tk-sep" aria-hidden="true"></span>
      </a></li>`).join('');
    el.innerHTML = `
      <div class="tk-label"><span class="tk-dot" aria-hidden="true"></span><span class="long">ESPN · your rosters</span><span class="short">ESPN</span></div>
      <div class="tk-view"><div class="tk-track">
        <ul class="tk-list">${items(false)}</ul>
        <ul class="tk-list dup" aria-hidden="true">${items(true)}</ul>
      </div></div>
      <button type="button" class="tk-btn" data-tk aria-label="${tickerPaused ? 'Play' : 'Pause'} news ticker">${IC_PAUSE}${IC_PLAY}</button>`;
    el.classList.toggle('paused', tickerPaused);
  }
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tk]');
    if (!btn) return;
    tickerPaused = !tickerPaused;
    btn.closest('.ticker').classList.toggle('paused', tickerPaused);
    btn.setAttribute('aria-label', `${tickerPaused ? 'Play' : 'Pause'} news ticker`);
  });

  /* Latest news. Headlines, ESPN's own photo and a link out: no article text ever reaches this page.
     The chip she picked outlives the minute-by-minute re-render, like PEEK and HUB_OPEN. */
  let newsTeam = 'all';
  const newsDay = (iso) => {
    const d = new Date(iso);
    return (Date.now() - d) / 864e5 < 6 ? d.toLocaleDateString(undefined, { weekday: 'short' }) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };
  const newsAt = () => hub().news_at
    ? new Date(hub().news_at).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '';
  const banner = (n) => `
    <div class="nl-banner">
      <svg viewBox="0 0 600 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="600" height="200" fill="var(--accent-ink)"/>
        ${[0, 1, 2, 3, 4, 5].map((i) => `<rect x="${i * 100}" width="50" height="200" fill="var(--accent)" opacity=".55"/>`).join('')}
        ${[50, 150, 250, 350, 450, 550].map((x) => `<path d="M${x} 0v200" stroke="#fff" stroke-width="3" opacity=".5"/>`).join('')}
        <circle cx="110" cy="52" r="26" fill="var(--lime)" stroke="var(--ink)" stroke-width="3"/>
        <rect x="470" y="30" width="38" height="38" rx="4" transform="rotate(45 489 49)" fill="var(--pink)" stroke="var(--ink)" stroke-width="3"/>
        <path d="M150 150h110M130 130h100M160 170h90" stroke="var(--lime)" stroke-width="6" stroke-linecap="round"/>
        <g transform="rotate(-24 330 120)"><ellipse cx="330" cy="120" rx="64" ry="36" fill="var(--orange)" stroke="var(--ink)" stroke-width="4"/>
          <path d="M310 120h40M318 110v20M330 108v24M342 110v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
      </svg>
      ${n.image ? `<img src="${esc(n.image)}" alt="${esc(n.headline)}" loading="lazy" onerror="this.remove()">` : ''}
    </div>`;
  const pill = (p) => `
    <span class="nl-pill">
      <span class="nl-av${p.team ? ` ${esc(p.team)}` : ''}">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="15" r="7" fill="#fff"/><path d="M6 40c0-9 6-14 14-14s14 5 14 14z" fill="#fff"/></svg>
        ${p.headshot ? `<img${p.pos === 'DST' ? ' class="logo"' : ''} src="${esc(p.headshot)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ''}
        ${p.team ? `<span class="tm" aria-hidden="true">${esc(p.team)}</span>` : ''}
      </span>
      <span>${esc(p.name)} <small>${p.pos && p.pos !== 'DST' ? esc(p.pos) : ''}</small></span>
    </span>`;
  const newsMeta = (n) => `
    <div class="nl-meta"><span class="nl-tag ${esc(n.tag)}">${esc(n.tag)}</span>${ownedByMe(n) ? '<span class="nl-yours">On your roster</span>' : ''}<span class="nl-date">${newsDay(n.date)}</span></div>`;
  const newsOwners = (n) => `<div class="nl-owners">${n.owners.map((o) => {
    const mine = o.team_id === myTeam.get();
    return `<span class="nl-owner${mine ? ' me' : ''}">${esc(o.manager)}${mine ? ' (you)' : ''}</span>`;
  }).join('')}</div>`;
  const READ = '<span class="nl-read">Read on ESPN <span aria-hidden="true">→</span></span>';
  const leadCard = (n) => `
    <a class="nl-lead" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">
      ${banner(n)}${newsMeta(n)}
      <h3 class="nl-h">${esc(n.headline)}</h3>
      ${newsOwners(n)}<div class="nl-pills">${n.players.map(pill).join('')}</div>${READ}
    </a>`;
  const smallCard = (n) => `
    <a class="nl-card" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">
      ${newsMeta(n)}
      <h3 class="nl-h">${esc(n.headline)}</h3>
      ${newsOwners(n)}<div class="nl-pills">${n.players.map(pill).join('')}</div>${READ}
    </a>`;

  function newsBody() {
    const all = rankedNews(), me = myTeam.get();
    const count = (id) => all.filter((n) => n.owners.some((o) => o.team_id === id)).length;
    const teams = Object.values(TEAMS).map((t) => ({ id: t.team_id, name: t.manager, n: count(t.team_id) }))
      .sort((a, b) => (b.id === me) - (a.id === me) || b.n - a.n || a.name.localeCompare(b.name));
    if (newsTeam !== 'all' && !teams.some((t) => t.id === newsTeam)) newsTeam = 'all';
    const shown = newsTeam === 'all' ? all : all.filter((n) => n.owners.some((o) => o.team_id === newsTeam));
    const who = newsTeam === 'all' ? '' : nameOf(newsTeam);
    const chip = (id, label, n, cls = '') => `<button type="button" class="nl-chip${cls}" data-nt="${id}" aria-pressed="${newsTeam === id}">${esc(label)}<b>${n}</b></button>`;
    return `
      <div class="nl-chips" role="group" aria-label="Filter headlines by team">
        ${chip('all', 'All teams', all.length)}
        ${teams.map((t) => chip(t.id, t.id === me ? `${t.name} (you)` : t.name, t.n, `${t.id === me ? ' me' : ''}${t.n ? '' : ' zero'}`)).join('')}
      </div>
      <p class="nl-count" aria-live="polite">${shown.length} ${shown.length === 1 ? 'headline' : 'headlines'} ${newsTeam === 'all' ? 'across the league' : `for ${esc(who)}`}</p>
      <div class="nl-grid">${shown.length
        ? `${leadCard(shown[0])}${shown.slice(1).map(smallCard).join('')}`
        : `<div class="nl-empty"><h3>Quiet on ${esc(who)}</h3><p>Nothing new from ESPN on this roster right now.</p></div>`}</div>`;
  }

  function newsSection() {
    if (!rankedNews().length) return '';
    const at = newsAt();
    return `
      <section id="latest-news">
        <div class="sec-head nl-head"><span class="marker book" aria-hidden="true"></span><h2>Latest news</h2><div class="rule"></div>${at ? `<span class="nl-cap">Captured ${esc(at)}</span>` : ''}</div>
        <p class="sec-sub">The latest ESPN headlines about players somebody in this league has on her roster. Your teams come first. Each one opens on ESPN.</p>
        <div id="nl-body">${newsBody()}</div>
      </section>`;
  }
  // Chips redraw only the section's body, so the page doesn't jump. A swipe row keeps its place, and focus
  // goes back to the chip she pressed.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-nt]');
    if (!btn) return;
    newsTeam = btn.dataset.nt === 'all' ? 'all' : Number(btn.dataset.nt);
    const body = document.getElementById('nl-body');
    const row = body.querySelector('.nl-chips');
    const left = row ? row.scrollLeft : 0;
    body.innerHTML = newsBody();
    const again = body.querySelector(`button[data-nt="${btn.dataset.nt}"]`);
    body.querySelector('.nl-chips').scrollLeft = left;
    if (again) again.focus({ preventScroll: true });
  });

  /* Phone-only tab switch (620px and under) over the bottom of This week: Latest news, League wire,
     Projected. The wire and the projections are the same sections the desktop draws, so on a phone the
     originals (.tab-src) hide and each tab shows a second copy of the same function's output. Above
     620px the tab bar and the extra copies are hidden and the page reads as it always has. The tab she
     picked outlives the live re-render. */
  let phoneTab = 'news';
  function bottomPanels(w) {
    const wire = wireSection(true), proj = w.complete ? '' : rankedProjections(w), news = newsSection();
    const tabs = [['news', 'Latest news', news], ['wire', 'League wire', wire], ['proj', 'Projected', proj]].filter((t) => t[2]);
    if (!tabs.length) return '';
    const on = tabs.some((t) => t[0] === phoneTab) ? phoneTab : tabs[0][0];
    return `
      ${tabs.length > 1 ? `<div class="ph-tabs" role="tablist" aria-label="More from this week">${tabs.map(([k, label]) => `
        <button type="button" role="tab" id="ptab-${k}" data-ptab="${k}" aria-controls="ppanel-${k}" aria-selected="${k === on}" tabindex="${k === on ? 0 : -1}">${label}</button>`).join('')}</div>` : ''}
      ${tabs.map(([k, , html]) => `
        <div class="ph-panel${k === 'news' ? '' : ' ph-only'}${k === on || tabs.length === 1 ? ' on' : ''}" id="ppanel-${k}" data-tabs="${tabs.length > 1}">${html}</div>`).join('')}`;
  }
  // The panels are tabpanels only while the tab bar is on screen (phones); above 620px they're plain sections.
  const phoneMQ = window.matchMedia('(max-width: 620px)');
  function syncPanelRoles() {
    document.querySelectorAll('.ph-panel').forEach((p) => {
      const tabbed = phoneMQ.matches && p.dataset.tabs === 'true';
      if (tabbed) { p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', `ptab-${p.id.slice(7)}`); }
      else { p.removeAttribute('role'); p.removeAttribute('aria-labelledby'); }
    });
  }
  phoneMQ.addEventListener('change', syncPanelRoles);
  function pickPhoneTab(k, focus) {
    phoneTab = k;
    document.querySelectorAll('[data-ptab]').forEach((t) => {
      const sel = t.dataset.ptab === k;
      t.setAttribute('aria-selected', sel);
      t.tabIndex = sel ? 0 : -1;
      if (sel && focus) t.focus({ preventScroll: true });
    });
    document.querySelectorAll('.ph-panel').forEach((p) => p.classList.toggle('on', p.id === `ppanel-${k}`));
    // A shorter panel can pull the page up from under her thumb; keep the switch where she can see it.
    const bar = document.querySelector('.ph-tabs');
    const r = bar && bar.getBoundingClientRect();
    if (r && (r.top < 100 || r.bottom > innerHeight)) bar.scrollIntoView({ block: 'start' });
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button[data-ptab]');
    if (t) pickPhoneTab(t.dataset.ptab, false);
  });
  document.addEventListener('keydown', (e) => {
    const t = e.target.closest && e.target.closest('button[data-ptab]');
    if (!t || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    const all = [...document.querySelectorAll('[data-ptab]')];
    const i = all.indexOf(t);
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? all.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length;
    e.preventDefault();
    pickPhoneTab(all[next].dataset.ptab, true);
  });

  function landingPage(w) {
    tickerWanted = !!rankedNews().length;
    const next = leadWithNext();
    const rows = coachRows(next) || [];
    const weekNum = next ? ahead().week : w.week;
    // Always this week's Coach rows: `rows` can be next week's when this week's list is empty.
    const mine = advice() || [];
    const stickers = w.complete ? finalStickers(w) : preKickoffStickers(w, mine);
    const title = w.complete
      ? (stickers.length ? `Week ${w.week} in ${STICKER_COUNT[stickers.length]} sticker${stickers.length === 1 ? '' : 's'}` : 'This week, wrapped')
      : `Getting ready<br>for Week ${w.week}`;
    const toFix = mine.filter((r) => r.counts.now).length;
    // "Every lineup looks set" is only true once ESPN has projections to judge a lineup by.
    const judged = mine.length && mine.every((r) => r.projected !== false);
    const dek = w.complete
      ? `Every game is final. The recap's still being written, so the numbers get the first word.`
      : toFix
        ? `${count(toFix, 'lineup has', 'lineups have')} something to fix and there's still time. Here's every matchup before kickoff.`
        : judged
          ? `Every lineup looks set and nobody's kicked off yet. Here's every matchup before kickoff.`
          : `Nobody's kicked off yet. Here's every matchup and what's worth sorting out before kickoff.`;
    return `
      <div class="hub-head">
        <div class="page-head">
          <div class="kicker">Week ${w.week} · ${w.complete ? 'in the books' : 'not started yet'}</div>
          <div class="head-row${!w.complete && WEEKS.length ? ' has-recap' : ''}">
            <h1>${title}</h1>
            ${w.complete && !stickers.length ? scorePills(w) : ''}
            ${!w.complete && WEEKS.length ? `<a class="recap-btn" href="#week-${latest().week}">Last week's recap <span aria-hidden="true">→</span></a>` : ''}
          </div>
          <p class="dek">${dek}</p>
        </div>
        ${seasonStrip(w)}
      </div>

      ${stickers.length ? (w.complete
        ? `<div class="stickers hub-chips">${stickers.map(sticker).join('')}</div>`
        : `<div class="stickers hub-chips scoreboard">${stickers.map(scoreCard).join('')}</div>`) : ''}

      ${w.complete ? `<div class="recap-when"><span class="d">TUE</span><span>The full recap, game balls and flags included, lands Tuesday. Nobody's safe.</span></div>` : ''}

      ${w.complete ? `
      <section>
        ${secHead('board', 'Final scores')}
        <div class="final-lines">${w.games.map((g) => `
          <a href="#live.game-${g.key}">
            <span class="w"><span class="ml-w">${isTie(g) ? 'T' : 'W'}</span><b>${esc(g.winner.manager)}</b><span class="num">${f2(g.winner.points)}</span></span>
            <span class="l">${esc(g.loser.manager)} <span class="num">${f2(g.loser.points)}</span></span>
          </a>`).join('')}</div>
      </section>
      ${rows.length ? `<a class="live-banner" href="${coachHref()}"><span>Every team's Week ${weekNum} to-do list is on <b>Coach</b>: swaps, injuries and empty slots.</span><span class="go">Open Coach →</span></a>` : ''}` : `
      <div class="hub-grid">
        <section style="margin-top:0">
          ${secHead('board', 'Matchups')}
          <p class="sec-sub">Projected scores are ESPN's. The strip under each game shows who has the edge at every lineup spot, in projected points${hub().stakes ? `. "Stakes" is what a win or a loss does to a team's chance of making the playoffs, by the same math as Standings` : ''}.</p>
          ${hubGames(w)}
        </section>
        <div class="hub-side">
          ${coachDesk(mine)}
