<title>__PAGE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600&display=swap">
<style>
  /* Tailgate pop palette, sticker-book UI.
     Cobalt = navigation, links, scoreboard. Tangerine = game balls. Bubblegum = flags. Lime = highlight badges.
     Text never takes a pop color on white (contrast); pops are fills with ink text on top. */
  :root {
    --bg: #f3f5fb;
    --card: #ffffff;
    --ink: #151a33;
    --muted: #565d79;
    --rule: #dde2ef;
    --edge: #151a33;
    --drop: #151a33;
    --board: #151a33;
    --board-2: #2b3263;
    --on-board: #f4f6ff;
    --on-board-muted: #a9b2dc;
    --accent: #2e4bf2;
    --accent-soft: #e2e7ff;
    --accent-ink: #1a2a9c;
    --on-accent: #ffffff;
    --orange: #ff7a1a;
    --pink: #ff6fb5;
    --lime: #c7f04a;
    --on-pop: #151a33;
    --logo-chip: #ffffff;
    --pink-soft: #ffe0ef;
    --orange-soft: #ffe6d3;
    --lime-soft: #eefbc9;
    --win: #1c7a50;
    --loss: #c0392b;
    --heat-hi: #2e4bf2;
    --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
    --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --script: "Fredoka", "Figtree", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1127;
      --card: #1a1f3f;
      --ink: #f2f4ff;
      --muted: #a4abd2;
      --rule: #2d345f;
      --edge: #4a55a0;
      --drop: #03040d;
      --board: #070919;
      --board-2: #283064;
      --on-board: #f4f6ff;
      --on-board-muted: #98a2d6;
      --accent: #8196ff;
      --accent-soft: #262f6c;
      --accent-ink: #e0e6ff;
      --on-accent: #0b1033;
      --orange: #ff8a33;
      --pink: #ff82c0;
      --lime: #c7f04a;
      --on-pop: #151a33;
    --logo-chip: #ffffff;
      --pink-soft: #4a1e3d;
      --orange-soft: #4a2c15;
    --lime-soft: #2f3a14;
      --win: #55d094;
      --loss: #ff7d70;
      --heat-hi: #8196ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1127;
    --card: #1a1f3f;
    --ink: #f2f4ff;
    --muted: #a4abd2;
    --rule: #2d345f;
    --edge: #4a55a0;
    --drop: #03040d;
    --board: #070919;
    --board-2: #283064;
    --on-board: #f4f6ff;
    --on-board-muted: #98a2d6;
    --accent: #8196ff;
    --accent-soft: #262f6c;
    --accent-ink: #e0e6ff;
    --on-accent: #0b1033;
    --orange: #ff8a33;
    --pink: #ff82c0;
    --lime: #c7f04a;
    --on-pop: #151a33;
    --logo-chip: #ffffff;
    --pink-soft: #4a1e3d;
    --orange-soft: #4a2c15;
    --lime-soft: #2f3a14;
    --win: #55d094;
    --loss: #ff7d70;
    --heat-hi: #8196ff;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 400 15.5px/1.55 var(--body); padding-inline: 16px; padding-block: 0 56px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  a { color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  main:focus { outline: none; }

  /* the sticker: every raised surface shares one outline + hard offset shadow */
  a.game, .card, .lineup, .std-card, .tile, .decided li, .other-games a, .versus,
  .story, .final-lines {
    border: 2px solid var(--edge); box-shadow: 4px 4px 0 var(--drop); border-radius: 14px;
  }
  @media (prefers-reduced-motion: no-preference) {
    a.game, .other-games a, .chips a, .profile-btn { transition: transform 0.12s ease, box-shadow 0.12s ease; }
  }
  a.game:hover, .other-games a:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--drop); }
  a.game:active, .other-games a:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }
  .badge-tilt { display: inline-block; transform: rotate(-3deg); }

  /* ---------- site header ---------- */
  .site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding-inline: 16px; border-bottom: 2px solid var(--edge); }
  .site-head .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding-block: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .flag-mark { width: 24px; height: 28px; flex: none; background: var(--pink); clip-path: polygon(0 0, 100% 0, 76% 50%, 100% 100%, 0 100%); transform: rotate(-8deg); filter: drop-shadow(2px 2px 0 var(--drop)); }
  .brand-name { font: 800 24px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
  .brand-script { font: 600 13px/1 var(--script); color: var(--on-pop); background: var(--lime); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 9px; margin-left: 6px; display: inline-block; transform: rotate(-4deg); vertical-align: 3px; }
  nav.site-nav { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding: 2px 4px 4px 2px; }
  nav.site-nav a { text-decoration: none; font: 600 14px/1 var(--body); padding: 8px 13px; border-radius: 999px; white-space: nowrap; color: var(--ink); border: 2px solid transparent; }
  nav.site-nav a:hover { border-color: var(--edge); }
  nav.site-nav a[aria-current="page"] { background: var(--accent); color: var(--on-accent); border-color: var(--edge); box-shadow: 2px 2px 0 var(--drop); }

  .draft-banner { margin-top: 18px; padding: 10px 14px; background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 3px 3px 0 var(--drop); font-size: 13.5px; font-weight: 700; }

  /* ---------- page heads ---------- */
  .crumbs { margin-top: 20px; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  .crumbs a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .crumbs a:hover { text-decoration: underline; }
  .page-head { padding-block: 22px 6px; display: grid; gap: 10px; }
  .kicker-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .kicker { justify-self: start; font: 600 14px/1 var(--script); color: var(--on-accent); background: var(--accent); border: 2px solid var(--edge); border-radius: 999px; padding: 6px 12px; transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--drop); }
  .page-head h1 { font: 800 clamp(36px, 6.2vw, 62px)/0.98 var(--display); letter-spacing: 0.005em; max-width: 20ch; }
  .dek { font-size: 17.5px; color: var(--muted); max-width: 62ch; margin: 0; }
  .dek a { color: var(--accent); font-weight: 700; }
  .team-summary { margin: 8px 0 0; padding: 10px 14px; background: var(--lime); color: var(--on-pop);
    border: 2px solid var(--edge); border-radius: 12px; box-shadow: 3px 3px 0 var(--drop);
    font-size: 14.5px; font-weight: 700; max-width: 62ch; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  /* Live page: the headline and the three score stickers share one line, and the stickers
     drop under it once there isn't room for both. */
  .head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .head-row h1 { font-size: clamp(34px, 4.6vw, 50px); max-width: 16ch; }
  .head-row .pills { margin-top: 0; }
  /* Pre-kickoff landing page: the way back to the last finished recap, next to the title. */
  .recap-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; box-shadow: 3px 3px 0 var(--drop); font: 700 14px/1.1 var(--body); text-decoration: none; white-space: nowrap; transform: rotate(-1.5deg); }
  .recap-btn:hover { transform: translate(-1px, -2px) rotate(-1.5deg); box-shadow: 6px 6px 0 var(--drop); }
  .head-row.has-recap { justify-content: flex-start; gap: 12px 18px; }
  .head-row.has-recap h1 { font-size: clamp(36px, 6.2vw, 62px); max-width: none; }
  .recap-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }
  .pill { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 14px 4px 4px; border-radius: 999px; border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); color: var(--on-pop); }
  .pill-plain { padding-left: 14px; }
  .pill-top { background: var(--lime); transform: rotate(-1.5deg); }
  .pill-mid { background: var(--orange); transform: rotate(-1deg); }
  .pill-bot { background: var(--pink); transform: rotate(1deg); }
  /* the rank medallion: where this score landed among the eight */
  .pill .medal { flex: none; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 999px; background: var(--board); color: var(--on-board); border: 2px solid var(--edge); display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font: 800 15px/1 var(--display); letter-spacing: 0.02em; }
  /* the ordinal rides high without taking part in the line box, so the numeral stays centred */
  .pill .medal .ord { font-size: 9.5px; line-height: 1; align-self: center; margin: -7px 0 0 0.5px; letter-spacing: 0; }
  .pill .txt { display: grid; gap: 1px; font: 600 11px/1.1 var(--body); text-transform: uppercase; letter-spacing: 0.07em; }
  .pill .txt b { font: 700 14px/1.15 var(--body); text-transform: none; letter-spacing: 0; }

  .week-switch, .team-switch { display: flex; gap: 8px; overflow-x: auto; margin-top: 20px; padding: 2px 4px 5px 2px; }
  .week-switch a, .team-switch a { text-decoration: none; font: 700 15px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; border: 2px solid var(--edge); background: var(--card); padding: 8px 12px; border-radius: 10px; white-space: nowrap; }
  .week-switch a:hover, .team-switch a:hover { background: var(--accent-soft); }
  .week-switch a[aria-current="page"], .team-switch a[aria-current="page"] { background: var(--lime); color: var(--on-pop); box-shadow: 3px 3px 0 var(--drop); }
  .team-switch .wk-n { font: 500 11px/1 var(--mono); opacity: 0.65; margin-left: 2px; }
  .team-switch .dot { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: var(--pink); border: 1.5px solid var(--edge); margin-left: 6px; font: 800 10px/1 var(--display); color: var(--on-pop); }

  /* the week toggle: a flip switch, not another row of tabs, so it reads as one control */
  .week-toggle { position: relative; display: inline-flex; flex-shrink: 0; border: 2px solid var(--edge); background: var(--card); border-radius: 999px; box-shadow: 3px 3px 0 var(--drop); }
  .week-toggle .knob { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); background: var(--lime); border-radius: 999px; }
  .week-toggle[data-state="next"] .knob { left: auto; right: 2px; }
  .week-toggle a { position: relative; z-index: 1; text-decoration: none; font: 700 13px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); padding: 8px 14px; white-space: nowrap; }
  .week-toggle a[aria-current="page"] { color: var(--on-pop); }
  .week-toggle .wk-n { font: 500 10.5px/1 var(--mono); opacity: 0.65; margin-left: 3px; }

  /* ---------- sections ---------- */
  section { margin-top: 44px; }
  .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .sec-head h2 { font: 800 28px/1 var(--display); letter-spacing: 0.01em; }
  .sec-head .rule { flex: 1; height: 2px; background: var(--rule); }
  .sec-head .more { font-size: 13.5px; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; }
  .sec-head .more:hover { text-decoration: underline; }
  .sec-sub { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
  .sec-sub.full { max-width: none; }
  .marker { width: 20px; height: 22px; flex: none; border: 2px solid var(--edge); }
  .marker.flag { background: var(--pink); border: none; clip-path: polygon(0 0, 100% 0, 76% 50%, 100% 100%, 0 100%); }
  .marker.ball { background: var(--orange); border-radius: 50% / 38%; transform: rotate(-30deg); width: 24px; height: 15px; }
  .marker.break { background: var(--ink); border: none; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .marker.board { background: var(--accent); border-radius: 5px; }
  .marker.book { background: var(--lime); border-radius: 2px 5px 5px 2px; width: 18px; }

  /* ---------- score boxes ---------- */
  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 18px; }
  a.game { background: var(--card); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; }
  .bug { background: var(--board); color: var(--on-board); display: grid; border-bottom: 2px solid var(--edge); }
  .bug-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 11px 16px; }
  .bug-row + .bug-row { border-top: 1px solid var(--board-2); }
  .bug-row.loser { color: var(--on-board-muted); }
  .bug-mgr { font: 800 23px/1 var(--display); letter-spacing: 0.02em; }
  .bug-team { font-size: 11.5px; color: var(--on-board-muted); margin-top: 3px; }
  .bug-score { font: 800 34px/1 var(--display); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
  .wl { font: 700 11px/1 var(--mono); padding: 4px 6px; border-radius: 4px; }
  .bug .wl.W { background: var(--lime); color: var(--on-pop); transform: rotate(-5deg); }
  .bug .wl.L { background: transparent; color: var(--on-board-muted); border: 1px solid var(--board-2); }
  .game-body { padding: 14px 16px; display: grid; gap: 10px; flex: 1; align-content: space-between; }
  .blurb { margin: 0; font-size: 14.5px; }
  .open { font-size: 13.5px; font-weight: 700; color: var(--accent); }
  a.game:hover .open { text-decoration: underline; }

  /* ---------- landing page: compact matchup cards ---------- */
  .ml-w { flex: none; font: 700 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 6px; border: 1.5px solid var(--edge); background: var(--lime); color: var(--on-pop); transform: rotate(-4deg); }
  /* Pre-kickoff card: each side is its own <details>, the score row is the toggle, and that
     side's lineup opens directly underneath it. Cobalt for the first side, bubblegum for the second. */
  .slot-chip { display: inline-block; min-width: 34px; padding: 3px 0; border-radius: 6px; border: 1.5px solid var(--edge); text-align: center; font: 600 10.5px/1 var(--mono); background: var(--card); color: var(--ink); }
  .slot-chip.s-QB { background: var(--pink); color: var(--on-pop); }
  .slot-chip.s-RB { background: var(--lime); color: var(--on-pop); }
  .slot-chip.s-WR { background: var(--orange); color: var(--on-pop); }
  .slot-chip.s-TE { background: var(--accent-soft); }
  .slot-chip.s-FLEX { background: var(--orange-soft); }
  .slot-chip.s-DST, .slot-chip.s-K { background: var(--pink-soft); }

  /* ---------- landing page: the week in stickers ----------
     Two across on a phone, four across on a laptop. Each sticker's shadow and tag take
     one pop color, with ink text on the tag, never pop-colored text on white. */
  .stickers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 18px; }
  .story { background: var(--card); padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .story .tag { justify-self: start; font: 600 12px/1 var(--script); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 9px; transform: rotate(-3deg); }
  .story .fig { font: 900 34px/0.9 var(--display); font-variant-numeric: tabular-nums; }
  .story p { margin: 0; font-size: 13.5px; line-height: 1.35; }
  .story.orange { box-shadow: 4px 4px 0 var(--orange); } .story.orange .tag { background: var(--orange); }
  .story.lime { box-shadow: 4px 4px 0 var(--lime); } .story.lime .tag { background: var(--lime); }
  .story.pink { box-shadow: 4px 4px 0 var(--pink); } .story.pink .tag { background: var(--pink); }
  .story.accent { box-shadow: 4px 4px 0 var(--accent); } .story.accent .tag { background: var(--accent-soft); color: var(--ink); }
  /* ---------- week hub (the landing page before kickoff) ----------
     One column on a phone; from 860px the matchups take the wide column and Coach's desk and the
     ranked projections sit beside them. Side A of every game is cobalt, side B is pink, and nothing
     relies on the color alone: every cell and bar says who and how much in text. */
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hub-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 28px; }
  .hub-head .page-head { flex: 1 1 340px; }
  .season-strip { flex: 1 1 300px; max-width: 460px; display: grid; gap: 7px; margin-bottom: 8px; }
  .season-strip .lab { display: flex; justify-content: space-between; gap: 10px; font: 500 11.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .season-strip .weeks { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .season-strip .weeks span { height: 24px; border: 2px solid var(--edge); border-radius: 6px; background: var(--card); font: 500 10px/20px var(--mono); text-align: center; color: var(--muted); }
  .season-strip .weeks .done { background: var(--board); color: var(--on-board); }
  .season-strip .weeks .now { background: var(--orange); color: var(--on-pop); box-shadow: 2px 2px 0 var(--drop); transform: translateY(-3px); }
  .season-strip .weeks .po { background: var(--pink-soft); color: var(--ink); }
  .hub-grid { display: grid; gap: 28px; margin-top: 30px; align-items: start; }
  .hub-grid > * { min-width: 0; }
  .hub-side { display: grid; gap: 34px; }
  .hub-side > section { margin-top: 0; }
  .hub-wire { display: grid; gap: 28px; align-items: start; }
  .hub-wire > * { min-width: 0; }
  /* Stacked in the side column: the feed scrolls inside its own panel so a busy week can't
     stretch the page, and the pickups chart sits under it. */
  .hub-wire.stack { gap: 18px; }
  .wire-scroll { max-height: 440px; overflow-y: auto; overscroll-behavior: contain; }
  @media (min-width: 860px) {
    .hub-grid { grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); }
    .hub-wire { grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr); }
    .hub-wire.stack { grid-template-columns: minmax(0, 1fr); }
  }
  .hub-game, .hub-panel, .hub-news a { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--drop); }
  .hub-game { overflow: hidden; }
  .hub-game + .hub-game { margin-top: 18px; }
  .hub-tag { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 2px solid var(--edge); font: 600 12px/1.2 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
  .hub-tag.mine { background: var(--lime-soft); }
  .hub-tag.swing { background: var(--pink-soft); }
  .hub-pill { font: 600 11px/1 var(--script); padding: 4px 9px; border: 2px solid var(--edge); border-radius: 999px; background: var(--lime); color: var(--on-pop); text-transform: none; letter-spacing: 0; }
  .hub-pill.swing { background: var(--pink); }
  .hub-sides { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px 12px; padding: 14px 16px 6px; }
  .hub-sides .nm { font: 800 26px/1 var(--display); }
  .hub-sides .nm a { text-decoration: none; }
  .hub-sides .nm a:hover { text-decoration: underline; }
  .hub-sides .rc { font: 500 11.5px/1.3 var(--mono); color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  .hub-sides .r { text-align: right; }
  .hub-sides .mid { font: 500 11px/1.3 var(--mono); color: var(--muted); text-align: center; }
  .hub-score { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
  .hub-score.r { justify-content: flex-end; }
  .hub-score i { width: 12px; height: 12px; flex: none; border: 2px solid var(--edge); border-radius: 4px; }
  .hub-a { background: var(--accent); } .hub-b { background: var(--pink); }
  .hub-bar { display: flex; height: 14px; margin: 6px 16px 4px; border: 2px solid var(--edge); border-radius: 99px; overflow: hidden; background: var(--rule); }
  .hub-bar span { display: block; height: 100%; }
  .hub-edges { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; padding: 12px 16px 6px; list-style: none; margin: 0; }
  .hub-edges li { border: 2px solid var(--edge); border-radius: 9px; padding: 6px 2px 5px; text-align: center; background: var(--card); min-width: 0; }
  .hub-edges li.a { background: var(--accent-soft); } .hub-edges li.b { background: var(--pink-soft); }
  .hub-edges .sl { display: block; font: 500 10px/1 var(--mono); color: var(--muted); letter-spacing: 0.04em; }
  .hub-edges .mg { display: block; font: 700 13.5px/1.3 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hub-edges .ar { display: block; font: 500 10px/1 var(--mono); }
  .hub-key { padding: 0 16px 12px; margin: 0; font: 500 11px/1.4 var(--mono); color: var(--muted); }
  .hub-key i { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--edge); border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .hub-stake { margin: 0; padding: 11px 16px; border-top: 2px solid var(--edge); background: var(--bg); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13.5px; }
  .hub-stake .odds { font: 700 13px/1 var(--mono); background: var(--card); border: 2px solid var(--edge); border-radius: 8px; padding: 4px 7px; }
  .hub-stake .to { color: var(--muted); }
  .hub-lineups { border-top: 2px solid var(--edge); }
  .hub-lineups > summary { cursor: pointer; list-style: none; padding: 10px 16px; font-weight: 700; font-size: 13.5px; color: var(--accent); }
  .hub-lineups > summary::-webkit-details-marker { display: none; }
  .hub-lineups > summary::after { content: " ▾"; }
  .hub-lineups[open] > summary::after { content: " ▴"; }
  .hub-lineups .cols { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--edge); }
  .hub-lineups .cols > div + div { border-left: 2px solid var(--edge); }
  .hub-lineups table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .hub-lineups caption { text-align: left; padding: 7px 10px 3px; font: 600 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .hub-lineups td { padding: 5px 6px; border-top: 1px solid var(--rule); }
  .hub-lineups td:first-child { padding-left: 10px; width: 40px; font: 500 10px/1 var(--mono); color: var(--muted); }
  .hub-lineups td.r { text-align: right; padding-right: 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .hub-lineups td.zero { font-weight: 700; text-decoration: underline; }
  .hub-panel { padding: 6px 16px 12px; }
  .hub-fix { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .hub-fix:last-of-type { border-bottom: none; }
  .hub-who { font: 700 12px/1 var(--mono); background: var(--accent-soft); color: var(--ink); border: 2px solid var(--edge); border-radius: 8px; padding: 5px 7px; min-width: 64px; text-align: center; text-decoration: none; }
  .hub-who.me { background: var(--orange); color: var(--on-pop); }
  .hub-fix .t { font-weight: 700; font-size: 13.5px; line-height: 1.25; min-width: 0; }
  .hub-fix .t small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .hub-fix .pts { font: 700 12.5px/1 var(--mono); border: 2px solid var(--edge); border-radius: 8px; padding: 4px 6px; background: var(--lime); color: var(--on-pop); white-space: nowrap; }
  .hub-fix .pts.flag { background: var(--pink); }
  .hub-clear { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 0 2px; font-size: 12.5px; color: var(--muted); }
  .hub-clear b { font: 600 11px/1 var(--script); background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 8px; }
  .hub-rank { display: grid; grid-template-columns: minmax(64px, auto) 1fr 46px; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; }
  .hub-rank .nm { font-weight: 700; }
  .hub-rank .tr { height: 14px; background: var(--rule); border: 2px solid var(--edge); border-radius: 99px; overflow: hidden; }
  .hub-rank .tr span { display: block; height: 100%; background: var(--accent); }
  .hub-rank .tr span.me { background: var(--orange); }
  .hub-rank .v { font: 500 12.5px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .hub-note { font: 500 11.5px/1.4 var(--mono); color: var(--muted); margin: 8px 0 0; }
  .hub-day { font: 600 11.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 12px 0 4px; margin: 0; }
  .hub-ev { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .hub-ev:last-child { border-bottom: none; }
  .hub-ev .ic { width: 26px; height: 26px; box-sizing: border-box; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid var(--edge); border-radius: 8px; background: var(--lime); color: var(--on-pop); }
  .hub-ev .ic svg { width: 14px; height: 14px; display: block; }
  .hub-ev .ic.trade { background: var(--orange); } .hub-ev .ic.swap { background: var(--accent-soft); color: var(--ink); } .hub-ev .ic.drop { background: var(--pink-soft); color: var(--ink); }
  .hub-ev .how { color: var(--muted); }
  .hub-news { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
  .hub-news a { padding: 14px 16px; display: grid; gap: 8px; align-content: start; text-decoration: none; }
  .hub-news .h { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .hub-news a:hover .h { text-decoration: underline; }
  .hub-news .src { font: 500 11.5px/1.3 var(--mono); color: var(--muted); }
  .hub-news .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hub-news .tags span { font: 600 11px/1 var(--script); background: var(--accent-soft); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 8px; }
  .hub-news .tags span.me { background: var(--orange); color: var(--on-pop); }
  @media (max-width: 760px) {
    /* The four stickers become one row to swipe: it scrolls inside itself, so the page never does. */
    .stickers.hub-chips { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin-inline: -16px; padding: 2px 20px 8px 16px; scrollbar-width: none; }
    .stickers.hub-chips::-webkit-scrollbar { display: none; }
    .stickers.hub-chips .story { flex: 0 0 68%; scroll-snap-align: start; scroll-margin-left: 16px; }
    .hub-sides .nm { font-size: 22px; } .hub-score { font-size: 32px; }
    .hub-edges { gap: 4px; padding-inline: 12px; } .hub-edges .mg { font-size: 11.5px; }
    .hub-lineups .cols { grid-template-columns: 1fr; } .hub-lineups .cols > div + div { border-left: none; border-top: 2px solid var(--edge); }
  }
  .recap-when { margin-top: 22px; display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--accent-soft); border: 2px solid var(--edge); border-radius: 14px; font-size: 14px; font-weight: 600; }
  .recap-when .d { flex: none; font: 900 26px/0.9 var(--display); background: var(--card); border: 2px solid var(--edge); border-radius: 10px; padding: 6px 9px 4px; }
  .final-lines { background: var(--card); overflow: hidden; display: grid; }
  .final-lines a { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 11px 16px; text-decoration: none; }
  .final-lines a + a { border-top: 2px dashed var(--rule); }
  .final-lines a:hover b { text-decoration: underline; }
  .final-lines .w { display: flex; align-items: center; gap: 8px; font: 800 19px/1.1 var(--display); }
  .final-lines .w .num { font: 700 17px/1 var(--mono); }
  .final-lines .l { color: var(--muted); font: 500 14px/1.2 var(--body); }
  .final-lines .l .num { font-family: var(--mono); }

  /* ---------- matchup page ---------- */
  .versus { margin-top: 18px; background: var(--board); color: var(--on-board); padding: 22px 20px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
  .versus .side { display: grid; gap: 4px; }
  .versus .side.right { text-align: right; justify-items: end; }
  .versus .mgr { font: 800 clamp(26px, 5vw, 40px)/1 var(--display); }
  .versus .mgr a { text-decoration: none; }
  .versus .team { font-size: 12.5px; color: var(--on-board-muted); }
  .versus .score { font: 900 clamp(40px, 8vw, 68px)/1 var(--display); font-variant-numeric: tabular-nums; }
  .versus .side.loser .score, .versus .side.loser .mgr { color: var(--on-board-muted); }
  .versus .vs { font: 600 18px/1 var(--script); color: var(--on-pop); background: var(--lime); border-radius: 999px; padding: 8px 10px; transform: rotate(-6deg); }
  .versus .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--board-2); padding-top: 12px; margin-top: 6px; font: 500 12px/1.4 var(--mono); color: var(--on-board-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  @media (max-width: 520px) {
    .versus { grid-template-columns: 1fr; }
    .versus .side.right { text-align: left; justify-items: start; }
    .versus .vs { display: none; }
  }
  .decided { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .decided li { background: var(--card); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
  .decided .tag { font: 600 11.5px/1 var(--mono); padding: 5px 7px; border-radius: 6px; border: 1.5px solid var(--edge); white-space: nowrap; margin-top: 1px; color: var(--on-pop); }
  .decided .tag.good { background: var(--lime); }
  .decided .tag.bad { background: var(--pink); }
  .decided .tag.info { background: var(--card); color: var(--ink); }
  /* An evaluated trade (scripts/trade_eval.py): who goes where, then both sides' numbers */
  .trade { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
  .trade-side { border: 1.5px solid var(--edge); border-radius: 8px; padding: 8px 10px; display: grid; gap: 3px; font-size: 14px; }
  .trade-side b { font: 600 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .trade-math { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 6px 12px; margin: 0; }
  .trade-math div { display: grid; gap: 2px; }
  .trade-math dt { font-size: 12px; color: var(--muted); }
  .trade-math dd { margin: 0; font: 600 13px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .trade-flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .trade-flags span { font: 600 11px/1 var(--mono); border: 1.5px solid var(--edge); border-radius: 999px; padding: 4px 8px; }
  .card .fit { font: 600 11px/1 var(--mono); background: var(--lime); color: var(--on-pop); border: 1.5px solid var(--edge); border-radius: 999px; padding: 4px 8px; transform: rotate(-2deg); white-space: nowrap; }

  .box-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 18px; }
  .lineup { background: var(--card); padding: 14px 16px; }
  .lineup h3 { font: 800 21px/1.1 var(--display); display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .lineup h3 a { text-decoration: none; }
  .lineup table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .lineup th { text-align: left; font: 600 11px/1 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 0 6px; }
  .lineup th.r, .lineup td.r { text-align: right; }
  .lineup td { padding: 5px 0; border-top: 1px solid var(--rule); vertical-align: baseline; }
  .lineup td.slot { width: 44px; color: var(--muted); font: 500 11px/1 var(--mono); }
  .lineup td.r { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
  /* A little room at both ends of every row, so an open row's outline has somewhere to go
     without landing on a name or a number. */
  .lineup th:first-child, .lineup td:first-child { padding-left: 5px; }
  .lineup th:last-child, .lineup td:last-child { padding-right: 5px; }
  .lineup td.proj { color: var(--muted); font-size: 12px; }
  .lineup tr.bench-head td { padding-top: 12px; border-top: none; font: 700 11px/1 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .lineup tr.bench td { color: var(--muted); }
  .lineup tr.bench.hot td { color: var(--ink); font-weight: 700; background: var(--pink-soft); }
  .lineup tr.bench.hot td.slot::after { content: " ⚑"; color: var(--ink); }
  /* On a live box score each player carries his NFL team logo (the slot column already
     names the position), and a player whose game is on right now wears a pulsing sticker. */
  .lineup td .tlogo { width: 19px; height: 19px; margin-left: 6px; vertical-align: -4px; object-fit: contain; }
  .lineup td .playing { display: inline-flex; align-items: center; white-space: nowrap; margin-left: 5px;
    font: 500 10.5px/1 var(--script); color: var(--on-pop); background: var(--lime);
    border: 1.5px solid var(--edge); border-radius: 999px; padding: 3px 7px 3px 5px; vertical-align: 1px; }
  /* The sticker is lime in both themes, so the dot keeps the one red that reads on it. */
  .lineup td .playing .live-dot { width: 7px; height: 7px; margin-right: 4px; vertical-align: 0; background: #c0392b; }
  .lineup .opt { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .lineup .opt b { color: var(--ink); }

  /* the player card: tap a row on the Coach page for how his points happened */
  .lineup button.peek { display: flex; width: 100%; gap: 6px; align-items: baseline; padding: 0;
    margin: -2px 0; background: none; border: 0; border-radius: 6px; color: inherit; font: inherit;
    text-align: left; cursor: pointer; }
  .lineup button.peek .chev { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: 11px;
    transform: rotate(0deg); transition: transform 0.15s ease; }
  .lineup button.peek[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .lineup button.peek .chev::before { content: "▶"; }
  .lineup button.peek:hover .peek-name { text-decoration: underline; }
  /* An open row becomes the top of its own card: same fill, and the outline runs from the
     player's name down around the card, so the two are one sticker rather than a box that
     happens to sit underneath. The side edges are inset shadows, not borders, so opening a
     row can't nudge the text in it sideways. */
  .lineup tr.peek-open > td { background: var(--accent-soft); border-top-color: transparent;
    box-shadow: inset 0 2px 0 var(--edge); }
  .lineup tr.peek-open > td:first-child { box-shadow: inset 2px 2px 0 var(--edge);
    border-top-left-radius: 11px; }
  .lineup tr.peek-open > td:last-child { box-shadow: inset -2px 2px 0 var(--edge);
    border-top-right-radius: 11px; }
  .lineup tr.peek-row > td { padding: 0 0 12px; border-top: none; }
  .peek-body { border: 2px solid var(--edge); border-top: none; border-radius: 0 0 12px 12px;
    background: var(--accent-soft); padding: 4px 12px 10px; display: grid; gap: 8px; }
  .peek-blurb { margin: 0; font-size: 13.5px; }
  .peek-lines { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .peek-lines caption { text-align: left; font: 600 10.5px/1 var(--body); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em; padding-bottom: 4px; }
  .peek-lines th { width: 100%; font: 500 12.5px/1.4 var(--body); color: var(--ink); text-align: left;
    text-transform: none; letter-spacing: 0; padding: 3px 0; border-top: 1px solid var(--rule); }
  .peek-lines td { width: 1%; padding: 3px 0 3px 14px; border-top: 1px solid var(--rule); text-align: right;
    font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .peek-lines td.val { color: var(--muted); padding-left: 10px; }
  .peek-lines tfoot th, .peek-lines tfoot td { font-weight: 700; border-top: 2px solid var(--edge); }
  .peek-notes { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
  .peek-notes li::marker { color: var(--accent); }
  .peek-none { margin: 0; font-size: 12.5px; color: var(--muted); }

  .other-games { display: flex; flex-wrap: wrap; gap: 10px; }
  .other-games a { text-decoration: none; background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; box-shadow: 3px 3px 0 var(--drop); }

  /* ---------- award cards: each kind gets its own colored sticker shadow ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 18px; }
  .card { background: var(--card); padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
  .card.balls { box-shadow: 5px 5px 0 var(--orange); }
  .card.flags { box-shadow: 5px 5px 0 var(--pink); }
  .card.breaks { box-shadow: 5px 5px 0 var(--drop); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .who { font: 800 14px/1 var(--display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .who a { text-decoration: none; }
  .who a:hover { color: var(--accent); }
  .stat { font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; padding: 5px 8px; border-radius: 6px; white-space: nowrap; border: 1.5px solid var(--edge); color: var(--on-pop); transform: rotate(-3deg); }
  .card.balls .stat { background: var(--orange); }
  .card.flags .stat { background: var(--pink); }
  .card.breaks .stat { background: var(--lime); }
  .card h3 { font: 800 22px/1.05 var(--display); letter-spacing: 0.01em; }
  .card p { margin: 0; font-size: 14.5px; }

  /* ---------- tables ---------- */
  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 16px 32px; }
  .table-scroll { overflow-x: auto; }
  table.std { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.std th { text-align: left; font: 600 11.5px/1.2 var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 10px 8px 0; border-bottom: 2px solid var(--edge); white-space: nowrap; }
  table.std td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--rule); }
  table.std tbody tr:last-child td { border-bottom: none; }
  table.std .r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.std th.r { font-family: var(--body); }
  table.std .rank { width: 30px; font: 800 19px/1 var(--display); color: var(--muted); }
  table.std tbody tr:first-child .rank { color: var(--accent); }
  table.std .mv { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 8px; border-radius: 999px; font: 700 12.5px/1 var(--mono); }
  table.std .mv.up { color: var(--win); background: color-mix(in srgb, var(--win) 16%, transparent); }
  table.std .mv.down { color: var(--loss); background: color-mix(in srgb, var(--loss) 14%, transparent); }
  table.std .mv.flat { padding: 4px 0 4px 10px; color: var(--muted); font-weight: 500; }
  table.std tr.moved-up td { background: color-mix(in srgb, var(--win) 6%, transparent); }
  table.std tr.moved-down td { background: color-mix(in srgb, var(--loss) 6%, transparent); }
  table.std .mgr a { font-weight: 700; text-decoration: none; }
  table.std .mgr a:hover { color: var(--accent); text-decoration: underline; }
  table.std .tname { display: block; font-size: 12px; color: var(--muted); }
  /* the profile button: team pages are easy to miss behind a plain name link, so every
     standings row gets an obvious way in, lined up down the right of the team column */
  table.std .mgr-cell { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  table.std .mgr-who { display: block; white-space: nowrap; }
  .profile-btn { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 999px; background: var(--accent); color: var(--on-accent); border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); font: 600 12px/1.25 var(--script); letter-spacing: 0.01em; white-space: nowrap; }
  table.std .mgr a.profile-btn:hover { color: var(--on-accent); text-decoration: none; }
  .profile-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--drop); }
  .profile-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--drop); }
  .res { font: 700 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px; }
  .res.W { color: var(--win); background: color-mix(in srgb, var(--win) 14%, transparent); }
  .res.L { color: var(--loss); background: color-mix(in srgb, var(--loss) 12%, transparent); }
  .std-card { background: var(--card); padding: 16px 16px 6px; }

  .heat td.cell { text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; padding: 9px 6px; border: 3px solid var(--card); border-radius: 8px; white-space: nowrap; }
  .heat td.cell a { text-decoration: none; }
  .heat td.cell a:hover { text-decoration: underline; }
  .heat td.cell .res { margin-left: 4px; background: var(--card); }
  .heat-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 8px; font-size: 12px; color: var(--muted); }
  .heat-legend .ramp { width: 120px; height: 10px; border-radius: 5px; border: 1px solid var(--rule); background: linear-gradient(90deg, color-mix(in srgb, var(--heat-hi) 6%, var(--card)), color-mix(in srgb, var(--heat-hi) 48%, var(--card))); }

  /* ---------- playoff picture ---------- */
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  /* the playoff line: a dashed cobalt rule under the last seed in, labeled once */
  table.std tr.po-cut td { border-bottom: 2px dashed var(--accent); }
  table.std tr.po-line td { padding: 6px 0 10px; border-bottom: 1px solid var(--rule); }
  .po-line-tag { display: inline-block; font: 600 12px/1 var(--script); color: var(--accent-ink); background: var(--accent-soft); border: 1.5px dashed var(--accent); border-radius: 999px; padding: 4px 10px; }
  .bye-tag { display: inline-block; margin-left: 7px; vertical-align: 1px; font: 600 11px/1 var(--script); color: var(--on-pop); background: var(--lime); border: 1.5px solid var(--edge); border-radius: 999px; padding: 3px 7px; transform: rotate(-4deg); }

  .bracket { display: grid; grid-template-columns: repeat(var(--br-cols, 3), minmax(0, 1fr)); gap: 18px; align-items: stretch; }
  .br-col { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; min-width: 0; }
  .br-col h3 { font: 600 12.5px/1 var(--script); letter-spacing: 0.02em; color: var(--muted); text-transform: uppercase; }
  .br-game { background: var(--card); border: 2px solid var(--edge); box-shadow: 4px 4px 0 var(--drop); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; }
  .br-team { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .br-team a { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .br-team a:hover { color: var(--accent); text-decoration: underline; }
  .br-team.fav { font-weight: 800; }
  .br-seed { min-width: 24px; height: 24px; padding: 0 5px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: var(--board); color: var(--on-board); font: 800 13px/1 var(--display); }
  .br-check { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--lime); color: var(--on-pop); border: 1.5px solid var(--edge); font: 700 12px/1 var(--body); }
  .br-odds { display: grid; gap: 4px; padding-top: 6px; border-top: 1px dashed var(--rule); font: 500 12px/1.2 var(--mono); color: var(--muted); }
  .br-champ { background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); box-shadow: 4px 4px 0 var(--drop); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; justify-items: start; }
  .br-champ .badge-tilt { font: 600 12px/1 var(--script); background: var(--card); color: var(--ink); border: 1.5px solid var(--edge); border-radius: 999px; padding: 4px 9px; }
  .br-champ-name { font: 800 30px/1 var(--display); color: var(--on-pop); }
  .br-champ-name a { color: var(--on-pop); text-decoration: none; }
  .br-champ-name a:hover { text-decoration: underline; }
  .br-champ .sub { font-size: 13px; font-weight: 600; }
  @media (max-width: 760px) { .bracket { grid-template-columns: 1fr; } }
  /* phones: the team name already links to her profile, so the team-name line goes to buy room for the numbers */
  @media (max-width: 520px) { table.std.po-odds .tname { display: none; } .po-make { min-width: 110px; } }

  /* ---------- playoff bracket + what-if ---------- */
  .pb-promo { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px 22px; background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--drop); padding: 16px 20px; margin: 0 0 26px; }
  .pb-promo-txt { display: flex; flex-direction: column; flex: 1; min-width: 230px; }
  .pb-eyebrow { align-self: flex-start; background: var(--board); color: var(--lime); font: 600 11px/1 var(--script); letter-spacing: 0.12em; padding: 5px 10px; border-radius: 999px; margin-bottom: 8px; }
  .pb-promo-txt b { font: 800 30px/1.05 var(--display); }
  .pb-promo-sub { font-size: 14px; font-weight: 500; margin-top: 5px; }
  .pb-cta { background: var(--board); color: var(--lime); border: 2px solid var(--edge); border-radius: 999px; box-shadow: 4px 4px 0 var(--card); padding: 14px 24px; font: 700 18px/1.1 var(--body); white-space: nowrap; cursor: pointer; }
  .pb-cta i { font-style: normal; display: inline-block; margin-left: 6px; }
  .pb-cta:hover { transform: translate(-1px, -2px); box-shadow: 6px 6px 0 var(--card); }
  .pb-cta:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--card); }
  @media (prefers-reduced-motion: no-preference) {
    .pb-cta { animation: pb-nudge 2.4s ease-in-out infinite; transition: box-shadow 0.1s; }
    .pb-cta:hover, .pb-cta:active { animation: none; }
    .pb-cta i { transition: transform 0.15s; }
    .pb-cta:hover i { transform: translateX(5px); }
    .pb-card.pulse, .pb-champ-card.pulse { animation: pb-pop 0.35s ease; }
    .pb-tag.odds { animation: pb-stick 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
    .pb-bar i { transition: width 0.3s; }
    .pb-col { transition: opacity 0.35s; }
  }
  @keyframes pb-nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes pb-pop { 0% { transform: scale(0.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
  @keyframes pb-stick { 0% { transform: rotate(3deg) scale(0.4); opacity: 0; } 100% { transform: rotate(3deg) scale(1); opacity: 1; } }

  .pb-panel { display: none; flex-wrap: wrap; align-items: center; gap: 12px 20px; background: var(--card); border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--drop); padding: 12px 16px; margin: 0 0 22px; }
  .pb-root.whatif .pb-panel { display: flex; }
  .pb-root.whatif .pb-promo, .pb-root.whatif .pb-intro, .pb-root.whatif .pb-legend { display: none; }
  .pb-steps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pb-dot { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 2px; color: var(--muted); font: 700 13px/1 var(--body); cursor: pointer; border-radius: 999px; }
  .pb-dot b { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--edge); display: grid; place-items: center; background: var(--card); color: var(--ink); font-size: 13px; }
  .pb-dot.cur { color: var(--ink); }
  .pb-dot.cur b { background: var(--board); color: var(--on-board); }
  .pb-dot.done b { background: var(--lime); color: var(--on-pop); }
  .pb-dot:disabled { cursor: default; opacity: 0.5; }
  .pb-sep { width: 20px; height: 3px; background: var(--rule); border-radius: 3px; }
  .pb-msg { flex: 1; min-width: 200px; font-weight: 700; font-size: 15px; }
  .pb-msg span { display: block; font-weight: 500; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .pb-tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .pb-ghost { background: var(--card); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; padding: 7px 13px; font: 700 13px/1 var(--body); cursor: pointer; }
  .pb-ghost:hover:not(:disabled) { background: var(--lime); color: var(--on-pop); }
  .pb-ghost:disabled { opacity: 0.35; cursor: default; }

  .pb-scroll { overflow-x: auto; padding: 8px 8px 28px; margin: 0 -8px; }
  .pb-bracket { display: flex; align-items: flex-start; min-width: 860px; position: relative; }
  .pb-col { flex: none; }
  .pb-col h3 { height: 30px; margin: 0; font: 600 12.5px/16px var(--script); letter-spacing: 0.02em; color: var(--muted); text-transform: uppercase; }
  .pb-col.semis, .pb-col.final { width: 280px; }
  .pb-col.champ { width: 224px; }
  .pb-col.final .pb-card { margin-top: 86px; }
  .pb-col.champ .pb-champ-card { margin-top: 64px; }
  .pb-stack { display: flex; flex-direction: column; gap: 40px; }
  .pb-card { position: relative; height: 132px; background: var(--card); border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--drop); padding: 8px; display: flex; flex-direction: column; justify-content: space-between; }
  .pb-row { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font: 700 17px/1 var(--body); color: var(--ink); width: 100%; text-align: left; background: transparent; border: 2px solid transparent; }
  .pb-seed { width: 26px; height: 26px; border-radius: 50%; background: var(--board); color: var(--on-board); font: 800 14px/1 var(--display); display: grid; place-items: center; flex: none; }
  .pb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; color: inherit; }
  a.pb-name:hover { color: var(--accent); text-decoration: underline; }
  .pb-pct { font: 500 14px/1 var(--mono); color: var(--muted); }
  .pb-ck { width: 20px; height: 20px; flex: none; border-radius: 50%; font: 700 11px/1 var(--body); display: grid; place-items: center; }
  .pb-row.fav { background: var(--lime); color: var(--on-pop); }
  .pb-row.fav a.pb-name:hover { color: var(--on-pop); }
  .pb-row.fav .pb-pct { color: var(--on-pop); font-weight: 600; }
  .pb-row.fav .pb-ck { border: 2px solid var(--edge); background: var(--card); color: var(--ink); }
  .pb-row.out { opacity: 0.45; }
  .pb-row.tbd { justify-content: center; color: var(--muted); font-weight: 500; font-size: 15px; font-style: italic; }
  .pb-row.pickable { cursor: pointer; border: 2px dashed var(--rule); }
  .pb-row.pickable.fav { border: 2px solid transparent; }
  .pb-row.pickable:not(.fav):hover { border-color: var(--edge); background: var(--bg); }
  .pb-bar { height: 8px; border-radius: 8px; border: 1.5px solid var(--edge); background: var(--accent-soft); overflow: hidden; margin: 0 4px 2px; }
  .pb-bar i { display: block; height: 100%; background: var(--accent); }
  .pb-conn { flex: none; width: 52px; margin-top: 30px; }
  .pb-conn svg { display: block; overflow: visible; stroke: var(--edge); }
  .pb-conn path { transition: stroke 0.2s; }
  .pb-conn path.on { stroke: var(--accent); }
  .pb-champ-card { position: relative; height: 176px; background: var(--lime); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--drop); padding: 18px; display: flex; flex-direction: column; justify-content: center; }
  .pb-champ-card.empty { background: var(--card); color: var(--muted); border-style: dashed; box-shadow: none; }
  .pb-champ-card .n { font: 800 44px/1 var(--display); overflow-wrap: anywhere; }
  .pb-champ-card .n a { color: inherit; text-decoration: none; }
  .pb-champ-card .n a:hover { text-decoration: underline; }
  .pb-champ-card .t { font-size: 14px; font-weight: 600; margin-top: 6px; line-height: 1.35; }
  .pb-tag { position: absolute; top: -16px; left: 14px; background: var(--card); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 12px; font: 600 13px/1.1 var(--script); transform: rotate(-3deg); white-space: nowrap; }
  .pb-tag.odds { top: auto; left: auto; bottom: -15px; right: 12px; transform: rotate(3deg); background: var(--board); color: var(--lime); font: 500 12px/1.1 var(--mono); box-shadow: 2px 2px 0 var(--lime); }
  .pb-tag.odds b { font-size: 15px; color: var(--on-board); font-weight: 700; }
  .pb-legend { margin: 8px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  .pb-legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--edge); margin-right: 6px; vertical-align: -2px; }
  .pb-legend .l1::before { background: var(--lime); }
  .pb-legend .l2::before { background: var(--accent); }
  .pb-foot { margin: 6px 0 0; max-width: 62ch; font-size: 12.5px; line-height: 1.5; color: var(--muted); }

  /* what-if: focus mode, one round per screen, panned sideways */
  .pb-root.whatif .pb-scroll { overflow-x: hidden; padding: 8px 0 28px; margin: 0; }
  .pb-root.whatif .pb-bracket { min-width: 0; }
  .pb-root.whatif .pb-conn { display: none; }
  .pb-root.whatif .pb-col { width: 100%; flex: 0 0 100%; display: flex; flex-direction: column; align-items: center; padding: 0 8px; opacity: 0.35; pointer-events: none; }
  .pb-root.whatif .pb-col.active { opacity: 1; pointer-events: auto; }
  .pb-root.whatif .pb-col > * { width: min(420px, 100%); }
  .pb-root.whatif .pb-col h3 { text-align: center; }
  .pb-root.whatif .pb-col.final .pb-card, .pb-root.whatif .pb-col.champ .pb-champ-card { margin-top: 0; }
  .pb-root.whatif .pb-card { height: 140px; }
  .pb-root.whatif .pb-stack { gap: 28px; }
  @media (max-width: 600px) {
    .pb-promo { padding: 16px; }
    .pb-promo-txt b { font-size: 25px; }
    .pb-cta { width: 100%; font-size: 17px; }
    .pb-sep { display: none; }
    .pb-dot { font-size: 12px; }
    .pb-tools { width: 100%; }
    .pb-tools .pb-ghost { flex: 1; }
  }

  /* a share bar: cobalt fill on a soft track, the number always printed beside it */
  .po-bar { display: block; height: 10px; border-radius: 999px; background: var(--accent-soft); border: 1.5px solid var(--edge); overflow: hidden; }
  .po-bar > span { display: block; height: 100%; background: var(--accent); }
  .br-odds .po-bar { height: 8px; }
  .po-make { display: grid; grid-template-columns: minmax(60px, 1fr) auto; align-items: center; gap: 4px 8px; min-width: 150px; }
  .po-make .num { font-size: 13px; text-align: right; }
  .po-label { grid-column: 1 / -1; justify-self: start; font: 600 11px/1 var(--script); color: var(--ink); background: var(--card); border: 1.5px solid var(--edge); border-radius: 999px; padding: 3px 7px; }
  .po-label.lock, .po-label.bye, .po-label.in { background: var(--lime); color: var(--on-pop); }
  .po-label.comfy { background: var(--accent-soft); }
  .po-label.bubble { background: var(--orange-soft); }
  .po-label.long { background: var(--pink-soft); }
  .po-label.near-out, .po-label.out { color: var(--muted); }
  .po-trend { white-space: nowrap; }
  .po-trend.down { color: var(--muted); }
  /* the heat map's playoff line runs down between two seed columns */
  .po-heat td.cell { min-width: 52px; }
  .po-heat .po-sep { width: 6px; padding: 0; border-bottom-color: transparent;
    background: repeating-linear-gradient(to bottom, var(--accent) 0 6px, transparent 6px 11px) center / 2px 100% no-repeat; }

  .leaders { list-style: none; margin: 0; padding: 0; display: grid; }
  .leaders li { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 2px dashed var(--rule); }
  .leaders .mug { grid-row: 1 / span 2; grid-column: 1; align-self: center; position: relative; width: 46px; height: 46px; }
  .leaders .shot { display: block; width: 100%; height: 100%; border: 2px solid var(--edge); border-radius: 50%; background: var(--accent-soft); object-fit: cover; object-position: center; }
  /* the club badge, tucked on the corner of the photo so the row gains no extra line */
  .leaders .logo { position: absolute; right: -5px; bottom: -3px; width: 24px; height: 24px; border: 2px solid var(--edge); border-radius: 50%; background: var(--logo-chip); object-fit: contain; padding: 1px; }
  .leaders .pname { font-weight: 700; grid-column: 2; }
  .leaders .ppos { font-weight: 600; font-size: 12.5px; color: var(--muted); }
  .leaders .meta { font-size: 12.5px; color: var(--muted); grid-column: 2; }
  .leaders .meta a { text-decoration: none; font-weight: 700; }
  .leaders .pts { grid-row: 1 / span 2; grid-column: 3; align-self: center; font: 800 20px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--on-pop); background: var(--orange); border: 2px solid var(--edge); border-radius: 10px; padding: 6px 8px; transform: rotate(-2deg); }

  .stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 14px; margin-top: 14px; }
  .tile { background: var(--card); padding: 12px 14px; }
  .tile:nth-child(1) { background: var(--lime); color: var(--on-pop); }
  .tile:nth-child(1) .label, .tile:nth-child(1) .sub { color: var(--on-pop); }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font: 800 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 12px; color: var(--muted); }

  .terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 0 28px; margin: 0; }
  .term { padding: 12px 0; border-top: 2px dashed var(--rule); }
  .term dt { font: 800 19px/1.1 var(--display); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .term dt a { font: 600 11.5px/1 var(--body); color: var(--accent); text-decoration: none; }
  .term dd { margin: 0; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips a { text-decoration: none; background: var(--card); color: var(--ink); border: 2px solid var(--edge); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 700; box-shadow: 2px 2px 0 var(--drop); }
  .chips a:nth-child(3n+1) { background: var(--lime); color: var(--on-pop); }
  .chips a:nth-child(3n+2) { background: var(--pink); color: var(--on-pop); }
  .chips a:nth-child(3n) { background: var(--orange); color: var(--on-pop); }
  .chips a:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--drop); }

  /* ---------- coach ---------- */
  /* One card per team on the overview: the manager, what needs doing, a way in. */
  .cc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .cc-head .todo { flex: none; }
  /* her top two items as a mini checklist; the box color is how urgent each one is */
  .cc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .cc-list li { display: grid; grid-template-columns: 18px 1fr; gap: 9px; align-items: start; font-size: 14px; line-height: 1.3; }
  .cc-list small { display: block; margin-top: 2px; color: var(--muted); font: 500 11.5px/1.3 var(--mono); }
  .cc-box { width: 18px; height: 18px; margin-top: 1px; border: 2px solid var(--edge); border-radius: 5px; background: var(--card); }
  .cc-box.now { background: var(--pink); }
  .cc-box.watch { background: var(--orange); }
  .cc-box.info { background: var(--accent-soft); }
  /* the count sticker: how many things need doing before kickoff */
  .todo { justify-self: start; font: 600 12.5px/1 var(--script); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; padding: 5px 11px; transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--drop); }
  .todo.now { background: var(--pink); }
  .todo.watch { background: var(--orange); }
  .todo.clear { background: var(--lime); }
  /* an advice card borrows the award card's sticker, colored by how urgent it is */
  .card.now { box-shadow: 5px 5px 0 var(--pink); }
  .card.watch { box-shadow: 5px 5px 0 var(--orange); }
  .card.info { box-shadow: 5px 5px 0 var(--drop); }

  /* Coach overview: your team pinned on top, a radar of the league's loudest items, then the
     "where everyone's strong" grid. One column on a phone; from 860px the hero and radar sit side by side. */
  .coach-top { display: grid; gap: 22px; margin-top: 14px; }
  /* the global `section` margin would stack on the grid's own and open a gap under the header */
  .coach-top > section { margin-top: 0; }
  @media (min-width: 860px) { .coach-top { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
  .coach-hero { position: relative; display: grid; gap: 14px; padding: 22px 20px 20px; background: var(--accent-soft); color: var(--ink);
    border: 2px solid var(--edge); border-radius: 14px; box-shadow: 5px 5px 0 var(--accent); }
  .you-sticker { position: absolute; top: -14px; right: 18px; font: 600 14px/1 var(--script); color: var(--on-pop); background: var(--pink);
    border: 2px solid var(--edge); border-radius: 999px; padding: 6px 13px; transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--drop); }
  .ch-eyebrow { margin: 0 0 4px; font: 600 12px/1 var(--script); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .ch-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; }
  .ch-who { flex: 0 1 auto; min-width: 0; }
  .ch-head .mgr { margin: 0; font: 900 clamp(36px, 7vw, 48px)/0.95 var(--display); }
  .ch-head .tname { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .ch-head .todo { flex: none; margin: 6px 0 0 auto; }
  .ch-stand { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; font: 500 13px/1.3 var(--mono); color: var(--muted); }
  .ch-stand .po-label { font-family: var(--body); }
  .ch-game { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px; align-items: end; padding: 14px; background: var(--card);
    border: 2px solid var(--edge); border-radius: 12px; }
  .ch-vs { font-size: 14px; }
  .ch-vs b { font: 800 22px/1 var(--display); }
  .ch-vs span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .ch-proj { text-align: right; }
  .ch-proj .n { display: block; font: 800 34px/1 var(--display); }
  .ch-proj .l { font: 500 11.5px/1.2 var(--mono); color: var(--muted); }
  .ch-game .fo-bar { grid-column: 1 / -1; }
  .ch-sum { margin: 0; font-size: 15.5px; line-height: 1.45; }
  .ch-list li { font-size: 15px; }
  .ch-go { flex: none; align-self: center; padding: 9px 16px; font-size: 14px; }
  .ch-pick { display: grid; gap: 12px; }
  .ch-pick p { margin: 0; font-size: 15px; }
  .ch-pick .profile-btn { justify-self: start; cursor: pointer; padding: 9px 16px; font-size: 14px; }

  /* Coach's hello: a modal with no way out but picking a team. Names wrap, never scroll. */
  .pick-dialog { width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow-y: auto; margin: auto; padding: 22px 20px 20px;
    background: var(--accent-soft); color: var(--ink); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 5px 5px 0 var(--accent); }
  .pick-dialog::backdrop { background: rgba(10, 20, 50, 0.6); }
  .pick-dialog h2 { margin: 0 0 6px; font: 900 clamp(32px, 8vw, 40px)/1 var(--display); }
  .pick-dialog p { margin: 0 0 16px; font-size: 15px; }
  .pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pick-grid button { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: var(--ink);
    font: 700 16px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; border: 2px solid var(--edge); background: var(--card);
    padding: 13px 10px; border-radius: 10px; box-shadow: 3px 3px 0 var(--drop); }
  .pick-grid button:hover, .pick-grid button:focus-visible { background: var(--lime); color: var(--on-pop); }
  .pick-grid button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }
  .pick-dialog .pick-hint { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-size: 13.5px; color: var(--muted); }
  .pick-dialog .dot, .pick-grid .dot { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: var(--pink); border: 1.5px solid var(--edge); font: 800 10px/1 var(--display); color: var(--on-pop); }

  /* the split win-probability bar: filled halves, navy or white ink on top */
  .fo-bar { display: flex; height: 28px; border: 2px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--card); }
  .fo-bar span { display: flex; align-items: center; min-width: 3.6em; padding: 0 10px; font: 500 12px/1 var(--mono); }
  .fo-bar .a { background: var(--accent); color: var(--on-accent); }
  .fo-bar .b { justify-content: flex-end; background: var(--pink); color: var(--on-pop); border-left: 2px solid var(--edge); }

  /* league radar: three sticker tiles, one pop color each */
  .radar { display: grid; gap: 16px; }
  .radar h2 { margin: 0; font: 800 20px/1 var(--display); text-transform: uppercase; letter-spacing: 0.03em; }
  .radar-tile { display: grid; gap: 6px; padding: 14px 16px; text-decoration: none; color: var(--ink); border: 2px solid var(--edge);
    border-radius: 14px; box-shadow: 4px 4px 0 var(--drop); }
  .radar-tile.swap { background: var(--orange-soft); }
  .radar-tile.close { background: var(--lime-soft); }
  .radar-tile.hurt { background: var(--pink-soft); }
  .radar-tile .rt-tag { justify-self: start; font: 600 12px/1 var(--script); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 10px; }
  .radar-tile.swap .rt-tag { background: var(--orange); transform: rotate(-2deg); }
  .radar-tile.close .rt-tag { background: var(--lime); }
  .radar-tile.hurt .rt-tag { background: var(--pink); transform: rotate(-2deg); }
  .rt-main { font: 800 21px/1.1 var(--display); }
  .rt-sub { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font: 500 12.5px/1.3 var(--mono); color: var(--muted); }
  .rt-sub b { font: 800 18px/1 var(--display); color: var(--ink); }
  .rt-pill { font: 600 11.5px/1 var(--script); color: var(--on-pop); background: var(--pink); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 8px; }
  .rt-empty { margin: 0; font-size: 14px; color: var(--muted); }

  .you-tag { margin-left: 6px; vertical-align: 4px; font: 600 11px/1 var(--script); color: var(--on-pop); background: var(--pink); border: 2px solid var(--edge); border-radius: 999px; padding: 2px 7px; }
  @media (prefers-reduced-motion: no-preference) { a.radar-tile { transition: transform 0.12s ease, box-shadow 0.12s ease; } }
  a.radar-tile:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--drop); }
  a.radar-tile:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }

  /* "Where everyone's strong": a cobalt heat grid. Rank 1 is solid cobalt, rank 8 almost white;
     ranks 1-2 take the on-accent ink, the rest the page ink, which holds 4.5:1 in both themes.
     The rank number and the corner sticker say the same thing, so color is never the only cue. */
  .strength { border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--drop); background: var(--card); }
  .strength table { width: 100%; min-width: 640px; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  .strength th, .strength td { padding: 0; text-align: center; }
  .strength thead th { padding: 10px 4px; font: 600 12.5px/1 var(--mono); letter-spacing: 0.04em; color: var(--muted); border-bottom: 2px solid var(--edge); }
  .strength thead th:first-child, .strength tbody th { position: sticky; left: 0; z-index: 1; text-align: left; padding-left: 14px; background: var(--card); border-right: 2px solid var(--edge); }
  .strength thead th:first-child, .strength tbody th { width: 148px; }
  .strength tbody th { padding-right: 8px; font: 800 20px/1 var(--display); white-space: nowrap; }
  .strength tbody th a { color: var(--ink); text-decoration: none; }
  .strength tbody th a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .strength td { position: relative; height: 52px; border: 2px solid var(--card); color: var(--ink); }
  .strength .rk { font: 500 20px/1 var(--mono); }
  .strength td.avg { background: var(--card); border-left: 2px solid var(--edge); }
  .strength td.avg .rk { font-weight: 700; }
  .strength td.h1 { background: var(--accent); }
  .strength td.h2 { background: color-mix(in srgb, var(--accent) 84%, var(--card)); }
  .strength td.h3 { background: color-mix(in srgb, var(--accent) 62%, var(--card)); }
  .strength td.h4 { background: color-mix(in srgb, var(--accent) 52%, var(--card)); }
  .strength td.h5 { background: color-mix(in srgb, var(--accent) 38%, var(--card)); }
  .strength td.h6 { background: color-mix(in srgb, var(--accent) 26%, var(--card)); }
  .strength td.h7 { background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
  .strength td.h8 { background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
  .strength td.h1, .strength td.h2 { color: var(--on-accent); }
  /* your row: outlined all the way round, manager cell tinted, "You" tag beside the name */
  .strength tbody tr.me th { background: var(--accent-soft); box-shadow: inset 0 3px 0 var(--edge), inset 0 -3px 0 var(--edge), inset 3px 0 0 var(--edge); }
  .strength tbody tr.me td { box-shadow: inset 0 3px 0 var(--edge), inset 0 -3px 0 var(--edge); }
  .strength tbody tr.me td:last-child { box-shadow: inset 0 3px 0 var(--edge), inset 0 -3px 0 var(--edge), inset -3px 0 0 var(--edge); }
  /* the corner sticker: lime for a team's best spot, pink for her weakest, each with its own glyph */
  .corner { position: absolute; top: 2px; right: 2px; display: grid; place-items: center; width: 18px; height: 18px; font: 700 9px/1 var(--display);
    font-style: normal; color: var(--on-pop); border: 2px solid var(--edge); border-radius: 50% 4px 50% 4px; }
  .corner.best { background: var(--lime); transform: rotate(4deg); }
  .corner.weak { background: var(--pink); transform: rotate(-4deg); }
  .strength-key { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  .strength-key .corner { position: static; display: inline-grid; vertical-align: -6px; margin-right: 6px; transform: none; }
  @media (max-width: 559px) { .strength thead th:first-child, .strength tbody th { width: 112px; } .strength tbody th { font-size: 18px; } .strength tbody th .you-tag { display: block; width: max-content; margin: 4px 0 0; } }

  /* Coach: two side-by-side cards (stacked on a phone): waiver order and the injury report */
  .coach-duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; margin-top: 34px; }
  @media (min-width: 900px) { .coach-duo { grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); align-items: start; } }
  .coach-duo > .panel { margin-top: 0; }
  .panel { padding: 16px 18px 18px; background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--drop); }
  .panel h2 { margin: 0; font: 800 24px/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
  .panel .sec-sub { margin: 6px 0 12px; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .waiver { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .waiver li { color: var(--ink); display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; border: 2px solid var(--edge); border-radius: 10px; background: var(--card); }
  .waiver li.me { background: var(--lime); color: var(--on-pop); box-shadow: 3px 3px 0 var(--drop); }
  .waiver .pos { font: 800 22px/1 var(--display); }
  .waiver .wname { font: 800 19px/1 var(--display); letter-spacing: 0.01em; }
  .waiver .wname a { color: inherit; text-decoration: none; }
  .waiver .wname a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .waiver .wname .you-tag { margin-left: 8px; }
  .waiver .rec { font: 500 14px/1 var(--mono); }
  .inj-toggle { display: inline-flex; border: 2px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--card); }
  .inj-toggle button { cursor: pointer; padding: 6px 12px; font: 600 13px/1 var(--body); color: var(--ink); background: transparent; border: 0; }
  .inj-toggle button + button { border-left: 2px solid var(--edge); }
  .inj-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .inj-toggle .wk-n { font: 500 11px/1 var(--mono); opacity: 0.85; margin-left: 2px; }
  .inj-wrap { border: 2px solid var(--edge); border-radius: 10px; }
  .inj-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .inj-table th, .inj-table td { padding: 8px 8px; text-align: left; vertical-align: middle; }
  .inj-table thead th { font: 600 11.5px/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--edge); }
  .inj-table tbody + tbody { border-top: 2px solid var(--edge); }
  .inj-table tbody th { width: 84px; font: 800 17px/1.1 var(--display); vertical-align: top; padding-top: 10px; }
  .inj-table tbody th a { color: var(--ink); text-decoration: none; }
  .inj-table tbody th a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .inj-table tbody th .you-tag { display: block; width: max-content; margin: 4px 0 0; }
  .inj-table .pl { font-weight: 700; }
  .inj-table .pl small { font: 500 11px/1 var(--mono); color: var(--muted); }
  .inj-table .nfl { margin-left: 4px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 3px; border: 2px solid var(--edge); border-radius: 999px; font: 500 11px/1 var(--mono); background: var(--card); white-space: nowrap; vertical-align: 1px; }
  .inj-table .role { font: 500 12px/1 var(--mono); color: var(--muted); }
  .spill { display: inline-block; padding: 4px 9px; font: 600 11.5px/1 var(--script); letter-spacing: 0.04em; text-transform: uppercase; color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; white-space: nowrap; }
  .spill.out { background: var(--pink); }
  .spill.q { background: var(--orange); }
  .spill.bye { background: var(--accent-soft); color: var(--ink); }
  .inj-empty { margin: 4px 0 0; padding: 18px 14px; text-align: center; font-size: 15px; background: var(--lime-soft); border: 2px solid var(--edge); border-radius: 10px; }
  @media (max-width: 559px) { .inj-table { font-size: 13px; } .inj-table tbody th { width: 58px; font-size: 15px; } .inj-table th, .inj-table td { padding: 7px 4px; } .inj-table .role { font-size: 10.5px; } .spill { padding: 3px 6px; font-size: 10.5px; } .inj-table thead th { font-size: 10.5px; } .panel { padding-inline: 14px; } }
  .card.now .stat { background: var(--pink); }
  .card.watch .stat { background: var(--orange); }
  .card.info .stat { background: var(--lime); }
  /* ESPN's injury designation, next to the player's name in any box score */
  .inj { display: inline-block; margin-left: 5px; font: 500 10.5px/1 var(--script); color: var(--on-pop); background: var(--orange); border: 1.5px solid var(--edge); border-radius: 999px; padding: 3px 7px; vertical-align: 1px; white-space: nowrap; }
  .inj.out { background: var(--pink); }

  .empty { padding: 70px 0; text-align: center; color: var(--muted); }
  .empty h1 { font: 800 42px/1 var(--display); color: var(--ink); margin-bottom: 10px; }
  /* ---------- live ---------- */
  .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--loss); margin-right: 6px; vertical-align: 1px; }
  @media (prefers-reduced-motion: no-preference) { .live-dot { animation: pulse 1.6s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .live-banner { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--accent); text-decoration: none; font-weight: 700; }
  .live-banner .go { color: var(--accent); white-space: nowrap; }
  .live-strip { display: grid; gap: 8px; padding: 10px 16px; border-bottom: 2px solid var(--edge); background: var(--accent-soft); font-size: 12.5px; }
  .live-strip .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .prob { display: flex; gap: 2px; height: 10px; border-radius: 5px; background: var(--card); border: 1.5px solid var(--edge); overflow: hidden; }
  .prob span { display: block; height: 100%; }
  .prob .a { background: var(--accent); }
  .prob .b { background: var(--orange); }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--edge); margin-right: 5px; vertical-align: 0; }
  /* "● 2 playing now" sits inside a sentence, so it stays on one line and leans on weight
     rather than another fill on top of the strip's tint. */
  .live-strip .on-now { display: inline-flex; align-items: center; white-space: nowrap; font-weight: 700; }
  .live-strip .on-now .live-dot { width: 7px; height: 7px; margin-right: 4px; }
  .moves { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .moves li { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 3px 3px 0 var(--drop); padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .moves .when { grid-row: span 2; font: 500 11.5px/1.3 var(--mono); color: var(--muted); padding-top: 2px; }
  .lows { margin-top: 28px; }
  .leaders.low .pts { background: var(--pink); }
  .moves .add { color: var(--win); font-weight: 700; }
  .moves .drop { color: var(--loss); font-weight: 700; }

  footer { margin-top: 56px; padding-top: 14px; border-top: 2px solid var(--edge); font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  footer .script { font: 600 13px/1 var(--script); color: var(--on-pop); background: var(--orange); border: 1.5px solid var(--edge); border-radius: 999px; padding: 4px 10px; display: inline-block; transform: rotate(-2deg); }
  /* ---------- team profile: Overview / Lineup / Season ----------
