  .chips a { text-decoration: none; background: var(--card); color: var(--ink); border: 2px solid var(--edge); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 700; box-shadow: 2px 2px 0 var(--drop); }
  .chips a:nth-child(3n+1) { background: var(--lime); color: var(--on-pop); }
  .chips a:nth-child(3n+2) { background: var(--pink); color: var(--on-pop); }
  .chips a:nth-child(3n) { background: var(--orange); color: var(--on-pop); }
  .chips a:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--drop); }

  /* recap page glossary: each term is a card that opens to its definition */
  .rp-terms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 24px; align-items: start; }
  .rp-term { border: 2px solid var(--edge); border-radius: 20px; background: var(--card); box-shadow: 4px 4px 0 var(--drop); overflow: hidden; }
  .rp-term.open { box-shadow: 7px 7px 0 var(--lime); transform: translate(-2px, -2px); }
  @media (prefers-reduced-motion: no-preference) { .rp-term { transition: box-shadow 0.2s, transform 0.2s; } .rp-term .plus { transition: transform 0.3s; } .rp-term-body { transition: grid-template-rows 0.35s ease, visibility 0s 0.35s; } .rp-term.open .rp-term-body { transition-delay: 0s; } }
  .rp-term-btn { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 12px 20px; border: 0; background: transparent; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
  .rp-term-btn .tt { font: 900 28px/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
  .rp-term .plus { position: relative; flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--edge); background: var(--lime); }
  .rp-term .plus::before, .rp-term .plus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 2px; background: var(--on-pop); transform: translate(-50%, -50%); }
  .rp-term .plus::after { transform: translate(-50%, -50%) rotate(90deg); }
  .rp-term.open .plus { transform: rotate(45deg); }
  .rp-term-body { display: grid; grid-template-rows: 0fr; visibility: hidden; }
  .rp-term.open .rp-term-body { grid-template-rows: 1fr; visibility: visible; }
  .rp-term-body > div { overflow: hidden; }
  .rp-term-body p { margin: 0; padding: 2px 20px 22px; font-size: 15.5px; line-height: 1.6; }
  @media (max-width: 980px) { .rp-terms { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .rp-terms { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- coach ---------- */
  /* One card per team on the overview: the manager, what needs doing, a way in. */
  .cc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .cc-head .todo { flex: none; }
  /* her top two items as a mini checklist; the box color is how urgent each one is */
  .cc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .cc-list li { display: grid; grid-template-columns: 18px 1fr; gap: 9px; align-items: start; font-size: 14px; line-height: 1.3; }
  .cc-list small { display: block; margin-top: 2px; color: var(--muted); font: 500 11.5px/1.3 var(--mono); }
  .cc-box { width: 18px; height: 18px; margin-top: 1px; border: 2px solid var(--edge); border-radius: 5px; background: var(--card); }
  .cc-box.now { background: var(--pink); }
  .cc-box.watch { background: var(--orange); }
  .cc-box.info { background: var(--accent-soft); }
  /* the count sticker: how many things need doing before kickoff */
  .todo { justify-self: start; font: 600 12.5px/1 var(--script); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; padding: 5px 11px; transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--drop); }
  .todo.now { background: var(--pink); }
  .todo.watch { background: var(--orange); }
  .todo.clear { background: var(--lime); }
  /* an advice card borrows the award card's sticker, colored by how urgent it is */
  .card.now { box-shadow: 5px 5px 0 var(--pink); }
  .card.watch { box-shadow: 5px 5px 0 var(--orange); }
  .card.info { box-shadow: 5px 5px 0 var(--drop); }

  /* Coach overview: your team pinned on top, a radar of the league's loudest items, then the
     "where everyone's strong" grid. One column on a phone; from 860px the hero and radar sit side by side. */
  .coach-top { display: grid; gap: 22px; margin-top: 14px; }
  /* the global `section` margin would stack on the grid's own and open a gap under the header */
  .coach-top > section { margin-top: 0; }
  @media (min-width: 860px) { .coach-top { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
  .coach-hero { position: relative; display: grid; gap: 14px; padding: 22px 20px 20px; background: var(--accent-soft); color: var(--ink);
    border: 2px solid var(--edge); border-radius: 14px; box-shadow: 5px 5px 0 var(--accent); }
  .you-sticker { position: absolute; top: -14px; right: 18px; font: 600 14px/1 var(--script); color: var(--on-pop); background: var(--pink);
    border: 2px solid var(--edge); border-radius: 999px; padding: 6px 13px; transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--drop); }
  .ch-eyebrow { margin: 0 0 4px; font: 600 12px/1 var(--script); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .ch-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; }
  .ch-who { flex: 0 1 auto; min-width: 0; }
  .ch-head .mgr { margin: 0; font: 900 clamp(36px, 7vw, 48px)/0.95 var(--display); }
  .ch-head .tname { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .ch-head .todo { flex: none; margin: 6px 0 0 auto; }
  .ch-stand { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; font: 500 13px/1.3 var(--mono); color: var(--muted); }
  .ch-stand .po-label { font-family: var(--body); }
  .ch-game { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px; align-items: end; padding: 14px; background: var(--card);
    border: 2px solid var(--edge); border-radius: 12px; }
  .ch-vs { font-size: 14px; }
  .ch-vs b { font: 800 22px/1 var(--display); }
  .ch-vs span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .ch-proj { text-align: right; }
  .ch-proj .n { display: block; font: 800 34px/1 var(--display); }
  .ch-proj .l { font: 500 11.5px/1.2 var(--mono); color: var(--muted); }
  .ch-game .fo-bar { grid-column: 1 / -1; }
  .ch-sum { margin: 0; font-size: 15.5px; line-height: 1.45; }
  .ch-list li { font-size: 15px; }
  .ch-go { flex: none; align-self: center; padding: 9px 16px; font-size: 14px; }
  .ch-pick { display: grid; gap: 12px; }
  .ch-pick p { margin: 0; font-size: 15px; }
  .ch-pick .profile-btn { justify-self: start; cursor: pointer; padding: 9px 16px; font-size: 14px; }

  /* Coach's hello: a modal with no way out but picking a team. Names wrap, never scroll. */
  .pick-dialog { width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow-y: auto; margin: auto; padding: 22px 20px 20px;
    background: var(--accent-soft); color: var(--ink); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 5px 5px 0 var(--accent); }
  .pick-dialog::backdrop { background: rgba(10, 20, 50, 0.6); }
  .pick-dialog h2 { margin: 0 0 6px; font: 900 clamp(32px, 8vw, 40px)/1 var(--display); }
  .pick-dialog p { margin: 0 0 16px; font-size: 15px; }
  .pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pick-grid button { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: var(--ink);
    font: 700 16px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; border: 2px solid var(--edge); background: var(--card);
    padding: 13px 10px; border-radius: 10px; box-shadow: 3px 3px 0 var(--drop); }
  .pick-grid button:hover, .pick-grid button:focus-visible { background: var(--lime); color: var(--on-pop); }
  .pick-grid button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }
  .pick-dialog .pick-hint { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-size: 13.5px; color: var(--muted); }
  .pick-dialog .dot, .pick-grid .dot { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: var(--pink); border: 1.5px solid var(--edge); font: 800 10px/1 var(--display); color: var(--on-pop); }

  /* the split win-probability bar: filled halves, navy or white ink on top */
  .fo-bar { display: flex; height: 28px; border: 2px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--card); }
  .fo-bar span { display: flex; align-items: center; min-width: 3.6em; padding: 0 10px; font: 500 12px/1 var(--mono); }
  .fo-bar .a { background: var(--accent); color: var(--on-accent); }
  .fo-bar .b { justify-content: flex-end; background: var(--pink); color: var(--on-pop); border-left: 2px solid var(--edge); }

  /* league radar: three sticker tiles, one pop color each */
  .radar { display: grid; gap: 16px; }
  .radar h2 { margin: 0; font: 800 20px/1 var(--display); text-transform: uppercase; letter-spacing: 0.03em; }
  .radar-tile { display: grid; gap: 6px; padding: 14px 16px; text-decoration: none; color: var(--ink); border: 2px solid var(--edge);
    border-radius: 14px; box-shadow: 4px 4px 0 var(--drop); }
  .radar-tile.swap { background: var(--orange-soft); }
  .radar-tile.close { background: var(--lime-soft); }
  .radar-tile.hurt { background: var(--pink-soft); }
  .radar-tile .rt-tag { justify-self: start; font: 600 12px/1 var(--script); color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 10px; }
  .radar-tile.swap .rt-tag { background: var(--orange); transform: rotate(-2deg); }
  .radar-tile.close .rt-tag { background: var(--lime); }
  .radar-tile.hurt .rt-tag { background: var(--pink); transform: rotate(-2deg); }
  .rt-main { font: 800 21px/1.1 var(--display); }
  .rt-sub { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font: 500 12.5px/1.3 var(--mono); color: var(--muted); }
  .rt-sub b { font: 800 18px/1 var(--display); color: var(--ink); }
  .rt-pill { font: 600 11.5px/1 var(--script); color: var(--on-pop); background: var(--pink); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 8px; }
  .rt-empty { margin: 0; font-size: 14px; color: var(--muted); }

  .you-tag { margin-left: 6px; vertical-align: 4px; font: 600 11px/1 var(--script); color: var(--on-pop); background: var(--pink); border: 2px solid var(--edge); border-radius: 999px; padding: 2px 7px; }
  @media (prefers-reduced-motion: no-preference) { a.radar-tile { transition: transform 0.12s ease, box-shadow 0.12s ease; } }
  a.radar-tile:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--drop); }
  a.radar-tile:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }

  /* "Where everyone's strong": a cobalt heat grid. Rank 1 is solid cobalt, rank 8 almost white;
     ranks 1-2 take the on-accent ink, the rest the page ink, which holds 4.5:1 in both themes.
     The rank number and the corner sticker say the same thing, so color is never the only cue. */
  .strength { border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--drop); background: var(--card); }
  .strength table { width: 100%; min-width: 640px; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  .strength th, .strength td { padding: 0; text-align: center; }
  .strength thead th { padding: 10px 4px; font: 600 12.5px/1 var(--mono); letter-spacing: 0.04em; color: var(--muted); border-bottom: 2px solid var(--edge); }
  .strength thead th:first-child, .strength tbody th { position: sticky; left: 0; z-index: 1; text-align: left; padding-left: 14px; background: var(--card); border-right: 2px solid var(--edge); }
  .strength thead th:first-child, .strength tbody th { width: 148px; }
  .strength tbody th { padding-right: 8px; font: 800 20px/1 var(--display); white-space: nowrap; }
  .strength tbody th a { color: var(--ink); text-decoration: none; }
  .strength tbody th a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .strength td { position: relative; height: 52px; border: 2px solid var(--card); color: var(--ink); }
  .strength .rk { font: 500 20px/1 var(--mono); }
  .strength td.avg { background: var(--card); border-left: 2px solid var(--edge); }
  .strength td.avg .rk { font-weight: 700; }
  .strength td.h1 { background: var(--accent); }
  .strength td.h2 { background: color-mix(in srgb, var(--accent) 84%, var(--card)); }
  .strength td.h3 { background: color-mix(in srgb, var(--accent) 62%, var(--card)); }
  .strength td.h4 { background: color-mix(in srgb, var(--accent) 52%, var(--card)); }
  .strength td.h5 { background: color-mix(in srgb, var(--accent) 38%, var(--card)); }
  .strength td.h6 { background: color-mix(in srgb, var(--accent) 26%, var(--card)); }
  .strength td.h7 { background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
  .strength td.h8 { background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
  .strength td.h1, .strength td.h2 { color: var(--on-accent); }
  /* your row: outlined all the way round, manager cell tinted, "You" tag beside the name */
  .strength tbody tr.me th { background: var(--accent-soft); box-shadow: inset 0 3px 0 var(--edge), inset 0 -3px 0 var(--edge), inset 3px 0 0 var(--edge); }
  .strength tbody tr.me td { box-shadow: inset 0 3px 0 var(--edge), inset 0 -3px 0 var(--edge); }
  .strength tbody tr.me td:last-child { box-shadow: inset 0 3px 0 var(--edge), inset 0 -3px 0 var(--edge), inset -3px 0 0 var(--edge); }
  /* the corner sticker: lime for a team's best spot, pink for her weakest, each with its own glyph */
  .corner { position: absolute; top: 2px; right: 2px; display: grid; place-items: center; width: 18px; height: 18px; font: 700 9px/1 var(--display);
    font-style: normal; color: var(--on-pop); border: 2px solid var(--edge); border-radius: 50% 4px 50% 4px; }
  .corner.best { background: var(--lime); transform: rotate(4deg); }
  .corner.weak { background: var(--pink); transform: rotate(-4deg); }
  .strength-key { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  .strength-key .corner { position: static; display: inline-grid; vertical-align: -6px; margin-right: 6px; transform: none; }
  @media (max-width: 559px) { .strength thead th:first-child, .strength tbody th { width: 112px; } .strength tbody th { font-size: 18px; } .strength tbody th .you-tag { display: block; width: max-content; margin: 4px 0 0; } }

__COACH_CSS__
__LIVE_CSS__
  /* Coach: two side-by-side cards (stacked on a phone): waiver order and the injury report */
  .coach-duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; margin-top: 34px; }
  @media (min-width: 900px) { .coach-duo { grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); align-items: start; } }
  .coach-duo > .panel { margin-top: 0; }
  .panel { padding: 16px 18px 18px; background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--drop); }
  .panel h2 { margin: 0; font: 800 24px/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
  .panel .sec-sub { margin: 6px 0 12px; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .waiver { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .waiver li { color: var(--ink); display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; border: 2px solid var(--edge); border-radius: 10px; background: var(--card); }
  .waiver li.me { background: var(--lime); color: var(--on-pop); box-shadow: 3px 3px 0 var(--drop); }
  .waiver .pos { font: 800 22px/1 var(--display); }
  .waiver .wname { font: 800 19px/1 var(--display); letter-spacing: 0.01em; }
  .waiver .wname a { color: inherit; text-decoration: none; }
  .waiver .wname a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .waiver .wname .you-tag { margin-left: 8px; }
  .waiver .rec { font: 500 14px/1 var(--mono); }
  .inj-toggle { display: inline-flex; border: 2px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--card); }
  .inj-toggle button { cursor: pointer; padding: 6px 12px; font: 600 13px/1 var(--body); color: var(--ink); background: transparent; border: 0; }
  .inj-toggle button + button { border-left: 2px solid var(--edge); }
  .inj-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .inj-toggle .wk-n { font: 500 11px/1 var(--mono); opacity: 0.85; margin-left: 2px; }
  .inj-wrap { border: 2px solid var(--edge); border-radius: 10px; }
  .inj-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .inj-table th, .inj-table td { padding: 8px 8px; text-align: left; vertical-align: middle; }
  .inj-table thead th { font: 600 11.5px/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--edge); }
  .inj-table tbody + tbody { border-top: 2px solid var(--edge); }
  .inj-table tbody th { width: 84px; font: 800 17px/1.1 var(--display); vertical-align: top; padding-top: 10px; }
  .inj-table tbody th a { color: var(--ink); text-decoration: none; }
  .inj-table tbody th a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .inj-table tbody th .you-tag { display: block; width: max-content; margin: 4px 0 0; }
  .inj-table .pl { font-weight: 700; }
  .inj-table .pl small { font: 500 11px/1 var(--mono); color: var(--muted); }
  .inj-table .nfl { margin-left: 4px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 3px; border: 2px solid var(--edge); border-radius: 999px; font: 500 11px/1 var(--mono); background: var(--card); white-space: nowrap; vertical-align: 1px; }
  .inj-table .role { font: 500 12px/1 var(--mono); color: var(--muted); }
  .spill { display: inline-block; padding: 4px 9px; font: 600 11.5px/1 var(--script); letter-spacing: 0.04em; text-transform: uppercase; color: var(--on-pop); border: 2px solid var(--edge); border-radius: 999px; white-space: nowrap; }
  .spill.out { background: var(--pink); }
  .spill.q { background: var(--orange); }
  .spill.bye { background: var(--accent-soft); color: var(--ink); }
  .inj-empty { margin: 4px 0 0; padding: 18px 14px; text-align: center; font-size: 15px; background: var(--lime-soft); border: 2px solid var(--edge); border-radius: 10px; }
  @media (max-width: 559px) { .inj-table { font-size: 13px; } .inj-table tbody th { width: 58px; font-size: 15px; } .inj-table th, .inj-table td { padding: 7px 4px; } .inj-table .role { font-size: 10.5px; } .spill { padding: 3px 6px; font-size: 10.5px; } .inj-table thead th { font-size: 10.5px; } .panel { padding-inline: 14px; } }
  .card.now .stat { background: var(--pink); }
  .card.watch .stat { background: var(--orange); }
  .card.info .stat { background: var(--lime); }
  /* ESPN's injury designation, next to the player's name in any box score */
  .inj { display: inline-block; margin-left: 5px; font: 500 10.5px/1 var(--script); color: var(--on-pop); background: var(--orange); border: 1.5px solid var(--edge); border-radius: 999px; padding: 3px 7px; vertical-align: 1px; white-space: nowrap; }
  .inj.out { background: var(--pink); }

  .empty { padding: 70px 0; text-align: center; color: var(--muted); }
  .empty h1 { font: 800 42px/1 var(--display); color: var(--ink); margin-bottom: 10px; }
  /* ---------- live ---------- */
  .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--loss); margin-right: 6px; vertical-align: 1px; }
  @media (prefers-reduced-motion: no-preference) { .live-dot { animation: pulse 1.6s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .live-banner { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--accent); text-decoration: none; font-weight: 700; }
  .live-banner .go { color: var(--accent); white-space: nowrap; }
  .live-strip { display: grid; gap: 8px; padding: 10px 16px; border-bottom: 2px solid var(--edge); background: var(--accent-soft); font-size: 12.5px; }
  .live-strip .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .prob { display: flex; gap: 2px; height: 10px; border-radius: 5px; background: var(--card); border: 1.5px solid var(--edge); overflow: hidden; }
  .prob span { display: block; height: 100%; }
  .prob .a { background: var(--accent); }
  .prob .b { background: var(--orange); }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--edge); margin-right: 5px; vertical-align: 0; }
  /* "● 2 playing now" sits inside a sentence, so it stays on one line and leans on weight
     rather than another fill on top of the strip's tint. */
  .live-strip .on-now { display: inline-flex; align-items: center; white-space: nowrap; font-weight: 700; }
  .live-strip .on-now .live-dot { width: 7px; height: 7px; margin-right: 4px; }
  .moves { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .moves li { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 3px 3px 0 var(--drop); padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .moves .when { grid-row: span 2; font: 500 11.5px/1.3 var(--mono); color: var(--muted); padding-top: 2px; }
  .lows { margin-top: 28px; }
  .leaders.low .pts { background: var(--pink); }
  .moves .add { color: var(--win); font-weight: 700; }
  .moves .drop { color: var(--loss); font-weight: 700; }

  footer { margin-top: 56px; padding-top: 14px; border-top: 2px solid var(--edge); font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  footer .script { font: 600 13px/1 var(--script); color: var(--on-pop); background: var(--orange); border: 1.5px solid var(--edge); border-radius: 999px; padding: 4px 10px; display: inline-block; transform: rotate(-2deg); }
  /* ---------- team profile: Overview / Lineup / Season ----------
     One hero on Overview, a slim identity bar on the other two tabs, and a tab bar in
     between. Phones get one column; from 860px up Overview grows a side rail. */
  /* the team strip: every team, in standings order, with who has homework and who is "you" */
  .tp-strip { display: flex; gap: 8px; overflow-x: auto; padding: 6px 6px 10px; margin: 8px -6px 0; scrollbar-width: none; }
  .tp-strip::-webkit-scrollbar { display: none; }
  .tp-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 5px 11px; text-decoration: none; color: var(--ink); background: var(--card);
    border: 2px solid var(--edge); border-radius: 999px; font: 800 12px/1 var(--body); letter-spacing: 0.03em; text-transform: uppercase; }
  .tp-chip:hover { background: var(--accent-soft); }
  .tp-chip[aria-current="page"] { background: var(--lime); color: var(--on-pop); box-shadow: 2px 2px 0 var(--drop); }
  .tp-chip .n, .tp-key .n { min-width: 18px; height: 18px; padding: 0 3px; border-radius: 9px; background: var(--pink); color: var(--on-pop); border: 2px solid var(--edge); font: 800 10px/14px var(--body); text-align: center; }
  .tp-chip .you, .tp-key .you { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--orange); border: 2px solid var(--edge); }
  .tp-key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 12px; font: 500 11px/1.4 var(--mono); color: var(--muted); }
  .tp-key span { display: inline-flex; align-items: center; gap: 5px; }
  .tp-key .n { min-width: 16px; height: 16px; padding: 0; display: inline-block; }
  .tp-key .you { display: inline-block; }
  .crumbs .you-tag { font: 700 11px/1 var(--script); letter-spacing: 0.04em; color: var(--on-pop); background: var(--orange); border: 1.5px solid var(--edge); border-radius: 999px; padding: 3px 8px; }

  /* the identity card: the same on Overview, Lineup and Season */
  .tp-id { margin-top: 4px; background: #151a33; color: #f4f6ff; border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--accent); padding: 18px 18px 16px; }
  .tp-id-top { display: flex; align-items: center; gap: 10px; }
  .tp-tname { font: 600 12.5px/1 var(--script); letter-spacing: 0.04em; text-transform: uppercase; color: #151a33; background: var(--pink); border: 2px solid #f4f6ff; border-radius: 999px; padding: 5px 11px; transform: rotate(-2deg); }
  .tp-you { font: 800 11px/1 var(--body); letter-spacing: 0.04em; text-transform: uppercase; color: #151a33; background: var(--orange); border: 2px solid #f4f6ff; border-radius: 999px; padding: 4px 10px; }
  .tp-id-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 8px; }
  .tp-id h1 { margin: 0; font: 900 clamp(48px, 15vw, 68px)/0.92 var(--display); letter-spacing: 0.01em; overflow-wrap: anywhere; }
  .tp-rec { text-align: right; flex: none; }
  .tp-rec b { display: block; font: 900 clamp(38px, 12vw, 50px)/0.9 var(--display); color: var(--lime); }
  .tp-rec span { display: block; margin-top: 4px; font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: #a9b2dc; }
  .tp-back { display: inline-flex; align-items: center; min-height: 32px; margin-top: 12px; padding: 5px 12px; text-decoration: none; font: 700 13px/1.2 var(--body); color: #151a33; background: var(--card); border: 2px solid #f4f6ff; border-radius: 999px; }
  .tp-back:hover { background: var(--lime); }
  .tp-back:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  .tp-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; margin: 14px 0 0; padding-top: 12px; border-top: 1.5px solid #2b3263; }
  .tp-stats > div { min-width: 0; }
  .tp-stats dt { font: 500 10px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: #a9b2dc; }
  .tp-stats dd { margin: 3px 0 0; font: 800 24px/1.05 var(--display); }
  .tp-stats dd small { font: 500 10px/1 var(--mono); color: #a9b2dc; margin-left: 4px; }
  .tp-stats .po dd { color: var(--lime); }
  .tp-stats .hs { display: block; margin-top: 2px; font: 500 10px/1.2 var(--mono); color: #a9b2dc; }
  @media (min-width: 860px) {
    .tp-id { padding: 24px 30px 22px; box-shadow: 6px 6px 0 var(--accent); }
    .tp-id h1 { font-size: clamp(72px, 9vw, 96px); }
    .tp-rec b { font-size: clamp(56px, 7vw, 76px); }
    .tp-rec span { font-size: 13px; }
    .tp-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 24px; }
    .tp-stats dd { font-size: 30px; }
  }

  /* the sticky tab bar. When the identity card has scrolled away it grows a mini identity on the left. */
  .tp-tabbar { position: sticky; top: 56px; z-index: 4; display: flex; align-items: center; gap: 12px; margin: 10px -16px 6px; padding: 6px 16px 10px; background: var(--bg); }
  .tp-tabbar { border-bottom: 2px solid transparent; }
  .tp-tabbar.stuck { border-bottom-color: var(--edge); }
  .tp-mini { display: none; align-items: center; gap: 8px; white-space: nowrap; font: 900 20px/1 var(--display); }
  .tp-mini em { font: 500 11px/1 var(--mono); font-style: normal; color: var(--lime); background: var(--board); border-radius: 999px; padding: 4px 8px; }
  .tp-tabbar.stuck .tp-mini { display: flex; }
  .tp-seg { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(max-content, 1fr)); overflow-x: auto; scrollbar-width: none; gap: 3px; padding: 3px; background: var(--card); border: 2px solid var(--edge); border-radius: 14px; }
  .tp-tabbar.stuck .tp-seg { max-width: 380px; }
  .tp-seg a { text-align: center; text-decoration: none; color: var(--ink); font: 600 14px/1 var(--script); border-radius: 10px; padding: 11px 0; }
  .tp-seg a:hover { background: var(--accent-soft); }
  .tp-seg a[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
  @media (max-width: 640px) { .tp-tabbar.stuck .tp-mini { display: none; } .tp-tabbar.stuck .tp-seg { max-width: none; } }

  .tp-sec { margin-top: 26px; display: grid; gap: 10px; align-content: start; }
  .tp-head { display: flex; align-items: center; gap: 8px; }
  .tp-head .mark { flex: none; width: 14px; height: 14px; background: var(--c, var(--accent)); border: 2px solid var(--edge); border-radius: 4px; }
  .tp-head h2 { font: 800 26px/1 var(--display); letter-spacing: 0.01em; }
  .tp-head .more { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; text-align: right; }
  .tp-head .more:hover { text-decoration: underline; }
  .tp-sec > .sec-sub { margin: -4px 0 0; }
  .tp-sub { margin-top: 4px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; font: 600 12px/1.2 var(--script); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .tp-sub small { font: 400 12px/1.2 var(--body); letter-spacing: 0; text-transform: none; }

  /* faces: a headshot with a small NFL badge, from the same source as Recaps' Top scorers */
  .pf { --s: 48px; position: relative; display: block; flex: none; width: var(--s); height: var(--s); }
  .pf .img { display: block; width: 100%; height: 100%; border: 2px solid var(--edge); border-radius: 50%; background: var(--accent-soft); object-fit: cover; object-position: center; }
  .pf.dst .img { object-fit: contain; padding: 14%; background: var(--logo-chip); }
  .pf .nfl { position: absolute; right: -5px; bottom: -4px; width: calc(var(--s) * 0.46); height: calc(var(--s) * 0.46); padding: 1px; border: 2px solid var(--edge); border-radius: 50%; background: var(--logo-chip); object-fit: contain; }
  .pf.sm { --s: 42px; }
  .pf.xs { --s: 28px; }
  .pf.xs .nfl { border-width: 1.5px; right: -6px; }
  .ref { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; margin: 2px 1px; padding: 2px 11px 2px 3px; color: var(--ink); text-decoration: none; background: var(--card);
    border: 2px solid var(--edge); border-radius: 999px; font: 700 13px/1.2 var(--body); vertical-align: middle; }
  .ref .rn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref em { font: 500 11px/1 var(--mono); font-style: normal; color: var(--muted); white-space: nowrap; }
  .refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  /* Overview */
  .ov-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 8px; }
  @media (max-width: 760px) { .ov-grid { grid-template-columns: minmax(0, 1fr); } }
  .ov-card { min-width: 0; background: var(--card); border: 2px solid var(--edge); border-radius: 16px; box-shadow: 3px 3px 0 var(--drop); padding: 14px 16px; }
  .ov-lab { font: 700 11px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ov-vs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 12px; }
  .ov-vs b { font: 900 30px/1 var(--display); }
  .ov-vs b a { color: inherit; text-decoration: none; }
  .ov-vs b a:hover { text-decoration: underline; }
  .ov-vs i { font: 500 12px/1 var(--mono); font-style: normal; text-transform: uppercase; color: var(--muted); }
  .mg { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border: 2px solid var(--edge); border-radius: 50%; background: var(--accent-soft); font: 900 15px/1 var(--display); }
  .mg.t { background: var(--pink-soft); }
  .ov-wc { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .ov-wc b { display: block; font: 900 42px/1 var(--display); }
  .ov-wc span { font: 600 12px/1.2 var(--body); color: var(--muted); }
  .ov-wc .r { text-align: right; }
  .ov-bar { height: 14px; margin: 8px 0 4px; overflow: hidden; background: var(--pink); border: 2px solid var(--edge); border-radius: 999px; }
  .ov-bar i { display: block; height: 100%; background: var(--accent); border-right: 2px solid var(--edge); }
  .ov-legend { display: flex; justify-content: space-between; gap: 6px; font: 500 11px/1.3 var(--mono); color: var(--muted); }
  .ov-legend .sq { display: inline-block; width: 10px; height: 10px; margin: 0 5px -1px; border: 2px solid var(--edge); border-radius: 3px; }
  .ov-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0 0; }
  .ov-stats dt { order: 2; font: 500 10px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .ov-stats dd { order: 1; margin: 0; font: 800 22px/1 var(--display); }
  .ov-stats > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .ov-fix { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 10px; background: var(--pink-soft); border: 2px solid var(--edge); border-radius: 12px; font-size: 13.5px; }
  .ov-fix.ok { background: var(--lime-soft); }
  .ov-fix > div { min-width: 0; flex: 1; }
  .ov-fix .refs { margin-top: 6px; }
  .ov-fix a.go { flex: none; align-self: flex-start; color: var(--ink); text-decoration: none; white-space: nowrap; background: var(--card); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 11px; font: 700 12px/1.2 var(--body); box-shadow: 2px 2px 0 var(--drop); }
  .ov-seed { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .ov-seed b { font: 900 40px/1 var(--display); }
  .ov-tag { display: inline-block; padding: 3px 10px; color: var(--on-pop); background: var(--lime); border: 2px solid var(--edge); border-radius: 999px; font: 800 11px/1.2 var(--body); }
  .ov-tag.og { background: var(--orange); }
  .ov-p { margin: 8px 0 10px; color: var(--muted); font-size: 13.5px; }
  .ov-odds { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
  .ov-odds > div { padding: 8px 10px; background: var(--pink-soft); border: 2px solid var(--edge); border-radius: 12px; }
  .ov-odds > div.w { background: var(--lime); color: var(--on-pop); }
  .ov-odds > div.n { grid-column: 1 / -1; background: var(--lime-soft); }
  .ov-odds .ar { padding: 0; background: none; border: 0; font: 900 22px/1 var(--display); }
  .ov-odds span { display: block; font: 600 12px/1.25 var(--body); }
  .ov-odds b { font: 900 34px/1 var(--display); }
  .ov-worth { margin: 12px 0 0; font-size: 13.5px; }
  .ov-take { padding: 14px 16px; background: var(--orange-soft); border: 2px solid var(--edge); border-radius: 16px; box-shadow: 3px 3px 0 var(--drop); }
  .ov-take h3 { margin: 8px 0 4px; font: 800 18px/1.15 var(--display); letter-spacing: 0.01em; }
  .ov-take p { margin: 0; font-size: 14px; }
  .ov-next { display: flex; align-items: center; gap: 12px; }
  .ov-next .mon { display: grid; place-items: center; flex: none; width: 46px; height: 46px; background: var(--accent-soft); border: 2px solid var(--edge); border-radius: 50%; font: 900 20px/1 var(--display); }
  .ov-next .nm { font-weight: 800; font-size: 16px; }
  .ov-next .nm a { color: inherit; }
  .ov-next .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 13.5px; color: var(--muted); }
  .ov-next > div:last-child { min-width: 0; }
  .ov-next .why { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; font-size: 13.5px; }
  .ov-next .why > span:last-child { min-width: 0; flex: 1 1 200px; }
  .ov-next.hurt { background: var(--pink-soft); }
  .ov-tag.pk { background: var(--pink); }
  .tp-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; align-items: start; }
  .tp-cards > *, .tp-cards .card { min-width: 0; }
  .tp-cards .card-top { flex-wrap: wrap; }
  .tp-more > summary { cursor: pointer; font: 700 13.5px/1.2 var(--body); color: var(--accent); padding: 6px 0; }
  .tp-more[open] > summary { margin-bottom: 12px; }
  .tp-ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; align-items: start; }
  .tp-ideas > div { display: grid; gap: 12px; align-content: start; }

  /* Lineup tab, and the accordion rows Season reuses. Everything sits under .acc so none of it
     can reach the box-score tables. The panel animates grid-template-rows 0fr to 1fr, so opening
     is a class toggle and the height is whatever the text needs. */
  .lu-sum { margin: 0; font-size: 14px; }
  .lu-fix { padding: 12px 14px; background: var(--pink-soft); border: 2px solid var(--edge); border-radius: 16px; box-shadow: 3px 3px 0 var(--drop); }
  .lu-fix.ok { background: var(--lime-soft); }
  .lu-fix p { margin: 2px 0 0; font-size: 13.5px; }
  .lu-fix .it { display: flex; gap: 12px; align-items: flex-start; margin-top: 8px; }
  .lu-fix .it > div { flex: 1; min-width: 0; }
  .lhint { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .lu-all { flex: none; cursor: pointer; color: var(--ink); background: var(--card); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 12px; font: 700 12px/1.2 var(--body); box-shadow: 2px 2px 0 var(--drop); }
  .lu-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 26px; }
  @media (min-width: 860px) { .lu-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .acc .divider { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; font: 500 11px/1 var(--mono); letter-spacing: 0.12em; color: var(--muted); }
  .acc .divider::after { content: ""; flex: 1; border-top: 2px solid var(--edge); }
  .acc .prow { border-bottom: 2px dotted var(--rule); }
  .acc .prow:last-child { border-bottom: 0; }
  .acc .row { position: relative; display: grid; grid-template-columns: 40px 52px minmax(0, 1fr) auto 24px; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .acc [data-row]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
  .acc .chev { display: grid; place-items: center; width: 24px; height: 24px; border: 2px solid var(--edge); border-radius: 50%; background: var(--card); font-size: 11px; line-height: 1; transition: transform 0.25s ease, background 0.2s; }
  .acc .prow.open .chev { transform: rotate(180deg); background: var(--lime); color: var(--on-pop); }
  .acc .coach { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows 0.26s ease, visibility 0s 0.26s; }
  .acc .prow.open .coach { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows 0.26s ease, visibility 0s; }
  @media (prefers-reduced-motion: reduce) { .acc .coach, .acc .prow.open .coach, .acc .chev { transition: none; } }
  .acc .cin { overflow: hidden; min-height: 0; }
  .acc .cb { margin: 0 0 12px; padding: 10px 14px 12px; background: var(--lime-soft); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 2px 2px 0 var(--drop); }
  .acc .cb.fl { background: var(--pink-soft); }
  .acc .cb h4 { color: var(--ink); margin: 6px 0 3px; font: 800 18px/1.12 var(--display); letter-spacing: 0.01em; }
  .acc .cb p { margin: 0; font-size: 13.5px; color: var(--ink); }
  .acc .cb .peek-body { margin-top: 6px; padding: 0; background: none; border: 0; }
  .acc .ctag { display: inline-block; padding: 1px 9px; color: var(--on-pop); background: var(--pink); border: 2px solid var(--edge); border-radius: 999px; font: 800 10px/1.5 var(--body); letter-spacing: 0.08em; text-transform: uppercase; }
  .acc .slot { font: 500 11px/1 var(--mono); text-align: center; background: var(--card); border: 2px solid var(--edge); border-radius: 8px; padding: 3px 0; }
  .acc .slot.flex { background: var(--lime-soft); }
  .acc .slot.bn { background: transparent; border-color: var(--rule); color: var(--muted); }
  .acc .av { position: relative; width: 48px; height: 48px; }
  .acc .av .pf { --s: 48px; }
  .acc .bench .av, .acc .bench .av .pf { width: 42px; height: 42px; --s: 42px; }
  .acc .bye .av { filter: grayscale(1); opacity: 0.55; }
  .acc .nm { font: 700 16px/1.15 var(--body); }
  .acc .nm .pos { font-weight: 600; font-size: 13px; color: var(--muted); }
  .acc .sub { margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .acc .sub b { color: var(--ink); font-weight: 700; }
  .acc .sub .live-dot { display: inline-block; vertical-align: 1px; }
  .acc .pill { min-width: 60px; padding: 4px 8px; text-align: center; color: var(--on-pop); background: var(--orange); border: 2px solid var(--edge); border-radius: 11px; box-shadow: 2px 2px 0 var(--drop); font: 900 24px/1 var(--display); }
  .acc .pill small { display: block; margin-top: 2px; font: 500 8.5px/1 var(--mono); letter-spacing: 0.1em; }
  .acc .pill.proj { padding: 3px 8px 4px; color: var(--muted); background: var(--card); border-style: dashed; box-shadow: none; }
  .acc .pill.byep { padding: 7px 8px; background: var(--pink); font-size: 17px; }
  @media (max-width: 640px) {
    .acc .row { grid-template-columns: 52px minmax(0, 1fr) auto 24px; gap: 10px; padding: 11px 0; }
    .acc .slot { position: absolute; left: -6px; top: 6px; z-index: 2; min-width: 30px; padding: 2px 5px; font-size: 10px; box-shadow: 1px 1px 0 var(--drop); }
    .acc .slot.bn { background: var(--bg); box-shadow: none; }
    .acc .av { margin-left: 6px; }
    .acc .bench .av { margin-left: 9px; }
  }

  /* Season tab */
  .sc-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
  @media (max-width: 760px) { .sc-grid { grid-template-columns: minmax(0, 1fr); } }
  .sc-chart { padding: 14px 16px 10px; background: var(--card); border: 2px solid var(--edge); border-radius: 16px; box-shadow: 3px 3px 0 var(--drop); }
  .sc-chart svg { display: block; width: 100%; height: auto; }
  .ch-w { fill: var(--lime); stroke: var(--edge); stroke-width: 2.5; }
  .ch-l { fill: var(--pink-soft); stroke: var(--edge); stroke-width: 2.5; }
  .ch-v { fill: var(--ink); font: 800 16px var(--display); text-anchor: middle; }
  .ch-x { fill: var(--muted); font: 500 11px var(--mono); text-anchor: middle; }
  .ch-avg { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
  .ch-al { fill: var(--accent-ink); font: 500 10.5px var(--mono); text-anchor: end; }
  .sc-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; }
  @media (max-width: 760px) { .sc-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } }
  @media (max-width: 520px) { .sc-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

<script id="recap-data" type="application/json">__RECAP_DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('recap-data').textContent);
  const WEEKS = DATA.weeks;
  const SEASON = DATA.season;
  const LIVE = DATA.live;
  // Nothing on the field right now: the week is either done and awaiting Tuesday's recap,
  // or captured but not yet kicked off (Thursday hasn't happened). Read straight off the
  // capture, never a day-of-week guess, so this only ever tracks real NFL kickoffs.
  const deadZone = () => !!(LIVE && (LIVE.complete || !LIVE.kicked_off));
  // The Live tab and route both dispatch here: the normal live scoreboard while something
  // is actually being played, the midweek landing page the rest of the time.
  const liveOrLanding = (w) => (deadZone() ? landingPage(w) : livePage(w));
  if (LIVE) {
    const tab = document.getElementById('nav-live');
    tab.hidden = false;
    // Same tab, same route — just not "Live" when nothing is.
    tab.innerHTML = deadZone() ? 'This week' : '<span class="live-dot" aria-hidden="true"></span>Live';
  }
  // Home shows Live (or, in the dead zone, the landing page) while a week is in progress or
  // pending, so the Recaps tab can't just point at "#" anymore — that would land there too.
  if (WEEKS.length) document.getElementById('nav-week').href = `#week-${WEEKS[WEEKS.length - 1].week}`;
  // Read through to LIVE every time: refreshLive() swaps the whole object's contents,
  // so a captured reference to LIVE.advice would go stale after the first refresh.
  const advice = () => (LIVE && LIVE.advice) || null;
  // The week-ahead preview is baked at build time (next week's numbers move about once a
  // day, not once a minute), so a live refresh leaves it exactly as it was.
  const ahead = () => (LIVE && LIVE.next) || null;
  const coachRows = (next) => (next ? (ahead() || {}).teams : advice()) || null;
  const coachFor = (id, next) => (coachRows(next) || []).find((a) => a.team_id === id);
  const adviceFor = (id) => coachFor(id, false);
  // A team's coach page is now a section of her profile; the league-wide grid keeps #coach.
  // Where a to-do lives: the Lineup tab (this week) or the next-week tab.
  const lineupUrl = (next, id) => `#team-${id}${next ? '.next' : '.lineup'}`;
  const coachUrl = (next, id) => (id ? `#team-${id}${next ? '.next' : ''}` : `#coach${next ? '-next' : ''}`);
  // Every game of the week played, so no lineup change can score another point. It
  // happens hours before ESPN calls the week final, and it's the moment this week's
  // advice stops being advice.
  const liveShut = () => { const rows = advice(); return !!rows && rows.every((a) => a.can_change === false); };
  // Nothing left to fix in this week, so the tab leads with next week instead.
  const leadWithNext = () => !!(ahead() && (LIVE.complete || liveShut()));
  // Eight people, one page: "Viewing as" remembers which team is hers: Coach opens it, and it lights up in
  // orange everywhere. Private windows throw on localStorage, which costs nothing: the in-memory
  // copies keep a pick (and the fact that she was asked) for the rest of the visit.
  let pickedTeam = null, askedMem = false;
  const KEY_TEAM = 'ffg-coach-team', KEY_ASKED = 'ffg-viewing-asked';
  const myTeam = {
    get() {
      let id = pickedTeam;
      try { id = Number(localStorage.getItem(KEY_TEAM)) || pickedTeam; } catch { /* storage blocked */ }
      return id && TEAMS[id] ? id : null;
    },
    set(id) { pickedTeam = id; askedMem = true; try { localStorage.setItem(KEY_TEAM, String(id)); localStorage.setItem(KEY_ASKED, '1'); } catch { /* no memory, no harm */ } },
    clear() { pickedTeam = null; askedMem = true; try { localStorage.removeItem(KEY_TEAM); localStorage.setItem(KEY_ASKED, '1'); } catch { /* no memory, no harm */ } },
    asked() { try { return localStorage.getItem(KEY_ASKED) === '1' || askedMem; } catch { return askedMem; } },
  };
  // Coach is one nav item for everyone. With a pick it opens that person's team; without one it
  // is the league landing. (The tab itself is shown and pointed by viewingAs.sync(), on every route.)
  const coachHref = () => { const me = myTeam.get(); return me ? `#team-${me}` : coachUrl(leadWithNext(), null); };
  // Whose team is on screen is not who is looking: a team page that isn't the pick's is written about
  // "her", not "you" (see voice()). route() clears it, teamPage() sets it.
  let otherTeam = false, viewName = '';
  const voice = (s) => (otherTeam ? herCopy(s) : s);
  const base = (w) => (w.live ? '#live' : `#week-${w.week}`);
  const updated = (iso) => new Date(iso).toLocaleString(undefined, { weekday: 'long', hour: 'numeric', minute: '2-digit' });
  const liveLabel = (w) => (w.complete ? `Week ${w.week} is final. The official recap drops Tuesday.` : `Week ${w.week} is happening now.`);
  const TEAMS = Object.fromEntries(SEASON.standings.map((t) => [t.team_id, t]));
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const f2 = (n) => (n == null ? '–' : (Math.round(n * 100) / 100).toFixed(2));
  const f1 = (n) => (n == null ? '–' : (Math.round(n * 10) / 10).toFixed(1));
  // "Joe Burrow (QB)". A defense already says what it is in its name ("Seahawks D/ST"),
  // and a player's lineup slot can be FLEX, which is a spot on the roster, not a position.
  const posOf = (pos) => (pos && pos !== 'DST' ? esc(pos) : '');
  // "(RB, 12.90)" — the position rides in the same parentheses as the points.
  const scored = (pos, pts) => (posOf(pos) ? `${posOf(pos)}, ` : '') + f2(pts);
  const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + f1(Math.abs(n));
  const SLOT_ORDER = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'DST', 'K'];
  // Injury designations that mean "he isn't playing", so they get the loud color
  const OUTISH = ['Out', 'On IR', 'Suspended', 'Doubtful'];
  const ADVICE_KIND = { out: 'Injury', bye: 'Bye week', watch: 'Game-time call', swap: 'Lineup swap',
    empty: 'Empty slot', hole: 'Roster hole', news: 'Injury news', back: 'Good news', clear: 'All clear',
    consensus: 'Expert consensus', fp_news: 'FantasyPros news', fp_back: 'FantasyPros update',
    waiver: 'Waiver idea', trade: 'Trade idea', recap: 'Last week', matchup: "Who's next",
    lineup_iq: 'Lineup calls', position: 'Position strength', projection: 'Vs projections' };
  /* Each urgency reads a little differently on the week being played and on the week
     ahead, where nothing has kicked off and nothing is locked yet. */
  const ADVICE_LEVEL = {
    now: { title: 'Do this now', marker: 'flag',
      sub: 'Changes worth making before his game kicks off. Once it does, that player is locked in for the week.',
      nextTitle: 'Sort this out', nextSub: 'Nothing has kicked off yet, so all of this is still yours to change. Sunday is the deadline.' },
    watch: { title: 'Keep an eye on it', marker: 'break',
      sub: 'Nothing is settled yet. Check back before kickoff.',
      nextSub: 'A long way from settled. Worth another look nearer the weekend.' },
    info: { title: 'Good to know', marker: 'book', sub: 'No action needed, just news from your roster.' },
  };
  const KIND = {
    game_balls: { cls: 'balls', label: 'Game ball', title: 'Game balls', marker: 'ball', tag: 'good',
      sub: 'In the NFL, the MVP of a win gets the actual game ball. Here, you get a card on a website.' },
    flags: { cls: 'flags', label: 'Flag', title: 'Flags on the play', marker: 'flag', tag: 'bad',
      sub: 'When a player breaks a rule, the referee throws a yellow flag. These are lineup crimes, mostly points left on the bench.' },
    tough_breaks: { cls: 'breaks', label: 'Tough break', title: 'Tough breaks', marker: 'break', tag: 'info',
      sub: 'Not your fault. The football gods just chose violence.' },
  };
  const AWARD_KINDS = Object.keys(KIND);
  const teamIdByManager = Object.fromEntries(SEASON.standings.map((t) => [t.manager, t.team_id]));
  const mgrLink = (name) => (teamIdByManager[name] ? `<a href="#team-${teamIdByManager[name]}">${esc(name)}</a>` : esc(name));
  // ESPN has no photo for some rookies and practice-squad call-ups and answers those
  // with a 404, so a silhouette sticker stands in for a broken image.
  const NO_HEADSHOT = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2219%22 r=%229%22 fill=%22%23767fb0%22/%3E%3Cpath d=%22M6 48c0-10 8-16 18-16s18 6 18 16z%22 fill=%22%23767fb0%22/%3E%3C/svg%3E';
  // The name is right next to the photo, so it's decorative: alt="" keeps screen readers
  // from reading every leader twice.
  const headshot = (p) => `<span class="mug"><img class="shot" src="${esc(p.headshot || NO_HEADSHOT)}" alt="" width="46" height="46" loading="lazy" onerror="this.onerror=null;this.src='${NO_HEADSHOT}'">${
    p.logo ? `<img class="logo" src="${esc(p.logo)}" alt="${esc(p.team || '')}" title="${esc(p.team || '')}" width="24" height="24" loading="lazy" onerror="this.remove()">` : ''}</span>`;
  const leaderList = (players, tone = '', mark = false) => `<ol class="leaders ${tone}">${players.map((p) => `
    <li${mark && myTeam.get() && teamIdByManager[p.manager] === myTeam.get() ? ' class="me"' : ''}>${headshot(p)}<span class="pname">${esc(p.name)}${mark && myTeam.get() && teamIdByManager[p.manager] === myTeam.get() ? '<span class="vh"> (your player)</span>' : ''}${posOf(p.pos) ? ` <span class="ppos">(${posOf(p.pos)})</span>` : ''}</span><span class="pts">${f1(p.points)}</span>
    <span class="meta">${mgrLink(p.manager)}${p.slot === 'FLEX' ? ' · in the flex' : ''} · projected <span class="num">${f1(p.projected)}</span>${p.short != null ? `, short by <span class="num">${f1(p.short)}</span>` : ''}</span></li>`).join('')}
  </ol>`;
  /* Worst performances: the top scorers list turned upside down, drawn the same way and
     sitting right under it. Skipped when the week has nothing to put in it. */
  const lowlights = (w, sub = true, mark = false) => (w.worst_performances || []).length ? `
    <div class="lows">
      ${secHead('flag', w.complete ? 'Worst performances' : 'Worst performances so far')}
      ${sub ? '<p class="sec-sub">Starters who fell furthest short of their projection.</p>' : ''}
      ${leaderList(w.worst_performances, 'low', mark)}
    </div>` : '';
  const record = (t) => `${t.wins}–${t.losses}${t.ties ? `–${t.ties}` : ''}`;
  const ordinal = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  const latest = () => WEEKS[WEEKS.length - 1];
  const weekOf = (n) => WEEKS.find((w) => w.week === n);

  $('#footer').innerHTML = `
    <span>${esc(DATA.league.name)} · ${DATA.league.season} · ${esc(DATA.league.scoring)} scoring</span>
    <span>${DATA.preview ? 'Preview copy. Draft weeks are not on the league site yet.' : '<span class="script">new recap every Tuesday</span>'}</span>`;

  /* ---------- shared pieces ---------- */
  const secHead = (marker, title, more = '') =>
    `<div class="sec-head"><span class="marker ${marker}" aria-hidden="true"></span><h2>${title}</h2><div class="rule"></div>${more}</div>`;
  const draftBanner = (w) =>
    DATA.preview && w.status !== 'published' ? `<div class="draft-banner">Draft. Week ${w.week} isn't on the league site yet.</div>` : '';

  function weekSwitch(active, suffix = '') {
    if (WEEKS.length < 2) return '';
    return `<nav class="week-switch" aria-label="Choose a week">${WEEKS.map((w) => `
      <a href="#week-${w.week}${suffix}" ${w.week === active.week ? 'aria-current="page"' : ''}>Week ${w.week}${DATA.preview && w.status !== 'published' ? '<span class="dot" title="Draft"></span>' : ''}</a>`).join('')}</nav>`;
  }

  function scoreBox(g, w) {
    return `
      <a class="game" href="${base(w)}.game-${g.key}" aria-label="${esc(g.winner.manager)} ${f2(g.winner.points)}, ${esc(g.loser.manager)} ${f2(g.loser.points)}. Open matchup">
        <div class="bug">
          ${[['winner', g.winner, 'W'], ['loser', g.loser, 'L']].map(([cls, s, r]) => `
            <div class="bug-row ${cls}">
              <div><div class="bug-mgr">${esc(s.manager)}</div><div class="bug-team">${esc(s.team_name)}</div></div>
              <div class="bug-score">${f2(s.points)}${w.complete ? `<span class="wl ${r}">${r}</span>` : ''}</div>
            </div>`).join('')}
        </div>
        ${w.live && !w.complete ? liveStrip(g) : ''}
        <div class="game-body">
          ${g.blurb ? `<p class="blurb">${esc(g.blurb)}</p>` : ''}
          <span class="open">${w.live ? 'Live box score →' : 'Box score and lineup calls →'}</span>
        </div>
      </a>`;
  }

  // Where a side stands this minute: who is on the field right now, then who hasn't
  // kicked off yet. "0 starters left to play" alone couldn't tell a finished afternoon
  // from three players mid-game, so the ones on the field get named first, with the
  // same pulsing dot the Live tab wears.
  function liveStatus(s) {
    const bits = [];
    if (s.playing_now) bits.push(`<span class="on-now"><span class="live-dot" aria-hidden="true"></span>${s.playing_now} playing now</span>`);
    if (s.yet_to_play) bits.push(`${s.yet_to_play} starter${s.yet_to_play === 1 ? '' : 's'} yet to play`);
    return bits.length ? bits.join(' · ') : 'all starters done';
  }

  function liveStrip(g) {
    return `<div class="live-strip">${[g.winner, g.loser].map((s) => `
      <div class="row">
        <span><span class="swatch" style="background:var(--${s === g.winner ? 'accent' : 'orange'})" aria-hidden="true"></span><b>${esc(s.manager)}</b> · projected ${f1(s.live_projection)} · ${liveStatus(s)}</span>
        <span class="num">${s.win_probability == null ? '' : `${Math.round(s.win_probability * 100)}% to win`}</span>
      </div>`).join('')}
      ${g.winner.win_probability == null ? '' : `<div class="prob" role="img" aria-label="Chance to win: ${esc(g.winner.manager)} ${Math.round(g.winner.win_probability * 100)}%, ${esc(g.loser.manager)} ${Math.round((1 - g.winner.win_probability) * 100)}%"><span class="a" style="flex:${g.winner.win_probability.toFixed(3)}"></span><span class="b" style="flex:${(1 - g.winner.win_probability).toFixed(3)}"></span></div>`}
    </div>`;
  }

  // The Move column: a pill when last week's result shifted the team's overall standing, a dash when
  // it held, nothing to compare to in Week 1. Triangle plus a number, so color is never the only cue.
  function rankMove(m) {
    if (m == null) return '';
    if (!m) return '<span class="mv flat" aria-label="No change in rank">–</span>';
    const up = m > 0, n = Math.abs(m);
    const label = `${up ? 'Up' : 'Down'} ${n} ${n === 1 ? 'spot' : 'spots'} after this week`;
    return `<span class="mv ${up ? 'up' : 'down'}" title="${label}" aria-label="${label}"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><polygon points="${up ? '6,1 11,10 1,10' : '1,2 11,2 6,11'}" fill="currentColor"/></svg>${n}</span>`;
  }

  function standingsTable(rows, { compact } = {}) {
    const full = !compact;
    // The playoff line and bye stickers read league.json's format through the playoff odds;
    // no odds, no line.
    // Both come from the seeding (now_cut, regular-season games only), not the row order: once a
    // playoff week is recapped these rows count it too, and a Round 1 win can lift a team past a
    // bye seed. The line is drawn only where it really splits the field from everyone else.
    const P = full ? SEASON.playoffs : null;
    const field = P && P.now_cut ? P.now_cut : [];
    const byeIds = new Set(field.slice(0, P ? P.config.byes : 0));
    const inField = new Set(field);
    const cut = field.length && rows.length > field.length && rows.slice(0, field.length).every((t) => inField.has(t.team_id)) ? field.length : 0;
    const cols = full ? 9 : 5;
    return `
      <div class="table-scroll"><table class="std">
        <thead><tr>
          <th></th><th title="Places gained or lost in the standings after the latest week">Move</th><th>Team</th><th class="r">Record</th>
          ${full ? '<th class="r">Streak</th>' : ''}
          <th class="r" title="Total points scored this season">Scored</th>
          ${full ? '<th class="r" title="Total points opponents scored">Allowed</th><th class="r" title="Record if this team played every other team every week">Vs. everyone</th><th class="r" title="Season total of points left on the bench">Benched</th>' : ''}
        </tr></thead>
        <tbody>${rows.map((t, i) => `
          <tr class="${t.rank_move > 0 ? 'moved-up' : t.rank_move < 0 ? 'moved-down' : ''}${i + 1 === cut ? ' po-cut' : ''}">
            <td class="rank">${i + 1}</td>
            <td class="mv-cell">${rankMove(t.rank_move)}</td>
            <td class="mgr"><span class="mgr-cell"><span class="mgr-who"><a href="#team-${t.team_id}">${esc(t.manager)}</a>${byeIds.has(t.team_id) ? '<span class="bye-tag" title="A top seed sits out Round 1">Bye</span>' : ''}<span class="tname">${esc(t.team_name)}</span></span>${full ? `<a class="profile-btn" href="#team-${t.team_id}" aria-label="${esc(t.manager)}'s team profile">Profile →</a>` : ''}</span></td>
            <td class="r">${record(t)}</td>
            ${full ? `<td class="r">${t.streak ? `<span class="res ${t.streak[0]}">${t.streak}</span>` : '–'}</td>` : ''}
            <td class="r">${f2(t.points_for)}</td>
            ${full ? `<td class="r">${f2(t.points_against)}</td><td class="r">${t.all_play_w}–${t.all_play_l}</td><td class="r">${f2(t.bench_left)}</td>` : ''}
          </tr>${i + 1 === cut ? `
          <tr class="po-line"><td colspan="${cols}"><span class="po-line-tag">Playoff line · the top ${cut} advance</span></td></tr>` : ''}`).join('')}
        </tbody>
      </table></div>`;
  }

  /* ---------- playoff picture ---------- */
  // Shares print as whole percents. The ends say <1% and >99%, because a simulation that never
  // saw something happen hasn't proved it can't; only a finished regular season gets 0% and 100%.
  const pct = (p, exact = false) => {
    if (exact && (p === 0 || p === 1)) return `${p * 100}%`;
    if (p < 0.005) return '<1%';
    if (p >= 0.995) return '>99%';
    return `${Math.round(p * 100)}%`;
  };
  const PO_TIP = { 'Near lock': 'Made the playoffs in nearly every simulated season', 'Bye race': `In the hunt for a top seed and the week off`,
    Comfortable: 'Makes it in most simulated seasons', Bubble: 'Right at the playoff line, could go either way',
    'Long shot': 'Needs some help, but it happens', 'Near out': 'Almost never makes it in the simulations',
    In: 'Made the playoffs', Out: 'Missed the playoffs' };
  const PO_LABEL = { 'Near lock': 'lock', 'Bye race': 'bye', Comfortable: 'comfy', Bubble: 'bubble',
    'Long shot': 'long', 'Near out': 'near-out', In: 'in', Out: 'out' };
  const nameOf = (id) => (TEAMS[id] ? TEAMS[id].manager : `Team ${id}`);
  const poBar = (p, label) => `<span class="po-bar" role="img" aria-label="${esc(label)}"><span style="width:${(p * 100).toFixed(1)}%"></span></span>`;
  const trendCell = (d) => {
    if (d == null) return '<span title="No earlier week to compare with">–</span>';
    const pts = Math.round(d * 1000) / 10;
    if (Math.abs(pts) < 0.5) return '<span title="Within half a point of last week">even</span>';
    const up = pts > 0;
    return `<span class="po-trend ${up ? 'up' : 'down'}"><span aria-hidden="true">${up ? '▲' : '▼'}</span> ${f1(Math.abs(pts))}<span class="sr"> points ${up ? 'up' : 'down'} since last week</span></span>`;
  };

  function bracketGame(g) {
    const fav = g.teams.find((x) => x.team_id === g.favorite);
    const team = (x) => `
          <div class="br-team${x.team_id === g.favorite ? ' fav' : ''}"><span class="br-seed" aria-label="Seed ${x.seed}">${x.seed}</span><a href="#team-${x.team_id}">${esc(nameOf(x.team_id))}</a>${
            x.team_id === g.favorite ? '<span class="br-check" aria-hidden="true">✓</span><span class="sr">projected winner</span>' : '<span></span>'}</div>`;
    return `
        <div class="br-game">${g.teams.map(team).join('')}
          <div class="br-odds">${poBar(g.win_prob, `${nameOf(fav.team_id)} wins this game ${pct(g.win_prob)} of the time`)}<span>${pct(g.win_prob)} ${esc(nameOf(fav.team_id))}</span></div>
        </div>`;
  }

  const weeksLabel = (r) => (r.weeks > 1 ? `Weeks ${r.week} ${r.weeks === 2 ? 'and' : 'to'} ${r.week + r.weeks - 1}` : `Week ${r.week}`);

  /* ---------- playoff bracket + what-if ----------
     The chalk bracket and the what-if mode share one renderer. What-if keeps its picks in WI and redraws
     only the bracket and the control panel, so the scroller (and its scroll position) outlives every pick.
     Odds come from SEASON.playoffs.bracket.what_if (site/playoffs.py), never from numbers in this file. */
  const WI = { on: false, step: 1, pick: { sf1: null, sf2: null, fin: null }, timer: 0, model: null };
  const noMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function wiModel(B) {
    const W = B && B.what_if;
    if (!W || !B.rounds || B.rounds.length !== 2 || B.rounds[0].games.length !== 2) return null;
    const seed = {}, pSemi = {};
    W.semis.forEach((g) => g.teams.forEach((t) => { seed[t.team_id] = t.seed; pSemi[t.team_id] = t.p; }));
    const chalk = { sf1: B.rounds[0].games[0].favorite, sf2: B.rounds[0].games[1].favorite, fin: B.champion };
    return {
      B, W, seed, pSemi, chalk, semis: B.rounds[0].games.map((g, k) => W.semis[k].teams),
      estimated: W.finals.some((f) => f.est) || W.scenarios.some((x) => x.est),
      finalOf: (a, b) => W.finals.find((f) => f.teams.includes(a) && f.teams.includes(b)),
      scenario: (a, b, c) => W.scenarios.find((x) => x.semis[0] === a && x.semis[1] === b && x.champion === c),
    };
  }

  const wiPicks = () => (WI.on ? WI.pick : WI.model.chalk);
  const wiBoth = () => !!(WI.pick.sf1 && WI.pick.sf2);
  const wiScenario = (k) => (k.sf1 && k.sf2 && k.fin ? WI.model.scenario(k.sf1, k.sf2, k.fin) : null);
  const wiReach = (k) => { const sc = k.sf1 && k.sf2 ? WI.model.W.scenarios.find((x) => x.semis[0] === k.sf1 && x.semis[1] === k.sf2) : null; return sc ? sc.reach : null; };

  /* One team row. Static: a link to her profile, lime for the favorite. What-if: a real button, lime for
     the pick. `slot` is the pick it belongs to (sf1, sf2 or fin). */
  function pbRow(slot, id, p, est, k) {
    const M = WI.model, on = WI.on;
    const lit = k[slot] === id, out = on && k[slot] && !lit;
    const pctTxt = p == null ? '' : `<span class="pb-pct">${est ? '~' : ''}${pct(p)}</span>`;
    const inner = `<span class="pb-seed" aria-hidden="true">${M.seed[id]}</span><span class="sr">Seed ${M.seed[id]}</span>${on
      ? `<span class="pb-name">${esc(nameOf(id))}</span>` : `<a class="pb-name" href="#team-${id}">${esc(nameOf(id))}</a>`}${pctTxt}<span class="pb-ck" aria-hidden="true">${lit ? '✓' : ''}</span>${lit && !on ? '<span class="sr">projected winner</span>' : ''}`;
    const cls = `pb-row${lit ? ' fav' : ''}${out ? ' out' : ''}${on ? ' pickable' : ''}`;
    return on ? `<button type="button" class="${cls}" data-m="${slot}" data-t="${id}" aria-pressed="${lit}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
  }

  function pbSemi(k, slot) {
    const teams = WI.model.semis[slot === 'sf1' ? 0 : 1];
    const top = Math.max(...teams.map((t) => t.p));
    return `<div class="pb-card${WI.on && k[slot] ? ' pulse' : ''}">${teams.map((t) => pbRow(slot, t.team_id, t.p, false, k)).join('')}
      <div class="pb-bar"><i style="width:${(top * 100).toFixed(1)}%"></i></div></div>`;
  }

  function pbFinal(k) {
    const M = WI.model;
    if (WI.on && !(k.sf1 && k.sf2)) return '<div class="pb-card"><div class="pb-row tbd">Waiting on semifinal picks…</div></div>';
    const [a, b] = [k.sf1, k.sf2].sort((x, y) => M.seed[x] - M.seed[y]);
    const f = M.finalOf(a, b);
    const top = Math.max(f.p[a], f.p[b]);
    const reach = wiReach(k);
    const sticker = WI.on && reach != null ? `<span class="pb-tag odds">🎯 <b>${pct(reach)}</b> this final happens</span>` : '';
    return `<div class="pb-card">${[a, b].map((t) => pbRow('fin', t, f.p[t], f.est, k)).join('')}
      <div class="pb-bar"><i style="width:${(top * 100).toFixed(1)}%"></i></div>${sticker}</div>`;
  }

  function pbChamp(k, byId) {
    const M = WI.model;
    if (WI.on && !k.fin) return '<div class="pb-champ-card empty"><span class="pb-tag">🏆 Champion</span><div class="n">?</div><div class="t">Pick the championship winner</div></div>';
    const sc = wiScenario(k);
    const chalk = ['sf1', 'sf2', 'fin'].every((x) => k[x] === M.chalk[x]);
    const sticker = sc ? `<span class="pb-tag odds">🎯 <b>${sc.est ? '~' : ''}${pct(sc.p)}</b> scenario odds</span>` : '';
    return `<div class="pb-champ-card${WI.on ? ' pulse' : ''}"><span class="pb-tag">🏆 ${chalk ? 'Projected champ' : 'Your champ'}</span>
      <div class="n"><a href="#team-${k.fin}">${esc(nameOf(k.fin))}</a></div>
      <div class="t">${chalk ? `Wins it all in <b>${pct(byId[k.fin].title)}</b> of simulated seasons` : 'Not the projected path'}</div>${sticker}</div>`;
  }

  function pbConn(kind, k) {
    const attrs = 'width="52" height="304" viewBox="0 0 52 304" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
    return kind === 'a'
      ? `<div class="pb-conn"><svg ${attrs}><path class="${k.sf1 ? 'on' : ''}" d="M0 66 H26 V152 H52"/><path class="${k.sf2 ? 'on' : ''}" d="M0 238 H26 V152"/></svg></div>`
      : `<div class="pb-conn"><svg ${attrs}><path class="${k.fin ? 'on' : ''}" d="M0 152 H52"/></svg></div>`;
  }

  function pbBracketHTML() {
    const M = WI.model, k = wiPicks(), B = M.B;
    const byId = Object.fromEntries(SEASON.playoffs.teams.map((t) => [t.team_id, t]));
    const act = (n) => (WI.on && WI.step === n ? ' active' : '');
    const inert = (n) => (WI.on && WI.step !== n ? ' inert aria-hidden="true"' : '');
    const [r0, r1] = B.rounds;
    return `
      <div class="pb-col semis${act(1)}" data-step="1"${inert(1)}><h3>Semifinals · ${weeksLabel(r0)}</h3><div class="pb-stack">${pbSemi(k, 'sf1')}${pbSemi(k, 'sf2')}</div></div>
      ${pbConn('a', k)}
      <div class="pb-col final${act(2)}" data-step="2"${inert(2)}><h3>Championship · ${weeksLabel(r1)}</h3>${pbFinal(k)}</div>
      ${pbConn('b', k)}
      <div class="pb-col champ${act(3)}" data-step="3"${inert(3)}><h3>${WI.on ? 'Champion' : 'Projected champ'}</h3>${pbChamp(k, byId)}</div>`;
  }

  function pbPanelHTML() {
    const k = WI.pick, both = wiBoth();
    const reach = { 1: true, 2: both, 3: !!k.fin };
    const names = { 1: 'Semifinals', 2: 'Championship', 3: 'Champion' };
    const steps = [1, 2, 3].map((n) => {
      const done = (n === 1 && both) || (n >= 2 && k.fin);
      const mark = done && WI.step !== n;
      return `${n > 1 ? '<i class="pb-sep"></i>' : ''}<button type="button" class="pb-dot${WI.step === n ? ' cur' : ''}${mark ? ' done' : ''}" data-wi="go" data-go="${n}"${WI.step === n ? ' aria-current="step"' : ''}${reach[n] ? '' : ' disabled'}><b>${mark ? '✓' : n}</b>${names[n]}</button>`;
    }).join('');
    const picked = ['sf1', 'sf2'].filter((x) => k[x]).length;
    const sc = wiScenario(k), reachP = wiReach(k);
    const m = {
      1: [`Pick your Week ${WI.model.B.rounds[0].week} winners (${picked}/2)`, 'Tap a team in each matchup. Once both are locked in, we move to the final.'],
      2: ['Pick the champion', both ? `This final happens in ${pct(reachP)} of scenarios. Who takes the title?` : 'Who takes the title?'],
      3: [k.fin ? `${esc(nameOf(k.fin))} takes the crown` : 'Pick a champion', sc ? `This exact scenario: ${sc.est ? '~' : ''}${pct(sc.p)} likely` : 'Change any round with Back or the step tabs.'],
    }[WI.step];
    return { steps, msg: `${m[0]}<span>${m[1]}</span>`, tools: `<button type="button" class="pb-ghost" data-wi="back"${WI.step === 1 ? ' disabled' : ''}>← Back</button><button type="button" class="pb-ghost" data-wi="reset">Reset</button><button type="button" class="pb-ghost" data-wi="exit">Exit</button>` };
  }

  function pbDraw() {
    const root = document.getElementById('pb-root');
    if (!root || !WI.model) return;
    root.classList.toggle('whatif', WI.on);
    document.getElementById('pb-bracket').innerHTML = pbBracketHTML();
    if (WI.on) {
      const P = pbPanelHTML();
      document.getElementById('pb-steps').innerHTML = P.steps;
      document.getElementById('pb-msg').innerHTML = P.msg;
      document.getElementById('pb-tools').innerHTML = P.tools;
    }
  }

  function pbAlign(instant) {
    const sc = document.getElementById('pb-scroll'), col = sc && sc.querySelector(`.pb-col[data-step="${WI.on ? WI.step : 1}"]`);
    if (sc && col) sc.scrollTo({ left: WI.on ? col.offsetLeft : 0, behavior: instant || noMotion() ? 'auto' : 'smooth' });
  }

  function pbGo(n, instant, focus) {
    WI.step = n;
    pbDraw();
    pbAlign(instant);
    if (focus) { const b = document.querySelector('.pb-col.active button, .pb-col.active a'); if (b) b.focus({ preventScroll: true }); }
  }

  /* After the second semifinal pick (or the champion pick) wait a beat so the pick registers, then pan on. */
  function pbAdvance(to) {
    clearTimeout(WI.timer);
    WI.timer = setTimeout(() => {
      const ready = to === 2 ? wiBoth() && WI.step === 1 : !!WI.pick.fin && WI.step === 2;
      if (WI.on && ready) pbGo(to, false, true);
    }, 500);
  }

  function pbAction(btn) {
    const a = btn.dataset.wi;
    clearTimeout(WI.timer);
    if (a === 'enter') {
      WI.on = true; WI.pick = { sf1: null, sf2: null, fin: null };
      pbGo(1, true, true);
      const top = document.getElementById('pb-root');
      if (top) top.scrollIntoView({ behavior: noMotion() ? 'auto' : 'smooth', block: 'start' });
    } else if (a === 'exit') {
      WI.on = false; WI.step = 1; WI.pick = { sf1: null, sf2: null, fin: null };
      pbDraw(); pbAlign(true);
      const again = document.querySelector('[data-wi="enter"]'); if (again) again.focus({ preventScroll: true });
    } else if (a === 'reset') {
      WI.pick = { sf1: null, sf2: null, fin: null }; pbGo(1, false, true);
    } else if (a === 'back') {
      if (WI.step > 1) pbGo(WI.step - 1, false, true);
    } else if (a === 'go') {
      pbGo(Number(btn.dataset.go), false, true);
    }
  }

  function pbPick(btn) {
    const slot = btn.dataset.m, id = Number(btn.dataset.t), k = WI.pick;
    k[slot] = id;
    if (slot !== 'fin' && k.fin && ![k.sf1, k.sf2].includes(k.fin)) k.fin = null;
    pbDraw();
    const again = document.querySelector(`.pb-row[data-m="${slot}"][data-t="${id}"]`); if (again) again.focus({ preventScroll: true });
    if (slot === 'fin') pbAdvance(3); else if (wiBoth()) pbAdvance(2);
  }

  $('#main').addEventListener('click', (e) => {
    if (!WI.on && !e.target.closest('[data-wi="enter"]')) return;
    const act = e.target.closest('button[data-wi]');
    if (act && !act.disabled) return pbAction(act);
    const row = e.target.closest('button.pb-row[data-m]');
    if (row && WI.on) pbPick(row);
  });
  window.addEventListener('resize', () => { if (WI.on) pbAlign(true); });

  function playoffPicture() {
    const P = SEASON.playoffs;
    if (!P || !P.teams || !P.teams.length) return '';
    const cfg = P.config;
    const n = P.teams.length;
    const cut = Math.min(cfg.teams, n);
    const done = P.games_left === 0;
    const B = P.bracket;
    const byId = Object.fromEntries(P.teams.map((t) => [t.team_id, t]));
    const champ = B ? byId[B.champion] : null;
    // Drawing the page starts the bracket over: what-if is a visit, not a saved setting.
    clearTimeout(WI.timer);
    Object.assign(WI, { on: false, step: 1, pick: { sf1: null, sf2: null, fin: null }, model: wiModel(B) });
    const shade = (p) => (p > 0 ? `background: color-mix(in srgb, var(--heat-hi) ${(6 + p * 50).toFixed(0)}%, var(--card))` : '');
    const seeds = Array.from({ length: n }, (_, k) => k + 1);
    const sims = Number(P.sims).toLocaleString('en-US');
    const tiebreak = cfg.tiebreaker === 'points_for' ? 'whoever has scored more points' : esc(cfg.tiebreaker.replace(/_/g, ' '));

    return `
      ${B ? `
      <section>
        ${secHead('ball', 'Playoff picture')}
        <p class="sec-sub full">Top ${cfg.teams} make the playoffs${cfg.byes ? `, top ${cfg.byes} get a bye (a week off)` : ', no byes (a bye is a week off)'}, starting Week ${cfg.first_round_week}.${B ? ` The championship is ${B.rounds[B.rounds.length - 1].weeks > 1 ? `both teams' points added up over ${weeksLabel(B.rounds[B.rounds.length - 1])}` : weeksLabel(B.rounds[B.rounds.length - 1])}.` : ''} ${cfg.reseed ? 'The bracket reseeds after each round.' : 'The bracket stays put.'}${cfg.consolation_ladder ? ' Everyone else plays a consolation ladder to settle final placing.' : ''}</p>
        ${WI.model ? `
        <div class="pb-root" id="pb-root">
          <p class="sec-sub pb-intro">The chalk bracket, meaning every favorite wins. Teams slot in by projected seed, their spot in the final standings. The percent is how often the favorite wins that one game.</p>
          <div class="pb-promo">
            <div class="pb-promo-txt"><span class="pb-eyebrow">NEW · INTERACTIVE</span><b>What if your team pulls off the upset?</b><span class="pb-promo-sub">Pick the winner of every game and see how likely your scenario is.</span></div>
            <button type="button" class="pb-cta" data-wi="enter">⚡ Play what-if <i aria-hidden="true">→</i></button>
          </div>
          <div class="pb-panel" id="pb-panel"><div class="pb-steps" id="pb-steps" role="group" aria-label="What-if steps"></div><div class="pb-msg" id="pb-msg" role="status" aria-live="polite"></div><div class="pb-tools" id="pb-tools"></div></div>
          <div class="pb-scroll" id="pb-scroll" tabindex="0" role="group" aria-label="Projected playoff bracket"><div class="pb-bracket" id="pb-bracket">${pbBracketHTML()}</div></div>
          <div class="pb-legend"><span class="l1">Projected winner</span><span class="l2">Win probability</span></div>
          <p class="pb-foot">🎯 = chance this exact path plays out (semifinal odds × semifinal odds × final odds, treated as independent). It runs lower than the title odds above because those count every way a team can win it, including from a different seed.${WI.model.estimated ? ' <b>~</b> = estimated: that final matchup isn\'t simulated directly, so it is inferred from the odds shown.' : ''}</p>
        </div>` : `
        <p class="sec-sub pb-intro">The chalk bracket, meaning every favorite wins. Teams slot in by projected seed, their spot in the final standings. The percent is how often the favorite wins that one game.</p>
        <div class="bracket" role="group" aria-label="Projected playoff bracket" style="--br-cols: ${B.rounds.length}">${B.rounds.slice(0, -1).map((r, k, early) => `
          <div class="br-col"><h3>${k === early.length - 1 ? 'Semifinals' : `Round ${k + 1}`} · ${weeksLabel(r)}</h3>${r.games.map(bracketGame).join('')}</div>`).join('')}
          <div class="br-col"><h3>Championship · ${weeksLabel(B.rounds[B.rounds.length - 1])}</h3>${bracketGame(B.final)}
            <div class="br-champ"><span class="badge-tilt">Projected champ</span><span class="br-champ-name"><a href="#team-${B.champion}">${esc(nameOf(B.champion))}</a></span><span class="sub">Wins it all in ${pct(champ.title)} of simulated seasons</span></div>
          </div>
        </div>`}
      </section>` : ''}

      <section>
        ${secHead('board', 'Playoff odds')}
        <p class="sec-sub full">${done ? 'The regular season is over, so the field is set. The title still has to be won.' : `<b>How this works.</b> We played out the rest of the season ${sims} times, drawing each team's weekly score from her scoring so far (nudged toward the league average, since a few weeks is a tiny sample). ${P.real_schedule ? 'Matchups follow the real schedule.' : 'Opponents are random, since the real schedule isn\'t loaded yet.'} Ties go to ${tiebreak}. Treat the odds like a weather forecast: great for planning, terrible for trash talk.`}</p>
        <div class="std-card table-scroll">
          <table class="std po-odds" aria-label="Playoff odds by team">
            <thead><tr><th title="Projected final spot in the standings, which sets the bracket">Seed</th><th>Team</th><th>Makes it</th>${cfg.byes ? '<th class="r">Bye</th>' : ''}<th class="r">Title</th><th class="r" title="Expected final regular-season record">Proj. record</th><th class="r" title="Change in playoff odds since last week, in percentage points">Vs. last week</th></tr></thead>
            <tbody>${P.teams.map((t) => `
