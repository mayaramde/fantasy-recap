     One hero on Overview, a slim identity bar on the other two tabs, and a tab bar in
     between. Phones get one column; from 860px up Overview grows a side rail. */
  .tp-hero { margin-top: 18px; background: #151a33; color: #f4f6ff; border: 2px solid var(--edge); border-radius: 18px; box-shadow: 5px 5px 0 var(--accent);
    padding: 18px 18px 16px; display: grid; gap: 12px 14px; grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "top top" "name rec" "stats stats"; align-items: end; }
  .tp-hero-top { grid-area: top; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tp-tname { font: 600 12.5px/1 var(--script); letter-spacing: 0.04em; text-transform: uppercase; color: #151a33; background: var(--pink); border: 2px solid #f4f6ff; border-radius: 999px; padding: 5px 11px; transform: rotate(-2deg); }
  .tp-you { font: 600 12px/1 var(--script); color: #151a33; background: var(--lime); border-radius: 999px; padding: 5px 11px; }
  .tp-hero h1 { grid-area: name; margin: 0; font: 900 clamp(48px, 17vw, 68px)/0.9 var(--display); letter-spacing: 0.01em; overflow-wrap: anywhere; }
  .tp-rec { grid-area: rec; text-align: right; }
  .tp-rec b { display: block; font: 900 clamp(38px, 12vw, 50px)/0.9 var(--display); color: var(--lime); }
  .tp-rec span { display: block; margin-top: 4px; font: 500 12px/1 var(--mono); color: #a9b2dc; }
  .tp-stats { grid-area: stats; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1.5px solid #2b3263; padding-top: 12px; }
  .tp-stats > :nth-child(4) { display: none; }
  .tp-stats .l { font: 600 10.5px/1 var(--script); letter-spacing: 0.08em; text-transform: uppercase; color: #a9b2dc; }
  .tp-stats .v { margin-top: 5px; font: 500 19px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .tp-stats .v small { font-size: 11px; color: #a9b2dc; }
  @media (min-width: 860px) {
    .tp-hero { padding: 26px 30px; box-shadow: 6px 6px 0 var(--accent); gap: 10px 36px; grid-template-columns: auto auto minmax(0, 1fr);
      grid-template-areas: "top rec stats" "name rec stats"; align-items: center; }
    .tp-hero h1 { font-size: clamp(72px, 9vw, 104px); }
    .tp-rec b { font-size: clamp(60px, 7vw, 84px); }
    .tp-rec span { font-size: 14px; margin-top: 8px; }
    .tp-stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 16px 36px; border-top: none; padding-top: 0; justify-self: end; }
    .tp-stats > :nth-child(4) { display: block; }
    .tp-stats .v { font-size: 26px; }
  }

  /* the slim version, for Lineup and Season: it is also the way back to Overview */
  .tp-bar { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; padding: 12px 16px; text-decoration: none;
    background: #151a33; color: #f4f6ff; border: 2px solid var(--edge); border-radius: 16px; box-shadow: 4px 4px 0 var(--accent); }
  .tp-bar:hover { color: #f4f6ff; }
  .tp-bar .back { display: block; font: 600 11px/1 var(--script); letter-spacing: 0.06em; text-transform: uppercase; color: #ff82c0; }
  .tp-bar .nm { display: block; margin-top: 3px; font: 900 34px/0.95 var(--display); }
  .tp-bar .rec { text-align: right; }
  .tp-bar .rec b { display: block; font: 900 32px/0.95 var(--display); color: var(--lime); }
  .tp-bar .rec span { display: block; margin-top: 2px; font: 500 11.5px/1 var(--mono); color: #a9b2dc; }

  .tp-tabs { margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 3px 3px 0 var(--drop); }
  .tp-tabs a { text-align: center; text-decoration: none; color: var(--ink); font: 600 14px/1 var(--script); border-radius: 9px; padding: 13px 0; }
  .tp-tabs a:hover { background: var(--accent-soft); }
  .tp-tabs a[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
  @media (min-width: 860px) { .tp-tabs { max-width: 440px; } .tp-tabs a { font-size: 15px; } }

  .tp-sec { margin-top: 26px; display: grid; gap: 10px; align-content: start; }
  .tp-head { display: flex; align-items: center; gap: 8px; }
  .tp-head .mark { flex: none; width: 14px; height: 14px; background: var(--c, var(--accent)); border: 2px solid var(--edge); border-radius: 4px; }
  .tp-head h2 { font: 800 26px/1 var(--display); letter-spacing: 0.01em; }
  .tp-head .more { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; text-align: right; }
  .tp-head .more:hover { text-decoration: underline; }
  .tp-sec > .sec-sub { margin: -4px 0 0; }
  .tp-sub { margin-top: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 600 12px/1.2 var(--script); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .tp-sub small { font: 400 12px/1.2 var(--body); letter-spacing: 0; text-transform: none; }

  /* Overview: this week */
  .tp-match { background: var(--card); border: 2px solid var(--edge); border-radius: 16px; box-shadow: 4px 4px 0 var(--lime); padding: 16px; display: grid; gap: 14px; }
  .tp-vs { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .tp-vs .nm { font: 800 28px/1 var(--display); }
  .tp-vs .nm a { color: var(--accent); text-decoration: none; }
  .tp-badge { flex: none; font: 600 12px/1 var(--script); color: var(--on-pop); background: var(--lime); border: 2px solid var(--edge); border-radius: 999px; padding: 5px 10px; transform: rotate(-2deg); }
  .tp-badge.now { background: var(--pink); } .tp-badge.watch { background: var(--orange); }
  .tp-win .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }

<script id="recap-data" type="application/json">__RECAP_DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('recap-data').textContent);
  const WEEKS = DATA.weeks;
  const SEASON = DATA.season;
  const LIVE = DATA.live;
  // Nothing on the field right now: the week is either done and awaiting Tuesday's recap,
  // or captured but not yet kicked off (Thursday hasn't happened). Read straight off the
  // capture, never a day-of-week guess, so this only ever tracks real NFL kickoffs.
  const deadZone = () => !!(LIVE && (LIVE.complete || !LIVE.kicked_off));
  // The Live tab and route both dispatch here: the normal live scoreboard while something
  // is actually being played, the midweek landing page the rest of the time.
  const liveOrLanding = (w) => (deadZone() ? landingPage(w) : livePage(w));
  if (LIVE) {
    const tab = document.getElementById('nav-live');
    tab.hidden = false;
    // Same tab, same route — just not "Live" when nothing is.
    tab.innerHTML = deadZone() ? 'This week' : '<span class="live-dot" aria-hidden="true"></span>Live';
  }
  // Home shows Live (or, in the dead zone, the landing page) while a week is in progress or
  // pending, so the Recaps tab can't just point at "#" anymore — that would land there too.
  if (WEEKS.length) document.getElementById('nav-week').href = `#week-${WEEKS[WEEKS.length - 1].week}`;
  // Read through to LIVE every time: refreshLive() swaps the whole object's contents,
  // so a captured reference to LIVE.advice would go stale after the first refresh.
  const advice = () => (LIVE && LIVE.advice) || null;
  // The week-ahead preview is baked at build time (next week's numbers move about once a
  // day, not once a minute), so a live refresh leaves it exactly as it was.
  const ahead = () => (LIVE && LIVE.next) || null;
  const coachRows = (next) => (next ? (ahead() || {}).teams : advice()) || null;
  const coachFor = (id, next) => (coachRows(next) || []).find((a) => a.team_id === id);
  const adviceFor = (id) => coachFor(id, false);
  // A team's coach page is now a section of her profile; the league-wide grid keeps #coach.
  // Where a to-do lives: the Lineup tab (this week) or the next-week tab.
  const lineupUrl = (next, id) => `#team-${id}${next ? '.next' : '.lineup'}`;
  const coachUrl = (next, id) => (id ? `#team-${id}${next ? '.next' : ''}` : `#coach${next ? '-next' : ''}`);
  // Every game of the week played, so no lineup change can score another point. It
  // happens hours before ESPN calls the week final, and it's the moment this week's
  // advice stops being advice.
  const liveShut = () => { const rows = advice(); return !!rows && rows.every((a) => a.can_change === false); };
  // Nothing left to fix in this week, so the tab leads with next week instead.
  const leadWithNext = () => !!(ahead() && (LIVE.complete || liveShut()));
  // Eight people, one page: remembering the last team someone picked lets the Coach page
  // open as hers. Private windows throw on localStorage, which costs nothing.
  // The in-memory copy matters now that Coach's team picker can't be dismissed: with storage
  // blocked, a pick still has to stick for the visit or the picker would reopen forever.
  let pickedTeam = null;
  const myTeam = {
    get() { try { return Number(localStorage.getItem('ffg-coach-team')) || pickedTeam; } catch { return pickedTeam; } },
    set(id) { pickedTeam = id; try { localStorage.setItem('ffg-coach-team', String(id)); } catch { /* no memory, no harm */ } },
  };
  // Always the Coach page itself, never her profile: her team shows up there as the hero card.
  const coachHref = () => coachUrl(leadWithNext(), null);
  if (advice()) {
    const tab = document.getElementById('nav-coach');
    tab.hidden = false;
    tab.href = coachHref();
  }
  const base = (w) => (w.live ? '#live' : `#week-${w.week}`);
  const updated = (iso) => new Date(iso).toLocaleString(undefined, { weekday: 'long', hour: 'numeric', minute: '2-digit' });
  const liveLabel = (w) => (w.complete ? `Week ${w.week} is final. The official recap drops Tuesday.` : `Week ${w.week} is happening now.`);
  const TEAMS = Object.fromEntries(SEASON.standings.map((t) => [t.team_id, t]));
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const f2 = (n) => (n == null ? '–' : (Math.round(n * 100) / 100).toFixed(2));
  const f1 = (n) => (n == null ? '–' : (Math.round(n * 10) / 10).toFixed(1));
  // "Joe Burrow (QB)". A defense already says what it is in its name ("Seahawks D/ST"),
  // and a player's lineup slot can be FLEX, which is a spot on the roster, not a position.
  const posOf = (pos) => (pos && pos !== 'DST' ? esc(pos) : '');
  // "(RB, 12.90)" — the position rides in the same parentheses as the points.
  const scored = (pos, pts) => (posOf(pos) ? `${posOf(pos)}, ` : '') + f2(pts);
  const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + f1(Math.abs(n));
  const SLOT_ORDER = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'DST', 'K'];
  // Injury designations that mean "he isn't playing", so they get the loud color
  const OUTISH = ['Out', 'On IR', 'Suspended', 'Doubtful'];
  const ADVICE_KIND = { out: 'Injury', bye: 'Bye week', watch: 'Game-time call', swap: 'Lineup swap',
    empty: 'Empty slot', hole: 'Roster hole', news: 'Injury news', back: 'Good news', clear: 'All clear',
    consensus: 'Expert consensus', fp_news: 'FantasyPros news', fp_back: 'FantasyPros update',
    waiver: 'Waiver idea', trade: 'Trade idea', recap: 'Last week', matchup: "Who's next",
    lineup_iq: 'Lineup calls', position: 'Position strength', projection: 'Vs projections' };
  /* Each urgency reads a little differently on the week being played and on the week
     ahead, where nothing has kicked off and nothing is locked yet. */
  const ADVICE_LEVEL = {
    now: { title: 'Do this now', marker: 'flag',
      sub: 'Changes worth making before his game kicks off. Once it does, that player is locked in for the week.',
      nextTitle: 'Sort this out', nextSub: 'Nothing has kicked off yet, so all of this is still yours to change. Sunday is the deadline.' },
    watch: { title: 'Keep an eye on it', marker: 'break',
      sub: 'Nothing is settled yet. Check back before kickoff.',
      nextSub: 'A long way from settled. Worth another look nearer the weekend.' },
    info: { title: 'Good to know', marker: 'book', sub: 'No action needed, just news from your roster.' },
  };
  const KIND = {
    game_balls: { cls: 'balls', label: 'Game ball', title: 'Game balls', marker: 'ball', tag: 'good',
      sub: 'In the NFL, the MVP of a win gets the actual game ball. Here, you get a card on a website.' },
    flags: { cls: 'flags', label: 'Flag', title: 'Flags on the play', marker: 'flag', tag: 'bad',
      sub: 'When a player breaks a rule, the referee throws a yellow flag. These are lineup crimes, mostly points left on the bench.' },
    tough_breaks: { cls: 'breaks', label: 'Tough break', title: 'Tough breaks', marker: 'break', tag: 'info',
      sub: 'Not your fault. The football gods just chose violence.' },
  };
  const AWARD_KINDS = Object.keys(KIND);
  const teamIdByManager = Object.fromEntries(SEASON.standings.map((t) => [t.manager, t.team_id]));
  const mgrLink = (name) => (teamIdByManager[name] ? `<a href="#team-${teamIdByManager[name]}">${esc(name)}</a>` : esc(name));
  // ESPN has no photo for some rookies and practice-squad call-ups and answers those
  // with a 404, so a silhouette sticker stands in for a broken image.
  const NO_HEADSHOT = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2219%22 r=%229%22 fill=%22%23767fb0%22/%3E%3Cpath d=%22M6 48c0-10 8-16 18-16s18 6 18 16z%22 fill=%22%23767fb0%22/%3E%3C/svg%3E';
  // The name is right next to the photo, so it's decorative: alt="" keeps screen readers
  // from reading every leader twice.
  const headshot = (p) => `<span class="mug"><img class="shot" src="${esc(p.headshot || NO_HEADSHOT)}" alt="" width="46" height="46" loading="lazy" onerror="this.onerror=null;this.src='${NO_HEADSHOT}'">${
    p.logo ? `<img class="logo" src="${esc(p.logo)}" alt="${esc(p.team || '')}" title="${esc(p.team || '')}" width="24" height="24" loading="lazy" onerror="this.remove()">` : ''}</span>`;
  const leaderList = (players, tone = '') => `<ol class="leaders ${tone}">${players.map((p) => `
    <li>${headshot(p)}<span class="pname">${esc(p.name)}${posOf(p.pos) ? ` <span class="ppos">(${posOf(p.pos)})</span>` : ''}</span><span class="pts">${f1(p.points)}</span>
    <span class="meta">${mgrLink(p.manager)}${p.slot === 'FLEX' ? ' · in the flex' : ''} · projected <span class="num">${f1(p.projected)}</span>${p.short != null ? `, short by <span class="num">${f1(p.short)}</span>` : ''}</span></li>`).join('')}
  </ol>`;
  /* Worst performances: the top scorers list turned upside down, drawn the same way and
     sitting right under it. Skipped when the week has nothing to put in it. */
  const lowlights = (w, sub = true) => (w.worst_performances || []).length ? `
    <div class="lows">
      ${secHead('flag', w.complete ? 'Worst performances' : 'Worst performances so far')}
      ${sub ? '<p class="sec-sub">Starters who fell furthest short of their projection.</p>' : ''}
      ${leaderList(w.worst_performances, 'low')}
    </div>` : '';
  const record = (t) => `${t.wins}–${t.losses}${t.ties ? `–${t.ties}` : ''}`;
  const ordinal = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  const latest = () => WEEKS[WEEKS.length - 1];
  const weekOf = (n) => WEEKS.find((w) => w.week === n);

  $('#footer').innerHTML = `
    <span>${esc(DATA.league.name)} · ${DATA.league.season} · ${esc(DATA.league.scoring)} scoring</span>
    <span>${DATA.preview ? 'Preview copy. Draft weeks are not on the league site yet.' : '<span class="script">new recap every Tuesday</span>'}</span>`;

  /* ---------- shared pieces ---------- */
  const secHead = (marker, title, more = '') =>
    `<div class="sec-head"><span class="marker ${marker}" aria-hidden="true"></span><h2>${title}</h2><div class="rule"></div>${more}</div>`;
  const draftBanner = (w) =>
    DATA.preview && w.status !== 'published' ? `<div class="draft-banner">Draft. Week ${w.week} isn't on the league site yet.</div>` : '';

  function weekSwitch(active, suffix = '') {
    if (WEEKS.length < 2) return '';
    return `<nav class="week-switch" aria-label="Choose a week">${WEEKS.map((w) => `
      <a href="#week-${w.week}${suffix}" ${w.week === active.week ? 'aria-current="page"' : ''}>Week ${w.week}${DATA.preview && w.status !== 'published' ? '<span class="dot" title="Draft"></span>' : ''}</a>`).join('')}</nav>`;
  }

  function scoreBox(g, w) {
    return `
      <a class="game" href="${base(w)}.game-${g.key}" aria-label="${esc(g.winner.manager)} ${f2(g.winner.points)}, ${esc(g.loser.manager)} ${f2(g.loser.points)}. Open matchup">
        <div class="bug">
          ${[['winner', g.winner, 'W'], ['loser', g.loser, 'L']].map(([cls, s, r]) => `
            <div class="bug-row ${cls}">
              <div><div class="bug-mgr">${esc(s.manager)}</div><div class="bug-team">${esc(s.team_name)}</div></div>
              <div class="bug-score">${f2(s.points)}${w.complete ? `<span class="wl ${r}">${r}</span>` : ''}</div>
            </div>`).join('')}
        </div>
        ${w.live && !w.complete ? liveStrip(g) : ''}
        <div class="game-body">
          ${g.blurb ? `<p class="blurb">${esc(g.blurb)}</p>` : ''}
          <span class="open">${w.live ? 'Live box score →' : 'Box score and lineup calls →'}</span>
        </div>
      </a>`;
  }

  // Where a side stands this minute: who is on the field right now, then who hasn't
  // kicked off yet. "0 starters left to play" alone couldn't tell a finished afternoon
  // from three players mid-game, so the ones on the field get named first, with the
  // same pulsing dot the Live tab wears.
  function liveStatus(s) {
    const bits = [];
    if (s.playing_now) bits.push(`<span class="on-now"><span class="live-dot" aria-hidden="true"></span>${s.playing_now} playing now</span>`);
    if (s.yet_to_play) bits.push(`${s.yet_to_play} starter${s.yet_to_play === 1 ? '' : 's'} yet to play`);
    return bits.length ? bits.join(' · ') : 'all starters done';
  }

  function liveStrip(g) {
    return `<div class="live-strip">${[g.winner, g.loser].map((s) => `
      <div class="row">
        <span><span class="swatch" style="background:var(--${s === g.winner ? 'accent' : 'orange'})" aria-hidden="true"></span><b>${esc(s.manager)}</b> · projected ${f1(s.live_projection)} · ${liveStatus(s)}</span>
        <span class="num">${s.win_probability == null ? '' : `${Math.round(s.win_probability * 100)}% to win`}</span>
      </div>`).join('')}
      ${g.winner.win_probability == null ? '' : `<div class="prob" role="img" aria-label="Chance to win: ${esc(g.winner.manager)} ${Math.round(g.winner.win_probability * 100)}%, ${esc(g.loser.manager)} ${Math.round((1 - g.winner.win_probability) * 100)}%"><span class="a" style="flex:${g.winner.win_probability.toFixed(3)}"></span><span class="b" style="flex:${(1 - g.winner.win_probability).toFixed(3)}"></span></div>`}
    </div>`;
  }

  function awardCard(c, kind) {
    const k = KIND[kind];
    return `
      <article class="card ${k.cls}">
        <div class="card-top"><span class="who">${mgrLink(c.manager)}</span>${c.stat ? `<span class="stat">${esc(c.stat)}</span>` : ''}</div>
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.text)}</p>
      </article>`;
  }

  // The Move column: a pill when last week's result shifted the team's overall standing, a dash when
  // it held, nothing to compare to in Week 1. Triangle plus a number, so color is never the only cue.
  function rankMove(m) {
    if (m == null) return '';
    if (!m) return '<span class="mv flat" aria-label="No change in rank">–</span>';
    const up = m > 0, n = Math.abs(m);
    const label = `${up ? 'Up' : 'Down'} ${n} ${n === 1 ? 'spot' : 'spots'} after this week`;
    return `<span class="mv ${up ? 'up' : 'down'}" title="${label}" aria-label="${label}"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><polygon points="${up ? '6,1 11,10 1,10' : '1,2 11,2 6,11'}" fill="currentColor"/></svg>${n}</span>`;
  }

  function standingsTable(rows, { compact } = {}) {
    const full = !compact;
    // The playoff line and bye stickers read league.json's format through the playoff odds;
    // no odds, no line.
    // Both come from the seeding (now_cut, regular-season games only), not the row order: once a
    // playoff week is recapped these rows count it too, and a Round 1 win can lift a team past a
    // bye seed. The line is drawn only where it really splits the field from everyone else.
    const P = full ? SEASON.playoffs : null;
    const field = P && P.now_cut ? P.now_cut : [];
    const byeIds = new Set(field.slice(0, P ? P.config.byes : 0));
    const inField = new Set(field);
    const cut = field.length && rows.length > field.length && rows.slice(0, field.length).every((t) => inField.has(t.team_id)) ? field.length : 0;
    const cols = full ? 9 : 5;
    return `
      <div class="table-scroll"><table class="std">
        <thead><tr>
          <th></th><th title="Places gained or lost in the standings after the latest week">Move</th><th>Team</th><th class="r">Record</th>
          ${full ? '<th class="r">Streak</th>' : ''}
          <th class="r" title="Total points scored this season">Scored</th>
          ${full ? '<th class="r" title="Total points opponents scored">Allowed</th><th class="r" title="Record if this team played every other team every week">Vs. everyone</th><th class="r" title="Season total of points left on the bench">Benched</th>' : ''}
        </tr></thead>
        <tbody>${rows.map((t, i) => `
          <tr class="${t.rank_move > 0 ? 'moved-up' : t.rank_move < 0 ? 'moved-down' : ''}${i + 1 === cut ? ' po-cut' : ''}">
            <td class="rank">${i + 1}</td>
            <td class="mv-cell">${rankMove(t.rank_move)}</td>
            <td class="mgr"><span class="mgr-cell"><span class="mgr-who"><a href="#team-${t.team_id}">${esc(t.manager)}</a>${byeIds.has(t.team_id) ? '<span class="bye-tag" title="A top seed sits out Round 1">Bye</span>' : ''}<span class="tname">${esc(t.team_name)}</span></span>${full ? `<a class="profile-btn" href="#team-${t.team_id}" aria-label="${esc(t.manager)}'s team profile">Profile →</a>` : ''}</span></td>
            <td class="r">${record(t)}</td>
            ${full ? `<td class="r">${t.streak ? `<span class="res ${t.streak[0]}">${t.streak}</span>` : '–'}</td>` : ''}
            <td class="r">${f2(t.points_for)}</td>
            ${full ? `<td class="r">${f2(t.points_against)}</td><td class="r">${t.all_play_w}–${t.all_play_l}</td><td class="r">${f2(t.bench_left)}</td>` : ''}
          </tr>${i + 1 === cut ? `
          <tr class="po-line"><td colspan="${cols}"><span class="po-line-tag">Playoff line · the top ${cut} advance</span></td></tr>` : ''}`).join('')}
        </tbody>
      </table></div>`;
  }

  /* ---------- playoff picture ---------- */
  // Shares print as whole percents. The ends say <1% and >99%, because a simulation that never
  // saw something happen hasn't proved it can't; only a finished regular season gets 0% and 100%.
  const pct = (p, exact = false) => {
    if (exact && (p === 0 || p === 1)) return `${p * 100}%`;
    if (p < 0.005) return '<1%';
    if (p >= 0.995) return '>99%';
    return `${Math.round(p * 100)}%`;
  };
  const PO_TIP = { 'Near lock': 'Made the playoffs in nearly every simulated season', 'Bye race': `In the hunt for a top seed and the week off`,
    Comfortable: 'Makes it in most simulated seasons', Bubble: 'Right at the playoff line, could go either way',
    'Long shot': 'Needs some help, but it happens', 'Near out': 'Almost never makes it in the simulations',
    In: 'Made the playoffs', Out: 'Missed the playoffs' };
  const PO_LABEL = { 'Near lock': 'lock', 'Bye race': 'bye', Comfortable: 'comfy', Bubble: 'bubble',
    'Long shot': 'long', 'Near out': 'near-out', In: 'in', Out: 'out' };
  const nameOf = (id) => (TEAMS[id] ? TEAMS[id].manager : `Team ${id}`);
  const poBar = (p, label) => `<span class="po-bar" role="img" aria-label="${esc(label)}"><span style="width:${(p * 100).toFixed(1)}%"></span></span>`;
  const trendCell = (d) => {
    if (d == null) return '<span title="No earlier week to compare with">–</span>';
    const pts = Math.round(d * 1000) / 10;
    if (Math.abs(pts) < 0.5) return '<span title="Within half a point of last week">even</span>';
    const up = pts > 0;
    return `<span class="po-trend ${up ? 'up' : 'down'}"><span aria-hidden="true">${up ? '▲' : '▼'}</span> ${f1(Math.abs(pts))}<span class="sr"> points ${up ? 'up' : 'down'} since last week</span></span>`;
  };

  function bracketGame(g) {
    const fav = g.teams.find((x) => x.team_id === g.favorite);
    const team = (x) => `
          <div class="br-team${x.team_id === g.favorite ? ' fav' : ''}"><span class="br-seed" aria-label="Seed ${x.seed}">${x.seed}</span><a href="#team-${x.team_id}">${esc(nameOf(x.team_id))}</a>${
            x.team_id === g.favorite ? '<span class="br-check" aria-hidden="true">✓</span><span class="sr">projected winner</span>' : '<span></span>'}</div>`;
    return `
        <div class="br-game">${g.teams.map(team).join('')}
          <div class="br-odds">${poBar(g.win_prob, `${nameOf(fav.team_id)} wins this game ${pct(g.win_prob)} of the time`)}<span>${pct(g.win_prob)} ${esc(nameOf(fav.team_id))}</span></div>
        </div>`;
  }

  const weeksLabel = (r) => (r.weeks > 1 ? `Weeks ${r.week} ${r.weeks === 2 ? 'and' : 'to'} ${r.week + r.weeks - 1}` : `Week ${r.week}`);

  /* ---------- playoff bracket + what-if ----------
     The chalk bracket and the what-if mode share one renderer. What-if keeps its picks in WI and redraws
     only the bracket and the control panel, so the scroller (and its scroll position) outlives every pick.
     Odds come from SEASON.playoffs.bracket.what_if (site/playoffs.py), never from numbers in this file. */
  const WI = { on: false, step: 1, pick: { sf1: null, sf2: null, fin: null }, timer: 0, model: null };
  const noMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function wiModel(B) {
    const W = B && B.what_if;
    if (!W || !B.rounds || B.rounds.length !== 2 || B.rounds[0].games.length !== 2) return null;
    const seed = {}, pSemi = {};
    W.semis.forEach((g) => g.teams.forEach((t) => { seed[t.team_id] = t.seed; pSemi[t.team_id] = t.p; }));
    const chalk = { sf1: B.rounds[0].games[0].favorite, sf2: B.rounds[0].games[1].favorite, fin: B.champion };
    return {
      B, W, seed, pSemi, chalk, semis: B.rounds[0].games.map((g, k) => W.semis[k].teams),
      estimated: W.finals.some((f) => f.est) || W.scenarios.some((x) => x.est),
      finalOf: (a, b) => W.finals.find((f) => f.teams.includes(a) && f.teams.includes(b)),
      scenario: (a, b, c) => W.scenarios.find((x) => x.semis[0] === a && x.semis[1] === b && x.champion === c),
    };
  }

  const wiPicks = () => (WI.on ? WI.pick : WI.model.chalk);
  const wiBoth = () => !!(WI.pick.sf1 && WI.pick.sf2);
  const wiScenario = (k) => (k.sf1 && k.sf2 && k.fin ? WI.model.scenario(k.sf1, k.sf2, k.fin) : null);
  const wiReach = (k) => { const sc = k.sf1 && k.sf2 ? WI.model.W.scenarios.find((x) => x.semis[0] === k.sf1 && x.semis[1] === k.sf2) : null; return sc ? sc.reach : null; };

  /* One team row. Static: a link to her profile, lime for the favorite. What-if: a real button, lime for
     the pick. `slot` is the pick it belongs to (sf1, sf2 or fin). */
  function pbRow(slot, id, p, est, k) {
    const M = WI.model, on = WI.on;
    const lit = k[slot] === id, out = on && k[slot] && !lit;
    const pctTxt = p == null ? '' : `<span class="pb-pct">${est ? '~' : ''}${pct(p)}</span>`;
    const inner = `<span class="pb-seed" aria-hidden="true">${M.seed[id]}</span><span class="sr">Seed ${M.seed[id]}</span>${on
      ? `<span class="pb-name">${esc(nameOf(id))}</span>` : `<a class="pb-name" href="#team-${id}">${esc(nameOf(id))}</a>`}${pctTxt}<span class="pb-ck" aria-hidden="true">${lit ? '✓' : ''}</span>${lit && !on ? '<span class="sr">projected winner</span>' : ''}`;
    const cls = `pb-row${lit ? ' fav' : ''}${out ? ' out' : ''}${on ? ' pickable' : ''}`;
    return on ? `<button type="button" class="${cls}" data-m="${slot}" data-t="${id}" aria-pressed="${lit}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
  }

  function pbSemi(k, slot) {
    const teams = WI.model.semis[slot === 'sf1' ? 0 : 1];
    const top = Math.max(...teams.map((t) => t.p));
    return `<div class="pb-card${WI.on && k[slot] ? ' pulse' : ''}">${teams.map((t) => pbRow(slot, t.team_id, t.p, false, k)).join('')}
      <div class="pb-bar"><i style="width:${(top * 100).toFixed(1)}%"></i></div></div>`;
  }

  function pbFinal(k) {
    const M = WI.model;
    if (WI.on && !(k.sf1 && k.sf2)) return '<div class="pb-card"><div class="pb-row tbd">Waiting on semifinal picks…</div></div>';
    const [a, b] = [k.sf1, k.sf2].sort((x, y) => M.seed[x] - M.seed[y]);
    const f = M.finalOf(a, b);
    const top = Math.max(f.p[a], f.p[b]);
    const reach = wiReach(k);
    const sticker = WI.on && reach != null ? `<span class="pb-tag odds">🎯 <b>${pct(reach)}</b> this final happens</span>` : '';
    return `<div class="pb-card">${[a, b].map((t) => pbRow('fin', t, f.p[t], f.est, k)).join('')}
      <div class="pb-bar"><i style="width:${(top * 100).toFixed(1)}%"></i></div>${sticker}</div>`;
  }

  function pbChamp(k, byId) {
    const M = WI.model;
    if (WI.on && !k.fin) return '<div class="pb-champ-card empty"><span class="pb-tag">🏆 Champion</span><div class="n">?</div><div class="t">Pick the championship winner</div></div>';
    const sc = wiScenario(k);
    const chalk = ['sf1', 'sf2', 'fin'].every((x) => k[x] === M.chalk[x]);
    const sticker = sc ? `<span class="pb-tag odds">🎯 <b>${sc.est ? '~' : ''}${pct(sc.p)}</b> scenario odds</span>` : '';
    return `<div class="pb-champ-card${WI.on ? ' pulse' : ''}"><span class="pb-tag">🏆 ${chalk ? 'Projected champ' : 'Your champ'}</span>
      <div class="n"><a href="#team-${k.fin}">${esc(nameOf(k.fin))}</a></div>
      <div class="t">${chalk ? `Wins it all in <b>${pct(byId[k.fin].title)}</b> of simulated seasons` : 'Not the projected path'}</div>${sticker}</div>`;
  }

  function pbConn(kind, k) {
    const attrs = 'width="52" height="304" viewBox="0 0 52 304" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
    return kind === 'a'
      ? `<div class="pb-conn"><svg ${attrs}><path class="${k.sf1 ? 'on' : ''}" d="M0 66 H26 V152 H52"/><path class="${k.sf2 ? 'on' : ''}" d="M0 238 H26 V152"/></svg></div>`
      : `<div class="pb-conn"><svg ${attrs}><path class="${k.fin ? 'on' : ''}" d="M0 152 H52"/></svg></div>`;
  }

  function pbBracketHTML() {
    const M = WI.model, k = wiPicks(), B = M.B;
    const byId = Object.fromEntries(SEASON.playoffs.teams.map((t) => [t.team_id, t]));
    const act = (n) => (WI.on && WI.step === n ? ' active' : '');
    const inert = (n) => (WI.on && WI.step !== n ? ' inert aria-hidden="true"' : '');
    const [r0, r1] = B.rounds;
    return `
      <div class="pb-col semis${act(1)}" data-step="1"${inert(1)}><h3>Semifinals · ${weeksLabel(r0)}</h3><div class="pb-stack">${pbSemi(k, 'sf1')}${pbSemi(k, 'sf2')}</div></div>
      ${pbConn('a', k)}
      <div class="pb-col final${act(2)}" data-step="2"${inert(2)}><h3>Championship · ${weeksLabel(r1)}</h3>${pbFinal(k)}</div>
      ${pbConn('b', k)}
      <div class="pb-col champ${act(3)}" data-step="3"${inert(3)}><h3>${WI.on ? 'Champion' : 'Projected champ'}</h3>${pbChamp(k, byId)}</div>`;
  }

  function pbPanelHTML() {
    const k = WI.pick, both = wiBoth();
    const reach = { 1: true, 2: both, 3: !!k.fin };
    const names = { 1: 'Semifinals', 2: 'Championship', 3: 'Champion' };
    const steps = [1, 2, 3].map((n) => {
      const done = (n === 1 && both) || (n >= 2 && k.fin);
      const mark = done && WI.step !== n;
      return `${n > 1 ? '<i class="pb-sep"></i>' : ''}<button type="button" class="pb-dot${WI.step === n ? ' cur' : ''}${mark ? ' done' : ''}" data-wi="go" data-go="${n}"${WI.step === n ? ' aria-current="step"' : ''}${reach[n] ? '' : ' disabled'}><b>${mark ? '✓' : n}</b>${names[n]}</button>`;
    }).join('');
    const picked = ['sf1', 'sf2'].filter((x) => k[x]).length;
    const sc = wiScenario(k), reachP = wiReach(k);
    const m = {
      1: [`Pick your Week ${WI.model.B.rounds[0].week} winners (${picked}/2)`, 'Tap a team in each matchup. Once both are locked in, we move to the final.'],
      2: ['Pick the champion', both ? `This final happens in ${pct(reachP)} of scenarios. Who takes the title?` : 'Who takes the title?'],
      3: [k.fin ? `${esc(nameOf(k.fin))} takes the crown` : 'Pick a champion', sc ? `This exact scenario: ${sc.est ? '~' : ''}${pct(sc.p)} likely` : 'Change any round with Back or the step tabs.'],
    }[WI.step];
    return { steps, msg: `${m[0]}<span>${m[1]}</span>`, tools: `<button type="button" class="pb-ghost" data-wi="back"${WI.step === 1 ? ' disabled' : ''}>← Back</button><button type="button" class="pb-ghost" data-wi="reset">Reset</button><button type="button" class="pb-ghost" data-wi="exit">Exit</button>` };
  }

  function pbDraw() {
    const root = document.getElementById('pb-root');
    if (!root || !WI.model) return;
    root.classList.toggle('whatif', WI.on);
    document.getElementById('pb-bracket').innerHTML = pbBracketHTML();
    if (WI.on) {
      const P = pbPanelHTML();
      document.getElementById('pb-steps').innerHTML = P.steps;
      document.getElementById('pb-msg').innerHTML = P.msg;
      document.getElementById('pb-tools').innerHTML = P.tools;
    }
  }

  function pbAlign(instant) {
    const sc = document.getElementById('pb-scroll'), col = sc && sc.querySelector(`.pb-col[data-step="${WI.on ? WI.step : 1}"]`);
    if (sc && col) sc.scrollTo({ left: WI.on ? col.offsetLeft : 0, behavior: instant || noMotion() ? 'auto' : 'smooth' });
  }

  function pbGo(n, instant, focus) {
    WI.step = n;
    pbDraw();
    pbAlign(instant);
    if (focus) { const b = document.querySelector('.pb-col.active button, .pb-col.active a'); if (b) b.focus({ preventScroll: true }); }
  }

  /* After the second semifinal pick (or the champion pick) wait a beat so the pick registers, then pan on. */
  function pbAdvance(to) {
    clearTimeout(WI.timer);
    WI.timer = setTimeout(() => {
      const ready = to === 2 ? wiBoth() && WI.step === 1 : !!WI.pick.fin && WI.step === 2;
      if (WI.on && ready) pbGo(to, false, true);
    }, 500);
  }

  function pbAction(btn) {
    const a = btn.dataset.wi;
    clearTimeout(WI.timer);
    if (a === 'enter') {
      WI.on = true; WI.pick = { sf1: null, sf2: null, fin: null };
      pbGo(1, true, true);
      const top = document.getElementById('pb-root');
      if (top) top.scrollIntoView({ behavior: noMotion() ? 'auto' : 'smooth', block: 'start' });
    } else if (a === 'exit') {
      WI.on = false; WI.step = 1; WI.pick = { sf1: null, sf2: null, fin: null };
      pbDraw(); pbAlign(true);
      const again = document.querySelector('[data-wi="enter"]'); if (again) again.focus({ preventScroll: true });
    } else if (a === 'reset') {
      WI.pick = { sf1: null, sf2: null, fin: null }; pbGo(1, false, true);
    } else if (a === 'back') {
      if (WI.step > 1) pbGo(WI.step - 1, false, true);
    } else if (a === 'go') {
      pbGo(Number(btn.dataset.go), false, true);
    }
  }

  function pbPick(btn) {
    const slot = btn.dataset.m, id = Number(btn.dataset.t), k = WI.pick;
    k[slot] = id;
    if (slot !== 'fin' && k.fin && ![k.sf1, k.sf2].includes(k.fin)) k.fin = null;
    pbDraw();
    const again = document.querySelector(`.pb-row[data-m="${slot}"][data-t="${id}"]`); if (again) again.focus({ preventScroll: true });
    if (slot === 'fin') pbAdvance(3); else if (wiBoth()) pbAdvance(2);
  }

  $('#main').addEventListener('click', (e) => {
    if (!WI.on && !e.target.closest('[data-wi="enter"]')) return;
    const act = e.target.closest('button[data-wi]');
    if (act && !act.disabled) return pbAction(act);
    const row = e.target.closest('button.pb-row[data-m]');
    if (row && WI.on) pbPick(row);
  });
  window.addEventListener('resize', () => { if (WI.on) pbAlign(true); });

  function playoffPicture() {
    const P = SEASON.playoffs;
    if (!P || !P.teams || !P.teams.length) return '';
    const cfg = P.config;
    const n = P.teams.length;
    const cut = Math.min(cfg.teams, n);
    const done = P.games_left === 0;
    const B = P.bracket;
    const byId = Object.fromEntries(P.teams.map((t) => [t.team_id, t]));
    const champ = B ? byId[B.champion] : null;
    // Drawing the page starts the bracket over: what-if is a visit, not a saved setting.
    clearTimeout(WI.timer);
    Object.assign(WI, { on: false, step: 1, pick: { sf1: null, sf2: null, fin: null }, model: wiModel(B) });
    const shade = (p) => (p > 0 ? `background: color-mix(in srgb, var(--heat-hi) ${(6 + p * 50).toFixed(0)}%, var(--card))` : '');
    const seeds = Array.from({ length: n }, (_, k) => k + 1);
    const sims = Number(P.sims).toLocaleString('en-US');
    const tiebreak = cfg.tiebreaker === 'points_for' ? 'whoever has scored more points' : esc(cfg.tiebreaker.replace(/_/g, ' '));

    return `
      ${B ? `
      <section>
        ${secHead('ball', 'Playoff picture')}
        <p class="sec-sub full">Top ${cfg.teams} make the playoffs${cfg.byes ? `, top ${cfg.byes} get a bye (a week off)` : ', no byes (a bye is a week off)'}, starting Week ${cfg.first_round_week}.${B ? ` The championship is ${B.rounds[B.rounds.length - 1].weeks > 1 ? `both teams' points added up over ${weeksLabel(B.rounds[B.rounds.length - 1])}` : weeksLabel(B.rounds[B.rounds.length - 1])}.` : ''} ${cfg.reseed ? 'The bracket reseeds after each round.' : 'The bracket stays put.'}${cfg.consolation_ladder ? ' Everyone else plays a consolation ladder to settle final placing.' : ''}</p>
        ${WI.model ? `
        <div class="pb-root" id="pb-root">
          <p class="sec-sub pb-intro">The chalk bracket, meaning every favorite wins. Teams slot in by projected seed, their spot in the final standings. The percent is how often the favorite wins that one game.</p>
          <div class="pb-promo">
            <div class="pb-promo-txt"><span class="pb-eyebrow">NEW · INTERACTIVE</span><b>What if your team pulls off the upset?</b><span class="pb-promo-sub">Pick the winner of every game and see how likely your scenario is.</span></div>
            <button type="button" class="pb-cta" data-wi="enter">⚡ Play what-if <i aria-hidden="true">→</i></button>
          </div>
          <div class="pb-panel" id="pb-panel"><div class="pb-steps" id="pb-steps" role="group" aria-label="What-if steps"></div><div class="pb-msg" id="pb-msg" role="status" aria-live="polite"></div><div class="pb-tools" id="pb-tools"></div></div>
          <div class="pb-scroll" id="pb-scroll" tabindex="0" role="group" aria-label="Projected playoff bracket"><div class="pb-bracket" id="pb-bracket">${pbBracketHTML()}</div></div>
          <div class="pb-legend"><span class="l1">Projected winner</span><span class="l2">Win probability</span></div>
          <p class="pb-foot">🎯 = chance this exact path plays out (semifinal odds × semifinal odds × final odds, treated as independent). It runs lower than the title odds above because those count every way a team can win it, including from a different seed.${WI.model.estimated ? ' <b>~</b> = estimated: that final matchup isn\'t simulated directly, so it is inferred from the odds shown.' : ''}</p>
        </div>` : `
        <p class="sec-sub pb-intro">The chalk bracket, meaning every favorite wins. Teams slot in by projected seed, their spot in the final standings. The percent is how often the favorite wins that one game.</p>
        <div class="bracket" role="group" aria-label="Projected playoff bracket" style="--br-cols: ${B.rounds.length}">${B.rounds.slice(0, -1).map((r, k, early) => `
          <div class="br-col"><h3>${k === early.length - 1 ? 'Semifinals' : `Round ${k + 1}`} · ${weeksLabel(r)}</h3>${r.games.map(bracketGame).join('')}</div>`).join('')}
          <div class="br-col"><h3>Championship · ${weeksLabel(B.rounds[B.rounds.length - 1])}</h3>${bracketGame(B.final)}
            <div class="br-champ"><span class="badge-tilt">Projected champ</span><span class="br-champ-name"><a href="#team-${B.champion}">${esc(nameOf(B.champion))}</a></span><span class="sub">Wins it all in ${pct(champ.title)} of simulated seasons</span></div>
          </div>
        </div>`}
      </section>` : ''}

      <section>
        ${secHead('board', 'Playoff odds')}
        <p class="sec-sub full">${done ? 'The regular season is over, so the field is set. The title still has to be won.' : `<b>How this works.</b> We played out the rest of the season ${sims} times, drawing each team's weekly score from her scoring so far (nudged toward the league average, since a few weeks is a tiny sample). ${P.real_schedule ? 'Matchups follow the real schedule.' : 'Opponents are random, since the real schedule isn\'t loaded yet.'} Ties go to ${tiebreak}. Treat the odds like a weather forecast: great for planning, terrible for trash talk.`}</p>
        <div class="std-card table-scroll">
          <table class="std po-odds" aria-label="Playoff odds by team">
            <thead><tr><th title="Projected final spot in the standings, which sets the bracket">Seed</th><th>Team</th><th>Makes it</th>${cfg.byes ? '<th class="r">Bye</th>' : ''}<th class="r">Title</th><th class="r" title="Expected final regular-season record">Proj. record</th><th class="r" title="Change in playoff odds since last week, in percentage points">Vs. last week</th></tr></thead>
            <tbody>${P.teams.map((t) => `
              <tr${t.proj_seed === cut && cut < n ? ' class="po-cut"' : ''}>
                <td class="rank">${t.proj_seed}</td>
                <td class="mgr"><a href="#team-${t.team_id}">${esc(nameOf(t.team_id))}</a><span class="tname">${esc((TEAMS[t.team_id] || {}).team_name || '')}</span></td>
                <td><div class="po-make">${poBar(t.playoff, `${nameOf(t.team_id)} makes the playoffs ${pct(t.playoff, done)} of the time`)}<span class="num">${pct(t.playoff, done)}</span><span class="po-label ${PO_LABEL[t.label] || ''}" title="${esc(PO_TIP[t.label] || '')}">${esc(t.label)}</span></div></td>
                ${cfg.byes ? `<td class="r">${pct(t.bye, done)}</td>` : ''}
                <td class="r">${pct(t.title, done && t.playoff === 0)}</td>
                <td class="r">${f1(t.proj_wins)}–${f1(t.proj_losses)}</td>
                <td class="r">${trendCell(t.trend)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </section>

      <section>
        ${secHead('book', 'Where everyone lands')}
        <p class="sec-sub">Each row is a team, each column a final seed. Darker blue means she finishes there more often. Seeds left of the dashed line make the playoffs.</p>
        <div class="std-card table-scroll">
          <table class="std heat po-heat" aria-label="Share of simulated seasons each team finishes at each seed">
            <thead><tr><th>Team</th>${seeds.map((k) => `<th style="text-align:center">${k}</th>${k === cut && cut < n ? '<th class="po-sep" aria-hidden="true"></th>' : ''}`).join('')}</tr></thead>
            <tbody>${P.teams.map((t) => `
              <tr>
                <td class="mgr"><a href="#team-${t.team_id}">${esc(nameOf(t.team_id))}</a></td>
                ${t.seed_dist.map((p, k) => `<td class="cell" style="${shade(p)}" title="${esc(nameOf(t.team_id))}: seed ${k + 1} in ${pct(p, done)} of simulations">${p > 0 ? pct(p, done) : ''}</td>${k + 1 === cut && cut < n ? '<td class="po-sep" aria-hidden="true"></td>' : ''}`).join('')}
              </tr>`).join('')}
            </tbody>
          </table>
          <div class="heat-legend"><span>Never</span><span class="ramp" aria-hidden="true"></span><span>Often</span></div>
        </div>
      </section>`;
  }

  /* "Ja'Marr Chase 🐯 Q ● Q3 7:22": on a live week the name carries his NFL team logo,
     ESPN's injury designation if it has one, and, while that team's game is being played,
     the game clock. ESPN can 404 a logo (a team we can't name, a free agent), so a broken
     one removes itself. Shared by the box scores and the Coach page's next-week lineup. */
  const playerName = (p, live) => esc(p.name)
    + (live && p.logo ? ` <img class="tlogo" src="${esc(p.logo)}" alt="${esc(p.team || '')}" title="${esc(p.team || '')}" width="19" height="19" loading="lazy" onerror="this.remove()">` : '')
    + (p.injury ? ` <span class="inj${OUTISH.includes(p.injury) ? ' out' : ''}" title="ESPN's injury report">${esc(p.injury)}</span>` : '')
    + (p.playing ? ` <span class="playing" title="His game is on right now"><span class="live-dot" aria-hidden="true"></span>${esc(p.playing)}</span>` : '');

  /* Player cards (the Coach page's two lineups): `cards` maps an ESPN player id to the
     blurb, scoring breakdown and notes site/build.py computed for him. Which rows are
     open is kept in PEEK rather than in the DOM, because the live refresh re-renders the
     whole page every 20 seconds and nobody wants a card snapping shut mid-read. */
  const PEEK = new Set();
  const peekId = (key, p) => `peek-${key}-${p.player_id}`;

  // The name cell: a disclosure button where there's a card for him, plain text otherwise.
  const peekName = (p, card, id, live) => (card
    ? `<button class="peek" type="button" data-peek="${p.player_id}" aria-expanded="${PEEK.has(p.player_id) ? 'true' : 'false'}" aria-controls="${id}"><span class="peek-name">${playerName(p, live)}</span><span class="chev" aria-hidden="true"></span></button>`
    : playerName(p, live));

  // The row underneath it, which holds the card itself. `cols` is the table's width: the
  // box-score lineup has four columns, the next-week lineup three.
  const peekRow = (p, card, id, cols) => (card
    ? `<tr class="peek-row" id="${id}"${PEEK.has(p.player_id) ? '' : ' hidden'}><td colspan="${cols}">${peekPanel(p, card)}</td></tr>`
    : '');

  function peekPanel(p, card) {
    const lines = card.lines || [];
    return `
      <div class="peek-body">
        <p class="peek-blurb">${esc(card.blurb)}</p>
        ${lines.length ? `
        <table class="peek-lines">
          <caption>Where the points came from</caption>
          <tbody>${lines.map((l) => `
            <tr><th scope="row">${esc(l.label)}</th><td class="val">${esc(l.value) || ''}</td><td>${l.points ? f2(l.points) : '—'}</td></tr>`).join('')}
          </tbody>
          <tfoot><tr><th scope="row">Total</th><td class="val"></td><td>${f2(p.points)}</td></tr></tfoot>
        </table>` : p.points > 0.005 ? `<p class="peek-none">ESPN hasn't broken these ${f2(p.points)} points down yet.</p>` : ''}
        ${(card.notes || []).length ? `<ul class="peek-notes">${card.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
      </div>`;
  }

  function lineupCard(side, won, live, badge, cards) {
    // A bench player is "hot" if he outscored a starter he could have replaced
    const floor = (p) => {
      const ok = { QB: ['QB'], RB: ['RB', 'FLEX'], WR: ['WR', 'FLEX'], TE: ['TE', 'FLEX'], DST: ['DST'], K: ['K'] }[p.pos] || [];
      const c = side.starters.filter((s) => ok.includes(s.slot));
      return c.length ? Math.min(...c.map((s) => s.points)) : Infinity;
    };
    const starters = [...side.starters].sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
    const bench = [...side.bench].sort((a, b) => b.points - a.points);
    const nameCell = (p) => playerName(p, live);
    const row = (p, cls, slot) => {
      const card = cards && p.player_id != null ? cards[p.player_id] : null;
      const id = peekId(side.team_id, p);
      return `<tr class="${cls}${card && PEEK.has(p.player_id) ? ' peek-open' : ''}"><td class="slot">${esc(slot)}</td><td>${peekName(p, card, id, live)}</td><td class="r">${f2(p.points)}</td><td class="r proj">${f1(p.projected)}</td></tr>`
        + peekRow(p, card, id, 4);
    };
    return `
      <div class="lineup">
        <h3><span>${mgrLink(side.manager)}</span><span class="num">${f2(side.points)} ${badge || `<span class="res ${won ? 'W' : 'L'}">${won ? 'W' : 'L'}</span>`}</span></h3>
        <table>
          <thead><tr><th>Slot</th><th>Player</th><th class="r">Pts</th><th class="r">Proj</th></tr></thead>
          <tbody>
            ${starters.map((p) => row(p, 'starter', p.slot)).join('')}
            <tr class="bench-head"><td colspan="4">Bench</td></tr>
            ${bench.map((p) => row(p, `bench${p.points > floor(p) + 0.005 ? ' hot' : ''}`, p.slot === 'IR' ? 'IR' : 'BN')).join('')}
          </tbody>
        </table>
        <div class="opt">Best possible lineup <b class="num">${f2(side.optimal)}</b> · ${side.points_left > 0.005 ? `<b class="num">${f2(side.points_left)}</b> left on the bench` : 'perfect lineup'}</div>
      </div>`;
  }

  /* Top, middle and bottom score: the same three stickers on the recap page and the live
     page, each carrying the rank it landed on. */
  const ORD = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; };
  const medal = (ranks) => `<span class="medal">${ranks.join('–')}<span class="ord">${ORD(ranks[ranks.length - 1])}</span></span>`;

  function scorePills(w) {
    const sofar = w.complete ? '' : ' so far';
    const mid = (w.mid_pack && w.mid_pack.teams.length) ? w.mid_pack : { teams: [], points: w.median };
    // With an even league nobody scores the middle score exactly, so the sticker shows the
    // score itself; with an odd one it belongs to a real team, so that team gets named.
    const midBody = mid.teams.length === 1
      ? `${esc(mid.teams[0].manager)} <span class="num">${f2(mid.teams[0].points)}</span>`
      : `<span class="num">${f2(mid.points)}</span>`;
    const midTip = mid.teams.length > 1
      ? `Halfway between ${mid.teams.map((t) => `${t.manager} ${f2(t.points)}`).join(' and ')}, the middle two scores of the week: half the league finished above, half below.`
      : 'The middle score of the week: half the league finished above it, half below.';
    // The middle score belongs to no single team in an even league, so it carries no rank medallion.
    const pill = (cls, ranks, label, body, tip) =>
      `<span class="pill ${cls}${ranks.length ? '' : ' pill-plain'}" title="${esc(tip)}">${ranks.length ? medal(ranks) : ''}<span class="txt">${label}<b>${body}</b></span></span>`;
    return `
      <div class="pills">
        ${pill('pill-top', [w.high_score.score_rank], `Top score${sofar}`,
               `${esc(w.high_score.manager)} <span class="num">${f2(w.high_score.points)}</span>`,
               "The week's highest team score.")}
        ${pill('pill-mid', [], 'Middle score', midBody, midTip)}
        ${pill('pill-bot', [w.low_score.score_rank], `Bottom score${sofar}`,
               `${esc(w.low_score.manager)} <span class="num">${f2(w.low_score.points)}</span>`,
               "The week's lowest team score.")}
      </div>`;
  }

  /* ---------- pages ---------- */
  function weekPage(w) {
    const kinds = AWARD_KINDS.filter((k) => w[k].length);
    const nAwards = kinds.reduce((n, k) => n + w[k].length, 0);
    return `
      ${LIVE ? `<a class="live-banner" href="#live"><span>${deadZone() ? '' : '<span class="live-dot" aria-hidden="true"></span>'}${deadZone() ? `Week ${LIVE.week}: scores, coach cards and who's up next` : liveLabel(LIVE)}</span><span class="go">${deadZone() ? 'Take a look →' : (LIVE.complete ? 'Final scores →' : 'Live scores →')}</span></a>` : ''}
      ${weekSwitch(w)}
      ${draftBanner(w)}
      <div class="page-head">
        <div class="kicker">Week ${w.week} recap${w.complete ? ' · final' : ' (in progress)'}</div>
        <h1>${esc(w.headline || `Week ${w.week}`)}</h1>
        ${w.dek ? `<p class="dek">${esc(w.dek)}</p>` : ''}
        ${scorePills(w)}
      </div>

      <section>
        ${secHead('board', 'Scoreboard')}
        <p class="sec-sub">Tap a game for the full box score and the lineup decisions that settled it.</p>
        <div class="games">${w.games.map((g) => scoreBox(g, w)).join('')}</div>
      </section>

      ${kinds.length ? `
      <section>
        ${secHead('ball', 'The awards', `<a class="more" href="#week-${w.week}.awards">All ${nAwards} awards →</a>`)}
        <p class="sec-sub">The top pick from each category. The rest are on the awards page.</p>
        <div class="cards">${kinds.map((k) => awardCard(w[k][0], k)).join('')}</div>
      </section>` : ''}

      <section>
        <div class="two-col">
          <div>
            ${secHead('board', 'Standings', '<a class="more" href="#standings">Full standings →</a>')}
            <p class="sec-sub">Final standings through Week ${latest().week}. Only finished, recapped weeks count${LIVE ? `, so Week ${LIVE.week} joins after its recap` : ''}.</p>
            <div class="std-card">${standingsTable(SEASON.standings, { compact: true })}</div>
          </div>
          <div>
            ${secHead('ball', 'Top scorers')}
            <p class="sec-sub">The five best starters in the league in Week ${w.week}.</p>
            ${leaderList(w.top_performers)}
            ${lowlights(w)}
          </div>
        </div>
      </section>

      ${w.glossary.length ? `
      <section>
        ${secHead('book', `New words from Week ${w.week}`, '<a class="more" href="#glossary">Full glossary →</a>')}
        <div class="chips">${w.glossary.map((g) => `<a href="#glossary" title="${esc(g.definition)}">${esc(g.term)}</a>`).join('')}</div>
      </section>` : ''}`;
  }

  function livePage(w) {
    const fmtDate = (iso) => new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return `
      <div class="page-head">
        <div class="kicker">Week ${w.week} · ${w.complete ? 'final' : 'live'}</div>
        <div class="head-row">
          <h1>${w.complete ? 'Final scores' : 'Live scoreboard'}</h1>
          ${scorePills(w)}
        </div>
        <p class="dek">${liveLabel(w)} Updated ${updated(w.captured_at)}. ${window.FANTASY_LIVE_API ? `Scores refresh about every minute${w.complete ? '' : ' while games are on'}.` : `Scores refresh once a day${w.complete ? '' : ', so the real-time numbers are on ESPN'}.`}</p>
      </div>

      ${w.advice ? `<a class="live-banner" href="${coachHref()}"><span>Want to know what to do about it? <b>Coach</b> has every team's swaps, injuries and empty slots for Week ${leadWithNext() ? ahead().week : w.week}.</span><span class="go">Open Coach →</span></a>` : ''}

      <section>
        ${secHead('board', 'Scoreboard')}
        <p class="sec-sub">${w.complete ? 'Tap a game for the box score.' : 'Projected scores and win chances are ESPN\'s. A pulsing dot counts the starters whose NFL game is on right now; "yet to play" is the ones who haven\'t kicked off. Tap a game for the live box score.'}</p>
        <div class="games">${w.games.map((g) => scoreBox(g, w)).join('')}</div>
      </section>

      <section>
        <div class="two-col">
          <div>
            ${secHead('ball', w.complete ? 'Top scorers' : 'Top scorers so far')}
            ${leaderList(w.top_performers)}
            ${lowlights(w, false)}
          </div>
          <div>
            ${secHead('flag', 'On the wire this week')}
            <p class="sec-sub">Waiver pickups, free-agent adds and drops.</p>
            ${w.moves.length ? `<ul class="moves">${w.moves.map((m) => `
              <li><span class="when">${fmtDate(m.date)}</span>
                <span><b>${mgrLink(m.manager)}</b></span>
                <span>${m.added.length ? `<span class="add">+ ${m.added.map(esc).join(', ')}</span>` : ''}${m.added.length && m.dropped.length ? ' · ' : ''}${m.dropped.length ? `<span class="drop">− ${m.dropped.map(esc).join(', ')}</span>` : ''}</span>
              </li>`).join('')}</ul>` : '<p class="sec-sub">No moves yet this week.</p>'}
          </div>
        </div>
      </section>
      <p class="sec-sub" style="margin-top:28px">Standings only count finished weeks, so this week shows up there once the recap drops Tuesday.</p>`;
  }

  /* The midweek landing page: what "Live" turns into once nothing's actually on the field
     (see deadZone() above). It leads with the week in a few stickers, storylines read
     straight off the numbers so the page has something to say before Tuesday's recap does,
     then the scores, then one way into Coach (which has every team's full list). */
  const STICKER_COUNT = ['no', 'one', 'two', 'three', 'four'];
  const sticker = (x) => `
    <article class="story ${x.tone}">
      <span class="tag">${esc(x.label)}</span>
      <div class="fig num">${esc(x.fig)}</div>
      <p>${esc(x.text)}</p>
    </article>`;

  // Plain words for a position, so a first-season reader isn't handed "RB".
  const POS_WORD = { QB: 'quarterback', RB: 'running back', WR: 'receiver', TE: 'tight end', K: 'kicker', DST: 'defense' };
  // A game this close earns "photo finish" / "anything goes"; past it, the sticker says
  // plainly that it's just the closest one, so the label is never untrue.
  const TIGHT = 10;
  const isTie = (g) => g.winner.result === 'T';

  // A finished week: every sticker is a number from the final scores, and each one is
  // skipped when the week can't back it (one game, all ties, no top scorer).
  // Sticker text is plain: sticker() escapes it, exactly once.
  function finalStickers(w) {
    const out = [];
    const margin = (g) => g.winner.points - g.loser.points;
    const byMargin = [...w.games].sort((a, b) => margin(b) - margin(a));
    const big = byMargin[0];
    const close = byMargin[byMargin.length - 1];
    if (big && margin(big) > 0) out.push({ tone: 'orange', label: 'Blowout', fig: `+${f2(margin(big))}`,
      text: `${big.winner.manager} ${f2(big.winner.points)}, ${big.loser.manager} ${f2(big.loser.points)}. That's the whole sticker.` });
    if (close && close !== big) {
      if (isTie(close)) out.push({ tone: 'lime', label: 'Dead heat', fig: f2(close.winner.points),
        text: `${close.winner.manager} and ${close.loser.manager} tied. Down to the decimal, still nothing.` });
      else if (margin(close) < TIGHT) out.push({ tone: 'lime', label: 'Photo finish', fig: f2(margin(close)),
        text: `${close.winner.manager} edged ${close.loser.manager}, ${f2(close.winner.points)} to ${f2(close.loser.points)}. A coin flip with decimals.` });
      else out.push({ tone: 'lime', label: 'Closest game', fig: f2(margin(close)),
        text: `${close.winner.manager} beat ${close.loser.manager}, ${f2(close.winner.points)} to ${f2(close.loser.points)}.` });
    }
    const top = (w.top_performers || [])[0];
    if (top) out.push({ tone: 'accent', label: 'Top scorer', fig: f1(top.points),
      text: `${top.name}, ${top.manager}'s ${POS_WORD[top.pos] || 'starter'}. Frame this one.` });
    // Ties aren't losses, so only a real loser can be the unlucky one.
    const unlucky = w.games.filter((g) => !isTie(g)).sort((a, b) => b.loser.points - a.loser.points)[0];
    if (unlucky) {
      const beat = w.games.filter((g) => !isTie(g) && g.winner.points < unlucky.loser.points).length;
      out.push({ tone: 'pink', label: beat ? 'Wrong opponent' : 'Best loss', fig: f2(unlucky.loser.points),
        text: beat
          ? `${unlucky.loser.manager} lost with a score that beats ${beat} of this week's winners. The schedule did this.`
          : `${unlucky.loser.manager} posted the week's highest losing score, which now comes with a sticker.` });
    }
    return out;
  }

  // Before kickoff: no scores yet, so every sticker comes from ESPN's projections,
  // its win odds, or this week's Coach rows. Each one is skipped when that data isn't there.
  function preKickoffStickers(w, rows) {
    const out = [];
    const proj = (s) => s.live_projection ?? s.projected ?? 0;
    // ESPN can publish rosters days before projections; all zeros means "not yet".
    const hasProj = w.games.some((g) => proj(g.winner) > 0 || proj(g.loser) > 0);

    if (hasProj) {
      // Closest on paper: the smallest gap between two projected totals
      const gap = (g) => Math.abs(proj(g.winner) - proj(g.loser));
      const close = [...w.games].sort((a, b) => gap(a) - gap(b))[0];
      if (close) out.push({ tone: 'lime', label: 'Closest on paper', fig: f1(gap(close)),
        text: `${close.winner.manager} vs ${close.loser.manager}, projected that far apart.${gap(close) < TIGHT ? ' ESPN is shrugging.' : ''}` });
    }

    // Heavy favorite: only when ESPN has published win odds, and only when they're lopsided
    const pairs = w.games.flatMap((g) => [[g.winner, g.loser], [g.loser, g.winner]])
      .filter(([s]) => s.win_probability != null && s.win_probability >= 0.65);
    if (pairs.length) {
      const [fav, opp] = pairs.sort((a, b) => b[0].win_probability - a[0].win_probability)[0];
      out.push({ tone: 'orange', label: 'Heavy favorite', fig: `${Math.min(99, Math.round(fav.win_probability * 100))}%`,
        text: `ESPN's odds that ${fav.manager} beats ${opp.manager}. ${opp.manager}, ESPN has been wrong before.` });
    }

    if (hasProj) {
      // Top projection: the lineup ESPN likes most this week
      const top = w.games.flatMap((g) => [g.winner, g.loser]).sort((a, b) => proj(b) - proj(a))[0];
      out.push({ tone: 'accent', label: 'Top projection', fig: f1(proj(top)),
        text: `${top.manager} has ESPN's highest projected lineup. No pressure.` });
    }

    // Biggest fix: the one lineup swap worth the most projected points, league-wide. Without
    // one, the busiest to-do list, straight from the Coach rows and framed as help, not homework.
    const fix = rows.flatMap((r) => r.items.filter((it) => it.kind === 'swap' && it.gain > 0).map((it) => ({ r, it })))
      .sort((a, b) => b.it.gain - a.it.gain)[0];
    const busiest = [...rows].sort((a, b) => b.counts.now - a.counts.now)[0];
    if (fix) {
      out.push({ tone: 'pink', label: 'Biggest fix', fig: `+${f1(fix.it.gain)}`,
        text: `One swap is worth that many projected points to ${fix.r.manager}. Coach has it.` });
    } else if (busiest && busiest.counts.now) {
      const n = busiest.counts.now;
      out.push({ tone: 'pink', label: 'Busiest to-do list', fig: String(n),
        text: `${busiest.manager} has ${n} ${n === 1 ? 'thing' : 'things'} on her Coach list before kickoff. Coach has her back.` });
    } else if (rows.length) {
      out.push({ tone: 'pink', label: 'All clear', fig: '0',
        text: 'Nobody has anything urgent on Coach. Enjoy it while it lasts.' });
    }

    return out.slice(0, 4);
  }

  /* ---------- week hub ----------
     Everything below is drawn from LIVE.games, LIVE.advice and LIVE.wire, which /api/live
     refreshes, so a lineup change shows up in the strip, the bar and Coach's desk together.
     Only the stakes and the headlines (LIVE.hub) are baked at build time; see hub_payload. */
  const projOf = (s) => s.live_projection ?? s.projected ?? 0;
  const NUM_WORD = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight'];
  const count = (n, one, many) => `${NUM_WORD[n] || n} ${n === 1 ? one : many}`;
  const shortDay = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const hub = () => (LIVE && LIVE.hub) || {};
  const stakesFor = (w, g) => {
    const st = hub().stakes;
    return st && st.week === w.week ? st.games.find((x) => x.key === g.key) : null;
  };
  // Lineups somebody opened, by game: the minute-by-minute refresh re-renders the page, and
  // a <details> she just opened shouldn't snap shut under her thumb (same idea as PEEK).
  const HUB_OPEN = new Set();

  function seasonStrip(w) {
    const po = SEASON.playoffs;
    if (!po) return '';
    const first = po.config.first_round_week;
    const rounds = (po.bracket && po.bracket.rounds) || [];
    const last = first - 1 + (rounds.reduce((n, r) => n + r.weeks, 0) || 1);
    const cls = (n) => (n === w.week ? 'now' : n < w.week ? 'done' : n >= first ? 'po' : '');
    const cells = Array.from({ length: last }, (_, i) => `<span class="${cls(i + 1)}">${i + 1}</span>`).join('');
    return `
      <div class="season-strip" role="img" aria-label="Season so far: ${w.week - 1} of ${last} weeks played, Week ${w.week} is ${w.complete ? 'final' : 'next'}, playoffs start in Week ${first}.">
        <div class="lab" aria-hidden="true"><span>Season</span><span>Playoffs start Week ${first}</span></div>
        <div class="weeks" aria-hidden="true">${cells}</div>
      </div>`;
  }

  // Who has the edge at each lineup spot, in projected points. RB and WR add up both starters.
  function edgeStrip(a, b) {
    const sum = (s, slot) => s.starters.filter((p) => p.slot === slot).reduce((n, p) => n + (p.projected || 0), 0);
    return `<ul class="hub-edges">${SLOT_ORDER.map((slot) => {
      const d = sum(a, slot) - sum(b, slot);
      const lead = Math.abs(d) < 0.05 ? null : d > 0 ? a : b;
      return `<li class="${lead ? (lead === a ? 'a' : 'b') : ''}">
        <span class="sl" aria-hidden="true">${slot === 'FLEX' ? 'FLX' : slot}</span>
        <span class="mg" aria-hidden="true">${lead ? `+${f1(Math.abs(d))}` : 'even'}</span>
        <span class="ar" aria-hidden="true">${lead ? (lead === a ? '◀' : '▶') : '·'}</span>
        <span class="vh">${slot}: ${lead ? `${esc(lead.manager)} by ${f1(Math.abs(d))}` : 'even'}</span></li>`;
    }).join('')}</ul>`;
  }

  // One sentence on what the game does to each side's playoff odds. A side whose odds
  // barely move is said plainly rather than given two near-identical numbers.
  function stakesLine(g, st) {
    if (!st) return '';
    const rows = [g.winner, g.loser].map((s) => ({ s, t: st.teams.find((t) => t.team_id === s.team_id) }))
      .filter((x) => x.t && x.t.win != null && x.t.lose != null);
    if (rows.length < 2) return '';
    const MOVES = 0.05;
    const odds = (x) => `<b>${esc(x.s.manager)}</b> <span class="odds">${pct(x.t.lose)}</span><span class="to">→</span><span class="odds">${pct(x.t.win)}</span>`;
    // At the ends a percentage is either a taunt or a jinx, so those are said in words.
    const steady = (x) => {
      const p = (x.t.win + x.t.lose) / 2;
      return p >= 0.97 ? `${esc(x.s.manager)} is all but in either way.` : p <= 0.03 ? `${esc(x.s.manager)}'s odds hold where they are.` : `${esc(x.s.manager)} sits near ${pct(p)} either way.`;
    };
    const moving = rows.filter((x) => x.t.swing >= MOVES);
    let body;
    if (moving.length === 2) body = `${odds(rows[0])} <span class="to">·</span> ${odds(rows[1])}`;
    else if (moving.length === 1) body = `${odds(moving[0])} <span class="to">·</span> <span>${steady(rows.find((x) => x !== moving[0]))}</span>`;
    else body = `<span>This one barely moves the playoff odds. ${steady(rows[0])} ${steady(rows[1])}</span>`;
    return `<p class="hub-stake"><b>Stakes</b>${moving.length ? '<span class="to">playoff odds, loss → win:</span>' : ''} ${body}</p>`;
  }

  function hubGame(w, g, { mine, swing }) {
    const [a, b] = [g.winner, g.loser];
    const hasProj = projOf(a) > 0 || projOf(b) > 0;
    const fav = [a, b].filter((s) => s.win_probability != null).sort((x, y) => y.win_probability - x.win_probability)[0];
    const mid = fav && fav.win_probability > 0.5 ? `ESPN: ${esc(fav.manager)} ${pct(fav.win_probability)} to win`
      : hasProj ? `${f1(Math.abs(projOf(a) - projOf(b)))} apart` : 'no projections yet';
    const rc = (s) => `${TEAMS[s.team_id] && TEAMS[s.team_id].weekly.length ? `${record(TEAMS[s.team_id])} · ` : ''}${esc(s.team_name)}`;
    const table = (s) => `<div><table><caption>${esc(s.manager)}</caption><tbody>${
      [...s.starters].sort((x, y) => SLOT_ORDER.indexOf(x.slot) - SLOT_ORDER.indexOf(y.slot)).map((p) => `
        <tr><td>${esc(p.slot)}</td><td>${esc(p.name)}</td><td class="r${hasProj && !p.projected ? ' zero' : ''}">${f1(p.projected)}</td></tr>`).join('')}</tbody></table></div>`;
    return `
      <article class="hub-game" aria-label="${esc(a.manager)} vs ${esc(b.manager)}">
        <div class="hub-tag${mine ? ' mine' : swing ? ' swing' : ''}">
          ${mine ? '<span class="hub-pill">Your game</span>' : ''}${swing ? '<span class="hub-pill swing">Most at stake</span>' : ''}
          <span>${esc(a.manager)} vs ${esc(b.manager)}</span>
        </div>
        <div class="hub-sides">
          <div><div class="nm">${mgrLink(a.manager)}</div><div class="rc">${rc(a)}</div></div>
          <div class="mid">PROJ</div>
          <div class="r"><div class="nm">${mgrLink(b.manager)}</div><div class="rc">${rc(b)}</div></div>
          <div class="hub-score"><i class="hub-a" aria-hidden="true"></i>${f1(projOf(a))}</div>
          <div class="mid">${mid}</div>
          <div class="hub-score r">${f1(projOf(b))}<i class="hub-b" aria-hidden="true"></i></div>
        </div>
        ${hasProj ? `
        <div class="hub-bar" role="img" aria-label="Projected points: ${esc(a.manager)} ${f1(projOf(a))}, ${esc(b.manager)} ${f1(projOf(b))}">
          <span class="hub-a" style="flex:${projOf(a).toFixed(2)}"></span><span class="hub-b" style="flex:${projOf(b).toFixed(2)}"></span>
        </div>
        ${edgeStrip(a, b)}
        <p class="hub-key"><i class="hub-a" aria-hidden="true"></i>◀ ${esc(a.manager)}'s edge &nbsp; <i class="hub-b" aria-hidden="true"></i>▶ ${esc(b.manager)}'s edge</p>` : ''}
        ${stakesLine(g, stakesFor(w, g))}
        <details class="hub-lineups" data-hub-open="${g.key}"${HUB_OPEN.has(g.key) ? ' open' : ''}>
          <summary>Full lineups</summary>
          <div class="cols">${table(a)}${table(b)}</div>
        </details>
      </article>`;
  }

  // Your game first (when the page knows whose page this is), then the most at stake.
  function hubGames(w) {
    const me = myTeam.get();
    const st = hub().stakes;
    const order = st && st.week === w.week ? st.games.map((x) => x.key) : [];
    const rank = (g) => (order.includes(g.key) ? order.indexOf(g.key) : order.length);
    const isMine = (g) => g.winner.team_id === me || g.loser.team_id === me;
    const top = order.length ? st.games[0] : null;
    const swingKey = top && top.teams.reduce((n, t) => n + t.swing, 0) >= 0.1 ? top.key : null;
    return [...w.games].sort((x, y) => (isMine(y) - isMine(x)) || (rank(x) - rank(y)))
      .map((g) => hubGame(w, g, { mine: isMine(g), swing: g.key === swingKey })).join('');
  }

  const DESK_KINDS = { swap: null, bye: 'BYE', out: 'OUT', empty: 'EMPTY', hole: '0 PROJ' };
  // Coach cards talk to "you"; on the desk they sit under somebody else's name.
  const deskTitle = (t) => t.replace(/^Your (.)/, (_, c) => c.toUpperCase());
  function coachDesk(rows) {
    const me = myTeam.get();
    const fixes = rows.flatMap((r) => r.items.filter((it) => it.level === 'now' && it.kind in DESK_KINDS).map((it) => ({ r, it })))
      .sort((x, y) => ((y.it.kind === 'swap') - (x.it.kind === 'swap')) || ((y.it.gain || 0) - (x.it.gain || 0)));
    const clear = rows.filter((r) => !r.counts.now);
    if (!fixes.length && !clear.length) return '';
    return `
      <section>
        ${secHead('flag', 'Coach desk', `<a class="more" href="${coachHref()}">Open Coach →</a>`)}
        <p class="sec-sub">${fixes.length ? 'Lineup fixes across the whole league, biggest projected gain first.' : clear.length === rows.length ? 'Nothing urgent on anybody’s list.' : 'No lineup fixes to make right now.'}</p>
        <div class="hub-panel">
          ${fixes.slice(0, 7).map(({ r, it }) => `
            <div class="hub-fix">
              <a class="hub-who${r.team_id === me ? ' me' : ''}" href="${lineupUrl(false, r.team_id)}">${esc(r.manager)}</a>
              <div class="t">${esc(deskTitle(it.title))}<small>${ADVICE_KIND[it.kind] || ''}</small></div>
              <span class="pts${it.kind === 'swap' ? '' : ' flag'}">${it.kind === 'swap' ? `+${f1(it.gain)}` : DESK_KINDS[it.kind]}</span>
            </div>`).join('')}
          ${clear.length ? `<div class="hub-clear"><b>All clear</b>${clear.map((r) => esc(r.manager)).join(' · ')}</div>` : ''}
        </div>
      </section>`;
  }

  function rankedProjections(w) {
    const me = myTeam.get();
    const sides = w.games.flatMap((g) => [g.winner, g.loser]).sort((x, y) => projOf(y) - projOf(x));
    const max = sides.length ? projOf(sides[0]) : 0;
    if (!max) return '';
    return `
      <section>
        ${secHead('board', 'Projected, ranked')}
        <p class="sec-sub">ESPN's projected score for every lineup as it's set right now.</p>
        <div class="hub-panel" style="padding-top:10px">
          ${sides.map((s) => `
            <div class="hub-rank"><span class="nm">${esc(s.manager)}</span>
              <span class="tr" aria-hidden="true"><span class="${s.team_id === me ? 'me' : ''}" style="width:${(100 * projOf(s) / max).toFixed(1)}%"></span></span>
              <span class="v">${f1(projOf(s))}</span></div>`).join('')}
          <p class="hub-note">${sides.some((s) => s.team_id === me) ? 'Orange is your team. ' : ''}A starter on a bye, a week off for his NFL team, counts for zero until he's swapped out.</p>
        </div>
      </section>`;
  }

  /* The league wire, capped so a busy Sunday of lineup tinkering can't push Wednesday's
     waiver run off the page. Days are the reader's own, not UTC's. */
  const WIRE_MAX = 12, WIRE_LINEUPS = 3;
  function wireSection(stacked = false) {
    const events = (LIVE && LIVE.wire) || [];
    if (!events.length) return '';
    const day = (e) => new Date(e.date).toDateString();
    // One line per manager per day: five separate adds and drops on a Wednesday read as one
    // busy Wednesday, and a morning of lineup tinkering as one "set her lineup".
    const rolled = new Map();
    for (const e of events) {
      if (e.kind === 'trade') { rolled.set(`trade|${e.date}|${e.team_id}|${e.with_id}`, e); continue; }
      const k = `${e.kind}|${day(e)}|${e.team_id}`;
      const had = rolled.get(k);
      if (!had) rolled.set(k, { ...e, added: [...(e.added || [])], dropped: [...(e.dropped || [])], promoted: new Set(e.promoted || []) });
      else if (e.kind === 'lineup') (e.promoted || []).forEach((id) => had.promoted.add(id));
      else { had.added.push(...e.added); had.dropped.push(...e.dropped); had.waiver = had.waiver && e.waiver; }
    }
    for (const e of rolled.values()) {
      if (e.kind !== 'move') continue;
      // Picked up and dropped again the same day nets out to nothing worth a line.
      const both = e.added.filter((n) => e.dropped.includes(n));
      e.added = e.added.filter((n) => !both.includes(n));
      e.dropped = e.dropped.filter((n) => !both.includes(n));
    }
    // Trades always make the cut, then pickups and drops. Lineup changes get what's left, and
    // at least WIRE_LINEUPS lines of it, so the newest days are never blank.
    const WEIGHT = { trade: 0, move: 1 };
    const newest = (x, y) => (x.date < y.date ? 1 : -1);
    const rows = [...rolled.values()].filter((e) => e.kind !== 'move' || e.added.length || e.dropped.length);
    const lineupRows = rows.filter((e) => e.kind === 'lineup').sort(newest);
    const realRows = rows.filter((e) => e.kind !== 'lineup').sort((x, y) => (WEIGHT[x.kind] - WEIGHT[y.kind]) || newest(x, y))
      .slice(0, WIRE_MAX - Math.min(WIRE_LINEUPS, lineupRows.length));
    const shown = [...realRows, ...lineupRows.slice(0, WIRE_MAX - realRows.length)].sort(newest);
    const list = (xs) => xs.map(esc).join(', ');
    const wireIcon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    const IC_ADD = wireIcon('<path d="M12 5v14M5 12h14"/>');
    const IC_DROP = wireIcon('<path d="M5 12h14"/>');
    const IC_TRADE = wireIcon('<path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/>');
    const IC_LINEUP = wireIcon('<path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/>');
    const line = (e) => {
      if (e.kind === 'trade') return `<span class="ic trade" aria-hidden="true">${IC_TRADE}</span><span><b>${esc(e.manager)}</b> and <b>${esc(e.with)}</b> made a trade. ${esc(e.manager)} gets ${list(e.added).replace(/\.$/, '')}. ${esc(e.with)} gets ${list(e.dropped).replace(/\.$/, '')}.</span>`;
      if (e.kind === 'lineup') return `<span class="ic swap" aria-hidden="true">${IC_LINEUP}</span><span><b>${esc(e.manager)}</b> set her lineup${e.promoted.size ? ` <span class="how">· ${e.promoted.size} ${e.promoted.size === 1 ? 'player' : 'players'} moved in off the bench</span>` : ''}</span>`;
      return `<span class="ic${e.added.length ? '' : ' drop'}" aria-hidden="true">${e.added.length ? IC_ADD : IC_DROP}</span><span><b>${esc(e.manager)}</b> ${[e.added.length ? `added ${list(e.added)}` : '', e.dropped.length ? `dropped ${list(e.dropped)}` : ''].filter(Boolean).join(', ')}${e.waiver ? ' <span class="how">· off waivers</span>' : ''}</span>`;
    };
    let last = '';
    const feed = shown.map((e) => {
      const head = day(e) === last ? '' : `<h3 class="hub-day">${shortDay(e.date)}</h3>`;
      last = day(e);
      return `${head}<div class="hub-ev">${line(e)}</div>`;
    }).join('');
    const picks = new Map();
    // Counted off the same netted rows the feed shows, so the two can't disagree.
    for (const e of rows) if (e.kind === 'move' && e.added.length) picks.set(e.manager, (picks.get(e.manager) || 0) + e.added.length);
    const busy = [...picks.entries()].sort((x, y) => y[1] - x[1]);
    const total = busy.reduce((n, [, c]) => n + c, 0);
    return `
      <section>
        ${secHead('board', 'League wire')}
        <p class="sec-sub">Pickups, drops, trades and lineup changes from the last seven days, newest first, straight from ESPN's activity log. "Off waivers" means the pickup waited its turn overnight instead of being grabbed on the spot.</p>
        <div class="hub-wire${stacked ? ' stack' : ''}">
          <div class="hub-panel${stacked ? ' wire-scroll' : ''}"${stacked ? ' tabindex="0" role="region" aria-label="League wire feed"' : ''}>${feed}</div>
          ${busy.length ? `
          <div>
            <h3 class="hub-day" style="padding-top:0">Most pickups, last seven days</h3>
            <div class="hub-panel" style="padding-top:10px">
              ${busy.map(([m, c]) => `
                <div class="hub-rank"><span class="nm">${esc(m)}</span>
                  <span class="tr" aria-hidden="true"><span style="width:${(100 * c / busy[0][1]).toFixed(1)}%"></span></span>
                  <span class="v">${c}</span></div>`).join('')}
              <p class="hub-note">${total} ${total === 1 ? 'pickup' : 'pickups'} across the league in seven days.${busy.length > 1 && busy[0][1] > busy[1][1] ? ` ${esc(busy[0][0])} made ${busy[0][1]} of them.` : ''}</p>
            </div>
          </div>` : ''}
        </div>
      </section>`;
  }

  // Headlines only, each one a link out to ESPN. No article text ever reaches this page.
  function newsSection() {
    const items = hub().news || [];
    if (!items.length) return '';
    const me = myTeam.get();
    return `
      <section>
        ${secHead('book', 'ESPN on your rosters')}
        <p class="sec-sub">ESPN headlines about players somebody in this league has on her roster. Each one opens on ESPN.</p>
        <div class="hub-news">${items.map((n) => `
          <a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">
            <span class="h">${esc(n.headline)}</span>
            <span class="tags">${n.owners.map((o) => `<span class="${o.team_id === me ? 'me' : ''}">${esc(o.manager)}</span>`).join('')}</span>
