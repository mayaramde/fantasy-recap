name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: python -m unittest tests.test_guard_bash -v
      - run: python -m unittest tests.test_check_recaps -v
      - run: python -m unittest tests.test_coach_written -v
      - run: python -m unittest tests.test_team_profile -v
      - run: python -m unittest tests.test_playoffs -v
      - run: python -m unittest tests.test_hub -v
      - run: python -m unittest tests.test_news -v
      - run: python -m unittest tests.test_trade_eval -v
      - run: python -m unittest tests.test_preview_live -v
      - run: python -m unittest tests.test_lowlights -v
      - run: python -m unittest tests.test_box_score_rows -v
      - run: python -m unittest tests.test_key_stats -v
      - run: python -m unittest tests.test_check_fantasypros -v
      - run: python -m unittest tests.test_bts_page -v
      - run: python -m unittest tests.test_remaining_projection -v
      - run: node --test tests/coach/*.test.js tests/live/*.test.js
      - run: python scripts/check.py
