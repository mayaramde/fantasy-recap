name: espn-public-probe

# TEMPORARY: proves ESPN serves the (now public) league with no cookies, through both capture
# paths, before the repo stops needing ESPN secrets. Runs only on this branch and is deleted
# before the PR merges. No secrets are referenced, so none reach the job. Prints counts only,
# never names.

on:
  push:
    branches: [claude/espn-public-league]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: No ESPN secrets in this job
        run: test -z "${ESPN_S2}${ESPN_SWID}" && echo "no ESPN cookies in the environment"

      - name: capture_node.mjs current (no cookies)
        run: node scripts/capture_node.mjs current

      - name: capture_node.mjs next (no cookies)
        run: node scripts/capture_node.mjs next

      - name: espn_fetch.py, the /api/live path (no cookies)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import espn_fetch
          week = espn_fetch.current_week()
          cap = espn_fetch.fetch_week(week)
          problems = espn_fetch.shape_problems(cap)
          print(f"espn_fetch: week {week}, shape problems: {len(problems)}")
          for p in problems[:10]:
              print("  ", p)
          sys.exit(1 if problems else 0)
          PY

      - name: Summarize what was captured (counts only)
        run: |
          python3 - <<'PY'
          import json, glob
          for path in sorted(glob.glob("data/2026/*/espn.json")):
              d = json.load(open(path))
              if not path.endswith(("next-week/espn.json",)) and d["week"] < 5:
                  continue
              sides = [s for m in d["matchups"] for s in (m["home"], m["away"]) if s]
              players = [p for s in sides for p in s["lineup"]]
              print(f"{path}: week {d['week']}, complete={d.get('complete')}, matchups={len(d['matchups'])}, "
                    f"teams={len(sides)}, players={len(players)}, "
                    f"with projection={sum(1 for p in players if p.get('projected'))}, "
                    f"injury field={sum(1 for p in players if 'injury_status' in p)}, "
                    f"scoring lines={sum(1 for p in players if p.get('scoring'))}, "
                    f"transactions={len(d.get('transactions') or [])}, teams table={len(d.get('teams') or [])}")
          PY

      - name: /api/live end to end (no cookies)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "api")
          import live
          payload = live.live_payload()
          adv = payload.get("advice") or []
          print(f"/api/live payload: week {payload.get('week')}, matchups={len(payload.get('matchups') or [])}, "
                f"coach rows={len(adv)}")
          PY

      - name: The checks workflow still passes on the fresh capture
        run: |
          python3 scripts/analyze.py
          python3 scripts/check.py
