name: live-update

# Refreshes the website's Live page from ESPN, hourly while NFL games are on, and the
# Coach page's week-ahead tab with it. Also deploys promptly whenever something that
# affects the live site merges to main (a published recap, a coach-daily snapshot, a
# scripts/site/api change) — see the `push` trigger below.
# Data only: capture, analyze, build, deploy. Nothing is committed, with one exception:
# once a day (the coach schedule below, or a manual run with coach_daily) the `coach`
# job has Claude run the coach-daily skill on a fresh capture, and the `live` job opens an
# auto-merging PR for the data/2026/fantasypros/latest.json it writes. This same run deploys
# with those cards, so they're live before that PR merges. See the `coach` job below.
#
# Repo settings (Settings → Secrets and variables → Actions), set by Maya:
#   secrets:   ESPN_S2, ESPN_SWID (ESPN login cookies), VERCEL_TOKEN
#              CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY,
#                for the daily coach step
#              FANTASYPROS_MCP_TOKEN (optional) bearer token for the FantasyPros MCP server
#              COACH_PR_TOKEN (optional) fine-grained PAT (contents + pull requests: write)
#                for coach-daily's PR; see "Open coach-daily's PR" for when it's needed
#   settings:  Actions → General → "Allow GitHub Actions to create and approve pull
#                requests", and General → "Allow auto-merge", both for coach-daily's PR
#   variables: VERCEL_ORG_ID, VERCEL_PROJECT_ID (from .vercel/project.json)
#              FANTASYPROS_MCP_URL (optional) the FantasyPros MCP server's URL. Without it
#                the coach step still runs, ESPN-only (no start/sit, waiver or trade ideas).
# When the ESPN cookies expire the capture step fails with "ESPN 401" — this workflow
# opens (or comments on) a GitHub issue when that happens, see "Alert on failure" below.

on:
  push:
    branches: [main]
    paths:
      - "recaps/**"
      - "data/**"
      - "site/**"
      - "scripts/**"
      - "api/**"
      - "league.json"
      - "vercel.json"
  schedule:
    # Times are UTC; NFL kickoffs are Eastern (UTC-4 until early November, then UTC-5).
    # Minute 7, not 0: GitHub runs scheduled workflows best-effort, and the top of the hour
    # is when every cron on the platform queues at once, so a run there is the most likely
    # to arrive late or be dropped. These fired at :00 for a night of NFL games and not one
    # of them ran. Seven minutes late beats an hour of nothing.
    - cron: "7 13-23 * * 0"     # Sunday games (incl. 9:30 AM ET international games)
    - cron: "7 0-5 * * 1,2,5"   # Sunday, Monday and Thursday night games (their UTC spillover
                                 # lands on the next calendar day: Sun→Mon(1), Mon→Tue(2), Thu→Fri(5))
    - cron: "7 0-5 * * 6"       # Friday-evening games (Black Friday, and any other Friday
                                 # night slate) spilling into Saturday UTC
    - cron: "7 17-23 * 12 6"    # December Saturday games
    - cron: "7 0-5 * 12 0"      # ...and Saturday nights
    - cron: "7 0-5,17-23 26 11 *"  # Thanksgiving (Nov 26): the Wed-night game's UTC spillover
                                     # (hours 0-5) plus the two Thursday day games (hours 17-23).
                                     # The Thursday night game already lands in the day-5 rule above.
    - cron: "7 17-23 25 12 *"   # Christmas Day (Dec 25) day games
    - cron: "7 0-5 26 12 *"     # ...and the Christmas night game's UTC spillover
    - cron: "30 11 * * *"       # daily morning catch-all (7:30 AM EDT), already off the hour
    - cron: "13 10 * * *"       # daily Coach cards (6:13 AM EDT). Must match the
                                 # coach job's `if:` below exactly: that's how a run tells
                                 # it's the coach run.
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force this run to fail right after checkout, to test the alert step below without touching ESPN, Vercel, or a real capture"
        type: boolean
        default: false
      deploy_preview:
        description: "Deploy to a throwaway preview URL instead of the live site — for testing this workflow's deploy path by hand before trusting it on a real push"
        type: boolean
        default: false
      coach_daily:
        description: "Also run coach-daily (Claude writes today's Coach cards and opens their auto-merging PR), as the daily schedule does"
        type: boolean
        default: false

concurrency:
  group: live-update
  cancel-in-progress: false

# Read-only by default. The live job adds what it needs to open coach-daily's PR; the coach
# job, where Claude runs, never gets more than read.
permissions:
  contents: read

jobs:
  # coach-daily (.claude/skills/coach-daily), once a day: Claude writes today's Coach cards to
  # data/2026/fantasypros/latest.json from a fresh capture, and that one file is handed to the
  # live job below as an artifact. Its own job on its own runner, with a read-only token and
  # no Vercel token, so nothing Claude does here (whatever FantasyPros' news text says) can
  # push, merge or touch the deploy; the live job checks the file and does all of that.
  # Claude never sees the ESPN cookies either: they're only in the capture steps' env.
  coach:
    # Keep this cron string in step with the `schedule` list above.
    if: github.event.schedule == '13 10 * * *' || github.event.inputs.coach_daily == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55   # the Claude step's 40, plus captures, setup and the action's install
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Keeps the (read-only) token, so the skill can fetch yesterday's coach-daily branch.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Capture this week and next from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          node scripts/capture_node.mjs current > /dev/null
          node scripts/capture_node.mjs next || echo "next week isn't on ESPN yet; coach-daily covers this week only"
          python3 scripts/analyze.py

      - name: MCP config
        env:
          FANTASYPROS_MCP_URL: ${{ vars.FANTASYPROS_MCP_URL }}
          HAS_FP_TOKEN: ${{ secrets.FANTASYPROS_MCP_TOKEN != '' }}
        run: |
          python3 - <<'PY'
          import json, os
          url = os.environ.get("FANTASYPROS_MCP_URL", "")
          servers = {}
          if url:
              server = {"type": "http", "url": url}
              if os.environ.get("HAS_FP_TOKEN") == "true":
                  # Expanded by Claude Code at load time, so the token never lands in this file.
                  server["headers"] = {"Authorization": "Bearer ${FANTASYPROS_MCP_TOKEN}"}
              servers["fantasypros"] = server
          else:
              print("FANTASYPROS_MCP_URL is not set: coach-daily runs ESPN-only")
          json.dump({"mcpServers": servers}, open(os.path.join(os.environ["RUNNER_TEMP"], "coach-mcp.json"), "w"))
          PY

      - name: Coach cards (Claude)
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        env:
          FANTASYPROS_MCP_TOKEN: ${{ secrets.FANTASYPROS_MCP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Run the coach-daily skill (.claude/skills/coach-daily/SKILL.md) for today, unattended.
            You are in the live-update GitHub Actions run, so follow the skill's
            "Running in GitHub Actions" section. Finish with the skill's Output summary.
          claude_args: >-
            --mcp-config ${{ runner.temp }}/coach-mcp.json
            --allowedTools "Read,Glob,Grep,Agent,Skill,mcp__fantasypros__*,Edit(./data/2026/fantasypros/latest.json),Write(./data/2026/fantasypros/latest.json),Edit(//tmp/**),Write(//tmp/**),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(python3 scripts/coach_brief.py:*),Bash(python3 site/build.py:*),Bash(python3 scripts/check.py:*),Bash(date:*)"

      # What happened in Claude's run, without its transcript: whether the FantasyPros server
      # connected, which tools it used, and anything its permissions refused.
      - name: Coach run summary
        if: always()
        run: |
          python3 - <<'PY' || true
          import collections, json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "claude-execution-output.json")
          if not os.path.exists(path):
              raise SystemExit("no execution log")
          events = json.load(open(path))
          tools = collections.Counter()
          for e in events:
              if e.get("type") == "system" and e.get("subtype") == "init":
                  print("MCP servers:", [(m.get("name"), m.get("status")) for m in e.get("mcp_servers", [])])
              if e.get("type") == "assistant":
                  for c in (e.get("message") or {}).get("content", []):
                      if c.get("type") == "tool_use":
                          tools[c["name"]] += 1
              if e.get("type") == "result":
                  print("turns:", e.get("num_turns"), " result:", e.get("subtype"))
                  for d in e.get("permission_denials", []):
                      print("denied:", d.get("tool_name"), json.dumps(d.get("tool_input", {}))[:200])
          print("tools used:", dict(tools))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: coach-snapshot
          path: data/2026/fantasypros/latest.json
          retention-days: 3

  live:
    needs: coach
    # Runs whether the coach job ran, failed or was skipped (every run but the daily one).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # coach-daily's branch
      pull-requests: write   # ...and its PR
      issues: write          # failure alerts
    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing in this job pushes with the checkout's token: the coach PR step pushes
          # with its own, so later steps (npm install, the Vercel CLI) never hold one.
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Simulate a failure (workflow_dispatch test only)
        if: ${{ github.event.inputs.simulate_failure == 'true' }}
        run: |
          echo "simulate_failure was set — failing here on purpose, before touching ESPN/Vercel, to test the alert step."
          exit 1

      - name: Capture current week from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          set +e
          node scripts/capture_node.mjs current > "$RUNNER_TEMP/capture.json" 2> "$RUNNER_TEMP/capture-stderr.log"
          code=$?
          cat "$RUNNER_TEMP/capture-stderr.log" >&2
          exit $code

      # The Coach page's "next week" tab. Best effort on purpose: a week ESPN hasn't
      # published rosters or projections for yet must never cost the league its live
      # scores, so a failure here is logged and the run carries on without the tab.
      - name: Capture next week from ESPN (best effort)
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/capture_node.mjs next

      - name: Is this the daily coach run?
        id: coach_gate
        env:
          COACH_RESULT: ${{ needs.coach.result }}
        run: |
          echo "coach job: $COACH_RESULT"
          if [ "$COACH_RESULT" = "skipped" ]; then echo "run=false"; else echo "run=true"; fi >> "$GITHUB_OUTPUT"

      # Scheduled runs skip when nothing's changed (the week they'd show is already
      # published — the recap did the work already). Two triggers must NEVER skip: a push
      # to main, which fires *because* something (often exactly that publish) just landed;
      # and a manual deploy_preview dispatch, which exists specifically to test this
      # workflow's deploy path and would otherwise silently no-op most weeks. The
      # daily coach run doesn't skip either: its new cards need deploying.
      - name: Skip if that week's recap is already published
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_PREVIEW: ${{ github.event.inputs.deploy_preview }}
          COACH_RUN: ${{ steps.coach_gate.outputs.run }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ["EVENT_NAME"] == "push" or os.environ.get("DEPLOY_PREVIEW") == "true":
              print("push to main, or a manual preview-deploy test: always deploy, never skip")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=false\n")
          elif os.environ.get("COACH_RUN") == "true":
              print("daily coach run: always deploy, so today's cards go out with it")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=false\n")
          else:
              week = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "capture.json")))[0]["week"]
              recap = Path(f"recaps/2026/week-{week:02d}.json")
              done = recap.exists() and json.loads(recap.read_text()).get("status") == "published"
              print(f"week {week}: " + ("recap published, nothing live to show" if done else "live"))
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"skip={'true' if done else 'false'}\n")
          PY

      - name: Analyze and check
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 scripts/analyze.py
          python3 scripts/check.py

      # Today's Coach cards from the coach job: the one file it hands over, checked here
      # before it's used. Anything wrong (or no file) and the checkout keeps main's snapshot.
      - uses: actions/download-artifact@v4
        if: needs.coach.result == 'success'
        continue-on-error: true
        with:
          name: coach-snapshot
          path: ${{ runner.temp }}/coach

      - name: Check today's Coach cards
        id: coach_check
        if: needs.coach.result == 'success'
        continue-on-error: true
        run: |
          snapshot=data/2026/fantasypros/latest.json
          new="$RUNNER_TEMP/coach/latest.json"
          if [ ! -f "$new" ]; then echo "the coach job handed over no snapshot"; exit 1; fi
          if ! python3 - "$new" <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          d = json.load(open(sys.argv[1]))
          assert isinstance(d.get("weeks"), dict) and isinstance(d.get("audit", {}), dict)
          t = datetime.fromisoformat(d["generated_at"].replace("Z", "+00:00"))
          assert abs(datetime.now(timezone.utc) - t) < timedelta(hours=2), "generated_at isn't today"
          PY
          then
            echo "not a readable, fresh snapshot"; exit 1
          fi
          cp "$new" "$snapshot"
          if ! python3 site/build.py > /dev/null; then
            echo "site/build.py fails with today's snapshot"; git checkout -- "$snapshot"; exit 1
          fi
          if git diff --quiet -- "$snapshot"; then echo "unchanged from main"; exit 1; fi

      # The default github.token can open the PR (with "Allow GitHub Actions to create and
      # approve pull requests" on, under Settings → Actions → General) but a PR it opens
      # doesn't trigger other workflows, so `checks` never runs on it. If main's branch
      # protection requires that check, auto-merge waits forever: set COACH_PR_TOKEN then.
      # Until the PR merges, the next deploy from main goes back to yesterday's cards.
      - name: Open coach-daily's PR
        id: coach_pr
        if: steps.coach_check.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COACH_PR_TOKEN || github.token }}
        run: |
          set -eo pipefail
          today=$(date -u +%F)
          branch="coach-daily-$today-$GITHUB_RUN_ID"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The branch starts from main as it is now, not from this run's checkout: a manual
          # run from a feature branch must not carry that branch's commits into an
          # auto-merging PR, and main may have moved since this run started. A separate
          # worktree, so the checkout the deploy builds from stays as it is.
          git fetch --quiet "$remote" main
          git worktree add --quiet -b "$branch" "$RUNNER_TEMP/coach-pr" FETCH_HEAD
          cp data/2026/fantasypros/latest.json "$RUNNER_TEMP/coach-pr/data/2026/fantasypros/latest.json"
          cd "$RUNNER_TEMP/coach-pr"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2026/fantasypros/latest.json
          git commit --quiet -m "Coach: daily FantasyPros cards ($today)"
          # Pushed with GH_TOKEN, so a COACH_PR_TOKEN merge can trigger the push-deploy.
          git push --quiet "$remote" "HEAD:refs/heads/$branch"
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Coach: daily FantasyPros cards ($today)" \
            --body "Written by coach-daily in [this live-update run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), voice-checked there. Data only: \`data/2026/fantasypros/latest.json\`.")
          gh pr merge "$url" --auto --squash --delete-branch
          echo "Opened $url with auto-merge on."
          # Older coach-daily PRs are superseded: the file is a rolling snapshot.
          { gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"coach-daily-\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r n; do
              gh pr close "$n" --repo "$GITHUB_REPOSITORY" --delete-branch || echo "couldn't close #$n"
            done; } || echo "couldn't list older coach-daily PRs to close"

      - name: Alert if the coach step failed
        if: >-
          contains(fromJSON('["failure","cancelled"]'), needs.coach.result) || steps.coach_check.outcome == 'failure'
          || steps.coach_pr.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The daily coach-daily step failed, so today's Coach cards weren't written or their PR wasn't opened. The site keeps yesterday's until they're 36 hours old, then shows ESPN-only cards. Check the run log for what broke.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search 'in:title "coach-daily failing"' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "coach-daily failing" --assignee "${{ github.repository_owner }}" --body "$body"
          fi

      - name: Don't remove a published recap from the site
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/site_guard.py

      - name: Deploy to Vercel
        if: steps.gate.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOY_PREVIEW: ${{ github.event.inputs.deploy_preview }}
        run: |
          npm install --global vercel@60
          # `vercel build` builds api/live.py with Vercel's Python runtime, which shells
          # out to uv. Vercel's own builders and the Mac have it; a runner doesn't, and
          # without it the build stops at "uv is required but was not found in PATH".
          python3 -m pip install --quiet uv
          if [ "$DEPLOY_PREVIEW" = "true" ]; then
            # Manual dry run of this workflow's deploy path (used before trusting the
            # push trigger on a real merge) — a throwaway URL, never the live site.
            scripts/deploy.sh --preview
          else
            scripts/deploy.sh
            test "$(curl -sS -o /dev/null -w '%{http_code}' https://fantasy-recap-eight.vercel.app)" = 200
          fi

      # Fires on any failed step above, including the simulate_failure test step. Comments
      # on the existing alert issue instead of opening a new one, so a bad Sunday (several
      # runs failing in a row) makes one issue, not ten.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -qi "ESPN 401" "$RUNNER_TEMP/capture-stderr.log" 2>/dev/null; then
            title="live-update failing: ESPN cookies expired"
            body="ESPN returned 401 — the session cookies expired. Update **both** copies, or the other one keeps failing after you fix the first:
          - GitHub Actions secrets (\`ESPN_S2\`, \`ESPN_SWID\`) — repo → Settings → Secrets and variables → Actions
          - The matching Vercel environment variables — a separate copy, see \`docs/vercel.md\` §6

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            title="live-update failing"
            body="A live-update run failed outside the usual ESPN-401 case. Check the run log for what broke.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search 'in:title "live-update failing"' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --assignee "${{ github.repository_owner }}" --body "$body"
          fi
