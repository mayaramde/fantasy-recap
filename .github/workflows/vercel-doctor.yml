name: vercel-doctor

# Temporary. The cloud deploy stops at "Could not retrieve Project Settings" (live-update
# runs #2 and #3), so this prints what VERCEL_TOKEN can actually see: which account it
# belongs to, which teams and projects it can list, and whether an explicit --scope gets
# `vercel pull` through. Names only — no secrets and no variable values beyond the two
# IDs the workflow logs already show.
#
# Delete this file once the deploy works.

on:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: What VERCEL_TOKEN can see
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@60
          # Never echoed: no `set -x` anywhere in this job.
          t=(--token "$VERCEL_TOKEN")

          echo "looking for project $VERCEL_PROJECT_ID under org $VERCEL_ORG_ID"

          echo "::group::whoami — which account the token belongs to"
          vercel whoami "${t[@]}" || echo "FAILED: whoami (the token itself is bad or expired)"
          echo "::endgroup::"

          echo "::group::teams the token can see"
          vercel teams ls "${t[@]}" || echo "FAILED: teams ls"
          echo "::endgroup::"

          echo "::group::projects in the token's own scope"
          vercel project ls "${t[@]}" || echo "FAILED: project ls"
          echo "::endgroup::"

          echo "::group::projects in VERCEL_ORG_ID"
          vercel project ls --scope "$VERCEL_ORG_ID" "${t[@]}" || echo "FAILED: project ls --scope (the token can't read that team)"
          echo "::endgroup::"

          echo "::group::does an explicit --scope get pull through?"
          vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID" "${t[@]}" \
            && echo "PULL OK — passing --scope is the fix" \
            || echo "FAILED: pull --scope too"
          echo "::endgroup::"
